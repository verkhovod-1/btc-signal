"use strict";

/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

const API="https://api.binance.com/api/v3/klines";
const SYMBOL="BTCUSDT";

const HISTORY_DAYS={
    "15m":90,
    "1h":365,
    "4h":730,
    "1d":1825
};

const STEP={
    "15m":15*60*1000,
    "1h":60*60*1000,
    "4h":4*60*60*1000,
    "1d":24*60*60*1000
};

/*
   24 часа в свечах.
*/
const H24={
    "15m":96,
    "1h":24,
    "4h":6,
    "1d":1
};

const HORIZONS={
    "15m":[4,16,96],
    "1h":[1,4,24],
    "4h":[1,6],
    "1d":[1]
};

const statusEl=document.getElementById("status");
const loaderEl=document.getElementById("loader");
const contentEl=document.getElementById("content");
const runBtn=document.getElementById("runBtn");


/* =========================================================
   ДИАГНОСТИКА
========================================================= */

function setStatus(text){
    statusEl.textContent=text;
}

window.addEventListener("error",function(e){

    loaderEl.style.display="none";

    setStatus(
        "Ошибка JavaScript: "+
        (e.message||"неизвестная ошибка")

window.addEventListener(
    "unhandledrejection",
    function(e){

        loaderEl.style.display="none";

        let msg="Неизвестная ошибка";

            msg=e.reason.message||String(e.reason);

);


/* =========================================================
   ФОРМАТТЕРЫ
========================================================= */

function finite(x){
    const n=Number(x);
    return Number.isFinite(n)?n:null;
}

function pct(x){

    const n=Number(x);

    if(!Number.isFinite(n)){
        return "—";
    }

    return (n>=0?"+":"")+
        n.toFixed(2)+"%";
}

function pct1(x){

    const n=Number(x);

    if(!Number.isFinite(n)){
        return "—";
    }

    return (n>=0?"+":"")+
        n.toFixed(1)+"%";
}

function price(x){

    const n=Number(x);

    if(!Number.isFinite(n)){
        return "—";
    }

    return n.toFixed(2);
}

function number2(x){

    const n=Number(x);

    if(!Number.isFinite(n)){
        return "—";
    }

    return n.toFixed(2);
}

function horizonName(h,interval){

    const minutes={
        "15m":15,
        "1h":60,
        "4h":240,
        "1d":1440
    };

    const total=h*minutes[interval];

    if(total>=1440){

        const d=total/1440;

        return d===1?
            "1 день":
            d+" дней";
    }

    if(total>=60){

        const h2=total/60;

        return h2===1?
            "1 час":
            h2+" ч";
    }

    return total+" мин";
}


/* =========================================================
   BINANCE
========================================================= */

async function fetchWithTimeout(url,timeout=20000){

    let lastError=null;

    for(let attempt=1;attempt<=3;attempt++){

        const controller=new AbortController();

        const timer=setTimeout(
            ()=>controller.abort(),
            timeout
        );

        try{

            const response=await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    signal:controller.signal
                }
            );

            clearTimeout(timer);

            if(!response.ok){

                throw new Error(
                    "Binance HTTP "+response.status
                );
            }

            return await response.json();

        }catch(error){

            clearTimeout(timer);
            lastError=error;

            if(attempt<3){

                setStatus(
                    "Повтор подключения к Binance "+
                    attempt+"/3..."
                );

                await new Promise(
                    r=>setTimeout(r,1000)
                );
            }
        }
    }

    throw lastError||
        new Error("Binance недоступен");
}


/* =========================================================
   ИСТОРИЯ
========================================================= */

async function fetchHistory(interval){

    const step=STEP[interval];

    const now=Date.now();

    const start=
        now-
        HISTORY_DAYS[interval]*
        24*60*60*1000;

    let cursor=start;

    const all=[];

    const estimated=
        Math.max(
            1,
            Math.ceil(
                (now-start)/(step*1000)
            )
        );

    let request=0;

    while(cursor<now){

        request++;

        setStatus(
            "Загрузка "+interval+
            ": запрос "+
            request+
            " из ~"+
            estimated
        );

        const url=
            API+
            "?symbol="+SYMBOL+
            "&interval="+interval+
            "&limit=1000"+
            "&startTime="+cursor+
            "&endTime="+now;

        const rows=
            await fetchWithTimeout(url);

        if(!Array.isArray(rows)){
            throw new Error(
                "Binance вернул неверный формат данных"
            );
        }

        if(rows.length===0){
            break;
        }

        for(const c of rows){

            if(!Array.isArray(c)||c.length<6){
                continue;
            }

            const item={
                time:Number(c[0]),
                open:Number(c[1]),
                high:Number(c[2]),
                low:Number(c[3]),
                close:Number(c[4]),
                volume:Number(c[5])
            };

            if(
                !Number.isFinite(item.time)||
                !Number.isFinite(item.open)||
                !Number.isFinite(item.high)||
                !Number.isFinite(item.low)||
                !Number.isFinite(item.close)||
                !Number.isFinite(item.volume)
            ){
                continue;
            }

            /*
               Не используем незакрытую свечу.
            */
            if(item.time+step<=now){
                all.push(item);
            }
        }

        const last=
            Number(rows[rows.length-1][0]);

        if(!Number.isFinite(last)){
            break;
        }

        const next=last+step;

        if(next<=cursor){
            break;
        }

        cursor=next;

        if(rows.length<1000){
            break;
        }
    }

    /*
       Удаляем дубликаты.
    */

    const map=new Map();

    for(const c of all){
        map.set(c.time,c);
    }

    const result=
        Array.from(map.values())
        .sort((a,b)=>a.time-b.time);

    if(result.length<250){

        throw new Error(
            "Недостаточно истории: "+
            result.length+
            " свечей"
        );
    }

    return result;
}


/* =========================================================
   EMA
========================================================= */

function EMA(values,period){

    const out=
        new Array(values.length)
        .fill(null);

    if(values.length<period){
        return out;
    }

    let sum=0;

    for(let i=0;i<period;i++){
        sum+=values[i];
    }

    let prev=sum/period;

    out[period-1]=prev;

    const k=2/(period+1);

    for(let i=period;i<values.length;i++){

        prev=
            values[i]*k+
            prev*(1-k);

        out[i]=prev;
    }

    return out;
}


/* =========================================================
   RSI
========================================================= */

function RSI(values,period=14){

    const out=
        new Array(values.length)
        .fill(null);

    if(values.length<=period){
        return out;
    }

    let gain=0;
    let loss=0;

    for(let i=1;i<=period;i++){

        const d=
            values[i]-values[i-1];

        if(d>0){
            gain+=d;
        }else{
            loss-=d;
        }
    }

    let avgGain=gain/period;
    let avgLoss=loss/period;

    out[period]=
        avgLoss===0?
        100:
        100-
        100/(1+avgGain/avgLoss);

    for(let i=period+1;i<values.length;i++){

        const d=
            values[i]-values[i-1];

        const g=d>0?d:0;
        const l=d<0?-d:0;

        avgGain=
            ((avgGain*(period-1))+g)/period;

        avgLoss=
            ((avgLoss*(period-1))+l)/period;

        out[i]=
            avgLoss===0?
            100:
            100-
            100/(1+avgGain/avgLoss);
    }

    return out;
}


/* =========================================================
   MACD
========================================================= */

function MACD(values){

    const e12=EMA(values,12);
    const e26=EMA(values,26);

    const macd=
        new Array(values.length)
        .fill(null);

    for(let i=0;i<values.length;i++){

        if(
            e12[i]!==null&&
            e26[i]!==null
        ){
            macd[i]=
                e12[i]-e26[i];
        }
    }

    const clean=
        macd.map(
            x=>x===null?0:x
        );

    const signal=EMA(clean,9);

    const hist=
        new Array(values.length)
        .fill(null);

    for(let i=0;i<values.length;i++){

        if(
            macd[i]!==null&&
            signal[i]!==null
        ){
            hist[i]=
                macd[i]-signal[i];
        }
    }

    return {
        macd,
        signal,
        hist
    };
}


/* =========================================================
   ADX
========================================================= */

function ADX(data,period=14){

    const n=data.length;

    const out=
        new Array(n)
        .fill(null);

    if(n<=period*2){
        return out;
    }

    const tr=new Array(n).fill(0);
    const plus=new Array(n).fill(0);
    const minus=new Array(n).fill(0);

    for(let i=1;i<n;i++){

        const h=data[i].high;
        const l=data[i].low;

        const ph=data[i-1].high;
        const pl=data[i-1].low;
        const pc=data[i-1].close;

        tr[i]=Math.max(
            h-l,
            Math.abs(h-pc),
            Math.abs(l-pc)
        );

        const up=h-ph;
        const down=pl-l;

        if(up>down&&up>0){
            plus[i]=up;
        }

        if(down>up&&down>0){
            minus[i]=down;
        }
    }

    let atr=0;
    let p=0;
    let m=0;

    for(let i=1;i<=period;i++){

        atr+=tr[i];
        p+=plus[i];
        m+=minus[i];
    }

    atr/=period;
    p/=period;
    m/=period;

    const dx=
        new Array(n).fill(null);

    for(let i=period;i<n;i++){

        if(i>period){

            atr=
                ((atr*(period-1))+tr[i])/
                period;

            p=
                ((p*(period-1))+plus[i])/
                period;

            m=
                ((m*(period-1))+minus[i])/
                period;
        }

        if(atr===0){
            continue;
        }

        const pdi=100*p/atr;
        const mdi=100*m/atr;

        if(pdi+mdi===0){
            continue;
        }

        dx[i]=
            100*Math.abs(pdi-mdi)/
            (pdi+mdi);
    }

    let count=0;
    let sum=0;

    for(let i=period;i<n;i++){

        if(dx[i]!==null){

            sum+=dx[i];
            count++;
        }

        if(count===period){

            let adx=sum/period;

            out[i]=adx;

            for(let j=i+1;j<n;j++){

                if(dx[j]===null){
                    continue;
                }

                adx=
                    ((adx*(period-1))+dx[j])/
                    period;

                out[j]=adx;
            }

            break;
        }
    }

    return out;
}


/* =========================================================
   ИНДИКАТОРЫ
========================================================= */

function indicators(data){

    const close=data.map(x=>x.close);

    const macd=MACD(close);

    return {
        close,
        ema20:EMA(close,20),
        ema50:EMA(close,50),
        ema200:EMA(close,200),
        rsi:RSI(close,14),
        macd:macd.macd,
        macdSignal:macd.signal,
        macdHist:macd.hist,
        adx:ADX(data,14)
    };
}


/* =========================================================
   СОСТОЯНИЕ РЫНКА
========================================================= */

function regime(ind,i){

    const p=ind.close[i];
    const e20=ind.ema20[i];
    const e50=ind.ema50[i];
    const e200=ind.ema200[i];
    const r=ind.rsi[i];
    const a=ind.adx[i];

    if(
        e20===null||
        e50===null||
        e200===null||
        r===null
    ){
        return "Не определён";
    }

    const strong=
        a!==null&&a>=25;

    if(
        e20>e50&&
        e50>e200&&
        r>=52&&
        strong
    ){
        return "Сильный бычий";
    }

    if(
        e20>e50&&
        p>e200
    ){
        return "Бычий";
    }

    if(
        e20<e50&&
        e50<e200&&
        r<=48&&
        strong
    ){
        return "Сильный медвежий";
    }

    if(
        e20<e50&&
        p<e200
    ){
        return "Медвежий";
    }

    return "Боковик";
}


/* =========================================================
   БАЗОВЫЙ СИГНАЛ
========================================================= */

function basicSignal(ind,data,i){

    if(
        i<200||
        ind.ema20[i]===null||
        ind.ema50[i]===null||
        ind.ema200[i]===null||
        ind.rsi[i]===null
    ){
        return {
            score:0,
            signal:"Недостаточно данных"
        };
    }

    let score=0;

    const p=ind.close[i];

    if(p>ind.ema20[i]) score++;
    else score--;

    if(ind.ema20[i]>ind.ema50[i]) score++;
    else score--;

    if(p>ind.ema200[i]) score++;
    else score--;

    if(
        ind.macdHist[i]!==null
    ){
        if(ind.macdHist[i]>0) score++;
        else score--;
    }

    if(ind.rsi[i]>52) score++;
    if(ind.rsi[i]<48) score--;

    if(ind.adx[i]!==null&&ind.adx[i]>25){

        if(score>0) score++;
        if(score<0) score--;
    }

    let signal="НЕЙТРАЛЬНО";

    if(score>=4)
        signal="СИЛЬНАЯ ПОКУПКА";
    else if(score>=2)
        signal="ПОКУПКА";
    else if(score<=-4)
        signal="СИЛЬНАЯ ПРОДАЖА";
    else if(score<=-2)
        signal="ПРОДАЖА";

    return {score,signal};
}


/* =========================================================
   ВОЗВРАТ
========================================================= */

function futureReturn(data,i,h){

    const entry=i+1;
    const exit=i+1+h;

    if(
        entry>=data.length||
        exit>=data.length
    ){
        return null;
    }

    const e=data[entry].open;
    const x=data[exit].close;

    if(
        !Number.isFinite(e)||
        !Number.isFinite(x)||
        e===0
    ){
        return null;
    }

    return (x-e)/e*100;
}


/* =========================================================
   СТАТИСТИКА
========================================================= */

function calcStats(values){

    if(!values.length){

        return {
            n:0,
            win:null,
            avg:null,
            median:null,
            best:null,
            worst:null,
            plus1:null,
            minus1:null
        };
    }

    let wins=0;
    let plus1=0;
    let minus1=0;
    let sum=0;

    let best=-Infinity;
    let worst=Infinity;

    for(const r of values){

        if(r>0) wins++;

        if(r>1) plus1++;

        if(r<-1) minus1++;

        sum+=r;

        best=Math.max(best,r);
        worst=Math.min(worst,r);
    }

    const sorted=
        values.slice().sort(
            (a,b)=>a-b
        );

    const mid=
        Math.floor(sorted.length/2);

    const median=
        sorted.length%2?
        sorted[mid]:
        (sorted[mid-1]+sorted[mid])/2;

    return {
        n:values.length,
        win:wins/values.length*100,
        avg:sum/values.length,
        median,
        best,
        worst,
        plus1:plus1/values.length*100,
        minus1:minus1/values.length*100
    };
}


/* =========================================================
   РЕЖИМЫ — 24 ЧАСА
========================================================= */

function regimeStats(
    data,
    ind,
    interval
){

    const h=H24[interval];

    const names=[
        "Сильный бычий",
        "Бычий",
        "Боковик",
        "Медвежий",
        "Сильный медвежий"
    ];

    const result={};

    for(const name of names){
        result[name]=[];
    }

    const max=
        data.length-h-2;

    for(
        let i=200;
        i<=max;
        i++
    ){

        const r=regime(ind,i);

        const ret=
            futureReturn(data,i,h);

        if(
            ret!==null&&
            result[r]
        ){
            result[r].push(ret);
        }
    }

    const stats={};

    for(const name of names){
        stats[name]=
            calcStats(result[name]);
    }

    return stats;
}


/* =========================================================
   УСЛОВИЯ ФАКТОРОВ
========================================================= */

function factorsAt(ind,i){

    return {

        ema:
            ind.ema20[i]!==null&&
            ind.ema50[i]!==null&&
            ind.ema20[i]>ind.ema50[i],

        above200:
            ind.ema200[i]!==null&&
            ind.close[i]>ind.ema200[i],

        macd:
            ind.macd[i]!==null&&
            ind.macd[i]>0,

        hist:
            ind.macdHist[i]!==null&&
            ind.macdHist[i]>0,

        rsi:
            ind.rsi[i]!==null&&
            ind.rsi[i]>52,

        rsiSafe:
            ind.rsi[i]!==null&&
            ind.rsi[i]>=52&&
            ind.rsi[i]<=65,

        adx:
            ind.adx[i]!==null&&
            ind.adx[i]>25,

        volume:
            true
    };
}


/* =========================================================
   ОБЪЁМНЫЙ ФАКТОР
========================================================= */

function volumeCondition(data,i){

    if(i<20){
        return false;
    }

    let sum=0;

    for(let j=i-20;j<i;j++){
        sum+=data[j].volume;
    }

    const avg=sum/20;

    return data[i].volume>avg;
}


/* =========================================================
   КОМБИНАЦИЯ ФАКТОРОВ
========================================================= */

function combinationStats(
    data,
    ind,
    interval
){

    const h=H24[interval];

    const sets=[
        {
            name:"EMA20 > EMA50",
            test:f=>f.ema
        },
        {
            name:"Цена > EMA200",
            test:f=>f.above200
        },
        {
            name:"MACD > 0",
            test:f=>f.macd
        },
        {
            name:"MACD Histogram > 0",
            test:f=>f.hist
        },
        {
            name:"RSI > 52",
            test:f=>f.rsi
        },
        {
            name:"RSI 52–65",
            test:f=>f.rsiSafe
        },
        {
            name:"ADX > 25",
            test:f=>f.adx
        },
        {
            name:"Объём > среднего",
            test:f=>f.volume
        }
    ];

    const result=[];

    /*
       Ограничиваем последними 6000 точками.
       Для статистики этого достаточно и
       телефон не будет перегружаться.
    */

    const start=
        Math.max(
            200,
            data.length-6000
        );

    for(const set of sets){

        const values=[];

        for(
            let i=start;
            i<=data.length-h-2;
            i++
        ){

            const f=factorsAt(ind,i);

            if(set.name==="Объём > среднего"){
                f.volume=
                    volumeCondition(data,i);
            }

            if(!set.test(f)){
                continue;
            }

            const ret=
                futureReturn(data,i,h);

            if(ret!==null){
                values.push(ret);
            }
        }

        result.push({
            name:set.name,
            stats:calcStats(values)
        });
    }

    /*
       Теперь комбинация из основных факторов.
    */

    const comboValues=[];

    for(
        let i=start;
        i<=data.length-h-2;
        i++
    ){

        const f=factorsAt(ind,i);

        f.volume=
            volumeCondition(data,i);

        if(
            f.ema&&
            f.above200&&
            f.macd&&
            f.hist&&
            f.rsiSafe&&
            f.adx
        ){

            const ret=
                futureReturn(data,i,h);

            if(ret!==null){
                comboValues.push(ret);
            }
        }
    }

    return {
        factors:result,
        combo:calcStats(comboValues)
    };
}


/* =========================================================
   РЕЙТИНГ ТЕКУЩЕГО СИГНАЛА
========================================================= */

function statisticalScore(
    current,
    regimeStat,
    combo
){

    /*
       Базовый рейтинг.
       Это НЕ вероятность и не гарантия.
       Это удобный статистический балл.
    */

    let score=50;

    if(
        current.signal==="СИЛЬНАЯ ПОКУПКА"
    ){
        score+=12;
    }else if(
        current.signal==="ПОКУПКА"
    ){
        score+=7;
    }else if(
        current.signal==="ПРОДАЖА"
    ){
        score-=7;
    }else if(
        current.signal==="СИЛЬНАЯ ПРОДАЖА"
    ){
        score-=12;
    }

    const rs=
        regimeStat[
            current.regime
        ];

    if(
        rs&&
        rs.n>=50&&
        rs.win!==null
    ){

        score+=
            (rs.win-50)*0.35;
    }

    if(
        combo&&
        combo.n>=50&&
        combo.win!==null
    ){

        score+=
            (combo.win-50)*0.25;
    }

    return Math.max(
        0,
        Math.min(100,score)
    );
}


/* =========================================================
   КЛАСС НАДЁЖНОСТИ
========================================================= */

function reliability(n){

    if(n<50){
        return "Слабая выборка";
    }

    if(n<100){
        return "Осторожно";
    }

    if(n<300){
        return "Нормальная";
    }

    if(n<1000){
        return "Хорошая";
    }

    return "Очень хорошая";
}

/* =========================================================

========================================================= */

async function runAnalysis(){

    runBtn.disabled=true;
    loaderEl.style.display="block";
    contentEl.innerHTML="";

    const interval=
        document.getElementById(
            "interval"
        ).value;

    try{

        setStatus(
            "JavaScript работает ✓. "+
            "Загружаем историю "+interval+"..."
        );

        await new Promise(
            r=>setTimeout(r,50)
        );

        const data=
            await fetchHistory(interval);

        setStatus(
            "Получено "+
            data.length+
            " свечей. Рассчитываем индикаторы..."
        );

        await new Promise(
            r=>setTimeout(r,50)
        );

        const ind=
            indicators(data);

        const last=data.length-1;

        if(
            ind.ema200[last]===null||
            ind.rsi[last]===null
        ){

            throw new Error(
                "Недостаточно данных для EMA200/RSI"
            );
        }

        setStatus(
            "Строим статистику 24 часа..."
        );

        await new Promise(
            r=>setTimeout(r,50)
        );

        const regimeData=
            regimeStats(
                data,
                ind,
                interval
            );

        setStatus(
            "Проверяем комбинации факторов..."
        );

        await new Promise(
            r=>setTimeout(r,50)
        );

        const combo=
            combinationStats(
                data,
                ind,
                interval
            );

        /*
           Основной статистический сигнал.
        */

        renderStatisticalSignal(
            data,
            ind,
            interval,
            regimeData,
            combo
        );

        renderIndicators(
            data,
            ind
        );

        renderRegimeTable(
            regimeData,
            interval
        );

        renderFactors(
            combo,
            interval
        );

        renderHorizons(
            data,
            ind,
            interval
        );

        setStatus(
            "Анализ завершён ✓ · "+
            data.length+
            " свечей · 24ч статистика рассчитана"
        );

    }catch(error){

        console.error(error);

        contentEl.innerHTML=`

<div class="card">

<h2 class="red">
Ошибка анализа
</h2>

<p>
${error&&error.message?
    error.message:
    String(error)}
</p>

<p class="note">
Если ошибка повторится, пришли мне её
точный текст или скриншот.
</p>

</div>
`;

        setStatus(
            "Ошибка: "+
            (
                error&&error.message?
                error.message:
                String(error)
            )
        );

    }finally{

        loaderEl.style.display="none";
        runBtn.disabled=false;
    }
}
