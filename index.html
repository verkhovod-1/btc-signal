<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>₿ BTC Signal v3.2</title>

<style>
body{
  margin:0;
  padding:16px;
  background:#111827;
  color:#f3f4f6;
  font-family:Arial,sans-serif;
}
h1{font-size:24px;margin:0 0 8px}
h2{font-size:18px;margin:22px 0 10px}
.card{
  background:#1f2937;
  border-radius:12px;
  padding:14px;
  margin:10px 0;
}
.good{color:#4ade80}
.warn{color:#fbbf24}
.bad{color:#f87171}
.small{font-size:13px;color:#9ca3af}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:7px 4px;
  border-bottom:1px solid #374151;
  text-align:right;
}
th:first-child,td:first-child{text-align:left}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<h1>₿ BTC Signal</h1>
<div class="small">v3.2 · проверка горизонтов</div>

<div class="card" id="status">
  Загрузка BTC…
</div>

<div class="card" id="current"></div>

<div class="card">
  <h2>⏱ Сравнение горизонтов</h2>
  <div class="small">
    Сигнал: EMA20 > EMA50 + ADX >25 + Volume > average
  </div>
  <div id="horizon"></div>
</div>

<div class="card">
  <h2>🔒 Финальный независимый тест</h2>
  <div class="small">
    Последние 10% данных полностью исключены из разработки.
  </div>
  <div id="holdout"></div>
</div>

<button onclick="location.reload()">🔄 Обновить данные</button>

<script>

const API="https://api.binance.com/api/v3/klines";

let candles=[];
let rows=[];

function fmt(x){
  if(!Number.isFinite(x)) return "—";
  return (x>=0?"+":"")+x.toFixed(2)+"%";
}

function median(arr){
  if(!arr.length)return NaN;
  const a=[...arr].sort((x,y)=>x-y);
  const m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}

function maxLosingStreak(arr){
  let cur=0,max=0;
  for(const x of arr){
    if(x<0){
      cur++;
      if(cur>max)max=cur;
    }else cur=0;
  }
  return max;
}

function ema(values,period){
  const out=new Array(values.length).fill(null);
  if(values.length<period)return out;

  let sum=0;
  for(let i=0;i<period;i++)sum+=values[i];

  out[period-1]=sum/period;

  const k=2/(period+1);

  for(let i=period;i<values.length;i++){
    out[i]=values[i]*k+out[i-1]*(1-k);
  }

  return out;
}

function calcRSI(values,period=14){
  const out=new Array(values.length).fill(null);
  if(values.length<=period)return out;

  let gain=0,loss=0;

  for(let i=1;i<=period;i++){
    const d=values[i]-values[i-1];
    if(d>=0)gain+=d;
    else loss-=d;
  }

  let avgGain=gain/period;
  let avgLoss=loss/period;

  out[period]=avgLoss===0?100:100-(100/(1+avgGain/avgLoss));

  for(let i=period+1;i<values.length;i++){
    const d=values[i]-values[i-1];
    const g=Math.max(d,0);
    const l=Math.max(-d,0);

    avgGain=(avgGain*(period-1)+g)/period;
    avgLoss=(avgLoss*(period-1)+l)/period;

    out[i]=avgLoss===0?100:100-(100/(1+avgGain/avgLoss));
  }

  return out;
}

function calcADX(high,low,close,period=14){

  const n=close.length;
  const tr=new Array(n).fill(null);
  const plusDM=new Array(n).fill(0);
  const minusDM=new Array(n).fill(0);

  for(let i=1;i<n;i++){

    const up=high[i]-high[i-1];
    const down=low[i-1]-low[i];

    tr[i]=Math.max(
      high[i]-low[i],
      Math.abs(high[i]-close[i-1]),
      Math.abs(low[i]-close[i-1])
    );

    plusDM[i]=(up>down && up>0)?up:0;
    minusDM[i]=(down>up && down>0)?down:0;
  }

  const adx=new Array(n).fill(null);

  let atr=0,pdm=0,mdm=0;

  for(let i=1;i<=period;i++){
    atr+=tr[i]||0;
    pdm+=plusDM[i];
    mdm+=minusDM[i];
  }

  atr/=period;
  pdm/=period;
  mdm/=period;

  const dx=[];

  for(let i=period;i<n;i++){

    if(i>period){
      atr=(atr*(period-1)+(tr[i]||0))/period;
      pdm=(pdm*(period-1)+plusDM[i])/period;
      mdm=(mdm*(period-1)+minusDM[i])/period;
    }

    const pdi=atr?100*pdm/atr:0;
    const mdi=atr?100*mdm/atr:0;

    const d=pdi+mdi===0?0:100*Math.abs(pdi-mdi)/(pdi+mdi);

    dx.push({i,d});

    if(dx.length===period){
      let s=0;
      for(const x of dx)s+=x.d;
      adx[i]=s/period;
    }

    if(dx.length>period){
      const prev=adx[i-1];
      if(prev!=null)adx[i]=(prev*(period-1)+d)/period;
    }
  }

  return adx;
}

function buildIndicators(){

  const close=candles.map(x=>+x[4]);
  const high=candles.map(x=>+x[2]);
  const low=candles.map(x=>+x[3]);
  const volume=candles.map(x=>+x[5]);

  const e20=ema(close,20);
  const e50=ema(close,50);
  const e200=ema(close,200);

  const e12=ema(close,12);
  const e26=ema(close,26);

  const macd=e12.map((x,i)=>{
    if(x==null||e26[i]==null)return null;
    return x-e26[i];
  });

  const signal=ema(
    macd.map(x=>x==null?0:x),
    9
  );

  const hist=macd.map((x,i)=>{
    if(x==null||signal[i]==null)return null;
    return x-signal[i];
  });

  const rsi=calcRSI(close,14);
  const adx=calcADX(high,low,close,14);

  const volAvg=new Array(volume.length).fill(null);

  for(let i=19;i<volume.length;i++){
    let s=0;
    for(let j=i-19;j<=i;j++)s+=volume[j];
    volAvg[i]=s/20;
  }

  rows=[];

  /*
    Один row соответствует закрытой дневной свече.

    ret12/24/48/72:
    доходность от открытия следующей свечи
    до закрытия через соответствующее количество часов.

    Поскольку данные дневные:
    24h = следующая дневная свеча.
    48h = две дневные свечи.
    72h = три дневные свечи.

    Для 12h используем половину дневного диапазона
    как приближение. Это НЕ реальная внутридневная
    доходность, поэтому 12h помечается отдельно.
  */

  for(let i=200;i<candles.length-3;i++){

    if(
      e20[i]==null ||
      e50[i]==null ||
      e200[i]==null ||
      macd[i]==null ||
      hist[i]==null ||
      rsi[i]==null ||
      adx[i]==null ||
      volAvg[i]==null
    )continue;

    const signalActive=
      e20[i]>e50[i] &&
      adx[i]>25 &&
      volume[i]>volAvg[i];

    const next=candles[i+1];

    const open1=+next[1];

    const close1=+candles[i+1][4];
    const close2=+candles[i+2][4];
    const close3=+candles[i+3][4];

    const ret24=(close1-open1)/open1*100;
    const ret48=(close2-open1)/open1*100;
    const ret72=(close3-open1)/open1*100;

    /*
      12h approximation:
      midpoint between open and close of next day.
      Это только ориентир.
    */
    const mid12=(open1+close1)/2;
    const ret12=(mid12-open1)/open1*100;

    rows.push({
      i,
      active:signalActive,
      ret12,
      ret24,
      ret48,
      ret72,
      baseline12:ret12,
      baseline24:ret24,
      baseline48:ret48,
      baseline72:ret72
    });
  }
}

function stats(data,key,baseKey){

  if(!data.length){
    return {
      n:0,avg:NaN,med:NaN,win:NaN,
      gt1:NaN,lt1:NaN,streak:0,
      base:NaN,edge:NaN
    };
  }

  const vals=data.map(x=>x[key]);
  const base=data.map(x=>x[baseKey]);

  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const baseAvg=base.reduce((a,b)=>a+b,0)/base.length;

  return {
    n:vals.length,
    avg,
    med:median(vals),
    win:vals.filter(x=>x>0).length/vals.length*100,
    gt1:vals.filter(x=>x>1).length/vals.length*100,
    lt1:vals.filter(x=>x<-1).length/vals.length*100,
    streak:maxLosingStreak(vals),
    base:baseAvg,
    edge:avg-baseAvg
  };
}

function statRow(label,s){

  return `
  <tr>
    <td>${label}</td>
    <td>${s.n}</td>
    <td>${fmt(s.avg)}</td>
    <td>${fmt(s.base)}</td>
    <td>${fmt(s.edge)}</td>
    <td>${fmt(s.med)}</td>
    <td>${s.win.toFixed(1)}%</td>
    <td>${s.streak}</td>
  </tr>`;
}

function renderHorizons(){

  const active=rows.filter(x=>x.active);

  const horizons=[
    ["12h","ret12","baseline12"],
    ["24h","ret24","baseline24"],
    ["48h","ret48","baseline48"],
    ["72h","ret72","baseline72"]
  ];

  let html=`
  <table>
  <tr>
    <th>Горизонт</th>
    <th>N</th>
    <th>Signal</th>
    <th>BTC</th>
    <th>Edge</th>
    <th>Median</th>
    <th>Win</th>
    <th>Loss streak</th>
  </tr>`;

  for(const h of horizons){
    html+=statRow(h[0],stats(active,h[1],h[2]));
  }

  html+="</table>";

  document.getElementById("horizon").innerHTML=html;
}

function renderHoldout(){

  const split=Math.floor(rows.length*0.90);

  const finalRows=rows.slice(split).filter(x=>x.active);

  const horizons=[
    ["12h","ret12","baseline12"],
    ["24h","ret24","baseline24"],
    ["48h","ret48","baseline48"],
    ["72h","ret72","baseline72"]
  ];

  let html=`
  <table>
  <tr>
    <th>Горизонт</th>
    <th>N</th>
    <th>Signal</th>
    <th>BTC</th>
    <th>Edge</th>
    <th>Median</th>
    <th>Win</th>
    <th>Loss</th>
  </tr>`;

  for(const h of horizons){

    const s=stats(
      finalRows,
      h[1],
      h[2]
    );

    html+=statRow(h[0],s);
  }

  html+="</table>";

  html+=`
  <p class="small">
  Финальный участок: ${finalRows.length} сигналов.
  Сигнал выбран заранее и не подбирался по этому участку.
  </p>`;

  document.getElementById("holdout").innerHTML=html;
}

function renderCurrent(){

  const last=candles[candles.length-1];

  const close=+last[4];

  const closes=candles.map(x=>+x[4]);
  const highs=candles.map(x=>+x[2]);
  const lows=candles.map(x=>+x[3]);

  const e20=ema(closes,20);
  const e50=ema(closes,50);
  const e200=ema(closes,200);
  const rsi=calcRSI(closes,14);
  const adx=calcADX(highs,lows,closes,14);

  const volume=candles.map(x=>+x[5]);

  let vs=0;

  for(let i=volume.length-20;i<volume.length;i++)
    vs+=volume[i];

  const va=vs/20;

  const active=
    e20.at(-1)>e50.at(-1) &&
    adx.at(-1)>25 &&
    volume.at(-1)>va;

  document.getElementById("current").innerHTML=`

  <h2>📡 Текущий сигнал</h2>

  <b class="${active?"good":"warn"}">
    ${active?"🟢 SIGNAL LONG":"⚪ NO SIGNAL"}
  </b>

  <p>BTC: $${close.toLocaleString("en-US",{maximumFractionDigits:0})}</p>

  <p>
  EMA20 ${e20.at(-1)>e50.at(-1)?"✓":"✗"}
  · ADX ${adx.at(-1).toFixed(1)}
  ${adx.at(-1)>25?"✓":"✗"}
  · Volume ${(volume.at(-1)/va).toFixed(2)}x
  ${volume.at(-1)>va?"✓":"✗"}
  </p>`;
}

async function fetchBatch(endTime){

  const url=
    API+
    "?symbol=BTCUSDT&interval=1d&limit=1000"+
    (endTime?("&endTime="+endTime):"");

  const controller=new AbortController();

  const timer=setTimeout(
    ()=>controller.abort(),
    10000
  );

  try{

    const r=await fetch(url,{
      signal:controller.signal
    });

    if(!r.ok)
      throw new Error("HTTP "+r.status);

    return await r.json();

  }finally{
    clearTimeout(timer);
  }
}

async function loadHistory(){

  let all=[];
  let endTime=null;

  for(let n=1;n<=5;n++){

    document.getElementById("status").innerHTML=
      `Загрузка BTC… запрос ${n}/5`;

    const batch=await fetchBatch(endTime);

    if(!batch.length)break;

    all=all.concat(batch);

    endTime=batch[0][0]-1;

    if(batch.length<1000)break;
  }

  const map=new Map();

  for(const c of all)
    map.set(c[0],c);

  candles=[...map.values()]
    .sort((a,b)=>a[0]-b[0]);

  buildIndicators();

  document.getElementById("status").innerHTML=`
    <b class="good">Данные обновлены</b><br>
    ${candles.length} свечей · ${rows.length} строк для статистики
  `;

  renderCurrent();
  renderHorizons();
  renderHoldout();
}

loadHistory().catch(e=>{

  document.getElementById("status").innerHTML=
    `<span class="bad">
      Ошибка загрузки: ${e.message}
    </span>`;
});

</script>

</body>
</html>
