<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Signal — Тест</title>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}
.box{
  background:#151c30;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}
button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:18px;
}
#result{
  margin-top:20px;
  padding:15px;
  background:#0f172a;
  border-radius:10px;
  min-height:30px;
}
.ok{
  color:#22c55e;
}
.error{
  color:#ef4444;
}
</style>
</head>

<body>

<div class="box">

<h2>₿ BTC Signal — тест</h2>

<p id="status">JavaScript ещё не проверен</p>

<button id="testBtn">
ПРОВЕРИТЬ
</button>

<div id="result"></div>

</div>

<script>

"use strict";

const status = document.getElementById("status");
const button = document.getElementById("testBtn");
const result = document.getElementById("result");

status.textContent = "JavaScript работает";

button.addEventListener("click", function(){

    result.className = "ok";

    result.innerHTML =
        "✅ КНОПКА РАБОТАЕТ<br><br>" +
        "JavaScript работает нормально.";

});

</script>

</body>
</html>
