<script>

const VERSION="2.9";

const SYMBOL="BTCUSDT";
const INTERVAL="1d";

const API_BASE=
"https://api.binance.com/api/v3/klines";

const TARGET_CANDLES=5000;
const REQUEST_LIMIT=1000;


/* =========================================================
   UI
========================================================= */

function showLoading(text,percent){

  document.getElementById("app").innerHTML=`

    <div class="card">

      <div class="loading">

        ${text}

        <div class="progress">
          <div
            class="progressbar"
            style="width:${percent||0}%">
          </div>
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   FETCH WITH TIMEOUT
========================================================= */

async function fetchJSON(url){

  const controller=new AbortController();

  const timer=setTimeout(()=>{
    controller.abort();
  },10000);

  try{

    const response=await fetch(url,{
      signal:controller.signal,
      cache:"no-store"
    });

    if(!response.ok){

      throw new Error(
        "Binance HTTP "+response.status
      );

    }

    return await response.json();

  }catch(e){

    if(e.name==="AbortError"){

      throw new Error(
        "Binance не ответил за 10 секунд."
      );

    }

    throw e;

  }finally{

    clearTimeout(timer);

  }

}


/* =========================================================
   LOAD HISTORY
========================================================= */

async function fetchHistory(){

  let all=[];

  let endTime=Date.now();

  /*
    Загружаем историю назад.
    Каждый запрос получает до 1000 свечей.
  */

  const requests=
    Math.ceil(TARGET_CANDLES/REQUEST_LIMIT);

  for(let n=0;n<requests;n++){

    const url=
      API_BASE+
      "?symbol="+SYMBOL+
      "&interval="+INTERVAL+
      "&limit="+REQUEST_LIMIT+
      "&endTime="+endTime;

    const data=await fetchJSON(url);

    if(!Array.isArray(data) || !data.length){

      break;

    }

    /*
      Добавляем в начало,
      потому что движемся назад во времени.
    */

    all=data.concat(all);

    /*
      Следующий запрос заканчивается
      на секунду раньше самой старой свечи.
    */

    const oldest=data[0][0];

    endTime=oldest-1;

    const percent=Math.min(
      100,
      Math.round(
        all.length/TARGET_CANDLES*100
      )
    );

    showLoading(
      "Загрузка истории BTC: "+
      all.length+
      " свечей из ~"+
      TARGET_CANDLES,
      percent
    );

    /*
      Если Binance вернул меньше 1000,
      значит дошли до начала доступной истории.
    */

    if(data.length<REQUEST_LIMIT){

      break;

    }

    /*
      Небольшая пауза между запросами.
    */

    await new Promise(
      resolve=>setTimeout(resolve,150)
    );

  }

  /*
    Удаляем возможные дубликаты.
  */

  const map=new Map();

  for(const x of all){

    map.set(x[0],x);

  }

  all=[...map.values()]
    .sort((a,b)=>a[0]-b[0]);

  /*
    Только нужное количество последних свечей.
  */

  if(all.length>TARGET_CANDLES){

    all=all.slice(
      all.length-TARGET_CANDLES
    );

  }

  if(all.length<500){

    throw new Error(
      "Получено слишком мало исторических свечей: "+
      all.length
    );

  }

  return all;

}


/* =========================================================
   HELPERS
========================================================= */

function mean(a){

  if(!a.length)return null;

  return a.reduce(
    (x,y)=>x+y,
    0
  )/a.length;

}


function median(a){

  if(!a.length)return null;

  const b=[...a].sort(
    (x,y)=>x-y
  );

  const m=Math.floor(b.length/2);

  return b.length%2
    ? b[m]
    : (b[m-1]+b[m])/2;

}


function pct(x){

  if(x==null)return "—";

  return (x>=0?"+":"")+
    x.toFixed(2)+"%";

}


function num(x,n=2){

  return x==null
    ? "—"
    : Number(x).toFixed(n);

}


function winRate(a){

  if(!a.length)return null;

  return 100*
    a.filter(x=>x>0).length/
    a.length;

}


function fmtDate(ts){

  return new Date(ts)
    .toLocaleDateString(
      "ru-RU"
    );

}


/* =========================================================
   EMA
========================================================= */

function ema(values,period){

  const out=
    new Array(values.length)
    .fill(null);

  if(values.length<period)return out;

  let sum=0;

  for(let i=0;i<period;i++){

    sum+=values[i];

  }

  let prev=sum/period;

  out[period-1]=prev;

  const k=2/(period+1);

  for(let i=period;i<values.length;i++){

    prev=
      values[i]*k+
      prev*(1-k);

    out[i]=prev;

  }

  return out;

}


/* =========================================================
   RSI
========================================================= */

function rsi(values,period=14){

  const out=
    new Array(values.length)
    .fill(null);

  if(values.length<=period)return out;

  let gain=0;
  let loss=0;

  for(let i=1;i<=period;i++){

    const d=
      values[i]-values[i-1];

    if(d>=0)gain+=d;
    else loss-=d;

  }

  let avgGain=gain/period;
  let avgLoss=loss/period;

  out[period]=
    avgLoss===0
      ? 100
      : 100-
        100/
        (1+avgGain/avgLoss);

  for(
    let i=period+1;
    i<values.length;
    i++
  ){

    const d=
      values[i]-values[i-1];

    const g=d>0?d:0;
    const l=d<0?-d:0;

    avgGain=
      (avgGain*(period-1)+g)/
      period;

    avgLoss=
      (avgLoss*(period-1)+l)/
      period;

    out[i]=
      avgLoss===0
        ? 100
        : 100-
          100/
          (1+avgGain/avgLoss);

  }

  return out;

}


/* =========================================================
   MACD
========================================================= */

function macd(values){

  const e12=ema(values,12);
  const e26=ema(values,26);

  const line=
    new Array(values.length)
    .fill(null);

  for(let i=0;i<values.length;i++){

    if(
      e12[i]!=null &&
      e26[i]!=null
    ){

      line[i]=
        e12[i]-e26[i];

    }

  }

  const compact=[];
  const map=[];

  for(let i=0;i<line.length;i++){

    if(line[i]!=null){

      compact.push(line[i]);
      map.push(i);

    }

  }

  const sigCompact=
    ema(compact,9);

  const signal=
    new Array(values.length)
    .fill(null);

  const hist=
    new Array(values.length)
    .fill(null);

  for(let j=0;j<map.length;j++){

    const i=map[j];

    if(sigCompact[j]!=null){

      signal[i]=sigCompact[j];

      hist[i]=
        line[i]-signal[i];

    }

  }

  return {
    line,
    signal,
    hist
  };

}


/* =========================================================
   ADX
========================================================= */

function adx(
  high,
  low,
  close,
  period=14
){

  const n=close.length;

  const out=
    new Array(n)
    .fill(null);

  if(n<period*2+2)return out;

  const tr=
    new Array(n)
    .fill(null);

  const plusDM=
    new Array(n)
    .fill(null);

  const minusDM=
    new Array(n)
    .fill(null);

  for(let i=1;i<n;i++){

    const up=
      high[i]-high[i-1];

    const down=
      low[i-1]-low[i];

    plusDM[i]=
      up>down && up>0
        ? up
        : 0;

    minusDM[i]=
      down>up && down>0
        ? down
        : 0;

    tr[i]=Math.max(
      high[i]-low[i],
      Math.abs(
        high[i]-close[i-1]
      ),
      Math.abs(
        low[i]-close[i-1]
      )
    );

  }

  let atr=0;
  let p=0;
  let m=0;

  for(let i=1;i<=period;i++){

    atr+=tr[i];
    p+=plusDM[i];
    m+=minusDM[i];

  }

  atr/=period;
  p/=period;
  m/=period;

  const dx=[];

  function getDX(){

    const plusDI=
      atr===0
        ? 0
        : 100*p/atr;

    const minusDI=
      atr===0
        ? 0
        : 100*m/atr;

    const sum=
      plusDI+minusDI;

    return sum===0
      ? 0
      : 100*
        Math.abs(
          plusDI-minusDI
        )/
        sum;

  }

  dx.push(getDX());

  for(let i=period+1;i<n;i++){

    atr=
      (atr*(period-1)+tr[i])/
      period;

    p=
      (p*(period-1)+plusDM[i])/
      period;

    m=
      (m*(period-1)+minusDM[i])/
      period;

    const d=getDX();

    dx.push(d);

    if(dx.length>=period){

      if(out[i-1]==null){

        let s=0;

        for(
          let j=dx.length-period;
          j<dx.length;
          j++
        ){

          s+=dx[j];

        }

        out[i]=s/period;

      }else{

        out[i]=
          (
            out[i-1]*(period-1)+d
          )/period;

      }

    }

  }

  return out;

}


/* =========================================================
   PREPARE
========================================================= */

function prepare(raw){

  let data=raw.map(x=>({

    time:x[0],
    open:+x[1],
    high:+x[2],
    low:+x[3],
    close:+x[4],
    volume:+x[5]

  }));

  const day=
    24*60*60*1000;

  const last=
    data[data.length-1];

  /*
    Последнюю свечу убираем,
    если она ещё не закрыта.
  */

  if(
    last.time+day>
    Date.now()
  ){

    data=data.slice(0,-1);

  }

  const close=
    data.map(x=>x.close);

  const high=
    data.map(x=>x.high);

  const low=
    data.map(x=>x.low);

  const volume=
    data.map(x=>x.volume);

  const e20=ema(close,20);
  const e50=ema(close,50);
  const e200=ema(close,200);

  const rs=rsi(close,14);

  const mc=macd(close);

  const ax=adx(
    high,
    low,
    close,
    14
  );

  const avgVol=
    new Array(close.length)
    .fill(null);

  for(let i=20;i<close.length;i++){

    let s=0;

    for(
      let j=i-20;
      j<i;
      j++
    ){

      s+=volume[j];

    }

    avgVol[i]=s/20;

  }

  for(let i=0;i<data.length;i++){

    data[i].ema20=e20[i];
    data[i].ema50=e50[i];
    data[i].ema200=e200[i];

    data[i].rsi=rs[i];

    data[i].macd=mc.line[i];
    data[i].macdSignal=mc.signal[i];
    data[i].macdHist=mc.hist[i];

    data[i].adx=ax[i];

    data[i].avgVol=avgVol[i];

  }

  return data;

}

/* =========================================================
   FUTURE RETURN
========================================================= */

function futureReturn(data,i){

  if(i+1>=data.length){
    return null;
  }

  const entry=
    data[i+1].open;

  const exit=
    data[i+1].close;

  if(!entry || !exit){
    return null;
  }

  return(
    exit/entry-1
  )*100;

}


function buildReturns(data){

  const r=
    new Array(data.length)
    .fill(null);

  for(
    let i=0;
    i<data.length-1;
    i++
  ){

    r[i]=futureReturn(
      data,
      i
    );

  }

  return r;

}


/* =========================================================
   COMBINATIONS
========================================================= */

function comboMatches(
  data,
  i,
  ids
){

  for(const id of ids){

    const f=
      FACTORS.find(
        x=>x.id===id
      );

    if(
      !f ||
      !f.test(data[i])
    ){

      return false;

    }

  }

  return true;

}


function comboReturns(
  data,
  returns,
  start,
  end,
  ids
){

  const values=[];

  for(
    let i=start;
    i<end;
    i++
  ){

    if(
      comboMatches(
        data,
        i,
        ids
      ) &&
      returns[i]!=null
    ){

      values.push(
        returns[i]
      );

    }

  }

  return values;

}


/* =========================================================
   BASELINE
========================================================= */

function periodBaseline(
  returns,
  start,
  end
){

  const values=[];

  for(
    let i=start;
    i<end;
    i++
  ){

    if(returns[i]!=null){

      values.push(
        returns[i]
      );

    }

  }

  return {

    values,

    avg:mean(values),

    median:median(values)

  };

}


/* =========================================================
   FOLDS
========================================================= */

function makeFolds(n){

  const first=
    Math.max(
      200,
      Math.floor(n*0.40)
    );

  /*
    При большой истории используем
    более мелкие тестовые окна,
    чтобы получить больше
    независимых walk-forward периодов.
  */

  const testSize=
    Math.max(
      30,
      Math.floor(n*0.10)
    );

  const folds=[];

  for(
    let k=0;
    k<7;
    k++
  ){

    const trainEnd=
      first+k*testSize;

    const testStart=
      trainEnd;

    const testEnd=
      Math.min(
        n-1,
        testStart+testSize
      );

    if(
      testEnd-testStart<20
    ){

      continue;

    }

    folds.push({

      trainStart:0,
      trainEnd,

      testStart,
      testEnd

    });

  }

  return folds;

}


/* =========================================================
   WALK FORWARD
========================================================= */

function walkForward(
  data,
  returns,
  ids
){

  const folds=
    makeFolds(data.length);

  const results=[];

  for(const fold of folds){

    const trainVals=
      comboReturns(
        data,
        returns,
        fold.trainStart,
        fold.trainEnd,
        ids
      );

    if(trainVals.length<12){
      continue;
    }

    const testVals=
      comboReturns(
        data,
        returns,
        fold.testStart,
        fold.testEnd,
        ids
      );

    if(testVals.length<8){
      continue;
    }

    const base=
      periodBaseline(
        returns,
        fold.testStart,
        fold.testEnd
      );

    if(base.avg==null){
      continue;
    }

    const testAvg=
      mean(testVals);

    results.push({

      trainN:
        trainVals.length,

      testN:
        testVals.length,

      testAvg,

      testMedian:
        median(testVals),

      btcAvg:
        base.avg,

      btcMedian:
        base.median,

      edge:
        testAvg-base.avg,

      start:
        data[
          fold.testStart
        ].time,

      end:
        data[
          Math.min(
            fold.testEnd,
            data.length-1
          )
        ].time

    });

  }

  return results;

}


/* =========================================================
   SCORE
========================================================= */

function walkScore(folds){

  if(!folds.length){

    return {

      score:0,
      meanEdge:null,
      medianEdge:null,
      positive:0,
      total:0,
      totalTestN:0,
      worst:null,
      status:"НЕДОСТАТОЧНО ДАННЫХ"

    };

  }

  const edges=
    folds.map(
      x=>x.edge
    );

  const meanEdge=
    mean(edges);

  const medianEdge=
    median(edges);

  const positive=
    edges.filter(
      x=>x>0
    ).length;

  const total=
    edges.length;

  const totalTestN=
    folds.reduce(
      (s,x)=>s+x.testN,
      0
    );

  const worst=
    Math.min(...edges);

  const confirmed=
    total>=4 &&
    totalTestN>=150 &&
    positive/total>=0.75 &&
    meanEdge>0.10 &&
    medianEdge>0 &&
    worst>-0.50;

  let status;

  if(confirmed){

    status="ПОДТВЕРЖДАЕТСЯ";

  }else if(
    total>=3 &&
    meanEdge>0 &&
    medianEdge>=0
  ){

    status=
      "ЧАСТИЧНО ПОДТВЕРЖДАЕТСЯ";

  }else{

    status=
      "НЕ ПОДТВЕРЖДАЕТСЯ";

  }

  /*
    Score используется только
    для ранжирования кандидатов.
  */

  let score=0;

  if(meanEdge>0)score+=25;
  if(meanEdge>0.10)score+=20;
  if(meanEdge>0.25)score+=10;

  if(medianEdge>0)score+=15;
  if(medianEdge>0.10)score+=10;

  if(total>=4)score+=10;
  if(totalTestN>=150)score+=10;

  if(
    positive/total>=0.75
  )score+=10;

  score=
    Math.min(
      100,
      score
    );

  return {

    score,
    meanEdge,
    medianEdge,
    positive,
    total,
    totalTestN,
    worst,
    status

  };

}


/* =========================================================
   COMBINATION
========================================================= */

function analyzeCombination(
  data,
  returns,
  ids
){

  const folds=
    walkForward(
      data,
      returns,
      ids
    );

  return {

    ids,
    folds,
    ...walkScore(folds)

  };

}


/* =========================================================
   ALL COMBINATIONS
========================================================= */

function combinations(
  array,
  min,
  max
){

  const result=[];

  function rec(
    start,
    current
  ){

    if(
      current.length>=min &&
      current.length<=max
    ){

      result.push(
        [...current]
      );

    }

    if(
      current.length===max
    ){
      return;
    }

    for(
      let i=start;
      i<array.length;
      i++
    ){

      current.push(
        array[i]
      );

      rec(
        i+1,
        current
      );

      current.pop();

    }

  }

  rec(0,[]);

  return result;

}


/* =========================================================
   TOP COMBINATIONS
========================================================= */

function findTopCombinations(
  data,
  returns
){

  const ids=
    FACTORS.map(
      x=>x.id
    );

  const combos=
    combinations(
      ids,
      2,
      4
    );

  const results=[];

  for(const combo of combos){

    const r=
      analyzeCombination(
        data,
        returns,
        combo
      );

    if(r.folds.length){

      results.push(r);

    }

  }

  results.sort(
    (a,b)=>{

      if(
        (b.score||0)!==
        (a.score||0)
      ){

        return(
          b.score||0
        )-
        (a.score||0);

      }

      return(
        b.meanEdge||-999
      )-
      (
        a.meanEdge||-999
      );

    }
  );

  return results;

}


/* =========================================================
   INDIVIDUAL FACTORS
========================================================= */

function individualStats(
  data,
  returns
){

  const out=[];

  for(const f of FACTORS){

    const vals=[];

    for(
      let i=0;
      i<data.length-1;
      i++
    ){

      if(
        f.test(data[i]) &&
        returns[i]!=null
      ){

        vals.push(
          returns[i]
        );

      }

    }

    if(!vals.length)continue;

    out.push({

      name:f.name,
      n:vals.length,
      avg:mean(vals),
      median:median(vals),
      win:winRate(vals),

      plus1:
        100*
        vals.filter(
          x=>x>1
        ).length/
        vals.length,

      minus1:
        100*
        vals.filter(
          x=>x<-1
        ).length/
        vals.length

    });

  }

  return out;

}


/* =========================================================
   REGIMES
========================================================= */

function regime(d){

  const bull=
    d.close>d.ema200 &&
    d.ema20>d.ema50 &&
    d.macd>0;

  const bear=
    d.close<d.ema200 &&
    d.ema20<d.ema50 &&
    d.macd<0;

  if(
    bull &&
    d.adx!=null &&
    d.adx>=30
  ){

    return "Strong Bullish";

  }

  if(bull){
    return "Bullish";
  }

  if(
    bear &&
    d.adx!=null &&
    d.adx>=30
  ){

    return "Strong Bearish";

  }

  if(bear){
    return "Bearish";
  }

  return "Flat";

}


function regimeStats(
  data,
  returns
){

  const map={};

  for(
    let i=0;
    i<data.length-1;
    i++
  ){

    const r=returns[i];

    if(r==null)continue;

    const rg=
      regime(data[i]);

    if(!map[rg]){
      map[rg]=[];
    }

    map[rg].push(r);

  }

  return Object.entries(
    map
  ).map(
    ([name,vals])=>({

      name,
      n:vals.length,
      avg:mean(vals),
      median:median(vals),
      win:winRate(vals)

    })
  );

}


/* =========================================================
   YEAR STATS FOR MAIN CANDIDATE
========================================================= */

function yearlyCandidateStats(
  data,
  returns,
  ids
){

  const map={};

  for(
    let i=0;
    i<data.length-1;
    i++
  ){

    if(
      !comboMatches(
        data,
        i,
        ids
      )
    ){

      continue;

    }

    if(returns[i]==null){
      continue;
    }

    const year=
      new Date(
        data[i].time
      ).getUTCFullYear();

    if(!map[year]){
      map[year]=[];
    }

    map[year].push(
      returns[i]
    );

  }

  return Object.entries(map)
    .map(
      ([year,vals])=>({

        year:+year,

        n:vals.length,

        avg:mean(vals),

        median:median(vals),

        win:winRate(vals),

        plus1:
          100*
          vals.filter(
            x=>x>1
          ).length/
          vals.length,

        minus1:
          100*
          vals.filter(
            x=>x<-1
          ).length/
          vals.length

      })
    )
    .sort(
      (a,b)=>a.year-b.year
    );

}


/* =========================================================
   CURRENT
========================================================= */

function activeFactorIds(d){

  return FACTORS
    .filter(
      f=>f.test(d)
    )
    .map(
      f=>f.id
    );

}


function currentSignal(
  data,
  returns
){

  const d=
    data[data.length-1];

  const ids=
    activeFactorIds(d);

  const vals=
    comboReturns(
      data,
      returns,
      0,
      data.length-1,
      ids
    );

  const base=
    periodBaseline(
      returns,
      0,
      data.length-1
    );

  const avg=mean(vals);
  const med=median(vals);
  const wr=winRate(vals);

  let score=50;

  if(avg!=null){

    if(avg>0.5)score+=20;
    else if(avg>0.2)score+=10;
    else if(avg<-0.5)score-=20;
    else if(avg<0)score-=10;

  }

  if(wr!=null){

    if(wr>55)score+=10;
    else if(wr<45)score-=10;

  }

  score=
    Math.max(
      0,
      Math.min(
        100,
        score
      )
    );

  let basic;

  if(score>=60){
    basic="BUY";
  }else if(score<=40){
    basic="SELL";
  }else{
    basic="HOLD";
  }

  return {

    d,
    ids,
    vals,
    avg,
    med,
    wr,

    baseline:base,

    edge:
      avg!=null &&
      base.avg!=null
        ? avg-base.avg
        : null,

    score,
    basic,
    regime:regime(d)

  };

}


/* =========================================================
   NAME
========================================================= */

function factorNames(ids){

  return ids
    .map(
      id=>{

        const f=
          FACTORS.find(
            x=>x.id===id
          );

        return f
          ? f.name
          : id;

      }
    )
    .join(" + ");

}
