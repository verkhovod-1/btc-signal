<script>

const VERSION="2.8.2";

const API_URL=
"https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1500";


/* =========================================================
   FETCH
========================================================= */

async function fetchKlines(){

  const controller=new AbortController();

  const timer=setTimeout(()=>{
    controller.abort();
  },10000);

  try{

    const response=await fetch(API_URL,{
      signal:controller.signal,
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("Binance HTTP "+response.status);
    }

    const data=await response.json();

    if(!Array.isArray(data) || data.length<300){
      throw new Error("Binance вернул недостаточно данных");
    }

    return data;

  }catch(e){

    if(e.name==="AbortError"){
      throw new Error(
        "Binance не ответил за 10 секунд. Проверьте интернет-соединение или доступ к Binance."
      );
    }

    throw e;

  }finally{
    clearTimeout(timer);
  }
}


/* =========================================================
   HELPERS
========================================================= */

function mean(a){
  if(!a.length) return null;
  return a.reduce((x,y)=>x+y,0)/a.length;
}

function median(a){

  if(!a.length) return null;

  const b=[...a].sort((x,y)=>x-y);
  const m=Math.floor(b.length/2);

  return b.length%2
    ? b[m]
    : (b[m-1]+b[m])/2;
}

function pct(x){
  return x==null ? "—" : (x>=0?"+":"")+x.toFixed(2)+"%";
}

function num(x,n=2){
  return x==null ? "—" : Number(x).toFixed(n);
}

function winRate(a){

  if(!a.length) return null;

  return 100*a.filter(x=>x>0).length/a.length;
}

function fmtDate(ts){
  return new Date(ts).toLocaleDateString("ru-RU");
}


/* =========================================================
   INDICATORS
========================================================= */

function ema(values,period){

  const out=new Array(values.length).fill(null);

  if(values.length<period) return out;

  let sum=0;

  for(let i=0;i<period;i++){
    sum+=values[i];
  }

  let prev=sum/period;
  out[period-1]=prev;

  const k=2/(period+1);

  for(let i=period;i<values.length;i++){

    prev=values[i]*k+prev*(1-k);
    out[i]=prev;

  }

  return out;
}


function rsi(values,period=14){

  const out=new Array(values.length).fill(null);

  if(values.length<=period) return out;

  let gain=0;
  let loss=0;

  for(let i=1;i<=period;i++){

    const d=values[i]-values[i-1];

    if(d>=0) gain+=d;
    else loss-=d;

  }

  let avgGain=gain/period;
  let avgLoss=loss/period;

  out[period]=
    avgLoss===0 ? 100 : 100-(100/(1+avgGain/avgLoss));

  for(let i=period+1;i<values.length;i++){

    const d=values[i]-values[i-1];

    const g=d>0?d:0;
    const l=d<0?-d:0;

    avgGain=(avgGain*(period-1)+g)/period;
    avgLoss=(avgLoss*(period-1)+l)/period;

    out[i]=
      avgLoss===0 ? 100 : 100-(100/(1+avgGain/avgLoss));

  }

  return out;
}


function macd(values){

  const e12=ema(values,12);
  const e26=ema(values,26);

  const line=new Array(values.length).fill(null);

  for(let i=0;i<values.length;i++){

    if(e12[i]!=null && e26[i]!=null){
      line[i]=e12[i]-e26[i];
    }

  }

  const compact=[];
  const map=[];

  for(let i=0;i<line.length;i++){

    if(line[i]!=null){
      compact.push(line[i]);
      map.push(i);
    }

  }

  const signalCompact=ema(compact,9);

  const signal=new Array(values.length).fill(null);
  const hist=new Array(values.length).fill(null);

  for(let j=0;j<map.length;j++){

    const i=map[j];

    if(signalCompact[j]!=null){

      signal[i]=signalCompact[j];
      hist[i]=line[i]-signal[i];

    }

  }

  return {line,signal,hist};
}


function adx(high,low,close,period=14){

  const n=close.length;

  const out=new Array(n).fill(null);

  if(n<period*2+2) return out;

  const tr=new Array(n).fill(null);
  const plusDM=new Array(n).fill(null);
  const minusDM=new Array(n).fill(null);

  for(let i=1;i<n;i++){

    const up=high[i]-high[i-1];
    const down=low[i-1]-low[i];

    plusDM[i]=(up>down && up>0)?up:0;
    minusDM[i]=(down>up && down>0)?down:0;

    tr[i]=Math.max(
      high[i]-low[i],
      Math.abs(high[i]-close[i-1]),
      Math.abs(low[i]-close[i-1])
    );

  }

  let atr=0;
  let p=0;
  let m=0;

  for(let i=1;i<=period;i++){

    atr+=tr[i];
    p+=plusDM[i];
    m+=minusDM[i];

  }

  atr/=period;
  p/=period;
  m/=period;

  const dx=[];

  function calcDX(){

    const plusDI=atr===0?0:100*(p/atr);
    const minusDI=atr===0?0:100*(m/atr);

    const sum=plusDI+minusDI;

    return sum===0
      ? 0
      : 100*Math.abs(plusDI-minusDI)/sum;
  }

  dx.push(calcDX());

  for(let i=period+1;i<n;i++){

    atr=(atr*(period-1)+tr[i])/period;
    p=(p*(period-1)+plusDM[i])/period;
    m=(m*(period-1)+minusDM[i])/period;

    const d=calcDX();

    dx.push(d);

    if(dx.length>=period){

      if(out[i-1]==null){

        let s=0;

        for(let j=dx.length-period;j<dx.length;j++){
          s+=dx[j];
        }

        out[i]=s/period;

      }else{

        out[i]=(out[i-1]*(period-1)+d)/period;

      }

    }

  }

  return out;
}


/* =========================================================
   PREPARE DATA
========================================================= */

function prepare(raw){

  const data=raw.map(x=>({

    time:x[0],
    open:+x[1],
    high:+x[2],
    low:+x[3],
    close:+x[4],
    volume:+x[5]

  }));

  /*
    Последняя свеча Binance может быть ещё открыта.
    Для дневного прогноза используем только закрытые свечи.
  */

  const now=Date.now();

  const last=data[data.length-1];

  const day=24*60*60*1000;

  const closed =
    last.time+day <= now
      ? data
      : data.slice(0,-1);

  const close=closed.map(x=>x.close);
  const high=closed.map(x=>x.high);
  const low=closed.map(x=>x.low);
  const volume=closed.map(x=>x.volume);

  const e20=ema(close,20);
  const e50=ema(close,50);
  const e200=ema(close,200);

  const r=rsi(close,14);

  const mc=macd(close);

  const ax=adx(high,low,close,14);

  const avgVol=new Array(close.length).fill(null);

  for(let i=20;i<close.length;i++){

    let s=0;

    for(let j=i-20;j<i;j++){
      s+=volume[j];
    }

    avgVol[i]=s/20;

  }

  for(let i=0;i<closed.length;i++){

    closed[i].ema20=e20[i];
    closed[i].ema50=e50[i];
    closed[i].ema200=e200[i];

    closed[i].rsi=r[i];

    closed[i].macd=mc.line[i];
    closed[i].macdSignal=mc.signal[i];
    closed[i].macdHist=mc.hist[i];

    closed[i].adx=ax[i];

    closed[i].avgVol=avgVol[i];

  }

  return closed;
}


/* =========================================================
   FACTORS
========================================================= */

const FACTORS=[

  {
    id:"ema",
    name:"EMA20 > EMA50",
    test:d=>d.ema20!=null && d.ema50!=null && d.ema20>d.ema50
  },

  {
    id:"ema200",
    name:"Цена > EMA200",
    test:d=>d.ema200!=null && d.close>d.ema200
  },

  {
    id:"macd",
    name:"MACD > 0",
    test:d=>d.macd!=null && d.macd>0
  },

  {
    id:"hist",
    name:"MACD Histogram > 0",
    test:d=>d.macdHist!=null && d.macdHist>0
  },

  {
    id:"rsi52",
    name:"RSI > 52",
    test:d=>d.rsi!=null && d.rsi>52
  },

  {
    id:"rsi5265",
    name:"RSI 52–65",
    test:d=>d.rsi!=null && d.rsi>=52 && d.rsi<=65
  },

  {
    id:"adx25",
    name:"ADX > 25",
    test:d=>d.adx!=null && d.adx>25
  },

  {
    id:"volume",
    name:"Volume > average",
    test:d=>d.avgVol!=null && d.volume>d.avgVol
  }

];


/* =========================================================
   FACTOR STATE
========================================================= */

function factorState(d){

  const obj={};

  for(const f of FACTORS){
    obj[f.id]=f.test(d);
  }

  return obj;
}

function activeFactorIds(d){

  const s=factorState(d);

  return FACTORS
    .filter(f=>s[f.id])
    .map(f=>f.id);
}


/* =========================================================
   FUTURE RETURN
========================================================= */

function futureReturn(data,i){

  if(i+1>=data.length) return null;

  /*
    Вход: следующий дневной open
    Выход: следующий дневной close
  */

  const entry=data[i+1].open;
  const exit=data[i+1].close;

  if(!entry || !exit) return null;

  return (exit/entry-1)*100;
}


/* =========================================================
   RETURNS
========================================================= */

function buildReturns(data){

  const arr=new Array(data.length).fill(null);

  for(let i=0;i<data.length-1;i++){
    arr[i]=futureReturn(data,i);
  }

  return arr;
}


/* =========================================================
   BASELINE
========================================================= */

function periodBaseline(returns,start,end){

  const values=[];

  /*
    Все движения BTC внутри тестового периода.
    Это принципиально важно:
    baseline НЕ ограничивается сигналами комбинации.
  */

  for(let i=start;i<end;i++){

    if(returns[i]!=null){
      values.push(returns[i]);
    }

  }

  return {
    values,
    avg:mean(values),
    median:median(values)
  };
}


/* =========================================================
   COMBO SIGNALS
========================================================= */

function comboMatches(data,i,ids){

  for(const id of ids){

    const factor=FACTORS.find(f=>f.id===id);

    if(!factor || !factor.test(data[i])){
      return false;
    }

  }

  return true;
}


function comboReturns(data,returns,start,end,ids){

  const values=[];

  for(let i=start;i<end;i++){

    if(comboMatches(data,i,ids) && returns[i]!=null){
      values.push(returns[i]);
    }

  }

  return values;
}


/* =========================================================
   FOLDS
========================================================= */

function makeFolds(n){

  /*
    5 expanding walk-forward folds.

    Для каждой проверки:
    train идёт только из прошлого,
    test — следующий участок.

    Никакого заглядывания в будущее.
  */

  const first=Math.max(
    200,
    Math.floor(n*0.40)
  );

  const testSize=Math.max(
    20,
    Math.floor(n*0.12)
  );

  const folds=[];

  for(let k=0;k<5;k++){

    const trainEnd=first+k*testSize;

    const testStart=trainEnd;
    const testEnd=Math.min(
      n-1,
      testStart+testSize
    );

    if(testEnd-testStart<10) continue;

    folds.push({
      trainStart:0,
      trainEnd,
      testStart,
      testEnd
    });

  }

  return folds;
}


/* =========================================================
   WALK FORWARD
========================================================= */

function walkForward(data,returns,ids){

  const folds=makeFolds(data.length);

  const results=[];

  for(const fold of folds){

    const trainVals=comboReturns(
      data,
      returns,
      fold.trainStart,
      fold.trainEnd,
      ids
    );

    /*
      Не допускаем комбинации, которые в обучении
      практически не встречаются.
    */

    if(trainVals.length<8) continue;

    const testVals=comboReturns(
      data,
      returns,
      fold.testStart,
      fold.testEnd,
      ids
    );

    if(testVals.length<5) continue;

    /*
      ВАЖНО:
      baseline берётся по ВСЕМ BTC-сделкам
      тестового окна.
    */

    const base=periodBaseline(
      returns,
      fold.testStart,
      fold.testEnd
    );

    if(base.avg==null) continue;

    const testAvg=mean(testVals);

    results.push({

      trainN:trainVals.length,
      testN:testVals.length,

      testAvg,
      testMedian:median(testVals),

      btcAvg:base.avg,
      btcMedian:base.median,

      edge:testAvg-base.avg,

      start:data[fold.testStart].time,
      end:data[Math.min(
        fold.testEnd,
        data.length-1
      )].time

    });

  }

  return results;
}


/* =========================================================
   WALK SCORE
========================================================= */

function walkScore(folds){

  if(!folds.length){
    return {
      score:0,
      meanEdge:null,
      medianEdge:null,
      positive:0,
      total:0,
      totalTestN:0,
      worst:null,
      status:"НЕДОСТАТОЧНО ДАННЫХ"
    };
  }

  const edges=folds.map(x=>x.edge);

  const meanEdge=mean(edges);
  const medianEdge=median(edges);

  const positive=edges.filter(x=>x>0).length;

  const total=edges.length;

  const totalTestN=
    folds.reduce((s,x)=>s+x.testN,0);

  const worst=Math.min(...edges);

  /*
    Строгие критерии подтверждения.

    Требуем:
    - минимум 4 тестовых периода
    - минимум 150 наблюдений
    - минимум 75% положительных периодов
    - среднее преимущество > 0.10%
    - медианное преимущество > 0
    - худший период не хуже -0.50%
  */

  const confirmed=
    total>=4 &&
    totalTestN>=150 &&
    positive/total>=0.75 &&
    meanEdge>0.10 &&
    medianEdge>0 &&
    worst>-0.50;

  let status;

  if(confirmed){

    status="ПОДТВЕРЖДАЕТСЯ";

  }else if(
    total>=3 &&
    meanEdge>0 &&
    medianEdge>=0
  ){

    status="ЧАСТИЧНО ПОДТВЕРЖДАЕТСЯ";

  }else{

    status="НЕ ПОДТВЕРЖДАЕТСЯ";

  }

  /*
    Score — НЕ вероятность.

    Это техническая оценка устойчивости
    для сравнения комбинаций между собой.
  */

  let score=0;

  if(meanEdge>0) score+=25;
  if(meanEdge>0.10) score+=20;
  if(meanEdge>0.25) score+=10;

  if(medianEdge>0) score+=15;
  if(medianEdge>0.10) score+=10;

  if(total>=4) score+=10;

  if(totalTestN>=150) score+=10;

  if(positive/total>=0.75) score+=10;

  score=Math.min(100,score);

  return {
    score,
    meanEdge,
    medianEdge,
    positive,
    total,
    totalTestN,
    worst,
    status
  };
}


/* =========================================================
   COMBINATION ANALYSIS
========================================================= */

function analyzeCombination(data,returns,ids){

  const folds=walkForward(
    data,
    returns,
    ids
  );

  const s=walkScore(folds);

  return {
    ids,
    folds,
    ...s
  };
}


/* =========================================================
   ALL COMBINATIONS
========================================================= */

function combinations(array,min,max){

  const result=[];

  function rec(start,current){

    if(current.length>=min &&
       current.length<=max){

      result.push([...current]);

    }

    if(current.length===max) return;

    for(let i=start;i<array.length;i++){

      current.push(array[i]);
      rec(i+1,current);
      current.pop();

    }

  }

  rec(0,[]);

  return result;
}


/* =========================================================
   TOP COMBINATIONS
========================================================= */

function findTopCombinations(data,returns){

  const ids=FACTORS.map(x=>x.id);

  const combos=combinations(ids,2,4);

  const results=[];

  for(const combo of combos){

    const r=analyzeCombination(
      data,
      returns,
      combo
    );

    if(r.folds.length){

      results.push(r);

    }

  }

  results.sort((a,b)=>{

    if((b.score||0)!==(a.score||0)){
      return (b.score||0)-(a.score||0);
    }

    return (b.meanEdge||-999)-
           (a.meanEdge||-999);

  });

  return results;
}


/* =========================================================
   INDIVIDUAL FACTORS
========================================================= */

function individualStats(data,returns){

  const out=[];

  for(const f of FACTORS){

    const vals=[];

    for(let i=0;i<data.length-1;i++){

      if(f.test(data[i]) &&
         returns[i]!=null){

        vals.push(returns[i]);

      }

    }

    if(!vals.length) continue;

    out.push({

      name:f.name,
      n:vals.length,
      avg:mean(vals),
      median:median(vals),
      win:winRate(vals),
      plus1:100*vals.filter(x=>x>1).length/vals.length,
      minus1:100*vals.filter(x=>x<-1).length/vals.length

    });

  }

  return out;
}


/* =========================================================
   REGIMES
========================================================= */

function regime(d){

  const bull=
    d.close>d.ema200 &&
    d.ema20>d.ema50 &&
    d.macd>0;

  const bear=
    d.close<d.ema200 &&
    d.ema20<d.ema50 &&
    d.macd<0;

  if(
    bull &&
    d.adx!=null &&
    d.adx>=30
  ){
    return "Strong Bullish";
  }

  if(bull){
    return "Bullish";
  }

  if(
    bear &&
    d.adx!=null &&
    d.adx>=30
  ){
    return "Strong Bearish";
  }

  if(bear){
    return "Bearish";
  }

  return "Flat";
}


function regimeStats(data,returns){

  const map={};

  for(let i=0;i<data.length-1;i++){

    const r=returns[i];

    if(r==null) continue;

    const rg=regime(data[i]);

    if(!map[rg]) map[rg]=[];

    map[rg].push(r);

  }

  return Object.entries(map).map(
    ([name,vals])=>({

      name,
      n:vals.length,
      avg:mean(vals),
      median:median(vals),
      win:winRate(vals)

    })
  );

}


/* =========================================================
   INCREMENTAL ANALYSIS
========================================================= */

function incrementalAnalysis(
  data,
  returns,
  baseIds,
  candidateIds
){

  const baseVals=comboReturns(
    data,
    returns,
    0,
    data.length-1,
    baseIds
  );

  const afterVals=comboReturns(
    data,
    returns,
    0,
    data.length-1,
    candidateIds
  );

  const globalBase=periodBaseline(
    returns,
    0,
    data.length-1
  );

  const baseAvg=mean(baseVals);
  const afterAvg=mean(afterVals);

  return {

    baseN:baseVals.length,
    afterN:afterVals.length,

    baseAvg,
    afterAvg,

    baseEdge:
      baseAvg!=null && globalBase.avg!=null
        ? baseAvg-globalBase.avg
        : null,

    afterEdge:
      afterAvg!=null && globalBase.avg!=null
        ? afterAvg-globalBase.avg
        : null,

    incremental:
      baseAvg!=null && afterAvg!=null
        ? afterAvg-baseAvg
        : null

  };

}


/* =========================================================
   CURRENT SIGNAL
========================================================= */

function currentSignal(data,returns){

  const d=data[data.length-1];

  const ids=activeFactorIds(d);

  const vals=comboReturns(
    data,
    returns,
    0,
    data.length-1,
    ids
  );

  const base=periodBaseline(
    returns,
    0,
    data.length-1
  );

  const avg=mean(vals);
  const med=median(vals);
  const wr=winRate(vals);

  let score=50;

  if(avg!=null){

    if(avg>0.5) score+=20;
    else if(avg>0.2) score+=10;
    else if(avg<-0.5) score-=20;
    else if(avg<0) score-=10;

  }

  if(wr!=null){

    if(wr>55) score+=10;
    else if(wr<45) score-=10;

  }

  score=Math.max(0,Math.min(100,score));

  let basic;

  if(score>=60) basic="BUY";
  else if(score<=40) basic="SELL";
  else basic="HOLD";

  return {

    d,
    ids,
    vals,
    avg,
    med,
    wr,
    baseline:base,
    edge:
      avg!=null && base.avg!=null
        ? avg-base.avg
        : null,
    score,
    basic,
    regime:regime(d)

  };

}


/* =========================================================

========================================================= */

function factorNames(ids){

  return ids.map(id=>{

    const f=FACTORS.find(x=>x.id===id);

    return f?f.name:id;

  }).join(" + ");

}


function statusClass(status){

  if(status==="ПОДТВЕРЖДАЕТСЯ"){
    return "good";
  }

  if(status==="ЧАСТИЧНО ПОДТВЕРЖДАЕТСЯ"){
    return "warn";
  }

  return "bad";
}


function renderError(message){

  document.getElementById("app").innerHTML=`

    <div class="card">

      <h2>Ошибка загрузки BTC</h2>

      <div class="error">

}
