<script>

const TF = {
 "15m": 900000,
 "1h": 3600000,
 "4h": 14400000,
 "1d": 86400000
};


/*
 HORIZONS

 15m:
 4 свечи = 1 час
 16 свечей = 4 часа
 96 свечей = 24 часа

 1h:
 1 свеча = 1 час
 4 свечи = 4 часа
 24 свечи = 24 часа

 4h:
 1 свеча = 4 часа
 6 свечей = 24 часа

 1d:
 1 свеча = 24 часа
*/

const HORIZONS = {
 "15m":[4,16,96],
 "1h":[1,4,24],
 "4h":[1,6],
 "1d":[1]
};


function sleep(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}


/*
 ИСПРАВЛЕННАЯ ФУНКЦИЯ

 Раньше:

 if(!isFinite(x))
    return "—";

 Для null это не работало,
 потому что isFinite(null) возвращает true.

 Поэтому при null выполнялся:

 null.toFixed(2)

 и приложение падало.
*/

function pct(x){

 if(
  x === null ||
  x === undefined ||
  !Number.isFinite(Number(x))
 ){
  return "—";
 }

 const n = Number(x);

 return (
  n >= 0 ? "+" : ""
 ) + n.toFixed(2) + "%";
}


function num(x){

 const n = Number(x);

 return Number.isFinite(n) ? n : null;
}


function fmtPrice(x){

 const n = Number(x);

 if(!Number.isFinite(n)){
  return "—";
 }

 return n.toLocaleString(
  "en-US",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 );
}


function formatHorizon(tf,h){

 if(tf==="15m"){
  if(h===4) return "1 час";
  if(h===16) return "4 часа";
  if(h===96) return "24 часа";
 }

 if(tf==="1h"){
  if(h===1) return "1 час";
  if(h===4) return "4 часа";
  if(h===24) return "24 часа";
 }

 if(tf==="4h"){
  if(h===1) return "4 часа";
  if(h===6) return "24 часа";
 }

 if(tf==="1d"){
  if(h===1) return "24 часа";
 }

 return `${h} свеч.`;
}


/* =========================
   INDICATORS
========================= */

function ema(values,period){

 const result = new Array(values.length).fill(null);

 if(values.length < period){
  return result;
 }

 let sum = 0;

 for(let i=0;i<period;i++){
  sum += values[i];
 }

 let prev = sum / period;

 result[period-1] = prev;

 const k = 2/(period+1);

 for(let i=period;i<values.length;i++){

  prev =
   values[i] * k +
   prev * (1-k);

  result[i] = prev;
 }

 return result;
}


function rsi(values,period=14){

 const result = new Array(values.length).fill(null);

 if(values.length <= period){
  return result;
 }

 let gains = 0;
 let losses = 0;

 for(let i=1;i<=period;i++){

  const diff =
   values[i]-values[i-1];

  if(diff>=0){
   gains += diff;
  }else{
   losses -= diff;
  }
 }

 let avgGain = gains/period;
 let avgLoss = losses/period;

 if(avgLoss===0){
  result[period] = 100;
 }else{
  const rs = avgGain/avgLoss;
  result[period] = 100-(100/(1+rs));
 }

 for(let i=period+1;i<values.length;i++){

  const diff =
   values[i]-values[i-1];

  const gain =
   diff>0 ? diff : 0;

  const loss =
   diff<0 ? -diff : 0;

  avgGain =
   (avgGain*(period-1)+gain)/period;

  avgLoss =
   (avgLoss*(period-1)+loss)/period;

  if(avgLoss===0){
   result[i]=100;
  }else{
   const rs=avgGain/avgLoss;
   result[i]=100-(100/(1+rs));
  }
 }

 return result;
}


function macd(values){

 const ema12 = ema(values,12);
 const ema26 = ema(values,26);

 const line =
  new Array(values.length).fill(null);

 for(let i=0;i<values.length;i++){

  if(
   ema12[i]!==null &&
   ema26[i]!==null
  ){
   line[i]=ema12[i]-ema26[i];
  }
 }

 const valid = [];

 const indexes = [];

 for(let i=0;i<line.length;i++){

  if(line[i]!==null){
   valid.push(line[i]);
   indexes.push(i);
  }
 }

 const signalValues =
  ema(valid,9);

 const signal =
  new Array(values.length).fill(null);

 const histogram =
  new Array(values.length).fill(null);

 for(let j=0;j<indexes.length;j++){

  const i=indexes[j];

  if(signalValues[j]!==null){

   signal[i]=signalValues[j];

   histogram[i]=
    line[i]-signal[i];
  }
 }

 return {
  line,
  signal,
  histogram
 };
}


/* =========================
   ADX
========================= */

function adx(data,period=14){

 const n=data.length;

 const result =
  new Array(n).fill(null);

 const plusDI =
  new Array(n).fill(null);

 const minusDI =
  new Array(n).fill(null);

 if(n < period*2+1){
  return {
   adx:result,
   plusDI,
   minusDI
  };
 }

 const tr = new Array(n).fill(0);
 const plusDM = new Array(n).fill(0);
 const minusDM = new Array(n).fill(0);

 for(let i=1;i<n;i++){

  const high=data[i].high;
  const low=data[i].low;

  const prevHigh=data[i-1].high;
  const prevLow=data[i-1].low;
  const prevClose=data[i-1].close;

  tr[i]=Math.max(
   high-low,
   Math.abs(high-prevClose),
   Math.abs(low-prevClose)
  );

  const upMove =
   high-prevHigh;

  const downMove =
   prevLow-low;

  plusDM[i]=
   upMove>downMove && upMove>0
   ? upMove
   : 0;

  minusDM[i]=
   downMove>upMove && downMove>0
   ? downMove
   : 0;
 }

 let atr=0;
 let pDM=0;
 let mDM=0;

 for(let i=1;i<=period;i++){

  atr+=tr[i];
  pDM+=plusDM[i];
  mDM+=minusDM[i];
 }

 for(let i=period;i<n;i++){

  if(i>period){

   atr =
    atr-(atr/period)+tr[i];

   pDM =
    pDM-(pDM/period)+plusDM[i];

   mDM =
    mDM-(mDM/period)+minusDM[i];
  }

  if(atr===0) continue;

  const pdi =
   100*(pDM/atr);

  const mdi =
   100*(mDM/atr);

  plusDI[i]=pdi;
  minusDI[i]=mdi;
 }

 const dx=[];

 for(let i=period;i<n;i++){

  if(
   plusDI[i]===null ||
   minusDI[i]===null
  ){
   continue;
  }

  const denominator =
   plusDI[i]+minusDI[i];

  if(denominator===0){
   dx.push({
    i,
    value:0
   });
  }else{

   dx.push({
    i,
    value:
     100*
     Math.abs(
      plusDI[i]-minusDI[i]
     )/
     denominator
   });
  }
 }

 if(dx.length<period){
  return {
   adx:result,
   plusDI,
   minusDI
  };
 }

 let sum=0;

 for(let j=0;j<period;j++){
  sum+=dx[j].value;
 }

 result[dx[period-1].i]=
  sum/period;

 for(let j=period;j<dx.length;j++){

  const prevIndex =
   dx[j-1].i;

  const currentIndex =
   dx[j].i;

  const previousADX =
   result[prevIndex];

  if(previousADX!==null){

   result[currentIndex]=
    (
     previousADX*(period-1)+
     dx[j].value
    )/period;
  }
 }

 return {
  adx:result,
  plusDI,
  minusDI
 };
}


/* =========================
   BUILD INDICATORS
========================= */

function buildIndicators(data){

 const close =
  data.map(x=>x.close);

 const volume =
  data.map(x=>x.volume);

 const ema20 =
  ema(close,20);

 const ema50 =
  ema(close,50);

 const ema200 =
  ema(close,200);

 const rsi14 =
  rsi(close,14);

 const m =
  macd(close);

 const a =
  adx(data,14);


 const volumeRatio =
  new Array(data.length).fill(null);

 for(let i=20;i<data.length;i++){

  let sum=0;
  let count=0;

  for(
   let j=Math.max(0,i-20);
   j<i;
   j++
  ){

   const v=volume[j];

   if(Number.isFinite(v)){
    sum+=v;
    count++;
   }
  }

  if(count>0){

   const avg=sum/count;

   if(avg>0){
    volumeRatio[i]=
     volume[i]/avg;
   }
  }
 }


 return {
  ema20,
  ema50,
  ema200,
  rsi:rsi14,
  macd:m.line,
  macdSignal:m.signal,
  macdHistogram:m.histogram,
  adx:a.adx,
  plusDI:a.plusDI,
  minusDI:a.minusDI,
  volumeRatio
 };
}


/* =========================
   MARKET REGIME
========================= */

function getRegime(ind,i){

 const adxValue=ind.adx[i];
 const pdi=ind.plusDI[i];
 const mdi=ind.minusDI[i];

 if(
  adxValue===null ||
  pdi===null ||
  mdi===null
 ){
  return "UNKNOWN";
 }

 if(adxValue<20){
  return "FLAT";
 }

 if(adxValue<=25){
  return "TRANSITION";
 }

 if(pdi>mdi){
  return "BULL";
 }

 return "BEAR";
}


/* =========================
   SIGNAL
========================= */

function getSignal(ind,i){

 let bull=0;
 let bear=0;


 /* EMA20 / EMA50 */

 if(
  ind.ema20[i]!==null &&
  ind.ema50[i]!==null
 ){

  if(ind.ema20[i]>ind.ema50[i]){
   bull+=20;
  }else{
   bear+=20;
  }
 }


 /* PRICE / EMA200 */

 if(
  ind.ema200[i]!==null
 ){

  const price=
   currentCloseForSignal;

  if(price>ind.ema200[i]){
   bull+=20;
  }else{
   bear+=20;
  }
 }


 /* RSI */

 const r=ind.rsi[i];

 if(r!==null){

  if(r>=52 && r<=68){

   bull+=20;

  }else if(r>75){

   bear+=10;

  }else if(r<30){

   bull+=10;

  }else if(r<45){

   bear+=15;

  }else{

   bull+=10;
   bear+=10;
  }
 }


 /* MACD */

 if(ind.macd[i]!==null){

  if(ind.macd[i]>0){
   bull+=20;
  }else{
   bear+=20;
  }
 }


 /* VOLUME */

 const vr=ind.volumeRatio[i];

 if(vr!==null){

  if(vr>=1.25){

   if(currentCloseForSignal>ind.ema20[i]){
    bull+=20;
   }else{
    bear+=20;
   }

  }else{

   bull+=10;
   bear+=10;
  }
 }


 const score=
  Math.max(
   0,
   Math.min(
    100,
    50+(bull-bear)/2
   )
  );


 let signal="HOLD";

 if(score>=70){
  signal="BUY";
 }else if(score<=30){
  signal="SELL";
 }

 return {
  signal,
  score,
  bull,
  bear
 };
}


/*
 Глобальная переменная нужна,
 потому что getSignal получает только ind и i.

 Перед вызовом getSignal она устанавливается
 текущей ценой.
*/

let currentCloseForSignal=0;


/* =========================
   DIRECTIONAL RETURN
========================= */

function directionalReturn(
 data,
 i,
 horizon,
 direction
){

 const entry=i+1;
 const exit=i+1+horizon;

 if(
  entry>=data.length ||
  exit>=data.length
 ){
  return null;
 }

 const p1=Number(data[entry].open);
 const p2=Number(data[exit].open);

 if(
  !Number.isFinite(p1) ||
  !Number.isFinite(p2) ||
  p1<=0
 ){
  return null;
 }

 const raw=
  (p2-p1)/p1*100;

 if(direction==="BUY"){
  return raw;
 }

 if(direction==="SELL"){
  return -raw;
 }

 return null;
}


/* =========================
   SIGNAL STATS
========================= */

function signalStats(
 data,
 ind,
 signal,
 horizon
){

 let n=0;
 let wins=0;

 const returns=[];

 const maxI=
  data.length-horizon-2;


 for(
  let i=200;
  i<=maxI;
  i++
 ){

  currentCloseForSignal=
   Number(data[i].close);

  if(!Number.isFinite(currentCloseForSignal)){
   continue;
  }

  const s=
   getSignal(ind,i);

  if(s.signal!==signal){
   continue;
  }

  const ret=
   directionalReturn(
    data,
    i,
    horizon,
    signal
   );

  if(ret===null){
   continue;
  }

  n++;

  returns.push(ret);

  if(ret>0){
   wins++;
  }
 }


 if(n===0){

  return {
   n:0,
   accuracy:null,
   avg:null,
   best:null,
   worst:null
  };
 }


 const avg=
  returns.reduce(
   (a,b)=>a+b,
   0
  )/returns.length;

 return {
  n,
  accuracy:
   wins/n*100,
  avg,
  best:Math.max(...returns),
  worst:Math.min(...returns)
 };
}


/* =========================
   REGIME FACTOR STATS
========================= */

function regimeFactorStats(
 data,
 ind,
 regime,
 factorFn,
 horizon
){

 let n=0;
 let wins=0;

 const returns=[];

 const maxI=
  data.length-horizon-2;


 for(
  let i=200;
  i<=maxI;
  i++
 ){

  currentCloseForSignal=
   Number(data[i].close);

  if(!Number.isFinite(currentCloseForSignal)){
   continue;
  }

  const r=
   getRegime(ind,i);

  if(r!==regime){
   continue;
  }

  let factor=false;

  try{
   factor=Boolean(
    factorFn(ind,i)
   );
  }catch(e){
   factor=false;
  }

  if(!factor){
   continue;
  }

  const ret=
   directionalReturn(
    data,
    i,
    horizon,
    "BUY"
   );

  if(ret===null){
   continue;
  }

  n++;

  returns.push(ret);

  if(ret>0){
   wins++;
  }
 }


 if(n===0){

  return {
   n:0,
   accuracy:null,
   avg:null,
   best:null,
   worst:null
  };
 }


 return {

  n,

  accuracy:
   wins/n*100,

  avg:
   returns.reduce(
    (a,b)=>a+b,
    0
   )/returns.length,

  best:
   Math.max(...returns),

  worst:
   Math.min(...returns)
 };
}


/* =========================
   FETCH BINANCE HISTORY
========================= */

async function fetchHistory(tf){

 const interval=tf;

 const end=Date.now();

 /*
  Сейчас загружаем 365 дней.
  Для 1d это примерно 365 свечей.

  Поэтому после 200-й свечи
  статистика будет небольшой.
 */

 const start=
  end-
  365*24*60*60*1000;

 let all=[];

 let currentStart=start;

 while(currentStart<end){

  const url=
   "https://api.binance.com/api/v3/klines"+
   "?symbol=BTCUSDT"+
   "&interval="+interval+
   "&startTime="+currentStart+
   "&endTime="+end+
   "&limit=1000";

  let response;

  try{

   response=
    await fetch(url);

  }catch(e){

   await sleep(1500);

   continue;
  }


  if(!response.ok){

   await sleep(1500);

   continue;
  }


  const rows=
   await response.json();

  if(
   !Array.isArray(rows) ||
   rows.length===0
  ){
   break;
  }


  for(const row of rows){

   all.push({

    time:Number(row[0]),

    open:Number(row[1]),

    high:Number(row[2]),

    low:Number(row[3]),

    close:Number(row[4]),

    volume:Number(row[5])

   });
  }


  const lastTime=
   Number(rows[rows.length-1][0]);

  const next=
   lastTime+
   TF[tf];


  if(next<=currentStart){
   break;
  }

  currentStart=next;

  await sleep(150);
 }


 /*
  Убираем возможные дубли.
 */

 const map=new Map();

 for(const x of all){
  map.set(x.time,x);
 }

 all=
  Array.from(map.values())
  .sort((a,b)=>a.time-b.time);


 return all;
}

/* =========================
   REGIME DIAGNOSTICS
========================= */

function renderRegimeDiagnostics(
 data,
 ind,
 tf
){

 /*
  Сейчас диагностика рассчитывается
  для горизонта 24 часа.

  Для 1d это 1 свеча.
  Для 1h это 24 свечи.
  Для 4h это 6 свечей.
  Для 15m это 96 свечей.
 */

 const horizon=
  tf==="15m"
  ?96
  :tf==="1h"
  ?24
  :tf==="4h"
  ?6
  :1;


 const regimes=[
  "BULL",
  "BEAR",
  "FLAT",
  "TRANSITION"
 ];


 const factors=[

  {
   name:"EMA20 > EMA50",

   fn:(x,i)=>
    x.ema20[i]!==null &&
    x.ema50[i]!==null &&
    x.ema20[i]>x.ema50[i]
  },

  {
   name:"Цена > EMA200",

   fn:(x,i)=>
    x.ema200[i]!==null &&
    currentCloseForSignal>x.ema200[i]
  },

  {
   name:"MACD > 0",

   fn:(x,i)=>
    x.macd[i]!==null &&
    x.macd[i]>0
  },

  {
   name:"MACD Histogram > 0",

   fn:(x,i)=>
    x.macdHistogram[i]!==null &&
    x.macdHistogram[i]>0
  },

  {
   name:"RSI 52–68",

   fn:(x,i)=>
    x.rsi[i]!==null &&
    x.rsi[i]>=52 &&
    x.rsi[i]<=68
  },

  {
   name:"Volume >= 1.25",

   fn:(x,i)=>
    x.volumeRatio[i]!==null &&
    x.volumeRatio[i]>=1.25
  }

 ];


 let html=`

 <div class="panel">

  <div class="section-title">
   Market Regime Diagnostics
  </div>

  <div class="small">
   Горизонт:
   <b>${formatHorizon(tf,horizon)}</b>.
   Здесь проверяется каждый отдельный фактор,
   а не полный BUY/SELL сигнал.
  </div>

  <table>

   <thead>

    <tr>
     <th>Фактор</th>
 `;


 for(const regime of regimes){

  html+=`
   <th>${regime}<br>Успех</th>
   <th>${regime}<br>Средн.</th>
  `;
 }


 html+=`

    </tr>

   </thead>

   <tbody>
 `;


 for(const factor of factors){

  html+=`

   <tr>

    <td>
     ${factor.name}
    </td>
  `;


  for(const regime of regimes){

   const s=
    regimeFactorStats(
     data,
     ind,
     regime,
     factor.fn,
     horizon
    );


   html+=`

    <td>
     ${
      s.accuracy===null
      ? "—"
      : s.accuracy.toFixed(1)+"%"
     }
     <br>
     <span class="small">
      N=${s.n}
     </span>
    </td>

    <td>
     ${pct(s.avg)}
    </td>
   `;
  }


  html+=`

   </tr>
  `;
 }


 html+=`

   </tbody>

  </table>

  <div class="small" style="margin-top:12px">

   <b>Как читать таблицу:</b><br>
   • Успех выше 50% — положительный признак.<br>
   • Средняя доходность показывает направление и силу эффекта.<br>
   • N показывает количество исторических случаев.<br>
   • Чем больше N, тем надёжнее статистика.<br>
   • Одна строка сама по себе ещё не является торговой стратегией.

  </div>

 </div>
 `;


 document.getElementById(
  "diagnostics"
 ).innerHTML=html;
}

   MAIN ANALYSIS
========================= */

async function runAnalysis(){

 const tf=
  document.getElementById(
   "timeframe"
  ).value;

 const status=
  document.getElementById(
   "status"
  );

 status.className="status";

 status.innerHTML=
  "Загрузка истории BTCUSDT…";


 document.getElementById(
  "live"
 ).innerHTML="";

 document.getElementById(
  "backtest"
 ).innerHTML="";

 document.getElementById(
  "diagnostics"
 ).innerHTML="";


 try{

  const data=
   await fetchHistory(tf);


  status.innerHTML=
   `Загружено свечей: ${data.length}. Расчёт индикаторов…`;


  if(data.length<300){

   throw new Error(
    `Недостаточно данных: ${data.length} свечей. Нужно минимум 300.`
   );
  }


  const ind=
   buildIndicators(data);


  renderLive(
   data,
   ind,
   tf
  );


  renderBacktest(
   data,
   ind,
   tf
  );


  renderRegimeDiagnostics(
   data,
   ind,
   tf
  );


  status.className=
   "status good";

  status.innerHTML=
   `Готово. ${data.length} свечей обработано.`;


 }catch(error){

  console.error(error);

  status.className=
   "status error";

  status.innerHTML=
   "Ошибка: "+
   (
    error?.message ||
    String(error)
   );

 }
}
