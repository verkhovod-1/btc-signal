<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>₿ BTC Signal v3.4</title>

<style>
body{
  margin:0;
  padding:16px;
  background:#111827;
  color:#f3f4f6;
  font-family:Arial,sans-serif;
}

  background:#1f2937;
  border-radius:12px;
  padding:14px;
  margin:10px 0;
}
.good{color:#4ade80}
.warn{color:#fbbf24}
.bad{color:#f87171}

  font-size:13px;
  color:#9ca3af;
  line-height:1.45;
}

  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

  padding:7px 3px;
  border-bottom:1px solid #374151;

}

  text-align:left;
}

  width:100%;

</style>

<body>

<h1>₿ BTC Signal</h1>
<div class="small">v3.4 · BTC 1H · 6/12/24/48/72h</div>

<div class="card" id="status">
  Загрузка BTC…
</div>

<div class="card" id="current"></div>

<div class="card">
  <h2>⏱ Сравнение горизонтов</h2>

  <div class="small">
    Сигнал: EMA20 &gt; EMA50 + ADX &gt;25 + Volume &gt; average
  </div>

  <div id="horizon"></div>
</div>

<div class="card">
  <h2>🔒 Финальный независимый тест</h2>

  <div class="small">
    Последние 10% часовых наблюдений полностью исключены
    из анализа сигнала.
  </div>

  <div id="holdout"></div>
</div>

<div class="card">
  <h2>📈 Последовательность сигналов</h2>
  <div id="sequence"></div>
</div>

<button onclick="location.reload()">
  🔄 Обновить данные
</button>


<script>

const API="https://api.binance.com/api/v3/klines";

const INTERVAL="1h";
const BATCHES=10;
const LIMIT=1000;

let candles=[];
let rows=[];


/* =========================
   ВСПОМОГАТЕЛЬНЫЕ
========================= */

function fmt(x){

  if(!Number.isFinite(x))
    return "—";

  return (x>=0?"+":"")+x.toFixed(2)+"%";
}


function median(arr){

  if(!arr.length)
    return NaN;

  const a=[...arr].sort((x,y)=>x-y);

  const m=Math.floor(a.length/2);

  return a.length%2
    ? a[m]
    : (a[m-1]+a[m])/2;
}


function maxLosingStreak(arr){

  let cur=0;
  let max=0;

  for(const x of arr){

    if(x<0){

      cur++;

      if(cur>max)
        max=cur;

    }else{

      cur=0;
    }
  }

  return max;
}


/* =========================
   EMA
========================= */

function ema(values,period){

  const out=
    new Array(values.length).fill(null);

  if(values.length<period)
    return out;

  let sum=0;

  for(let i=0;i<period;i++)
    sum+=values[i];

  out[period-1]=sum/period;

  const k=2/(period+1);

  for(let i=period;i<values.length;i++){

    out[i]=
      values[i]*k+
      out[i-1]*(1-k);
  }

  return out;
}


/* =========================
   ADX
========================= */

function calcADX(
  high,
  low,
  close,
  period=14
){

  const n=close.length;

  const tr=
    new Array(n).fill(null);

  const plusDM=
    new Array(n).fill(0);

  const minusDM=
    new Array(n).fill(0);

  for(let i=1;i<n;i++){

    const up=
      high[i]-high[i-1];

    const down=
      low[i-1]-low[i];

    tr[i]=Math.max(
      high[i]-low[i],
      Math.abs(
        high[i]-close[i-1]
      ),
      Math.abs(
        low[i]-close[i-1]
      )
    );

    plusDM[i]=
      (up>down && up>0)
      ? up
      : 0;

    minusDM[i]=
      (down>up && down>0)
      ? down
      : 0;
  }

  const adx=
    new Array(n).fill(null);

  let atr=0;
  let pdm=0;
  let mdm=0;

  for(let i=1;i<=period;i++){

    atr+=tr[i]||0;
    pdm+=plusDM[i];
    mdm+=minusDM[i];
  }

  atr/=period;
  pdm/=period;
  mdm/=period;

  const dx=[];

  for(let i=period;i<n;i++){

    if(i>period){

      atr=
        (atr*(period-1)+(tr[i]||0))
        /period;

      pdm=
        (pdm*(period-1)+plusDM[i])
        /period;

      mdm=
        (mdm*(period-1)+minusDM[i])
        /period;
    }

    const pdi=
      atr ? 100*pdm/atr : 0;

    const mdi=
      atr ? 100*mdm/atr : 0;

    const d=
      pdi+mdi===0
      ? 0
      : 100*Math.abs(pdi-mdi)
        /(pdi+mdi);

    dx.push(d);

    if(dx.length===period){

      let sum=0;

      for(const x of dx)
        sum+=x;

      adx[i]=sum/period;
    }

    if(dx.length>period){

      const prev=adx[i-1];

      if(prev!=null){

        adx[i]=
          (prev*(period-1)+d)
          /period;
      }
    }
  }

  return adx;
}


/* =========================
   ИНДИКАТОРЫ
========================= */

function buildRows(){

  const close=
    candles.map(x=>+x[4]);

  const high=
    candles.map(x=>+x[2]);

  const low=
    candles.map(x=>+x[3]);

  const volume=
    candles.map(x=>+x[5]);

  const e20=
    ema(close,20);

  const e50=
    ema(close,50);

  const adx=
    calcADX(
      high,
      low,
      close,
      14
    );

  const volAvg=
    new Array(volume.length)
      .fill(null);

  for(let i=19;i<volume.length;i++){

    let sum=0;

    for(let j=i-19;j<=i;j++)
      sum+=volume[j];

    volAvg[i]=sum/20;
  }

  rows=[];

  /*
    Вход:
    OPEN следующей 1H свечи.

    Горизонты:
    6h
    12h
    24h
    48h
    72h

    Важно:
    доходность считается от одного
    и того же входа.
  */

  const maxH=72;

  for(
    let i=50;
    i<candles.length-maxH-1;
    i++
  ){

    if(
      e20[i]==null ||
      e50[i]==null ||
      adx[i]==null ||
      volAvg[i]==null
    ){
      continue;
    }

    const active=
      e20[i]>e50[i] &&
      adx[i]>25 &&
      volume[i]>volAvg[i];

    const entry=
      +candles[i+1][1];

    if(!Number.isFinite(entry) || entry<=0)
      continue;

    const r={

      i,

      active,

      ret6:
        (
          +candles[i+1+6][4]
          -entry
        )/entry*100,

      ret12:
        (
          +candles[i+1+12][4]
          -entry
        )/entry*100,

      ret24:
        (
          +candles[i+1+24][4]
          -entry
        )/entry*100,

      ret48:
        (
          +candles[i+1+48][4]
          -entry
        )/entry*100,

      ret72:
        (
          +candles[i+1+72][4]
          -entry
        )/entry*100
    };

    rows.push(r);
  }
}


/* =========================
   СТАТИСТИКА
========================= */

function calcStats(
  signalRows,
  allRows,
  key
){

  if(!signalRows.length){

    return {
      n:0,
      avg:NaN,
      base:NaN,
      edge:NaN,
      med:NaN,
      win:NaN,
      gt1:NaN,
      lt1:NaN,
      streak:0
    };
  }

  const signal=
    signalRows.map(x=>x[key]);

  const all=
    allRows.map(x=>x[key]);

  const avg=
    signal.reduce(
      (a,b)=>a+b,
      0
    )/signal.length;

  const base=
    all.reduce(
      (a,b)=>a+b,
      0
    )/all.length;

  return {

    n:signal.length,

    avg,

    base,

    edge:avg-base,

    med:median(signal),

    win:
      signal.filter(x=>x>0)
      .length/signal.length*100,

    gt1:
      signal.filter(x=>x>1)
      .length/signal.length*100,

    lt1:
      signal.filter(x=>x<-1)
      .length/signal.length*100,

    streak:
      maxLosingStreak(signal)
  };
}


/* =========================
   ТАБЛИЦА
========================= */

function rowHTML(
  label,
  s
){

  return `
  <tr>

    <td>${label}</td>

    <td>${s.n}</td>

    <td>${fmt(s.avg)}</td>

    <td>${fmt(s.base)}</td>

    <td class="${
      s.edge>0
      ?"good"
      :s.edge<0
      ?"bad"
      :""
    }">
      ${fmt(s.edge)}
    </td>

    <td>${fmt(s.med)}</td>

    <td>
      ${
        Number.isFinite(s.win)
        ?s.win.toFixed(1)+"%"
        :"—"
      }
    </td>

    <td>${s.streak}</td>

  </tr>`;
}


/* =========================
   ОБЩАЯ СТАТИСТИКА
========================= */

function renderHorizons(){

  const active=
    rows.filter(x=>x.active);

  const hs=[

    ["6h","ret6"],
    ["12h","ret12"],
    ["24h","ret24"],
    ["48h","ret48"],
    ["72h","ret72"]

  ];

  let html=`

  <table>

  <tr>

    <th>Горизонт</th>
    <th>N</th>
    <th>Signal</th>
    <th>BTC</th>
    <th>Edge</th>
    <th>Median</th>
    <th>Win</th>
    <th>Loss</th>

  </tr>
  `;

  for(const h of hs){

    const s=
      calcStats(
        active,
        rows,
        h[1]
      );

    html+=
      rowHTML(
        h[0],
        s
      );
  }

  html+="</table>";

  document.getElementById(
    "horizon"
  ).innerHTML=html;
}


/* =========================
   HOLDOUT
========================= */

function renderHoldout(){

  const split=
    Math.floor(
      rows.length*0.90
    );

  const finalRows=
    rows.slice(split);

  const finalSignals=
    finalRows.filter(
      x=>x.active
    );

  const hs=[

    ["6h","ret6"],
    ["12h","ret12"],
    ["24h","ret24"],
    ["48h","ret48"],
    ["72h","ret72"]

  ];

  let html=`

  <table>

  <tr>

    <th>Горизонт</th>
    <th>N</th>
    <th>Signal</th>
    <th>BTC</th>
    <th>Edge</th>
    <th>Median</th>
    <th>Win</th>
    <th>Loss</th>

  </tr>
  `;

  for(const h of hs){

    const s=
      calcStats(
        finalSignals,
        finalRows,
        h[1]
      );

    html+=
      rowHTML(
        h[0],
        s
      );
  }

  html+="</table>";

  html+=`

  <p class="small">

    Финальный участок:
    ${finalRows.length} наблюдений.<br>

    Сигналов:
    ${finalSignals.length}.<br><br>

    BTC baseline рассчитан по всем
    доступным наблюдениям финального
    участка.

  </p>
  `;

  document.getElementById(
    "holdout"
  ).innerHTML=html;
}


/* =========================
   ПОСЛЕДОВАТЕЛЬНОСТЬ СИГНАЛОВ
========================= */

function renderSequence(){

  const signals=
    rows.filter(x=>x.active);

  if(!signals.length){

    document.getElementById(
      "sequence"
    ).innerHTML=
      "Сигналов нет.";

    return;
  }

  const hs=[
    ["24h","ret24"],
    ["48h","ret48"],
    ["72h","ret72"]
  ];

  let html="";

  for(const h of hs){

    const vals=
      signals.map(x=>x[h[1]]);

    let equity=1;

    let maxEquity=1;
    let maxDD=0;

    /*
      Условная стратегия:

      каждый сигнал =
      отдельная последовательная
      сделка одинакового размера.

      Это НЕ торговый бэктест с комиссиями.
      Это диагностический показатель.
    */

    for(const r of vals){

      equity*=
        1+r/100;

      if(equity>maxEquity)
        maxEquity=equity;

      const dd=
        (equity/maxEquity-1)*100;

      if(dd<maxDD)
        maxDD=dd;
    }

    const total=
      (equity-1)*100;

    html+=`

    <p>

      <b>${h[0]}</b>:
      условный накопленный результат
      <span class="${
        total>=0
        ?"good"
        :"bad"
      }">
        ${fmt(total)}
      </span>

      · Max DD:
      ${fmt(maxDD)}

    </p>
    `;
  }

  html+=`

  <div class="small">

    Показатель является диагностикой
    последовательности сигналов.
    Комиссии, проскальзывание,
    размер позиции и перекрытие сделок
    не учитываются.

  </div>
  `;

  document.getElementById(
    "sequence"
  ).innerHTML=html;
}


/* =========================
   ТЕКУЩИЙ СИГНАЛ
========================= */

function renderCurrent(){

  const close=
    +candles.at(-1)[4];

  const closeArr=
    candles.map(x=>+x[4]);

  const highArr=
    candles.map(x=>+x[2]);

  const lowArr=
    candles.map(x=>+x[3]);

  const volArr=
    candles.map(x=>+x[5]);

  const e20=
    ema(closeArr,20);

  const e50=
    ema(closeArr,50);

  const adx=
    calcADX(
      highArr,
      lowArr,
      closeArr,
      14
    );

  let sum=0;

  for(
    let i=volArr.length-20;
    i<volArr.length;
    i++
  ){
    sum+=volArr[i];
  }

  const avgVol=sum/20;

  const trend=
    e20.at(-1)>e50.at(-1);

  const strong=
    adx.at(-1)>25;

  const volume=
    volArr.at(-1)>avgVol;

  const active=
    trend &&
    strong &&
    volume;

  document.getElementById(
    "current"
  ).innerHTML=`

  <h2>📡 Текущий сигнал</h2>

  <b class="${
    active
    ?"good"
    :"warn"
  }">

    ${
      active
      ?"🟢 SIGNAL LONG"
      :"⚪ NO SIGNAL"
    }

  </b>

  <p>
    BTC:
    $${close.toLocaleString(
      "en-US",
      {maximumFractionDigits:0}
    )}
  </p>

  <p>

    EMA20
    ${trend?"✓":"✗"}

    · ADX
    ${adx.at(-1).toFixed(1)}
    ${strong?"✓":"✗"}

    · Volume
    ${(volArr.at(-1)/avgVol).toFixed(2)}x
    ${volume?"✓":"✗"}

  </p>
  `;
}


/* =========================
   BINANCE
========================= */

async function fetchBatch(
  endTime
){

  let url=
    API+
    "?symbol=BTCUSDT"+
    "&interval="+INTERVAL+
    "&limit="+LIMIT;

  if(endTime)
    url+="&endTime="+endTime;

  const controller=
    new AbortController();

  const timer=
    setTimeout(
      ()=>controller.abort(),
      15000
    );

  try{

    const response=
      await fetch(
        url,
        {
          signal:
            controller.signal
        }
      );

    if(!response.ok)
      throw new Error(
        "HTTP "+response.status
      );

    return await response.json();

  }finally{

    clearTimeout(timer);
  }
}


/* =========================
   ЗАГРУЗКА
========================= */

async function loadHistory(){

  let all=[];
  let endTime=null;

  for(
    let n=1;
    n<=BATCHES;
    n++
  ){

    document.getElementById(
      "status"
    ).innerHTML=`

      Загрузка BTC 1H…<br>
      запрос ${n}/${BATCHES}

    `;

    const batch=
      await fetchBatch(
        endTime
      );

    if(!batch.length)
      break;

    all=
      all.concat(batch);

    endTime=
      batch[0][0]-1;

    if(batch.length<LIMIT)
      break;
  }


  /*
    Удаляем дубли.
  */

  const map=new Map();

  for(const c of all)
    map.set(c[0],c);


  candles=
    [...map.values()]
    .sort(
      (a,b)=>a[0]-b[0]
    );


  buildRows();


  document.getElementById(
    "status"
  ).innerHTML=`

    <b class="good">
      Данные обновлены
    </b>
    <br>

    ${candles.length}
    часовых свечей ·
    ${rows.length}
    строк для статистики

  `;


  renderCurrent();
  renderHorizons();
  renderHoldout();
  renderSequence();
}


/* =========================
   START
========================= */

loadHistory().catch(e=>{

  document.getElementById(
    "status"
  ).innerHTML=

    `<span class="bad">
      Ошибка загрузки:
      ${e.message}
    </span>`;
});

</script>

</body>
</html>
