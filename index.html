<script>

const API =
  "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1500";

const FACTORS = [
  "EMA20 > EMA50",
  "Price > EMA200",
  "MACD > 0",
  "MACD Histogram > 0",
  "RSI > 52",
  "RSI 52–65",
  "ADX > 25",
  "Volume > average"
];

const MIN_N = 50;

function $(id){
  return document.getElementById(id);
}

function setStatus(text, cls=""){
  $("status").textContent=text;
  $("status").className="status "+cls;
}

function fmtPct(x){
  if(!Number.isFinite(x)) return "—";
  return (x>=0?"+":"") + x.toFixed(2) + "%";
}

function median(arr){
  if(!arr.length) return NaN;
  const a=[...arr].sort((x,y)=>x-y);
  const m=Math.floor(a.length/2);
  return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
}

function mean(arr){
  if(!arr.length) return NaN;
  return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function ema(values,period){
  const out=new Array(values.length).fill(null);
  if(values.length<period) return out;

  let sum=0;
  for(let i=0;i<period;i++) sum+=values[i];

  out[period-1]=sum/period;

  const k=2/(period+1);

  for(let i=period;i<values.length;i++){
    out[i]=values[i]*k+out[i-1]*(1-k);
  }

  return out;
}

function rsi(values,period=14){
  const out=new Array(values.length).fill(null);

  if(values.length<=period) return out;

  let gains=0;
  let losses=0;

  for(let i=1;i<=period;i++){
    const d=values[i]-values[i-1];
    if(d>=0) gains+=d;
    else losses-=d;
  }

  let avgGain=gains/period;
  let avgLoss=losses/period;

  out[period]=
    avgLoss===0 ? 100 :
    100-(100/(1+avgGain/avgLoss));

  for(let i=period+1;i<values.length;i++){

    const d=values[i]-values[i-1];

    const gain=d>0?d:0;
    const loss=d<0?-d:0;

    avgGain=(avgGain*(period-1)+gain)/period;
    avgLoss=(avgLoss*(period-1)+loss)/period;

    out[i]=
      avgLoss===0 ? 100 :
      100-(100/(1+avgGain/avgLoss));
  }

  return out;
}

function macd(values){
  const e12=ema(values,12);
  const e26=ema(values,26);

  const line=new Array(values.length).fill(null);

  for(let i=0;i<values.length;i++){
    if(e12[i]!=null && e26[i]!=null){
      line[i]=e12[i]-e26[i];
    }
  }

  const compact=[];
  const map=[];

  for(let i=0;i<line.length;i++){
    if(line[i]!=null){
      compact.push(line[i]);
      map.push(i);
    }
  }

  const signalCompact=ema(compact,9);
  const signal=new Array(values.length).fill(null);
  const hist=new Array(values.length).fill(null);

  for(let j=0;j<map.length;j++){
    const i=map[j];

    if(signalCompact[j]!=null){
      signal[i]=signalCompact[j];
      hist[i]=line[i]-signal[i];
    }
  }

  return {line,signal,hist};
}

function adx(high,low,close,period=14){

  const n=close.length;

  const tr=new Array(n).fill(null);
  const plusDM=new Array(n).fill(null);
  const minusDM=new Array(n).fill(null);

  for(let i=1;i<n;i++){

    const h=high[i];
    const l=low[i];

    const ph=high[i-1];
    const pl=low[i-1];
    const pc=close[i-1];

    tr[i]=Math.max(
      h-l,
      Math.abs(h-pc),
      Math.abs(l-pc)
    );

    const up=h-ph;
    const down=pl-l;

    plusDM[i]=(up>down && up>0)?up:0;
    minusDM[i]=(down>up && down>0)?down:0;
  }

  const atr=new Array(n).fill(null);
  const pdi=new Array(n).fill(null);
  const mdi=new Array(n).fill(null);
  const dx=new Array(n).fill(null);
  const result=new Array(n).fill(null);

  let trSum=0;
  let plusSum=0;
  let minusSum=0;

  for(let i=1;i<=period;i++){
    trSum+=tr[i]||0;
    plusSum+=plusDM[i]||0;
    minusSum+=minusDM[i]||0;
  }

  atr[period]=trSum/period;

  let p=plusSum/period;
  let m=minusSum/period;

  pdi[period]=atr[period]===0?0:100*(p/atr[period]);
  mdi[period]=atr[period]===0?0:100*(m/atr[period]);

  let den=pdi[period]+mdi[period];

  dx[period]=den===0?0:
    100*Math.abs(pdi[period]-mdi[period])/den;

  for(let i=period+1;i<n;i++){

    atr[i]=(atr[i-1]*(period-1)+(tr[i]||0))/period;

    p=(p*(period-1)+(plusDM[i]||0))/period;
    m=(m*(period-1)+(minusDM[i]||0))/period;

    pdi[i]=atr[i]===0?0:100*p/atr[i];
    mdi[i]=atr[i]===0?0:100*m/atr[i];

    den=pdi[i]+mdi[i];

    dx[i]=den===0?0:
      100*Math.abs(pdi[i]-mdi[i])/den;
  }

  let count=0;
  let sum=0;

  for(let i=period;i<n;i++){

    if(dx[i]!=null){
      if(count<period){
        sum+=dx[i];
        count++;

        if(count===period){
          result[i]=sum/period;
        }
      }else{
        result[i]=(result[i-1]*(period-1)+dx[i])/period;
      }
    }
  }

  return result;
}

function buildData(raw){

  const close=raw.map(x=>Number(x[4]));
  const open=raw.map(x=>Number(x[1]));
  const high=raw.map(x=>Number(x[2]));
  const low=raw.map(x=>Number(x[3]));
  const volume=raw.map(x=>Number(x[5]));
  const time=raw.map(x=>Number(x[0]));

  const ema20=ema(close,20);
  const ema50=ema(close,50);
  const ema200=ema(close,200);

  const RSI=rsi(close,14);
  const MACD=macd(close);
  const ADX=adx(high,low,close,14);

  const avgVol=new Array(close.length).fill(null);

  for(let i=20;i<close.length;i++){

    let s=0;

    for(let j=i-20;j<i;j++){
      s+=volume[j];
    }

    avgVol[i]=s/20;
  }

  const data=[];

  for(let i=0;i<close.length;i++){

    data.push({
      i,
      time:time[i],
      open:open[i],
      high:high[i],
      low:low[i],
      close:close[i],
      volume:volume[i],

      ema20:ema20[i],
      ema50:ema50[i],
      ema200:ema200[i],

      rsi:RSI[i],
      macd:MACD.line[i],
      macdSignal:MACD.signal[i],
      macdHist:MACD.hist[i],

      adx:ADX[i],
      avgVol:avgVol[i]
    });
  }

  return data;
}

function factorState(d){

  return {

    "EMA20 > EMA50":
      d.ema20!=null &&
      d.ema50!=null &&
      d.ema20>d.ema50,

    "Price > EMA200":
      d.ema200!=null &&
      d.close>d.ema200,

    "MACD > 0":
      d.macd!=null &&
      d.macd>0,

    "MACD Histogram > 0":
      d.macdHist!=null &&
      d.macdHist>0,

    "RSI > 52":
      d.rsi!=null &&
      d.rsi>52,

    "RSI 52–65":
      d.rsi!=null &&
      d.rsi>=52 &&
      d.rsi<=65,

    "ADX > 25":
      d.adx!=null &&
      d.adx>25,

    "Volume > average":
      d.avgVol!=null &&
      d.volume>d.avgVol
  };
}

function futureReturn(data,i){

  if(i+1>=data.length) return null;

  const entry=data[i+1].open;
  const exit=data[i+1].close;

  if(!Number.isFinite(entry) ||
     !Number.isFinite(exit) ||
     entry===0) return null;

  return (exit-entry)/entry*100;
}

function usableRows(data){

  const out=[];

  for(let i=0;i<data.length-1;i++){

    const d=data[i];

    if(
      d.ema200==null ||
      d.macd==null ||
      d.macdHist==null ||
      d.rsi==null ||
      d.adx==null ||
      d.avgVol==null
    ) continue;

    const ret=futureReturn(data,i);

    if(ret==null) continue;

    out.push({
      ...d,
      ret,
      factors:factorState(d)
    });
  }

  return out;
}

function comboMatch(row,combo){

  return combo.every(f=>row.factors[f]);
}

function stats(rows){

  if(!rows.length){
    return {
      n:0,
      avg:NaN,
      median:NaN,
      win:NaN,
      plus1:NaN,
      minus1:NaN
    };
  }

  const rets=rows.map(x=>x.ret);

  return {
    n:rets.length,
    avg:mean(rets),
    median:median(rets),
    win:rets.filter(x=>x>0).length/rets.length*100,
    plus1:rets.filter(x=>x>1).length/rets.length*100,
    minus1:rets.filter(x=>x<-1).length/rets.length*100
  };
}

function periodBaseline(rows,start,end){

  return stats(rows.slice(start,end));
}

function comboStats(rows,combo,start=0,end=rows.length){

  const selected=[];

  for(let i=start;i<end;i++){

    if(comboMatch(rows[i],combo)){
      selected.push(rows[i]);
    }
  }

  return stats(selected);
}

function combinations(arr,min,max){

  const result=[];

  function rec(start,current){

    if(current.length>=min){
      result.push([...current]);
    }

    if(current.length===max) return;

    for(let i=start;i<arr.length;i++){
      current.push(arr[i]);
      rec(i+1,current);
      current.pop();
    }
  }

  rec(0,[]);

  return result;
}

function incremental(rows){

  const pairs=[];

  for(let a=0;a<FACTORS.length;a++){

    const first=[FACTORS[a]];
    const base=comboStats(rows,first);

    if(base.n<100) continue;

    for(let b=0;b<FACTORS.length;b++){

      if(a===b) continue;

      const combo=[FACTORS[a],FACTORS[b]];
      const after=comboStats(rows,combo);

      if(after.n<50) continue;

      const delta=after.avg-base.avg;

      pairs.push({
        base,
        after,
        first:FACTORS[a],
        second:FACTORS[b],
        delta
      });
    }
  }

  pairs.sort((a,b)=>b.delta-a.delta);

  return pairs.slice(0,10);
}

function walkForward(rows,combo){

  const folds=[];

  const n=rows.length;

  const firstTrain=Math.floor(n*0.50);

  const tests=5;

  let trainEnd=firstTrain;

  const remaining=n-firstTrain;
  const testSize=Math.floor(remaining/tests);

  for(let k=0;k<tests;k++){

    const testStart=trainEnd;
    const testEnd=
      k===tests-1 ? n :
      Math.min(n,testStart+testSize);

    if(testEnd<=testStart) break;

    const trainRows=rows.slice(0,trainEnd);

    const testRows=rows.slice(testStart,testEnd);

    const comboTrain=comboStats(trainRows,combo);
    const comboTest=comboStats(testRows,combo);
    const baseTest=periodBaseline(rows,testStart,testEnd);

    if(comboTest.n>0 && baseTest.n>0){

      folds.push({
        trainN:trainRows.length,
        testN:testRows.length,
        comboN:comboTest.n,
        comboAvg:comboTest.avg,
        btcAvg:baseTest.avg,
        edge:comboTest.avg-baseTest.avg
      });
    }

    trainEnd=testEnd;
  }

  return folds;
}

function scoreWalkForward(folds){

  if(folds.length<4) return 0;

  const totalN=folds.reduce((s,x)=>s+x.comboN,0);

  const edges=folds.map(x=>x.edge);

  const positive=edges.filter(x=>x>0).length;

  const meanEdge=mean(edges);
  const medianEdge=median(edges);
  const worst=Math.min(...edges);

  let score=0;

  if(folds.length>=4) score+=20;
  if(totalN>=100) score+=20;
  if(positive/folds.length>=0.75) score+=20;
  if(meanEdge>0.10) score+=20;
  if(medianEdge>0) score+=10;
  if(worst>-0.50) score+=10;

  return score;
}

function statusText(folds){

  const totalN=folds.reduce((s,x)=>s+x.comboN,0);

  const edges=folds.map(x=>x.edge);

  const positive=edges.filter(x=>x>0).length;

  const meanEdge=mean(edges);
  const med=median(edges);
  const worst=Math.min(...edges);

  const confirmed=
    folds.length>=4 &&
    totalN>=150 &&
    positive/folds.length>=0.75 &&
    meanEdge>0.10 &&
    med>0 &&
    worst>-0.50;

  return {
    confirmed,
    totalN,
    positive,
    meanEdge,
    medianEdge:med,
    worst
  };
}

function regime(d){

  if(
    d.ema200!=null &&
    d.ema20!=null &&
    d.ema50!=null &&
    d.macd!=null &&
    d.adx!=null
  ){

    if(
      d.close>d.ema200 &&
      d.ema20>d.ema50 &&
      d.macd>0
    ){
      if(d.adx>=30) return "Strong Bullish";
      return "Bullish";
    }

    if(
      d.close<d.ema200 &&
      d.ema20<d.ema50 &&
      d.macd<0
    ){
      if(d.adx>=30) return "Strong Bearish";
      return "Bearish";
    }
  }

  return "Flat";
}

function renderTable(headers,rows){

  let html="<table><thead><tr>";

  headers.forEach(h=>{
    html+="<th>"+h+"</th>";
  });

  html+="</tr></thead><tbody>";

  rows.forEach(row=>{
    html+="<tr>";

    row.forEach((cell,j)=>{
      html+="<td>"+cell+"</td>";
    });

    html+="</tr>";
  });

  html+="</tbody></table>";

  return html;
}

async function loadBTC(){

  try{

    setStatus("Подключение к Binance…","loading");
    $("diagnostic").textContent=
      "Запрашиваем дневные свечи BTCUSDT…";

    const controller=new AbortController();

    const timeout=setTimeout(
      ()=>controller.abort(),
      10000
    );

    let response;

    try{

      response=await fetch(API,{
        cache:"no-store",
        signal:controller.signal
      });

    }finally{

      clearTimeout(timeout);
    }

    if(!response.ok){
      throw new Error(
        "Binance HTTP "+response.status+
        " "+response.statusText
      );
    }

    setStatus("Получение данных…","loading");

    const raw=await response.json();

    if(!Array.isArray(raw) || raw.length<300){
      throw new Error(
        "Binance вернул слишком мало данных: "+
        (Array.isArray(raw)?raw.length:0)
      );
    }

    $("diagnostic").textContent=
      "Binance: получено "+raw.length+
      " дневных свечей. Расчёт индикаторов…";

    const data=buildData(raw);

    const rows=usableRows(data);

    if(rows.length<250){
      throw new Error(
        "Недостаточно пригодных строк после расчёта индикаторов: "+
        rows.length
      );
    }

    $("diagnostic").textContent=
      "Готово: "+raw.length+
      " свечей, "+rows.length+
      " строк для статистики.";

    renderAll(data,rows);

    setStatus("Данные обновлены","success");

    $("app").style.display="block";

  }catch(err){

    console.error(err);

    setStatus(
      "Ошибка загрузки BTC",
      "error"
    );

    if(err.name==="AbortError"){

      $("diagnostic").textContent=
        "Binance не ответил за 10 секунд.\n"+
        "Проверь интернет и попробуй обновить страницу.";

    }else{

      $("diagnostic").textContent=
        String(err.message || err);
    }
  }
}

function renderAll(data,rows){

  const d=data[data.length-1];

  const r=regime(d);

  $("regime").textContent=r;

  $("regime").className="big "+
    (
      r.includes("Bullish") ? "good" :
      r.includes("Bearish") ? "bad" :
      "neutral"
    );

  $("regimeDetails").innerHTML=
    "BTC: $"+d.close.toLocaleString("en-US",{
      maximumFractionDigits:0
    })+
    " · RSI: "+d.rsi.toFixed(1)+
    " · ADX: "+d.adx.toFixed(1);

  const f=factorState(d);

  const active=FACTORS.filter(x=>f[x]);

  const inactive=FACTORS.filter(x=>!f[x]);

  $("signal").innerHTML=
    "<b>Активны:</b> "+
    (active.length?active.join(" · "):"нет")+
    "<br><br>"+
    "<b>Неактивны:</b> "+
    (inactive.length?inactive.join(" · "):"нет")+
    "<br><br>"+
    "<span class='small'>"+
    "Важно: Score/условия не являются вероятностью роста или падения."
    +"</span>";

  $("indicators").innerHTML=renderTable(
    ["Индикатор","Значение"],
    [
      ["Цена","$"+d.close.toLocaleString("en-US",{maximumFractionDigits:0})],
      ["EMA20",d.ema20.toFixed(2)],
      ["EMA50",d.ema50.toFixed(2)],
      ["EMA200",d.ema200.toFixed(2)],
      ["MACD",d.macd.toFixed(4)],
      ["MACD Histogram",d.macdHist.toFixed(4)],
      ["RSI",d.rsi.toFixed(2)],
      ["ADX",d.adx.toFixed(2)],
      ["Volume / Avg",(
        d.volume/d.avgVol
      ).toFixed(2)+"x"]
    ]
  );

  renderIncremental(rows);

  renderFactors(rows);

  renderRegimes(rows);

  renderWalkForward(rows);
}

function renderIncremental(rows){

  const list=incremental(rows);

  $("incremental").innerHTML=renderTable(
    ["Комбинация","N base","N after","Base","After","Δ"],
    list.map(x=>[
      x.first+" → + "+x.second,
      x.base.n,
      x.after.n,
      fmtPct(x.base.avg),
      fmtPct(x.after.avg),
      "<span class='"+(
        x.delta>0?"good":"bad"
      )+"'>"+
      fmtPct(x.delta)+
      "</span>"
    ])
  );
}

function renderFactors(rows){

  const result=[];

  for(const factor of FACTORS){

    const s=comboStats(rows,[factor]);

    result.push([
      factor,
      s.n,
      fmtPct(s.avg),
      fmtPct(s.median),
      s.win.toFixed(1)+"%",
      s.plus1.toFixed(1)+"%",
      s.minus1.toFixed(1)+"%"
    ]);
  }

  $("factors").innerHTML=renderTable(
    [
      "Фактор",
      "N",
      "Avg",
      "Median",
      "Win",
      ">+1%",
      "<-1%"
    ],
    result
  );
}

function renderRegimes(rows){

  const names=[
    "Flat",
    "Bullish",
    "Strong Bullish",
    "Bearish",
    "Strong Bearish"
  ];

  const result=[];

  for(const name of names){

    const selected=rows.filter(
      x=>regime(x)===name
    );

    const s=stats(selected);

    result.push([
      name,
      s.n,
      fmtPct(s.avg),
      fmtPct(s.median),
      s.n?s.win.toFixed(1)+"%":"—"
    ]);
  }

  $("regimes").innerHTML=renderTable(
    ["Режим","N","Avg","Median","Win"],
    result
  );
}

function renderWalkForward(rows){

  const combos=combinations(FACTORS,2,4);

  const results=[];

  for(const combo of combos){

    const folds=walkForward(rows,combo);

    if(folds.length<4) continue;

    const info=statusText(folds);

    if(info.totalN<80) continue;

    results.push({
      combo,
      folds,
      info,
      score:scoreWalkForward(folds)
    });
  }

  results.sort((a,b)=>{

    if(b.score!==a.score)
      return b.score-a.score;

    if(b.info.meanEdge!==a.info.meanEdge)
      return b.info.meanEdge-a.info.meanEdge;

    return b.info.totalN-a.info.totalN;
  });

  const top=results.slice(0,10);

  $("walkforward").innerHTML=renderTable(
    [
      "Комбинация",
      "N",
      "Edge",
      "Median",
      "Позитивные",
      "Worst",
      "Score"
    ],
    top.map(x=>[
      x.combo.join(" + "),
      x.info.totalN,
      fmtPct(x.info.meanEdge),
      fmtPct(x.info.medianEdge),
      x.info.positive+"/"+x.folds.length,
      fmtPct(x.info.worst),
      x.score+"/100"
    ])
  );

  if(top.length){

    const best=top[0];

    const info=best.info;

    let status=
      info.confirmed ?
      "ПОДТВЕРЖДЕНО" :
      "ЧАСТИЧНО ПОДТВЕРЖДАЕТСЯ";

    $("best").innerHTML=
      "<h3>"+best.combo.join(" + ")+"</h3>"+
      "<div class='badge'>"+status+"</div>"+
      "<p>"+
      "<b>Score:</b> "+best.score+"/100<br>"+
      "<b>Test N:</b> "+info.totalN+"<br>"+
      "<b>Mean edge:</b> "+fmtPct(info.meanEdge)+"<br>"+
      "<b>Median edge:</b> "+fmtPct(info.medianEdge)+"<br>"+
      "<b>Положительных периодов:</b> "+
      info.positive+"/"+best.folds.length+"<br>"+
      "<b>Worst period:</b> "+fmtPct(info.worst)+
      "</p>";

    $("best").innerHTML+=
      "<h3>Walk-forward</h3>"+
      renderTable(
        [
          "#",
          "Train",
          "Test",
          "Combo",
          "BTC",
          "Edge"
        ],
        best.folds.map((x,i)=>[
          i+1,
          x.trainN,
          x.testN,
          fmtPct(x.comboAvg),
          fmtPct(x.btcAvg),
          fmtPct(x.edge)
        ])
      );
  }
}

loadBTC();
