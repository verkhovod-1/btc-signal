<script>

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

const BINANCE_BASE =
  "https://api.binance.com/api/v3/klines";

const SYMBOL = "BTCUSDT";
const INTERVAL = "1d";

const REQUEST_LIMIT = 1000;

/* Сколько блоков по 1000 свечей загружаем */
const HISTORY_REQUESTS = 5;

/* Тайм-аут одного запроса */
const REQUEST_TIMEOUT = 10000;

const FACTORS = [
  "EMA20 > EMA50",
  "Price > EMA200",
  "MACD > 0",
  "MACD Histogram > 0",
  "RSI > 52",
  "RSI 52–65",
  "ADX > 25",
  "Volume > average"
];


/* =========================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ========================================================= */

function $(id){
  return document.getElementById(id);
}

function setStatus(text,cls=""){
  $("status").textContent=text;
  $("status").className="status "+cls;
}

function setProgress(percent){
  $("progressbar").style.width =
    Math.max(0,Math.min(100,percent))+"%";
}

function fmtPct(x){
  if(!Number.isFinite(x)) return "—";
  return (x>=0?"+":"")+x.toFixed(2)+"%";
}

function median(arr){
  if(!arr.length) return NaN;

  const a=[...arr].sort((x,y)=>x-y);
  const m=Math.floor(a.length/2);

  return a.length%2
    ? a[m]
    : (a[m-1]+a[m])/2;
}

function mean(arr){
  if(!arr.length) return NaN;

  return arr.reduce((a,b)=>a+b,0)/arr.length;
}


/* =========================================================
   ИНДИКАТОРЫ
   ========================================================= */

function ema(values,period){

  const out=new Array(values.length).fill(null);

  if(values.length<period) return out;

  let sum=0;

  for(let i=0;i<period;i++){
    sum+=values[i];
  }

  out[period-1]=sum/period;

  const k=2/(period+1);

  for(let i=period;i<values.length;i++){

    out[i]=
      values[i]*k+
      out[i-1]*(1-k);
  }

  return out;
}


function rsi(values,period=14){

  const out=
    new Array(values.length).fill(null);

  if(values.length<=period) return out;

  let gains=0;
  let losses=0;

  for(let i=1;i<=period;i++){

    const d=
      values[i]-values[i-1];

    if(d>=0) gains+=d;
    else losses-=d;
  }

  let avgGain=gains/period;
  let avgLoss=losses/period;

  out[period]=
    avgLoss===0
      ? 100
      : 100-(100/(1+avgGain/avgLoss));

  for(let i=period+1;i<values.length;i++){

    const d=
      values[i]-values[i-1];

    const gain=d>0?d:0;
    const loss=d<0?-d:0;

    avgGain=
      (avgGain*(period-1)+gain)/period;

    avgLoss=
      (avgLoss*(period-1)+loss)/period;

    out[i]=
      avgLoss===0
        ? 100
        : 100-(100/(1+avgGain/avgLoss));
  }

  return out;
}


function macd(values){

  const e12=ema(values,12);
  const e26=ema(values,26);

  const line=
    new Array(values.length).fill(null);

  for(let i=0;i<values.length;i++){

    if(e12[i]!=null && e26[i]!=null){
      line[i]=e12[i]-e26[i];
    }
  }

  const compact=[];
  const map=[];

  for(let i=0;i<line.length;i++){

    if(line[i]!=null){
      compact.push(line[i]);
      map.push(i);
    }
  }

  const signalCompact=
    ema(compact,9);

  const signal=
    new Array(values.length).fill(null);

  const hist=
    new Array(values.length).fill(null);

  for(let j=0;j<map.length;j++){

    const i=map[j];

    if(signalCompact[j]!=null){

      signal[i]=signalCompact[j];

      hist[i]=
        line[i]-signal[i];
    }
  }

  return {
    line,
    signal,
    hist
  };
}


function adx(high,low,close,period=14){

  const n=close.length;

  const tr=
    new Array(n).fill(null);

  const plusDM=
    new Array(n).fill(null);

  const minusDM=
    new Array(n).fill(null);

  for(let i=1;i<n;i++){

    const h=high[i];
    const l=low[i];

    const ph=high[i-1];
    const pl=low[i-1];
    const pc=close[i-1];

    tr[i]=Math.max(
      h-l,
      Math.abs(h-pc),
      Math.abs(l-pc)
    );

    const up=h-ph;
    const down=pl-l;

    plusDM[i]=
      (up>down && up>0)
        ? up
        : 0;

    minusDM[i]=
      (down>up && down>0)
        ? down
        : 0;
  }

  const atr=
    new Array(n).fill(null);

  const pdi=
    new Array(n).fill(null);

  const mdi=
    new Array(n).fill(null);

  const dx=
    new Array(n).fill(null);

  const result=
    new Array(n).fill(null);

  let trSum=0;
  let plusSum=0;
  let minusSum=0;

  for(let i=1;i<=period;i++){

    trSum+=tr[i]||0;
    plusSum+=plusDM[i]||0;
    minusSum+=minusDM[i]||0;
  }

  atr[period]=trSum/period;

  let p=plusSum/period;
  let m=minusSum/period;

  pdi[period]=
    atr[period]===0
      ? 0
      : 100*(p/atr[period]);

  mdi[period]=
    atr[period]===0
      ? 0
      : 100*(m/atr[period]);

  let den=
    pdi[period]+mdi[period];

  dx[period]=
    den===0
      ? 0
      : 100*Math.abs(
          pdi[period]-mdi[period]
        )/den;

  for(let i=period+1;i<n;i++){

    atr[i]=
      (
        atr[i-1]*(period-1)+
        (tr[i]||0)
      )/period;

    p=
      (
        p*(period-1)+
        (plusDM[i]||0)
      )/period;

    m=
      (
        m*(period-1)+
        (minusDM[i]||0)
      )/period;

    pdi[i]=
      atr[i]===0
        ? 0
        : 100*p/atr[i];

    mdi[i]=
      atr[i]===0
        ? 0
        : 100*m/atr[i];

    den=pdi[i]+mdi[i];

    dx[i]=
      den===0
        ? 0
        : 100*Math.abs(
            pdi[i]-mdi[i]
          )/den;
  }

  let count=0;
  let sum=0;

  for(let i=period;i<n;i++){

    if(dx[i]!=null){

      if(count<period){

        sum+=dx[i];
        count++;

        if(count===period){
          result[i]=sum/period;
        }

      }else{

        result[i]=
          (
            result[i-1]*(period-1)+
            dx[i]
          )/period;
      }
    }
  }

  return result;
}


/* =========================================================
   ФОРМИРОВАНИЕ ДАННЫХ
   ========================================================= */

function buildData(raw){

  const close=
    raw.map(x=>Number(x[4]));

  const open=
    raw.map(x=>Number(x[1]));

  const high=
    raw.map(x=>Number(x[2]));

  const low=
    raw.map(x=>Number(x[3]));

  const volume=
    raw.map(x=>Number(x[5]));

  const time=
    raw.map(x=>Number(x[0]));

  const ema20=ema(close,20);
  const ema50=ema(close,50);
  const ema200=ema(close,200);

  const RSI=rsi(close,14);

  const MACD=macd(close);

  const ADX=adx(
    high,
    low,
    close,
    14
  );

  const avgVol=
    new Array(close.length).fill(null);

  for(let i=20;i<close.length;i++){

    let s=0;

    for(let j=i-20;j<i;j++){
      s+=volume[j];
    }

    avgVol[i]=s/20;
  }

  const data=[];

  for(let i=0;i<close.length;i++){

    data.push({

      i,

      time:time[i],

      open:open[i],
      high:high[i],
      low:low[i],
      close:close[i],

      volume:volume[i],

      ema20:ema20[i],
      ema50:ema50[i],
      ema200:ema200[i],

      rsi:RSI[i],

      macd:MACD.line[i],

      macdSignal:
        MACD.signal[i],

      macdHist:
        MACD.hist[i],

      adx:ADX[i],

      avgVol:avgVol[i]
    });
  }

  return data;
}


/* =========================================================
   ФАКТОРЫ
   ========================================================= */

function factorState(d){

  return {

    "EMA20 > EMA50":
      d.ema20!=null &&
      d.ema50!=null &&
      d.ema20>d.ema50,

    "Price > EMA200":
      d.ema200!=null &&
      d.close>d.ema200,

    "MACD > 0":
      d.macd!=null &&
      d.macd>0,

    "MACD Histogram > 0":
      d.macdHist!=null &&
      d.macdHist>0,

    "RSI > 52":
      d.rsi!=null &&
      d.rsi>52,

    "RSI 52–65":
      d.rsi!=null &&
      d.rsi>=52 &&
      d.rsi<=65,

    "ADX > 25":
      d.adx!=null &&
      d.adx>25,

    "Volume > average":
      d.avgVol!=null &&
      d.volume>d.avgVol
  };
}


function futureReturn(data,i){

  if(i+1>=data.length)
    return null;

  const entry=
    data[i+1].open;

  const exit=
    data[i+1].close;

  if(
    !Number.isFinite(entry) ||
    !Number.isFinite(exit) ||
    entry===0
  ){
    return null;
  }

  return (
    (exit-entry)/entry
  )*100;
}


function usableRows(data){

  const out=[];

  for(let i=0;i<data.length-1;i++){

    const d=data[i];

    if(
      d.ema200==null ||
      d.macd==null ||
      d.macdHist==null ||
      d.rsi==null ||
      d.adx==null ||
      d.avgVol==null
    ){
      continue;
    }

    const ret=
      futureReturn(data,i);

    if(ret==null)
      continue;

    out.push({

      ...d,

      ret,

      factors:
        factorState(d)
    });
  }

  return out;
}


/* =========================================================
   СТАТИСТИКА
   ========================================================= */

function comboMatch(row,combo){

  return combo.every(
    f=>row.factors[f]
  );
}


function stats(rows){

  if(!rows.length){

    return {
      n:0,
      avg:NaN,
      median:NaN,
      win:NaN,
      plus1:NaN,
      minus1:NaN
    };
  }

  const rets=
    rows.map(x=>x.ret);

  return {

    n:rets.length,

    avg:mean(rets),

    median:median(rets),

    win:
      rets.filter(x=>x>0).length/
      rets.length*100,

    plus1:
      rets.filter(x=>x>1).length/
      rets.length*100,

    minus1:
      rets.filter(x=>x<-1).length/
      rets.length*100
  };
}


function periodBaseline(
  rows,
  start,
  end
){
  return stats(
    rows.slice(start,end)
  );
}


function comboStats(
  rows,
  combo,
  start=0,
  end=rows.length
){

  const selected=[];

  for(let i=start;i<end;i++){

    if(
      comboMatch(rows[i],combo)
    ){
      selected.push(rows[i]);
    }
  }

  return stats(selected);
}


function combinations(
  arr,
  min,
  max
){

  const result=[];

  function rec(start,current){

    if(current.length>=min){
      result.push([...current]);
    }

    if(current.length===max)
      return;

    for(
      let i=start;
      i<arr.length;
      i++
    ){

      current.push(arr[i]);

      rec(
        i+1,
        current
      );

      current.pop();
    }
  }

  rec(0,[]);

  return result;
}


/* =========================================================
   ИНКРЕМЕНТАЛЬНЫЙ АНАЛИЗ
   ========================================================= */

function incremental(rows){

  const pairs=[];

  for(
    let a=0;
    a<FACTORS.length;
    a++
  ){

    const first=[
      FACTORS[a]
    ];

    const base=
      comboStats(rows,first);

    if(base.n<100)
      continue;

    for(
      let b=0;
      b<FACTORS.length;
      b++
    ){

      if(a===b)
        continue;

      const combo=[
        FACTORS[a],
        FACTORS[b]
      ];

      const after=
        comboStats(
          rows,
          combo
        );

      if(after.n<50)
        continue;

      const delta=
        after.avg-base.avg;

      pairs.push({

        base,
        after,

        first:
          FACTORS[a],

        second:
          FACTORS[b],

        delta
      });
    }
  }

  pairs.sort(
    (a,b)=>b.delta-a.delta
  );

  return pairs.slice(0,10);
}


/* =========================================================
   WALK FORWARD
   ========================================================= */

function walkForward(
  rows,
  combo
){

  const folds=[];

  const n=rows.length;

  const firstTrain=
    Math.floor(n*0.50);

  const tests=5;

  let trainEnd=
    firstTrain;

  const remaining=
    n-firstTrain;

  const testSize=
    Math.floor(
      remaining/tests
    );

  for(
    let k=0;
    k<tests;
    k++
  ){

    const testStart=
      trainEnd;

    const testEnd=
      k===tests-1
        ? n
        : Math.min(
            n,
            testStart+testSize
          );

    if(testEnd<=testStart)
      break;

    const trainRows=
      rows.slice(
        0,
        trainEnd
      );

    const testRows=
      rows.slice(
        testStart,
        testEnd
      );

    const comboTrain=
      comboStats(
        trainRows,
        combo
      );

    const comboTest=
      comboStats(
        testRows,
        combo
      );

    const baseTest=
      periodBaseline(
        rows,
        testStart,
        testEnd
      );

    if(
      comboTest.n>0 &&
      baseTest.n>0
    ){

      folds.push({

        trainN:
          trainRows.length,

        testN:
          testRows.length,

        comboN:
          comboTest.n,

        comboAvg:
          comboTest.avg,

        btcAvg:
          baseTest.avg,

        edge:
          comboTest.avg-
          baseTest.avg
      });
    }
  }

  return folds;
}


function scoreWalkForward(
  folds
){

  if(folds.length<4)
    return 0;

  const totalN=
    folds.reduce(
      (s,x)=>s+x.comboN,
      0
    );

  const edges=
    folds.map(
      x=>x.edge
    );

  const positive=
    edges.filter(
      x=>x>0
    ).length;

  const meanEdge=
    mean(edges);

  const medianEdge=
    median(edges);

  const worst=
    Math.min(...edges);

  let score=0;

  if(folds.length>=4)
    score+=20;

  if(totalN>=100)
    score+=20;

  if(
    positive/folds.length>=0.75
  )
    score+=20;

  if(meanEdge>0.10)
    score+=20;

  if(medianEdge>0)
    score+=10;

  if(worst>-0.50)
    score+=10;

  return score;
}


function statusText(folds){

  const totalN=
    folds.reduce(
      (s,x)=>s+x.comboN,
      0
    );

  const edges=
    folds.map(
      x=>x.edge
    );

  const positive=
    edges.filter(
      x=>x>0
    ).length;

  const meanEdge=
    mean(edges);

  const med=
    median(edges);

  const worst=
    Math.min(...edges);

  const confirmed=

    folds.length>=4 &&

    totalN>=150 &&

    positive/folds.length>=0.75 &&

    meanEdge>0.10 &&

    med>0 &&

    worst>-0.50;

  return {

    confirmed,

    totalN,

    positive,

    meanEdge,

    medianEdge:med,

    worst
  };
}


/* =========================================================
   РЕЖИМ
   ========================================================= */

function regime(d){

  if(
    d.ema200!=null &&
    d.ema20!=null &&
    d.ema50!=null &&
    d.macd!=null &&
    d.adx!=null
  ){

    if(
      d.close>d.ema200 &&
      d.ema20>d.ema50 &&
      d.macd>0
    ){

      if(d.adx>=30)
        return "Strong Bullish";

      return "Bullish";
    }

    if(
      d.close<d.ema200 &&
      d.ema20<d.ema50 &&
      d.macd<0
    ){

      if(d.adx>=30)
        return "Strong Bearish";

      return "Bearish";
    }
  }

  return "Flat";
}


/* =========================================================
   ТАБЛИЦА
   ========================================================= */

function renderTable(
  headers,
  rows
){

  let html=
    "<table><thead><tr>";

  headers.forEach(h=>{
    html+="<th>"+h+"</th>";
  });

  html+="</tr></thead><tbody>";

  rows.forEach(row=>{

    html+="<tr>";

    row.forEach(cell=>{
      html+="<td>"+cell+"</td>";
    });

    html+="</tr>";
  });

  html+="</tbody></table>";

  return html;
}


/* =========================================================
   НОВАЯ ЗАГРУЗКА ИСТОРИИ
   ========================================================= */

async function fetchOneBatch(
  endTime,
  requestNumber
){

  let url=
    BINANCE_BASE+
    "?symbol="+SYMBOL+
    "&interval="+INTERVAL+
    "&limit="+REQUEST_LIMIT;

  if(endTime!=null){
    url+="&endTime="+endTime;
  }

  $("diagnostic").textContent=
    "Запрос "+requestNumber+
    "/"+HISTORY_REQUESTS+
    "…";

  setStatus(
    "Загрузка истории "+
    requestNumber+"/"+HISTORY_REQUESTS+
    "…",
    "loading"
  );

  const controller=
    new AbortController();

  const timer=
    setTimeout(
      ()=>controller.abort(),
      REQUEST_TIMEOUT
    );

  try{

    const response=
      await fetch(
        url,
        {
          cache:"no-store",
          signal:controller.signal
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP "+
        response.status+
        " "+
        response.statusText
      );
    }

    const data=
      await response.json();

    if(
      !Array.isArray(data) ||
      data.length===0
    ){

      throw new Error(
        "Binance вернул пустой ответ."
      );
    }

    return data;

  }catch(err){

    if(err.name==="AbortError"){

      throw new Error(
        "Запрос "+requestNumber+
        " не ответил за "+
        REQUEST_TIMEOUT/1000+
        " секунд."
      );
    }

    throw new Error(
      "Запрос "+requestNumber+
      ": "+
      (err.message || err)
    );

  }finally{

    clearTimeout(timer);
  }
}
