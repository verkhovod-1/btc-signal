<script>
"use strict";

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

const API="https://api.binance.com/api/v3/klines";
const REQUESTS=5;
const LIMIT=1000;
const TIMEOUT=10000;

const FACTORS=[
 "EMA20 > EMA50",
 "Price > EMA200",
 "MACD > 0",
 "MACD Histogram > 0",
 "RSI > 52",
 "RSI 52–65",
 "ADX > 25",
 "Volume > average"
];

/* ========================================================= */

function $(id){
 return document.getElementById(id);
}

function status(t,c){
 $("status").textContent=t;
 $("status").className="status "+c;
}

function diag(t){
 $("diag").textContent=t;
}

function progress(n){
 $("bar").style.width=n+"%";
}

function pct(x){
 if(!Number.isFinite(x))return "—";
 return (x>=0?"+":"")+x.toFixed(2)+"%";
}

function avg(a){
 if(!a.length)return NaN;
 return a.reduce((x,y)=>x+y,0)/a.length;
}

function med(a){
 if(!a.length)return NaN;
 let b=[...a].sort((x,y)=>x-y);
 let m=Math.floor(b.length/2);
 return b.length%2?b[m]:(b[m-1]+b[m])/2;
}

/* =========================================================
   ИНДИКАТОРЫ
   ========================================================= */

function EMA(a,p){
 let r=new Array(a.length).fill(null);
 if(a.length<p)return r;

 let s=0;
 for(let i=0;i<p;i++)s+=a[i];
 r[p-1]=s/p;

 let k=2/(p+1);

 for(let i=p;i<a.length;i++)
  r[i]=a[i]*k+r[i-1]*(1-k);

 return r;
}

function RSI(a,p=14){
 let r=new Array(a.length).fill(null);
 if(a.length<=p)return r;

 let g=0,l=0;

 for(let i=1;i<=p;i++){
  let d=a[i]-a[i-1];
  if(d>0)g+=d;
  else l-=d;
 }

 let ag=g/p,al=l/p;

 r[p]=al===0?100:100-100/(1+ag/al);

 for(let i=p+1;i<a.length;i++){
  let d=a[i]-a[i-1];
  let gg=d>0?d:0;
  let ll=d<0?-d:0;

  ag=(ag*(p-1)+gg)/p;
  al=(al*(p-1)+ll)/p;

  r[i]=al===0?100:100-100/(1+ag/al);
 }

 return r;
}

function MACD(a){
 let e12=EMA(a,12);
 let e26=EMA(a,26);
 let line=new Array(a.length).fill(null);

 for(let i=0;i<a.length;i++){
  if(e12[i]!=null&&e26[i]!=null)
   line[i]=e12[i]-e26[i];
 }

 let c=[],map=[];

 for(let i=0;i<line.length;i++){
  if(line[i]!=null){
   c.push(line[i]);
   map.push(i);
  }
 }

 let sigC=EMA(c,9);
 let sig=new Array(a.length).fill(null);
 let hist=new Array(a.length).fill(null);

 for(let j=0;j<map.length;j++){
  let i=map[j];
  if(sigC[j]!=null){
   sig[i]=sigC[j];
   hist[i]=line[i]-sig[i];
  }
 }

 return {line,hist};
}

function ADX(h,l,c,p=14){
 let n=c.length;
 let tr=new Array(n).fill(0);
 let plus=new Array(n).fill(0);
 let minus=new Array(n).fill(0);

 for(let i=1;i<n;i++){
  tr[i]=Math.max(
   h[i]-l[i],
   Math.abs(h[i]-c[i-1]),
   Math.abs(l[i]-c[i-1])
  );

  let up=h[i]-h[i-1];
  let down=l[i-1]-l[i];

  plus[i]=(up>down&&up>0)?up:0;
  minus[i]=(down>up&&down>0)?down:0;
 }

 let atr=new Array(n).fill(null);
 let pdi=new Array(n).fill(null);
 let mdi=new Array(n).fill(null);
 let dx=new Array(n).fill(null);
 let out=new Array(n).fill(null);

 let ts=0,ps=0,ms=0;

 for(let i=1;i<=p;i++){
  ts+=tr[i];
  ps+=plus[i];
  ms+=minus[i];
 }

 atr[p]=ts/p;

 let pp=ps/p;
 let mm=ms/p;

 pdi[p]=atr[p]?100*pp/atr[p]:0;
 mdi[p]=atr[p]?100*mm/atr[p]:0;

 let d=pdi[p]+mdi[p];
 dx[p]=d?100*Math.abs(pdi[p]-mdi[p])/d:0;

 for(let i=p+1;i<n;i++){
  atr[i]=(atr[i-1]*(p-1)+tr[i])/p;
  pp=(pp*(p-1)+plus[i])/p;
  mm=(mm*(p-1)+minus[i])/p;

  pdi[i]=atr[i]?100*pp/atr[i]:0;
  mdi[i]=atr[i]?100*mm/atr[i]:0;

  d=pdi[i]+mdi[i];
  dx[i]=d?100*Math.abs(pdi[i]-mdi[i])/d:0;
 }

 let count=0,sum=0;

 for(let i=p;i<n;i++){
  if(count<p){
   sum+=dx[i];
   count++;
   if(count===p)out[i]=sum/p;
  }else{
   out[i]=(out[i-1]*(p-1)+dx[i])/p;
  }
 }

 return out;
}

/* =========================================================
   ДАННЫЕ
   ========================================================= */

function build(raw){

 let close=raw.map(x=>+x[4]);
 let open=raw.map(x=>+x[1]);
 let high=raw.map(x=>+x[2]);
 let low=raw.map(x=>+x[3]);
 let vol=raw.map(x=>+x[5]);
 let time=raw.map(x=>+x[0]);

 let e20=EMA(close,20);
 let e50=EMA(close,50);
 let e200=EMA(close,200);
 let rsi=RSI(close);
 let macd=MACD(close);
 let adx=ADX(high,low,close);

 let av=new Array(close.length).fill(null);

 for(let i=20;i<close.length;i++){
  let s=0;
  for(let j=i-20;j<i;j++)s+=vol[j];
  av[i]=s/20;
 }

 let data=[];

 for(let i=0;i<close.length;i++){
  data.push({
   i,
   time:time[i],
   open:open[i],
   high:high[i],
   low:low[i],
   close:close[i],
   volume:vol[i],
   ema20:e20[i],
   ema50:e50[i],
   ema200:e200[i],
   rsi:rsi[i],
   macd:macd.line[i],
   hist:macd.hist[i],
   adx:adx[i],
   avgVol:av[i]
  });
 }

 return data;
}

function factors(d){
 return {
  "EMA20 > EMA50":d.ema20!=null&&d.ema50!=null&&d.ema20>d.ema50,
  "Price > EMA200":d.ema200!=null&&d.close>d.ema200,
  "MACD > 0":d.macd!=null&&d.macd>0,
  "MACD Histogram > 0":d.hist!=null&&d.hist>0,
  "RSI > 52":d.rsi!=null&&d.rsi>52,
  "RSI 52–65":d.rsi!=null&&d.rsi>=52&&d.rsi<=65,
  "ADX > 25":d.adx!=null&&d.adx>25,
  "Volume > average":d.avgVol!=null&&d.volume>d.avgVol
 };
}

function prepare(data){

 let rows=[];

 for(let i=0;i<data.length-1;i++){

  let d=data[i];

  if(
   d.ema200==null||
   d.macd==null||
   d.hist==null||
   d.rsi==null||
   d.adx==null||
   d.avgVol==null
  )continue;

  let ret=(data[i+1].close-data[i+1].open)/
           data[i+1].open*100;

  rows.push({
   ...d,
   ret,
   f:factors(d)
  });
 }

 return rows;
}

/* =========================================================
   СТАТИСТИКА
   ========================================================= */

function match(row,c){
 return c.every(x=>row.f[x]);
}

function stats(rows){

 if(!rows.length)
  return {n:0,avg:NaN,median:NaN,win:NaN,p1:NaN,m1:NaN};

 let a=rows.map(x=>x.ret);

 return {
  n:a.length,
  avg:avg(a),
  median:med(a),
  win:a.filter(x=>x>0).length/a.length*100,
  p1:a.filter(x=>x>1).length/a.length*100,
  m1:a.filter(x=>x<-1).length/a.length*100
 };
}

function cstats(rows,c,start=0,end=rows.length){

 let a=[];

 for(let i=start;i<end;i++)
  if(match(rows[i],c))a.push(rows[i]);

 return stats(a);
}

function combinations(arr,min,max){

 let out=[];

 function go(start,c){

  if(c.length>=min)
   out.push([...c]);

  if(c.length===max)return;

  for(let i=start;i<arr.length;i++){
   c.push(arr[i]);
   go(i+1,c);
   c.pop();
  }
 }

 go(0,[]);
 return out;
}

/* =========================================================
   WALK FORWARD
   ========================================================= */

function walk(rows,c){

 let folds=[];
 let n=rows.length;

 let train=Math.floor(n*.5);
 let remain=n-train;
 let size=Math.floor(remain/5);

 for(let k=0;k<5;k++){

  let start=train;
  let end=k===4?n:Math.min(n,start+size);

  let cs=cstats(rows,c,start,end);
  let bs=stats(rows.slice(start,end));

  if(cs.n>0&&bs.n>0){

   folds.push({
    train,
    test:end-start,
    n:cs.n,
    combo:cs.avg,
    btc:bs.avg,
    edge:cs.avg-bs.avg
   });
  }

  train=end;
 }

 return folds;
}

function score(folds){

 if(folds.length<4)return 0;

 let n=folds.reduce((s,x)=>s+x.n,0);
 let e=folds.map(x=>x.edge);

 let positive=e.filter(x=>x>0).length;
 let me=avg(e);
 let md=med(e);
 let worst=Math.min(...e);

 let s=0;

 if(folds.length>=4)s+=20;
 if(n>=100)s+=20;
 if(positive/folds.length>=.75)s+=20;
 if(me>.10)s+=20;
 if(md>0)s+=10;
 if(worst>-.50)s+=10;

 return s;
}

/* =========================================================
   РЕЖИМ
   ========================================================= */

function regime(d){

 if(
  d.ema200!=null&&
  d.ema20!=null&&
  d.ema50!=null&&
  d.macd!=null&&
  d.adx!=null
 ){

  if(d.close>d.ema200&&
     d.ema20>d.ema50&&
     d.macd>0)
   return d.adx>=30?
    "Strong Bullish":"Bullish";

  if(d.close<d.ema200&&
     d.ema20<d.ema50&&
     d.macd<0)
   return d.adx>=30?
    "Strong Bearish":"Bearish";
 }

 return "Flat";
}

/* =========================================================
   ТАБЛИЦА
   ========================================================= */

function table(head,rows){

 let h="<table><thead><tr>";

 head.forEach(x=>h+="<th>"+x+"</th>");

 h+="</tr></thead><tbody>";

 rows.forEach(r=>{
  h+="<tr>";
  r.forEach(x=>h+="<td>"+x+"</td>");
  h+="</tr>";
 });

 return h+"</tbody></table>";
}

/* =========================================================
   ЗАГРУЗКА ОДНОГО БЛОКА
   ========================================================= */

async function getBatch(endTime,num){

 let url=
  API+
  "?symbol=BTCUSDT"+
  "&interval=1d"+
  "&limit=1000";

 if(endTime!==null)
  url+="&endTime="+endTime;

 diag(
  "Запрос "+num+"/"+REQUESTS+
  " — ожидание Binance…"
 );

 status(
  "Загрузка истории "+num+"/"+REQUESTS+"…",
  "loading"
 );

 let controller=new AbortController();

 let timer=setTimeout(
  ()=>controller.abort(),
  TIMEOUT
 );

 try{

  let response=await fetch(
   url,
   {
    cache:"no-store",
    signal:controller.signal
   }
  );

  if(!response.ok)
   throw new Error(
    "HTTP "+response.status
   );

  let data=await response.json();

  if(!Array.isArray(data)||!data.length)
   throw new Error("Пустой ответ Binance");

  return data;

 }catch(e){

  if(e.name==="AbortError")
   throw new Error(
    "Запрос "+num+
    " не ответил за 10 секунд"
   );

  throw new Error(
   "Запрос "+num+": "+
   (e.message||e)
  );

 }finally{

  clearTimeout(timer);
 }
}

/* =========================================================
   ЗАГРУЗКА 5000 СВЕЧЕЙ
   ========================================================= */

async function loadHistory(){

 let all=[];
 let end=null;

 for(let n=1;n<=REQUESTS;n++){

  let batch=await getBatch(end,n);

  diag(
   "Запрос "+n+"/"+REQUESTS+
   " получен: "+
   batch.length+
   " свечей"
  );

  all=batch.concat(all);

  end=batch[0][0]-1;

  progress(n/REQUESTS*100);

  if(n<REQUESTS)
   await new Promise(r=>setTimeout(r,500));
 }

 let map=new Map();

 all.forEach(x=>map.set(x[0],x));

 return [...map.values()].sort(
  (a,b)=>a[0]-b[0]
 );
}

/* =========================================================
   ОТРИСОВКА
   ========================================================= */

function render(data,rows){

 let d=data[data.length-1];
 let r=regime(d);
 let f=factors(d);

 $("regime").textContent=r;

 $("regime").className=
  "big "+
  (r.includes("Bullish")?
   "good":
   r.includes("Bearish")?
   "bad":"neutral");

 $("regimeInfo").textContent=
  "BTC: $"+
  d.close.toLocaleString("en-US",{
   maximumFractionDigits:0
  })+
  " · RSI: "+d.rsi.toFixed(1)+
  " · ADX: "+d.adx.toFixed(1);

 let on=FACTORS.filter(x=>f[x]);
 let off=FACTORS.filter(x=>!f[x]);

 $("signal").innerHTML=
  "<b>Активны:</b> "+
  (on.length?on.join(" · "):"нет")+
  "<br><br>"+
  "<b>Неактивны:</b> "+
  (off.length?off.join(" · "):"нет")+
  "<br><br><span class='small'>"+
  "Score не является вероятностью."
  +"</span>";

 $("indicators").innerHTML=table(
  ["Индикатор","Значение"],
  [
   ["Цена","$"+d.close.toLocaleString("en-US",{maximumFractionDigits:0})],
   ["EMA20",d.ema20.toFixed(2)],
   ["EMA50",d.ema50.toFixed(2)],
   ["EMA200",d.ema200.toFixed(2)],
   ["MACD",d.macd.toFixed(4)],
   ["MACD Histogram",d.hist.toFixed(4)],
   ["RSI",d.rsi.toFixed(2)],
   ["ADX",d.adx.toFixed(2)],
   ["Volume / Avg",(d.volume/d.avgVol).toFixed(2)+"x"]
  ]
 );

 renderIncremental(rows);
 renderFactors(rows);
 renderRegimes(rows);
 renderWalk(rows);
}

function renderIncremental(rows){

 let arr=[];

 for(let a=0;a<FACTORS.length;a++){

  let base=cstats(rows,[FACTORS[a]]);

  if(base.n<100)continue;

  for(let b=0;b<FACTORS.length;b++){

   if(a===b)continue;

   let after=cstats(
    rows,
    [FACTORS[a],FACTORS[b]]
   );

   if(after.n<50)continue;

   arr.push({
    a:FACTORS[a],
    b:FACTORS[b],
    base,
    after,
    delta:after.avg-base.avg
   });
  }
 }

 arr.sort((x,y)=>y.delta-x.delta);

 $("incremental").innerHTML=table(
  ["Комбинация","N base","N after","Base","After","Δ"],
  arr.slice(0,10).map(x=>[
   x.a+" → + "+x.b,
   x.base.n,
   x.after.n,
   pct(x.base.avg),
   pct(x.after.avg),
   "<span class='"+(x.delta>0?"good":"bad")+"'>"+
   pct(x.delta)+"</span>"
  ])
 );
}

function renderFactors(rows){

 $("factors").innerHTML=table(
  ["Фактор","N","Avg","Median","Win",">+1%","<-1%"],
  FACTORS.map(x=>{
   let s=cstats(rows,[x]);

   return [
    x,s.n,pct(s.avg),pct(s.median),
    s.win.toFixed(1)+"%",
    s.p1.toFixed(1)+"%",
    s.m1.toFixed(1)+"%"
   ];
  })
 );
}

function renderRegimes(rows){

 let names=[
  "Flat",
  "Bullish",
  "Strong Bullish",
  "Bearish",
  "Strong Bearish"
 ];

 $("regimes").innerHTML=table(
  ["Режим","N","Avg","Median","Win"],
  names.map(name=>{
   let s=stats(
    rows.filter(x=>regime(x)===name)
   );

   return [
    name,
    s.n,
    pct(s.avg),
    pct(s.median),
    s.n?s.win.toFixed(1)+"%":"—"
   ];
  })
 );
}

function renderWalk(rows){

 let results=[];

 for(let c of combinations(FACTORS,2,4)){

  let folds=walk(rows,c);

  if(folds.length<4)continue;

  let n=folds.reduce((s,x)=>s+x.n,0);
  if(n<80)continue;

  let e=folds.map(x=>x.edge);
  let me=avg(e);
  let md=med(e);
  let worst=Math.min(...e);
  let pos=e.filter(x=>x>0).length;

  results.push({
   c,folds,n,me,md,worst,pos,
   score:score(folds)
  });
 }

 results.sort((a,b)=>
  b.score-a.score||
  b.me-a.me||
  b.n-a.n
 );

 let top=results.slice(0,10);

 $("walk").innerHTML=table(
  ["Комбинация","N","Edge","Median","Позитивные","Worst","Score"],
  top.map(x=>[
   x.c.join(" + "),
   x.n,
   pct(x.me),
   pct(x.md),
   x.pos+"/"+x.folds.length,
   pct(x.worst),
   x.score+"/100"
  ])
 );

 if(!top.length){
  $("best").textContent="Недостаточно данных.";
  return;
 }

 let b=top[0];

 let confirmed=
  b.folds.length>=4&&
  b.n>=150&&
  b.pos/b.folds.length>=.75&&
  b.me>.10&&
  b.md>0&&
  b.worst>-.50;

 $("best").innerHTML=
  "<h3>"+b.c.join(" + ")+"</h3>"+
  "<div class='badge'>"+
  (confirmed?
   "ПОДТВЕРЖДЕНО":
   "ЧАСТИЧНО ПОДТВЕРЖДАЕТСЯ")+
  "</div>"+
  "<p>"+
  "<b>Score:</b> "+b.score+"/100<br>"+
  "<b>Test N:</b> "+b.n+"<br>"+
  "<b>Mean edge:</b> "+pct(b.me)+"<br>"+
  "<b>Median edge:</b> "+pct(b.md)+"<br>"+
  "<b>Положительных:</b> "+
  b.pos+"/"+b.folds.length+"<br>"+
  "<b>Worst:</b> "+pct(b.worst)+
  "</p>"+
  "<h3>Walk-forward</h3>"+
  table(
   ["#","Train","Test","Combo","BTC","Edge"],
   b.folds.map((x,i)=>[
    i+1,
    x.train,
    x.test,
    pct(x.combo),
    pct(x.btc),
    pct(x.edge)
   ])
  );
}

/* =========================================================
   ЗАПУСК
   ========================================================= */

async function start(){

 try{

  status(
   "JavaScript работает",
   "success"
  );

  diag(
   "Начинаем загрузку истории BTC…"
  );

  progress(0);

  let raw=await loadHistory();

  diag(
   "Получено "+
   raw.length+
   " уникальных свечей. Расчёт…"
  );

  if(raw.length<1000)
   throw new Error(
    "Получено слишком мало свечей: "+
    raw.length
   );

  let data=build(raw);
  let rows=prepare(data);

  if(rows.length<500)
   throw new Error(
    "Пригодных строк только "+
    rows.length
   );

  render(data,rows);

  $("app").style.display="block";

  status(
   "Данные обновлены",
   "success"
  );

  diag(
   "Готово: "+
   raw.length+
   " свечей, "+
   rows.length+
   " строк для статистики."
  );

  progress(100);

 }catch(e){

  console.error(e);

  status(
   "Ошибка",
   "error"
  );

  diag(
   e.message||
   String(e)
  );
 }
}


/*
  ВАЖНО:
  Запускаем после полной загрузки страницы.
*/

window.addEventListener(
 "load",
 start
);

</script>

</body>
</html>
