<script>

"use strict";

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const API =
    "https://api.binance.com/api/v3/klines";

const SYMBOL = "BTCUSDT";

/*
   История специально подобрана под мобильный телефон.

   15m = 90 дней
   1h  = 365 дней
   4h  = 730 дней
   1d  = 1825 дней (~5 лет)
*/
const HISTORY_DAYS = {
    "15m":90,
    "1h":365,
    "4h":730,
    "1d":1825
};

const HORIZONS = {
    "15m":[4,16,96],
    "1h":[1,4,24],
    "4h":[1,6],
    "1d":[1]
};

const intervalMs = {
    "15m":15*60*1000,
    "1h":60*60*1000,
    "4h":4*60*60*1000,
    "1d":24*60*60*1000
};

const statusEl = document.getElementById("status");
const loaderEl = document.getElementById("loader");
const contentEl = document.getElementById("content");
const runBtn = document.getElementById("runBtn");


/* =========================================================
   ДИАГНОСТИКА JAVASCRIPT
========================================================= */

function setStatus(text){
    statusEl.textContent = text;
}

window.addEventListener("error",function(e){

    loaderEl.style.display="none";

    setStatus(
        "Ошибка JavaScript: " +
        (e.message || "неизвестная ошибка")
    );
});

window.addEventListener(
    "unhandledrejection",
    function(e){

        loaderEl.style.display="none";

        let msg="Неизвестная ошибка";

        if(e.reason){
            msg=e.reason.message || String(e.reason);
        }

        setStatus(
            "Ошибка: " + msg
        );
    }
);


/* =========================================================
   БЕЗОПАСНЫЕ ФОРМАТТЕРЫ
========================================================= */

function num(x){

    const n=Number(x);

    return Number.isFinite(n) ? n : null;
}


function pct(x){

    const n=Number(x);

    if(!Number.isFinite(n)){
        return "—";
    }

    return (n>=0?"+":"")+
           n.toFixed(2)+
           "%";
}


function fmtPrice(x){

    const n=Number(x);

    if(!Number.isFinite(n)){
        return "—";
    }

    return n.toFixed(2);
}


function fmtNum(x){

    const n=Number(x);

    if(!Number.isFinite(n)){
        return "—";
    }

    return n.toFixed(2);
}


function fmtVolume(x){

    const n=Number(x);

    if(!Number.isFinite(n)){
        return "—";
    }

    if(n>=1000000){
        return (n/1000000).toFixed(1)+"M";
    }

    if(n>=1000){
        return (n/1000).toFixed(1)+"K";
    }

    return n.toFixed(0);
}


function formatHorizon(h,interval){

    const minutes = {
        "15m":15,
        "1h":60,
        "4h":240,
        "1d":1440
    };

    const total =
        h * minutes[interval];

    if(total>=1440){

        const d=total/1440;

        return d===1 ? "1 день" :
               d+" дней";
    }

    if(total>=60){

        const h2=total/60;

        return h2===1 ? "1 час" :
               h2+" ч";
    }

    return total+" мин";
}


/* =========================================================
   BINANCE FETCH С TIMEOUT И RETRY
========================================================= */

async function fetchWithTimeout(url,timeout=20000){

    let lastError=null;

    for(let attempt=1;attempt<=3;attempt++){

        const controller =
            new AbortController();

        const timer=setTimeout(
            ()=>controller.abort(),
            timeout
        );

        try{

            const response=await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    signal:controller.signal
                }
            );

            clearTimeout(timer);

            if(!response.ok){

                throw new Error(
                    "Binance HTTP "+response.status
                );
            }

            return await response.json();

        }catch(error){

            clearTimeout(timer);

            lastError=error;

            if(attempt<3){

                setStatus(
                    "Повтор подключения к Binance... "+
                    attempt+"/3"
                );

                await new Promise(
                    r=>setTimeout(r,1000)
                );
            }
        }
    }

    throw lastError ||
          new Error("Не удалось получить данные");
}


/* =========================================================
   ЗАГРУЗКА ИСТОРИИ
========================================================= */

async function fetchHistory(interval){

    const step=intervalMs[interval];

    const days=HISTORY_DAYS[interval];

    const now=Date.now();

    const start =
        now -
        days*24*60*60*1000;

    let cursor=start;

    let all=[];

    /*
       1000 свечей на запрос.
    */
    const totalRequests=
        Math.max(
            1,
            Math.ceil(
                (now-start)/
                (step*1000)
            )
        );

    let requestNumber=0;

    while(cursor<now){

        requestNumber++;

        setStatus(
            "Загрузка "+interval+
            ": запрос "+
            requestNumber+
            " из ~"+
            totalRequests+
            "..."
        );

        const url =
            API+
            "?symbol="+SYMBOL+
            "&interval="+interval+
            "&limit=1000"+
            "&startTime="+cursor+
            "&endTime="+now;

        const data =
            await fetchWithTimeout(url);

        if(!Array.isArray(data)){

            throw new Error(
                "Binance вернул некорректные данные"
            );
        }

        if(data.length===0){
            break;
        }

        for(const c of data){

            if(!Array.isArray(c) || c.length<6){
                continue;
            }

            const t=Number(c[0]);

            const open=Number(c[1]);
            const high=Number(c[2]);
            const low=Number(c[3]);
            const close=Number(c[4]);
            const volume=Number(c[5]);

            if(
                !Number.isFinite(t) ||
                !Number.isFinite(open) ||
                !Number.isFinite(high) ||
                !Number.isFinite(low) ||
                !Number.isFinite(close) ||
                !Number.isFinite(volume)
            ){
                continue;
            }

            /*
               Не используем незакрытую последнюю свечу.
            */
            if(t+step>now){
                continue;
            }

            all.push({
                time:t,
                open:open,
                high:high,
                low:low,
                close:close,
                volume:volume
            });
        }

        const lastTime=
            Number(data[data.length-1][0]);

        if(
            !Number.isFinite(lastTime) ||
            lastTime<cursor
        ){
            throw new Error(
                "Ошибка курсора истории Binance"
            );
        }

        const nextCursor=
            lastTime+step;

        if(nextCursor<=cursor){
            break;
        }

        cursor=nextCursor;

        if(data.length<1000){
            break;
        }
    }

    /*
       Удаляем дубликаты.
    */

    const map=new Map();

    for(const c of all){
        map.set(c.time,c);
    }

    all=Array.from(map.values());

    all.sort(
        (a,b)=>a.time-b.time
    );

    if(all.length<250){

        throw new Error(
            "Недостаточно исторических данных: "+
            all.length+
            " свечей"
        );
    }

    return all;
}


/* =========================================================
   EMA
========================================================= */

function EMA(values,period){

    const result=
        new Array(values.length)
        .fill(null);

    if(values.length<period){
        return result;
    }

    let sum=0;

    for(let i=0;i<period;i++){

        const v=Number(values[i]);

        if(!Number.isFinite(v)){
            return result;
        }

        sum+=v;
    }

    let prev=sum/period;

    result[period-1]=prev;

    const k=2/(period+1);

    for(let i=period;i<values.length;i++){

        const v=Number(values[i]);

        if(!Number.isFinite(v)){
            continue;
        }

        prev =
            v*k +
            prev*(1-k);

        result[i]=prev;
    }

    return result;
}


/* =========================================================
   RSI
========================================================= */

function RSI(values,period=14){

    const result=
        new Array(values.length)
        .fill(null);

    if(values.length<=period){
        return result;
    }

    let gain=0;
    let loss=0;

    for(let i=1;i<=period;i++){

        const diff=
            values[i]-values[i-1];

        if(diff>0){
            gain+=diff;
        }else{
            loss-=diff;
        }
    }

    let avgGain=gain/period;
    let avgLoss=loss/period;

    if(avgLoss===0){
        result[period]=100;
    }else{

        const rs=avgGain/avgLoss;

        result[period]=
            100-(100/(1+rs));
    }

    for(let i=period+1;i<values.length;i++){

        const diff=
            values[i]-values[i-1];

        const g=
            diff>0 ? diff : 0;

        const l=
            diff<0 ? -diff : 0;

        avgGain=
            ((avgGain*(period-1))+g)/
            period;

        avgLoss=
            ((avgLoss*(period-1))+l)/
            period;

        if(avgLoss===0){

            result[i]=100;

        }else{

            const rs=
                avgGain/avgLoss;

            result[i]=
                100-(100/(1+rs));
        }
    }

    return result;
}


/* =========================================================
   MACD
========================================================= */

function MACD(values){

    const e12=EMA(values,12);
    const e26=EMA(values,26);

    const macd=
        new Array(values.length)
        .fill(null);

    for(let i=0;i<values.length;i++){

        if(
            e12[i]!==null &&
            e26[i]!==null
        ){
            macd[i]=
                e12[i]-e26[i];
        }
    }

    const clean=macd.map(
        x=>x===null?0:x
    );

    const signal=EMA(clean,9);

    const hist=
        new Array(values.length)
        .fill(null);

    for(let i=0;i<values.length;i++){

        if(
            macd[i]!==null &&
            signal[i]!==null
        ){
            hist[i]=
                macd[i]-signal[i];
        }
    }

    return {
        macd:macd,
        signal:signal,
        hist:hist
    };
}


/* =========================================================
   ADX
========================================================= */

function ADX(data,period=14){

    const n=data.length;

    const result=
        new Array(n)
        .fill(null);

    if(n<=period*2){
        return result;
    }

    const tr=
        new Array(n).fill(0);

    const plusDM=
        new Array(n).fill(0);

    const minusDM=
        new Array(n).fill(0);

    for(let i=1;i<n;i++){

        const high=data[i].high;
        const low=data[i].low;

        const prevHigh=data[i-1].high;
        const prevLow=data[i-1].low;
        const prevClose=data[i-1].close;

        tr[i]=Math.max(
            high-low,
            Math.abs(high-prevClose),
            Math.abs(low-prevClose)
        );

        const up=
            high-prevHigh;

        const down=
            prevLow-low;

        if(up>down && up>0){
            plusDM[i]=up;
        }

        if(down>up && down>0){
            minusDM[i]=down;
        }
    }

    let atr=0;
    let pDM=0;
    let mDM=0;

    for(let i=1;i<=period;i++){

        atr+=tr[i];
        pDM+=plusDM[i];
        mDM+=minusDM[i];
    }

    atr/=period;
    pDM/=period;
    mDM/=period;

    const dx=
        new Array(n).fill(null);

    for(let i=period;i<n;i++){

        if(i>period){

            atr=
                ((atr*(period-1))+tr[i])/
                period;

            pDM=
                ((pDM*(period-1))+plusDM[i])/
                period;

            mDM=
                ((mDM*(period-1))+minusDM[i])/
                period;
        }

        if(atr===0){
            continue;
        }

        const pDI=
            100*(pDM/atr);

        const mDI=
            100*(mDM/atr);

        const sum=pDI+mDI;

        if(sum===0){
            continue;
        }

        dx[i]=
            100*Math.abs(pDI-mDI)/sum;
    }

    let sumDX=0;
    let count=0;

    for(let i=period;i<n;i++){

        if(dx[i]!==null){

            sumDX+=dx[i];
            count++;
        }

        if(count===period){

            let adx=sumDX/period;

            result[i]=adx;

            for(let j=i+1;j<n;j++){

                if(dx[j]===null){
                    continue;
                }

                adx=
                    ((adx*(period-1))+dx[j])/
                    period;

                result[j]=adx;
            }

            break;
        }
    }

    return result;
}


/* =========================================================
   ИНДИКАТОРЫ
========================================================= */

function calculateIndicators(data){

    const closes=
        data.map(x=>x.close);

    const ema20=EMA(closes,20);
    const ema50=EMA(closes,50);
    const ema200=EMA(closes,200);

    const rsi=RSI(closes,14);

    const macd=MACD(closes);

    const adx=ADX(data,14);

    return {
        close:closes,
        ema20:ema20,
        ema50:ema50,
        ema200:ema200,
        rsi:rsi,
        macd:macd.macd,
        macdSignal:macd.signal,
        macdHist:macd.hist,
        adx:adx
    };
}


/* =========================================================
   РЕЖИМ РЫНКА
========================================================= */

function getRegime(ind,i){

    const e20=ind.ema20[i];
    const e50=ind.ema50[i];
    const e200=ind.ema200[i];
    const rsi=ind.rsi[i];
    const adx=ind.adx[i];

    if(
        e20===null ||
        e50===null ||
        e200===null ||
        rsi===null
    ){
        return "Не определён";
    }

    const strongTrend =
        adx!==null &&
        adx>=25;

    if(
        e20>e50 &&
        e50>e200 &&
        rsi>=52 &&
        strongTrend
    ){
        return "Сильный бычий";
    }

    if(
        e20>e50 &&
        ind.close[i]>e200
    ){
        return "Бычий";
    }

    if(
        e20<e50 &&
        e50<e200 &&
        rsi<=48 &&
        strongTrend
    ){
        return "Сильный медвежий";
    }

    if(
        e20<e50 &&
        ind.close[i]<e200
    ){
        return "Медвежий";
    }

    return "Боковик";
}


/* =========================================================
   СИГНАЛ
========================================================= */

function getSignal(ind,data,i){

    if(
        i<200 ||
        !ind.ema20[i] ||
        !ind.ema50[i] ||
        !ind.ema200[i] ||
        ind.rsi[i]===null
    ){
        return {
            signal:"Недостаточно данных",
            score:0
        };
    }

    let score=0;

    const price=ind.close[i];

    if(price>ind.ema20[i]){
        score++;
    }else{
        score--;
    }

    if(ind.ema20[i]>ind.ema50[i]){
        score++;
    }else{
        score--;
    }

    if(price>ind.ema200[i]){
        score++;
    }else{
        score--;
    }

    if(ind.macdHist[i]!==null){

        if(ind.macdHist[i]>0){
            score++;
        }else{
            score--;
        }
    }

    if(ind.rsi[i]>52){
        score++;
    }

    if(ind.rsi[i]<48){
        score--;
    }

    /*
       Объём выше среднего.
    */

    let volSum=0;
    let volCount=0;

    const from=
        Math.max(0,i-20);

    for(let j=from;j<i;j++){

        volSum+=data[j].volume;
        volCount++;
    }

    if(volCount>0){

        const avgVol=
            volSum/volCount;

        if(data[i].volume>avgVol){
            score++;
        }
    }

    let signal="НЕЙТРАЛЬНО";

    if(score>=4){
        signal="СИЛЬНАЯ ПОКУПКА";
    }else if(score>=2){
        signal="ПОКУПКА";
    }else if(score<=-4){
        signal="СИЛЬНАЯ ПРОДАЖА";
    }else if(score<=-2){
        signal="ПРОДАЖА";
    }

    return {
        signal:signal,
        score:score
    };
}


/* =========================================================
   ВОЗВРАТ ЗА ГОРИЗОНТ
========================================================= */

function directionalReturn(data,i,horizon){

    const entryIndex=i+1;
    const exitIndex=i+1+horizon;

    if(
        entryIndex>=data.length ||
        exitIndex>=data.length
    ){
        return null;
    }

    const entry=data[entryIndex].open;
    const exit=data[exitIndex].close;

    if(
        !Number.isFinite(entry) ||
        !Number.isFinite(exit) ||
        entry===0
    ){
        return null;
    }

    return ((exit-entry)/entry)*100;
}


/* =========================================================
   СТАТИСТИКА СИГНАЛОВ
========================================================= */

function signalStats(
    data,
    ind,
    horizon
){

    const results={
        buy:[],
        sell:[],
        neutral:[]
    };

    const maxI=
        data.length-horizon-2;

    for(
        let i=200;
        i<=maxI;
        i++
    ){

        const s=
            getSignal(ind,data,i);

        const r=
            directionalReturn(
                data,
                i,
                horizon
            );

        if(r===null){
            continue;
        }

        if(
            s.signal==="ПОКУПКА" ||
            s.signal==="СИЛЬНАЯ ПОКУПКА"
        ){
            results.buy.push(r);

        }else if(
            s.signal==="ПРОДАЖА" ||
            s.signal==="СИЛЬНАЯ ПРОДАЖА"
        ){
            results.sell.push(r);

        }else{
            results.neutral.push(r);
        }
    }

    return results;
}


function stats(arr){

    if(!Array.isArray(arr) || arr.length===0){

        return {
            n:0,
            win:0,
            avg:null,
            median:null
        };
    }

    let wins=0;

    let sum=0;

    for(const x of arr){

        if(x>0){
            wins++;
        }

        sum+=x;
    }

    const sorted=
        arr.slice().sort(
            (a,b)=>a-b
        );

    let median;

    const mid=
        Math.floor(sorted.length/2);

    if(sorted.length%2){
        median=sorted[mid];
    }else{
        median=
            (sorted[mid-1]+sorted[mid])/2;
    }

    return {
        n:arr.length,
        win:(wins/arr.length)*100,
        avg:sum/arr.length,
        median:median
    };
}


/* =========================================================
   РЕНДЕР ТЕКУЩЕГО СИГНАЛА
========================================================= */

function renderLive(

/* =========================================================
   ДИАГНОСТИКА ФАКТОРОВ
========================================================= */

function factorCondition(
    ind,
    data,
    i,
    factor
){

    const price=ind.close[i];

    switch(factor){

        case "EMA20 > EMA50":
            return (
                ind.ema20[i]!==null &&
                ind.ema50[i]!==null &&
                ind.ema20[i]>ind.ema50[i]
            );

        case "Цена > EMA200":
            return (
                ind.ema200[i]!==null &&
                price>ind.ema200[i]
            );

        case "MACD > 0":
            return (
                ind.macd[i]!==null &&
                ind.macd[i]>0
            );

        case "MACD Histogram > 0":
            return (
                ind.macdHist[i]!==null &&
                ind.macdHist[i]>0
            );

        case "RSI > 52":
            return (
                ind.rsi[i]!==null &&
                ind.rsi[i]>52
            );

        case "ADX > 25":
            return (
                ind.adx[i]!==null &&
                ind.adx[i]>25
            );

        default:
            return false;
    }
}


function renderRegimeDiagnostics(
    data,
    ind,
    interval
){

    const factors=[
        "EMA20 > EMA50",
        "Цена > EMA200",
        "MACD > 0",
        "MACD Histogram > 0",
        "RSI > 52",
        "ADX > 25"
    ];

    const horizons=
        HORIZONS[interval];

    /*
       Чтобы телефон не выполнял слишком много
       вычислений одновременно, берём максимум
       6000 последних точек для диагностики.
    */

    const start=
        Math.max(
            200,
            data.length-6000
        );

    let html=`

<div class="card">

<h2>Диагностика факторов</h2>

<p class="note">
Показывается вероятность положительного
результата после выполнения условия.
</p>

<table>

<thead>
<tr>
<th>Фактор</th>
`;

    for(const h of horizons){

        html+=`
<th>${formatHorizon(h,interval)}</th>
`;
    }

    html+=`
</tr>
</thead>

<tbody>
`;

    for(const factor of factors){

        html+=`
<tr>
<td>${factor}</td>
`;

        for(const h of horizons){

            let total=0;
            let wins=0;

            for(
                let i=start;
                i<=data.length-h-2;
                i++
            ){

                if(
                    !factorCondition(
                        ind,
                        data,
                        i,
                        factor
                    )
                ){
                    continue;
                }

                const r=
                    directionalReturn(
                        data,
                        i,
                        h
                    );

                if(r===null){
                    continue;
                }

                total++;

                if(r>0){
                    wins++;
                }
            }

            const rate=
                total>0
                    ?(wins/total)*100
                    :null;

            html+=`
<td>
${rate===null
    ?"—"
    :rate.toFixed(1)+"%"}
<br>
<span class="gray">
N=${total}
</span>
</td>
`;
        }

        html+=`
</tr>
`;
    }

    html+=`

</tbody>
</table>

</div>
`;

    contentEl.innerHTML+=html;
}


/* =========================================================
   ГЛАВНЫЙ ЗАПУСК
========================================================= */

async function runAnalysis(){

    runBtn.disabled=true;

    loaderEl.style.display="block";

    contentEl.innerHTML="";

    const interval=
        document.getElementById(
            "interval"
        ).value;

    try{

        setStatus(
            "JavaScript работает ✓. " +
            "Подготавливаем анализ "+interval+"..."
        );

        /*
           Даём браузеру отрисовать статус
           перед тяжёлой работой.
        */

        await new Promise(
            r=>setTimeout(r,50)
        );

        const data=
            await fetchHistory(interval);

        setStatus(
            "Получено "+
            data.length+
            " свечей. Рассчитываем индикаторы..."
        );

        await new Promise(
            r=>setTimeout(r,50)
        );

        const ind=
            calculateIndicators(data);

        /*
           Проверяем основные значения.
        */

        const last=
            data.length-1;

        if(
            ind.close[last]===null ||
            ind.ema200[last]===null
        ){
            throw new Error(
                "Не удалось рассчитать EMA200. " +
                "Получено свечей: "+data.length
            );
        }

        setStatus(
            "Индикаторы рассчитаны. " +
            "Строим сигнал..."
        );

        await new Promise(
            r=>setTimeout(r,50)
        );

        renderLive(
            data,
            ind,
            interval
        );

        renderBacktest(
            data,
            ind,
            interval
        );

        setStatus(
            "Анализ завершён ✓"
        );

        /*
           Диагностику запускаем после основного
           результата.
        */

        await new Promise(
            r=>setTimeout(r,50)
        );

        renderRegimeDiagnostics(
            data,
            ind,
            interval
        );

    }catch(error){

        console.error(error);

        contentEl.innerHTML=`

<div class="card">

<h2 class="red">
Ошибка анализа
</h2>

<p>
${String(
    error &&
    error.message
        ?error.message
        :error
)}
</p>

<p class="note">
Попробуйте ещё раз. Если ошибка повторяется,
пришлите мне её точный текст.
</p>

</div>
`;

        setStatus(
            "Ошибка: "+
            (
                error &&
                error.message
                    ?error.message
                    :String(error)
            )
        );

    }finally{

        loaderEl.style.display="none";

        runBtn.disabled=false;
    }
}


/* =========================================================
   КНОПКА
========================================================= */

runBtn.addEventListener(
    "click",
    runAnalysis
);


/* =========================================================
   СТАРТ
========================================================= */

setStatus(
    "JavaScript работает ✓. " +
    "Выберите таймфрейм и нажмите «Обновить анализ»."
);

</script>
