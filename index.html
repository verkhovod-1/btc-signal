<script>

const CONFIG={
  "15m":{interval:"15m",days:90,h:96},
  "1h":{interval:"1h",days:365,h:24},
  "4h":{interval:"4h",days:730,h:6},
  "1d":{interval:"1d",days:1825,h:1}
};

const FACTORS=[
  {id:"ema",name:"EMA20 > EMA50"},
  {id:"ema200",name:"Цена > EMA200"},
  {id:"macd",name:"MACD > 0"},
  {id:"hist",name:"MACD Histogram > 0"},
  {id:"rsi52",name:"RSI > 52"},
  {id:"rsi5265",name:"RSI 52–65"},
  {id:"adx",name:"ADX > 25"},
  {id:"volume",name:"Объём > среднего"}
];

function n(x){
  const v=Number(x);
  return Number.isFinite(v)?v:null;
}

function fmt(x,d=2){
  const v=n(x);
  return v===null?"—":v.toFixed(d);
}

function pct(x){
  const v=n(x);
  if(v===null)return "—";
  return (v>=0?"+":"")+v.toFixed(2)+"%";
}

function price(x){
  const v=n(x);
  return v===null?"—":v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function median(a){
  if(!a.length)return null;
  const b=[...a].sort((x,y)=>x-y);
  const m=Math.floor(b.length/2);
  return b.length%2?b[m]:(b[m-1]+b[m])/2;
}

function avg(a){
  if(!a.length)return null;
  return a.reduce((s,x)=>s+x,0)/a.length;
}

function reliability(N){
  if(N<50)return "Слабая";
  if(N<100)return "Осторожно";
  if(N<300)return "Нормальная";
  if(N<1000)return "Хорошая";
  return "Очень хорошая";
}

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

async function fetchHistory(interval,days){

  const end=Date.now();
  const start=end-days*86400000;

  let out=[];
  let cursor=start;

  for(let page=0;page<15;page++){

    const url=
      "https://api.binance.com/api/v3/klines"+
      "?symbol=BTCUSDT"+
      "&interval="+interval+
      "&startTime="+cursor+
      "&endTime="+end+
      "&limit=1000";

    let data=null;
    let lastError=null;

    for(let attempt=0;attempt<3;attempt++){

      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),20000);

      try{
        const r=await fetch(url,{
          cache:"no-store",
          signal:controller.signal
        });

        clearTimeout(timer);

        if(!r.ok)throw new Error("HTTP "+r.status);

        data=await r.json();
        break;

      }catch(e){
        clearTimeout(timer);
        lastError=e;
        await new Promise(r=>setTimeout(r,1000*(attempt+1)));
      }
    }

    if(!data){
      throw lastError||new Error("Не удалось получить данные Binance");
    }

    if(!data.length)break;

    out.push(...data);

    if(data.length<1000)break;

    const lastTime=data[data.length-1][0];

    if(lastTime<=cursor)break;

    cursor=lastTime+1;

    if(cursor>=end)break;
  }

  const map=new Map();

  for(const k of out){
    map.set(k[0],{
      time:k[0],
      open:+k[1],
      high:+k[2],
      low:+k[3],
      close:+k[4],
      volume:+k[5]
    });
  }

  const arr=[...map.values()].sort((a,b)=>a.time-b.time);

  // Используем только закрытые свечи
  const intervalMs={
    "15m":900000,
    "1h":3600000,
    "4h":14400000,
    "1d":86400000
  }[interval];

  const now=Date.now();

  return arr.filter(x=>x.time+intervalMs<=now);
}

function ema(values,period){
  const out=new Array(values.length).fill(null);
  if(values.length<period)return out;

  let sum=0;

  for(let i=0;i<period;i++)sum+=values[i];

  let prev=sum/period;
  out[period-1]=prev;

  const k=2/(period+1);

  for(let i=period;i<values.length;i++){
    prev=values[i]*k+prev*(1-k);
    out[i]=prev;
  }

  return out;
}

function rsi(values,period=14){

  const out=new Array(values.length).fill(null);

  if(values.length<=period)return out;

  let gains=0;
  let losses=0;

  for(let i=1;i<=period;i++){
    const d=values[i]-values[i-1];
    if(d>=0)gains+=d;
    else losses-=d;
  }

  let avgGain=gains/period;
  let avgLoss=losses/period;

  out[period]=
    avgLoss===0?100:
    100-(100/(1+avgGain/avgLoss));

  for(let i=period+1;i<values.length;i++){

    const d=values[i]-values[i-1];
    const gain=Math.max(d,0);
    const loss=Math.max(-d,0);

    avgGain=(avgGain*(period-1)+gain)/period;
    avgLoss=(avgLoss*(period-1)+loss)/period;

    out[i]=
      avgLoss===0?100:
      100-(100/(1+avgGain/avgLoss));
  }

  return out;
}

function macd(values){

  const e12=ema(values,12);
  const e26=ema(values,26);

  const line=new Array(values.length).fill(null);

  for(let i=0;i<values.length;i++){
    if(e12[i]!==null&&e26[i]!==null)
      line[i]=e12[i]-e26[i];
  }

  const valid=[];
  const idx=[];

  for(let i=0;i<line.length;i++){
    if(line[i]!==null){
      valid.push(line[i]);
      idx.push(i);
    }
  }

  const sigValid=ema(valid,9);
  const signal=new Array(values.length).fill(null);
  const hist=new Array(values.length).fill(null);

  for(let j=0;j<idx.length;j++){
    const i=idx[j];

    if(sigValid[j]!==null){
      signal[i]=sigValid[j];
      hist[i]=line[i]-signal[i];
    }
  }

  return {line,signal,hist};
}

function adx(high,low,close,period=14){

  const len=close.length;
  const tr=new Array(len).fill(null);
  const plusDM=new Array(len).fill(null);
  const minusDM=new Array(len).fill(null);

  for(let i=1;i<len;i++){

    const up=high[i]-high[i-1];
    const down=low[i-1]-low[i];

    plusDM[i]=(up>down&&up>0)?up:0;
    minusDM[i]=(down>up&&down>0)?down:0;

    tr[i]=Math.max(
      high[i]-low[i],
      Math.abs(high[i]-close[i-1]),
      Math.abs(low[i]-close[i-1])
    );
  }

  const out=new Array(len).fill(null);

  if(len<period*2+1)return out;

  let atr=0,pdm=0,mdm=0;

  for(let i=1;i<=period;i++){
    atr+=tr[i]||0;
    pdm+=plusDM[i]||0;
    mdm+=minusDM[i]||0;
  }

  let dxs=[];

  for(let i=period;i<len;i++){

    if(i>period){
      atr=atr-(atr/period)+(tr[i]||0);
      pdm=pdm-(pdm/period)+(plusDM[i]||0);
      mdm=mdm-(mdm/period)+(minusDM[i]||0);
    }

    const pdi=atr?(100*pdm/atr):0;
    const mdi=atr?(100*mdm/atr):0;

    const dx=(pdi+mdi)===0?0:
      100*Math.abs(pdi-mdi)/(pdi+mdi);

    dxs.push(dx);

    if(dxs.length>=period){

      if(dxs.length===period){
        out[i]=avg(dxs);
      }else{
        out[i]=((out[i-1]*(period-1))+dx)/period;
      }
    }
  }

  return out;
}

function indicators(data){

  const close=data.map(x=>x.close);
  const high=data.map(x=>x.high);
  const low=data.map(x=>x.low);

  const e20=ema(close,20);
  const e50=ema(close,50);
  const e200=ema(close,200);
  const rs=rsi(close,14);
  const mc=macd(close);
  const ax=adx(high,low,close,14);

  const volumeAvg=new Array(data.length).fill(null);

  let sum=0;
  const vp=20;

  for(let i=0;i<data.length;i++){

    sum+=data[i].volume;

    if(i>=vp)sum-=data[i-vp].volume;

    if(i>=vp-1)
      volumeAvg[i]=sum/vp;
  }

  return {
    e20,e50,e200,
    rsi:rs,
    macd:mc.line,
    macdHist:mc.hist,
    adx:ax,
    volumeAvg
  };
}

function regime(ind,i){

  const e20=ind.e20[i];
  const e50=ind.e50[i];
  const e200=ind.e200[i];
  const r=ind.rsi[i];
  const a=ind.adx[i];
  const m=ind.macd[i];

  if(
    e20===null||e50===null||
    e200===null||r===null||
    a===null||m===null
  )return "Неизвестно";

  let score=0;

  if(e20>e50)score++;
  if(dataGlobal[i].close>e200)score++;
  if(m>0)score++;
  if(r>52)score++;
  if(a>25)score++;

  if(score>=5)return "Сильный бычий";
  if(score>=3)return "Бычий";
  if(score===2)return "Боковик";
  if(score===1)return "Медвежий";
  return "Сильный медвежий";
}

function factorState(ind,i){

  const x=dataGlobal[i];

  return {
    ema:ind.e20[i]!==null&&ind.e50[i]!==null&&ind.e20[i]>ind.e50[i],
    ema200:ind.e200[i]!==null&&x.close>ind.e200[i],
    macd:ind.macd[i]!==null&&ind.macd[i]>0,
    hist:ind.macdHist[i]!==null&&ind.macdHist[i]>0,
    rsi52:ind.rsi[i]!==null&&ind.rsi[i]>52,
    rsi5265:ind.rsi[i]!==null&&ind.rsi[i]>=52&&ind.rsi[i]<=65,
    adx:ind.adx[i]!==null&&ind.adx[i]>25,
    volume:ind.volumeAvg[i]!==null&&x.volume>ind.volumeAvg[i]
  };
}

function futureReturn(data,i,h){

  if(i+1+h>=data.length)return null;

  const entry=data[i+1].open;
  const exit=data[i+1+h].close;

  if(!Number.isFinite(entry)||!Number.isFinite(exit)||entry<=0)
    return null;

  return (exit/entry-1)*100;
}

function statsForIndices(data,indices,h){

  const returns=[];

  for(const i of indices){

    const r=futureReturn(data,i,h);

    if(r!==null&&Number.isFinite(r))
      returns.push(r);
  }

  if(!returns.length){
    return {
      N:0,
      win:null,
      avg:null,
      median:null,
      plus1:null,
      minus1:null
    };
  }

  return {
    N:returns.length,
    win:100*returns.filter(x=>x>0).length/returns.length,
    avg:avg(returns),
    median:median(returns),
    plus1:100*returns.filter(x=>x>1).length/returns.length,
    minus1:100*returns.filter(x=>x<-1).length/returns.length
  };
}

function baselineStats(data,h,start,end){

  const indices=[];

  for(let i=start;i<end-h-1;i++)
    indices.push(i);

  return statsForIndices(data,indices,h);
}

function combinationStats(data,ind,h,combo,start,end){

  const indices=[];

  for(let i=Math.max(200,start);i<end-h-1;i++){

    const f=factorState(ind,i);

    if(combo.every(x=>f[x]))
      indices.push(i);
  }

  return statsForIndices(data,indices,h);
}

function scoreCombination(s,baseline){

  if(!s||s.N<50||!baseline)return -999;

  const edgeAvg=s.avg-baseline.avg;
  const edgeMedian=s.median-baseline.median;
  const edgeWin=s.win-baseline.win;

  // Умеренное ранжирование:
  // доходность важнее процента выигрышных,
  // но N тоже существенно влияет.
  let score=50;

  score+=edgeAvg*25;
  score+=edgeMedian*15;
  score+=edgeWin*0.25;

  const reliability=Math.min(1,s.N/300);
  score*=0.65+0.35*reliability;

  return score;
}

function comboName(combo){
  return combo.map(id=>{
    const x=FACTORS.find(f=>f.id===id);
    return x?x.name:id;
  }).join(" + ");
}

function combinations(arr,size){

  const result=[];

  function rec(start,current){

    if(current.length===size){
      result.push([...current]);
      return;
    }

    for(let i=start;i<arr.length;i++){
      current.push(arr[i]);
      rec(i+1,current);
      current.pop();
    }
  }

  rec(0,[]);

  return result;
}

function findBestCombos(data,ind,h,start,end,baseline){

  const all=[];

  for(let size=2;size<=4;size++){

    const combos=combinations(
      FACTORS.map(x=>x.id),
      size
    );

    for(const combo of combos){

      const s=combinationStats(
        data,ind,h,combo,start,end
      );

      if(s.N<50)continue;

      const score=scoreCombination(s,baseline);

      all.push({
        combo,
        size,
        ...s,
        score
      });
    }
  }

  all.sort((a,b)=>b.score-a.score);

  return all;
}

function currentFactors(ind,i){

  const f=factorState(ind,i);

  return FACTORS.filter(x=>f[x.id]);
}

function currentComboStats(data,ind,h,combo){

  if(!combo.length)return null;

  return combinationStats(
    data,
    ind,
    h,
    combo.map(x=>x.id),
    0,
    data.length
  );
}

function statTableRow(name,s){

  return `
  <tr>
    <td>${escapeHtml(name)}</td>
    <td>${s.N}</td>
    <td>${pct(s.win-100)}</td>
    <td>${pct(s.avg)}</td>
    <td>${pct(s.median)}</td>
    <td>${pct(s.plus1)}</td>
    <td>${pct(s.minus1)}</td>
  </tr>`;
}

function renderBasic(data,ind,h){

  const i=data.length-1;

  const current={
    price:data[i].close,
    rsi:ind.rsi[i],
    adx:ind.adx[i],
    e20:ind.e20[i],
    e50:ind.e50[i],
    e200:ind.e200[i],
    macd:ind.macd[i],
    hist:ind.macdHist[i]
  };

  const regimeNow=regime(ind,i);

  let regimeScore=0;

  if(current.e20>current.e50)regimeScore++;
  if(current.price>current.e200)regimeScore++;
  if(current.macd>0)regimeScore++;
  if(current.rsi>52)regimeScore++;
  if(current.adx>25)regimeScore++;

  const signal=
    regimeScore>=4?"СИЛЬНАЯ ПОКУПКА":
    regimeScore>=3?"ПОКУПКА":
    regimeScore===2?"НЕЙТРАЛЬНО":
    regimeScore===1?"ПРОДАЖА":
    "СИЛЬНАЯ ПРОДАЖА";

  return `
  <div class="card">
    <h2>📈 Текущий рынок</h2>

    <div class="grid">

      <div class="stat">
        <div class="label">BTC</div>
        <div class="value">${price(current.price)}</div>
      </div>

      <div class="stat">
        <div class="label">RSI</div>
        <div class="value">${fmt(current.rsi)}</div>
      </div>

      <div class="stat">
        <div class="label">ADX</div>
        <div class="value">${fmt(current.adx)}</div>
      </div>

      <div class="stat">
        <div class="label">Режим</div>
        <div class="value">${regimeNow}</div>
      </div>

      <div class="stat">
        <div class="label">EMA20</div>
        <div class="value">${price(current.e20)}</div>
      </div>

      <div class="stat">
        <div class="label">EMA50</div>
        <div class="value">${price(current.e50)}</div>
      </div>

      <div class="stat">
        <div class="label">EMA200</div>
        <div class="value">${price(current.e200)}</div>
      </div>

      <div class="stat">
        <div class="label">MACD</div>
        <div class="value">${fmt(current.macd)}</div>
      </div>

      <div class="stat">
        <div class="label">MACD Histogram</div>
        <div class="value">${fmt(current.hist)}</div>
      </div>

    </div>

    <hr>

    <div class="label">Базовый сигнал</div>
    <div class="signal">${signal}</div>

    <div class="progress">
      <div style="width:${regimeScore*20}%"></div>
    </div>

    <div class="small">
      Сработало факторов: ${regimeScore}/5
    </div>
  </div>`;
}

function renderFactors(data,ind,h){

  const rows=[];

  const end=data.length-h-2;

  for(const factor of FACTORS){

    const indices=[];

    for(let i=200;i<end;i++){

      const f=factorState(ind,i);

      if(f[factor.id])indices.push(i);
    }

    const s=statsForIndices(data,indices,h);

    rows.push(statTableRow(factor.name,s));
  }

  return `
  <div class="card">
    <h2>📊 Факторы · 24 часа</h2>

    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Условие</th>
          <th>N</th>
          <th>Рост</th>
          <th>Средн.</th>
          <th>Медиана</th>
          <th>>+1%</th>
          <th><−1%</th>
        </tr>
      </thead>
      <tbody>
        ${rows.join("")}
      </tbody>
    </table>
    </div>
  </div>`;
}

function renderRegimes(data,ind,h){

  const names=[
    "Сильный бычий",
    "Бычий",
    "Боковик",
    "Медвежий",
    "Сильный медвежий"
  ];

  const end=data.length-h-2;

  const rows=[];

  for(const name of names){

    const indices=[];

    for(let i=200;i<end;i++){

      if(regime(ind,i)===name)
        indices.push(i);
    }

    const s=statsForIndices(data,indices,h);

    rows.push(statTableRow(name,s));
  }

  return `
  <div class="card">
    <h2>📚 История режимов · 24 часа</h2>

    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Режим</th>
          <th>N</th>
          <th>Рост</th>
          <th>Средн.</th>
          <th>Медиана</th>
          <th>>+1%</th>
          <th><−1%</th>
        </tr>
      </thead>
      <tbody>${rows.join("")}</tbody>
    </table>
    </div>
  </div>`;
}

function renderSearch(data,ind,h,baseline){

  const split=Math.floor(data.length*0.7);

  const combos=findBestCombos(
    data,
    ind,
    h,
    200,
    split,
    baseline
  );

  const top=combos.slice(0,10);

  const rows=top.map(x=>{

    const edge=x.avg-baseline.avg;

    return `
    <tr>
      <td>${escapeHtml(comboName(x.combo))}</td>
      <td>${x.N}</td>
      <td>${pct(x.win)}</td>
      <td>${pct(x.avg)}</td>
      <td>${pct(x.median)}</td>
      <td>${pct(edge)}</td>
      <td>${fmt(x.score)}</td>
    </tr>`;
  });

  return `
  <div class="card">
    <h2>🔥 Автопоиск лучших комбинаций</h2>

    <div class="small">
      Перебраны комбинации из 2–4 факторов.
      Минимум N=50. Поиск выполнен на первых 70% истории.
    </div>

    <div style="overflow-x:auto;margin-top:10px">
    <table>
      <thead>
        <tr>
          <th>Комбинация</th>
          <th>N</th>
          <th>Рост</th>
          <th>Средн.</th>
          <th>Медиана</th>
          <th>Преимущество</th>
          <th>Рейтинг</th>
        </tr>
      </thead>
      <tbody>
        ${rows.length?rows.join(""):
        `<tr><td colspan="7">Недостаточно статистики</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>`;
}

function renderValidation(data,ind,h,baseline){

  const split=Math.floor(data.length*0.7);

  const train=findBestCombos(
    data,
    ind,
    h,
    200,
    split,
    baseline
  );

  const best=train[0];

  if(!best){

    return `
    <div class="card">
      <h2>🧪 Проверка устойчивости</h2>
      <div class="warn">Недостаточно данных для проверки.</div>
    </div>`;
  }

  const test=combinationStats(
    data,
    ind,
    h,
    best.combo,
    split,
    data.length
  );

  const trainAvg=best.avg;
  const testAvg=test.avg;

  const stable=
    trainAvg!==null&&
    testAvg!==null&&
    trainAvg>0&&
    testAvg>0;

  return `
  <div class="card">
    <h2>🧪 Проверка 70/30</h2>

    <div class="small">
      Лучшая комбинация сначала ищется на 70% истории,
      затем проверяется на последних 30%.
    </div>

    <h3>${escapeHtml(comboName(best.combo))}</h3>

    <div class="grid">

      <div class="stat">
        <div class="label">Обучение N</div>
        <div class="value">${best.N}</div>
      </div>

      <div class="stat">
        <div class="label">Обучение средн.</div>
        <div class="value">${pct(trainAvg)}</div>
      </div>

      <div class="stat">
        <div class="label">Проверка N</div>
        <div class="value">${test.N}</div>
      </div>

      <div class="stat">
        <div class="label">Проверка средн.</div>
        <div class="value">${pct(testAvg)}</div>
      </div>

      <div class="stat">
        <div class="label">Проверка медиана</div>
        <div class="value">${pct(test.median)}</div>
      </div>

      <div class="stat">
        <div class="label">Статус</div>
        <div class="value ${stable?"good":"warn"}">
          ${stable?"УСТОЙЧИВО":"НЕ ПОДТВЕРЖДЕНО"}
        </div>
      </div>

    </div>

    <div class="small" style="margin-top:10px">
      Важно: 70/30 — диагностическая проверка,
      а не гарантия будущей доходности.
    </div>
  </div>`;
}

function renderCurrentCombination(data,ind,h){

  const i=data.length-1;

  const active=currentFactors(ind,i);

  if(active.length<2){

    return `
    <div class="card">
      <h2>🎯 Текущая комбинация</h2>
      <div class="warn">
        Сейчас недостаточно активных факторов для статистической комбинации.
      </div>
    </div>`;
  }

  const bestCombos=[];

  for(let size=2;size<=Math.min(4,active.length);size++){

    const combos=combinations(
      active.map(x=>x.id),
      size
    );

    for(const combo of combos){

      const s=combinationStats(
        data,
        ind,
        h,
        combo,
        200,
        data.length
      );

      if(s.N>=50){

        bestCombos.push({
          combo,
          ...s
        });
      }
    }
  }

  bestCombos.sort((a,b)=>
    (b.avg??-999)-(a.avg??-999)
  );

  const top=bestCombos.slice(0,5);

  return `
  <div class="card">
    <h2>🎯 Что работает при текущем состоянии</h2>

    <div class="small">
      Сейчас активны:
      ${active.map(x=>escapeHtml(x.name)).join(" · ")}
    </div>

    <hr>

    ${
      top.length?
      `<div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Комбинация</th>
            <th>N</th>
            <th>Рост</th>
            <th>Средн.</th>
            <th>Медиана</th>
          </tr>
        </thead>
        <tbody>
          ${top.map(x=>`
          <tr>
            <td>${escapeHtml(comboName(x.combo))}</td>
            <td>${x.N}</td>
            <td>${pct(x.win)}</td>
            <td>${pct(x.avg)}</td>
            <td>${pct(x.median)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>`
      :
      `<div class="warn">
        Для текущего сочетания факторов пока недостаточно исторических случаев N≥50.
      </div>`
    }
  </div>`;
}

function renderStatSignal(data,ind,h,baseline){

  const i=data.length-1;

  const reg=regime(ind,i);

  const regimeIndices=[];

  for(let j=200;j<data.length-h-2;j++){

    if(regime(ind,j)===reg)
      regimeIndices.push(j);
  }

  const rs=statsForIndices(
    data,
    regimeIndices,
    h
  );

  const active=currentFactors(ind,i);

  let comboBest=null;

  for(let size=2;size<=Math.min(4,active.length);size++){

    const combos=combinations(
      active.map(x=>x.id),
      size
    );

    for(const combo of combos){

      const s=combinationStats(
        data,
        ind,
        h,
        combo,
        200,
        data.length
      );

      if(s.N<50)continue;

      if(
        !comboBest||
        (s.avg??-999)>(comboBest.avg??-999)
      ){
        comboBest={combo,...s};
      }
    }
  }

  let score=50;

  if(baseline.avg!==null&&rs.avg!==null)
    score+=(rs.avg-baseline.avg)*25;

  if(baseline.median!==null&&rs.median!==null)
    score+=(rs.median-baseline.median)*15;

  if(comboBest){

    if(comboBest.avg!==null&&baseline.avg!==null)
      score+=(comboBest.avg-baseline.avg)*15;

    if(comboBest.win!==null&&baseline.win!==null)
      score+=(comboBest.win-baseline.win)*0.15;
  }

  score=Math.max(0,Math.min(100,score));

  const evaluation=
    score>=75?"Сильный сигнал":
    score>=65?"Умеренно бычий":
    score>=55?"Нейтрально / осторожно":
    score>=45?"Нейтрально":
    score>=35?"Умеренно медвежий":
    "Слабый сигнал";

  return `
  <div class="card">
    <h2>📊 Статистический сигнал · 24 часа</h2>

    <div class="grid">

      <div class="stat">
        <div class="label">Оценка</div>
        <div class="signal">${fmt(score,0)}/100</div>
      </div>

      <div class="stat">
        <div class="label">Интерпретация</div>
        <div class="value">${evaluation}</div>
      </div>

      <div class="stat">
        <div class="label">Режим</div>
        <div class="value">${reg}</div>
      </div>

      <div class="stat">
        <div class="label">Исторический N</div>
        <div class="value">${rs.N}</div>
      </div>

      <div class="stat">
        <div class="label">Исторический рост</div>
        <div class="value">${pct(rs.avg)}</div>
      </div>

      <div class="stat">
        <div class="label">Медиана</div>
        <div class="value">${pct(rs.median)}</div>
      </div>

      <div class="stat">
        <div class="label">База BTC</div>
        <div class="value">${pct(baseline.avg)}</div>
      </div>

      <div class="stat">
        <div class="label">Преимущество режима</div>
        <div class="value">${pct(
          rs.avg!==null&&baseline.avg!==null
          ?rs.avg-baseline.avg:null
        )}</div>
      </div>

    </div>

    <div class="small" style="margin-top:10px">
      Оценка 0–100 — это рейтинговый показатель силы сигнала,
      а не вероятность роста BTC.
    </div>
  </div>`;
}

function renderBaseline(baseline){

  return `
  <div class="card">
    <h2>⚖️ Базовая доходность BTC · 24 часа</h2>

    <div class="grid">

      <div class="stat">
        <div class="label">N</div>
        <div class="value">${baseline.N}</div>
      </div>

      <div class="stat">
        <div class="label">Рост</div>
        <div class="value">${pct(baseline.win)}</div>
      </div>

      <div class="stat">
        <div class="label">Средняя</div>
        <div class="value">${pct(baseline.avg)}</div>
      </div>

      <div class="stat">
        <div class="label">Медиана</div>
        <div class="value">${pct(baseline.median)}</div>
      </div>

      <div class="stat">
        <div class="label">> +1%</div>
        <div class="value">${pct(baseline.plus1)}</div>

        <div class="label">< −1%</div>
        <div class="value">${pct(baseline.minus1)}</div>
      </div>

    </div>

    <div class="small">
      Это контрольная группа: результат обычного 24-часового движения BTC
      без фильтров индикаторов.
    </div>
  </div>`;
}

async function run(){

  const tf=document.getElementById("tf").value;
  const cfg=CONFIG[tf];

  const status=document.getElementById("status");

  status.innerHTML=
    "⏳ Загружаю историю Binance...";

  document.getElementById("app").innerHTML="";

  try{

    const data=await fetchHistory(
      cfg.interval,
      cfg.days
    );

    if(data.length<300)
      throw new Error(
        "Недостаточно исторических данных: "+data.length
      );

    dataGlobal=data;

    status.innerHTML=
      `✓ Загружено ${data.length} закрытых свечей. Расчёт статистики...`;

    const ind=indicators(data);

    const h=cfg.h;

    const baseline=baselineStats(
      data,
      h,
      200,
      data.length
    );

    const html=
      renderBasic(data,ind,h)+
      renderStatSignal(data,ind,h,baseline)+
      renderBaseline(baseline)+
      renderFactors(data,ind,h)+
      renderRegimes(data,ind,h)+
      renderCurrentCombination(data,ind,h)+
      renderSearch(data,ind,h,baseline)+
      renderValidation(data,ind,h,baseline);

    document.getElementById("app").innerHTML=html;

    status.innerHTML=
      `Анализ завершён ✓ ${data.length} свечей · горизонт 24ч · v2.6`;

  }catch(e){

    console.error(e);

    status.innerHTML=
      `<span class="bad">Ошибка: ${escapeHtml(e.message||String(e))}</span>`;
  }
}

let dataGlobal=[];
