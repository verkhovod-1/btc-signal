<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11161c">
<title>BTC Signal 2.2</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#11161c;
  color:#eee;
  font-family:Arial,sans-serif;
}
.container{
  max-width:700px;
  margin:auto;
  padding:16px;
}
h1{margin:5px 0 3px}
h2{margin-top:0}
.card{
  background:#20262d;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
}
.price{
  font-size:30px;
  font-weight:bold;
}
select,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  font-size:16px;
}
button{
  background:#238636;
  color:white;
  font-weight:bold;
}
button:disabled{
  opacity:.5;
}
.signal{
  font-size:30px;
  font-weight:bold;
  text-align:center;
  padding:15px;
  border-radius:14px;
  margin:10px 0;
}
.buy{background:#123d25;color:#4cff91}
.sell{background:#491c1c;color:#ff6565}
.hold{background:#3d3a18;color:#ffe66d}
.metric{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #30363d;
}
.small{
  color:#9da7b3;
  font-size:13px;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin:8px 0 14px;
}
.progress div{
  height:100%;
  background:#3fb950;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}
th,td{
  padding:9px 5px;
  border-bottom:1px solid #30363d;
  text-align:center;
}
th{color:#aaa}
.good{color:#4cff91}
.bad{color:#ff6565}
.neutral{color:#ffe66d}
</style>
</head>

<body>

<div class="container">

<h1>₿ BTC Signal</h1>
<div class="small">Версия 2.2 · анализ силы сигнала</div>

<div class="card">
  <div class="small">BTC / USDT</div>
  <div id="price" class="price">Загрузка...</div>

  <select id="tf">
    <option value="15m">15 минут</option>
    <option value="1h" selected>1 час</option>
    <option value="4h">4 часа</option>
    <option value="1d">1 день</option>
  </select>

  <button id="refresh">🔄 Обновить сигнал</button>
</div>

<div class="card">

<h2>Сигнал</h2>

<div id="signal" class="signal hold">
  Загрузка...
</div>

<div class="metric">
  <span>Score</span>
  <b id="score">—</b>
</div>

<div class="metric">
  <span>RSI</span>
  <b id="rsi">—</b>
</div>

<div class="metric">
  <span>MACD</span>
  <b id="macd">—</b>
</div>

<div class="metric">
  <span>EMA 20</span>
  <b id="ema20">—</b>
</div>

<div class="metric">
  <span>EMA 50</span>
  <b id="ema50">—</b>
</div>

<div class="metric">
  <span>EMA 200</span>
  <b id="ema200">—</b>
</div>

<div class="metric">
  <span>Объём / средний</span>
  <b id="volume">—</b>
</div>

<div id="reasons" class="small" style="margin-top:12px"></div>

</div>

<div class="card">

<h2>📊 Исторический тест</h2>

<div class="small">
Тестируется последний 1 год. Сигнал формируется на закрытии свечи,
вход — на открытии следующей свечи.
</div>

<button id="backtest">📊 Тестировать 1 год</button>

<div id="status" class="small" style="margin-top:12px"></div>

<div id="results"></div>

</div>

</div>

<script>

const API="https://api.binance.com/api/v3";

const $=id=>document.getElementById(id);

let currentData=null;


/* =========================
   МАТЕМАТИКА
========================= */

function ema(values,period){
  if(values.length<period)return null;

  let k=2/(period+1);
  let e=values.slice(0,period)
    .reduce((a,b)=>a+b,0)/period;

  for(let i=period;i<values.length;i++){
    e=values[i]*k+e*(1-k);
  }

  return e;
}

function rsi(values,period=14){
  if(values.length<period+1)return null;

  let gain=0,loss=0;

  for(let i=1;i<=period;i++){
    let d=values[i]-values[i-1];
    if(d>0)gain+=d;
    else loss-=d;
  }

  gain/=period;
  loss/=period;

  for(let i=period+1;i<values.length;i++){
    let d=values[i]-values[i-1];

    let g=d>0?d:0;
    let l=d<0?-d:0;

    gain=(gain*(period-1)+g)/period;
    loss=(loss*(period-1)+l)/period;
  }

  if(loss===0)return 100;

  let rs=gain/loss;

  return 100-(100/(1+rs));
}

function macd(values){
  if(values.length<35)return null;

  let e12=ema(values,12);
  let e26=ema(values,26);

  if(e12===null||e26===null)return null;

  let line=e12-e26;

  return line;
}

function indicators(candles){

  let closes=candles.map(x=>x.close);
  let vols=candles.map(x=>x.volume);

  let e20=ema(closes,20);
  let e50=ema(closes,50);
  let e200=ema(closes,200);
  let r=rsi(closes,14);

  let m=macd(closes);

  let avgVol=vols.slice(-20)
    .reduce((a,b)=>a+b,0)/20;

  let vr=avgVol?vols[vols.length-1]/avgVol:1;

  return{
    close:closes.at(-1),
    ema20:e20,
    ema50:e50,
    ema200:e200,
    rsi:r,
    macd:m,
    volumeRatio:vr
  };
}


/* =========================
   SCORE
========================= */

function calculateScore(ind){

  let bull=0;
  let bear=0;
  let reasons=[];

  if(ind.ema20>ind.ema50){
    bull+=20;
    reasons.push("EMA20 выше EMA50");
  }else{
    bear+=20;
    reasons.push("EMA20 ниже EMA50");
  }

  if(ind.close>ind.ema200){
    bull+=20;
    reasons.push("цена выше EMA200");
  }else{
    bear+=20;
    reasons.push("цена ниже EMA200");
  }

  if(ind.rsi>=52 && ind.rsi<=68){
    bull+=20;
    reasons.push("RSI поддерживает рост");
  }
  else if(ind.rsi>75){
    bear+=10;
    reasons.push("RSI перегрет");
  }
  else if(ind.rsi<30){
    bull+=10;
    reasons.push("RSI перепродан");
  }
  else if(ind.rsi<45){
    bear+=15;
    reasons.push("RSI слабый");
  }
  else{
    bull+=10;
    bear+=10;
  }

  if(ind.macd>0){
    bull+=20;
    reasons.push("MACD положительный");
  }else{
    bear+=20;
    reasons.push("MACD отрицательный");
  }

  if(ind.volumeRatio>=1.25){

    if(ind.close>ind.ema20){
      bull+=20;
      reasons.push("сильный объём на росте");
    }else{
      bear+=20;
      reasons.push("сильный объём на снижении");
    }

  }else{
    bull+=10;
    bear+=10;
  }

  let score=Math.round(50+(bull-bear)/2);

  score=Math.max(0,Math.min(100,score));

  let signal=
    score>=70?"BUY":
    score<=30?"SELL":
    "HOLD";

  return{
    score,
    signal,
    bull,
    bear,
    reasons
  };
}


/* =========================
   LIVE
========================= */

async function loadLive(){

  try{

    let tf=$("tf").value;

    let response=await fetch(
      `${API}/klines?symbol=BTCUSDT&interval=${tf}&limit=250`
    );

    let raw=await response.json();

    let candles=raw.map(x=>({
      open:+x[1],
      high:+x[2],
      low:+x[3],
      close:+x[4],
      volume:+x[5],
      time:x[0]
    }));

    let ind=indicators(candles);
    let sc=calculateScore(ind);

    currentData={ind,sc};

    $("price").textContent=
      "$"+ind.close.toLocaleString(
        "en-US",
        {maximumFractionDigits:2}
      );

    $("score").textContent=sc.score;

    $("rsi").textContent=ind.rsi.toFixed(1);

    $("macd").textContent=ind.macd.toFixed(2);

    $("ema20").textContent=
      ind.ema20.toFixed(2);

    $("ema50").textContent=
      ind.ema50.toFixed(2);

    $("ema200").textContent=
      ind.ema200.toFixed(2);

    $("volume").textContent=
      ind.volumeRatio.toFixed(2)+"×";

    let s=$("signal");

    s.textContent=
      sc.signal==="BUY"?"🟢 BUY":
      sc.signal==="SELL"?"🔴 SELL":
      "🟡 HOLD";

    s.className=
      "signal "+
      (sc.signal==="BUY"?"buy":
       sc.signal==="SELL"?"sell":"hold");

    $("reasons").innerHTML=
      "<b>Причины:</b><br>"+
      sc.reasons.join(" · ");

  }catch(e){

    $("price").textContent="Ошибка";

    console.error(e);

  }

}

$("refresh").onclick=loadLive;

$("tf").onchange=loadLive;

loadLive();


/* =========================
   ИСТОРИЯ BINANCE
========================= */

async function getHistory(interval){

  const end=Date.now();

  const start=
    end-365*24*60*60*1000;

  let all=[];
  let cursor=start;

  while(cursor<end){

    let url=
      `${API}/klines?symbol=BTCUSDT`+
      `&interval=${interval}`+
      `&startTime=${cursor}`+
      `&endTime=${end}`+
      `&limit=1000`;

    let response=await fetch(url);

    if(!response.ok){
      throw new Error("Binance API: "+response.status);
    }

    let data=await response.json();

    if(!data.length)break;

    for(let x of data){

      all.push({
        open:+x[1],
        high:+x[2],
        low:+x[3],
        close:+x[4],
        volume:+x[5],
        time:x[0]
      });

    }

    cursor=data[data.length-1][0]+1;

    $("status").textContent=
      "Загружено свечей: "+all.length;

    await new Promise(r=>setTimeout(r,150));

    if(data.length<1000)break;
  }

  return all;
}


/* =========================
   SCORE ДИАПАЗОНЫ
========================= */

function scoreGroup(score,side){

  if(side==="BUY"){

    if(score>=90)return "90–100";
    if(score>=85)return "85–90";
    if(score>=80)return "80–85";
    if(score>=75)return "75–80";
    return "70–75";

  }else{

    if(score<=10)return "0–10";
    if(score<=15)return "10–15";
    if(score<=20)return "15–20";
    if(score<=25)return "20–25";
    return "25–30";

  }
}


/* =========================
   BACKTEST
========================= */

function runBacktest(candles,tf){

  const n=candles.length;

  let signals=[];

  /*
   Для каждого бара считаем индикаторы
   только по информации, которая уже была
   доступна на момент закрытия бара.
  */

  for(let i=200;i<n-1;i++){

    let subset=candles.slice(0,i+1);

    let ind=indicators(subset);

    if(
      !ind ||
      !isFinite(ind.rsi) ||
      !isFinite(ind.macd)
    )continue;

    let sc=calculateScore(ind);

    if(sc.signal==="HOLD")continue;

    signals.push({
      i,
      side:sc.signal,
      score:sc.score
    });
  }

  let horizons={
    "1 час":tf==="15m"?4:
            tf==="1h"?1:
            null,

    "4 часа":tf==="15m"?16:
             tf==="1h"?4:
             tf==="4h"?1:
             null,

    "24 часа":tf==="15m"?96:
              tf==="1h"?24:
              tf==="4h"?6:
              tf==="1d"?1:
              null
  };

  let output={};

  for(let [name,h] of Object.entries(horizons)){

    if(h===null){

      output[name]=null;
      continue;

    }

    let stats={
      BUY:[],
      SELL:[]
    };

    for(let s of signals){

      let entryIndex=s.i+1;

      let exitIndex=entryIndex+h-1;

      if(exitIndex>=n)continue;

      let entry=candles[entryIndex].open;

      let exit=candles[exitIndex].close;

      if(!entry)continue;

      let result=
        s.side==="BUY"
        ?(exit-entry)/entry*100
        :(entry-exit)/entry*100;

      stats[s.side].push({
        score:s.score,
        result
      });

    }

    output[name]=stats;
  }

  return{
    signals,
    output
  };
}


/* =========================
   СТАТИСТИКА
========================= */

function calcStats(arr){

  if(!arr.length){

    return{
      count:0,
      win:0,
      avg:0,
      best:0,
      worst:0
    };

  }

  let wins=
    arr.filter(x=>x.result>0).length;

  let sum=
    arr.reduce((a,x)=>a+x.result,0);

  let best=
    Math.max(...arr.map(x=>x.result));

  let worst=
    Math.min(...arr.map(x=>x.result));

  return{
    count:arr.length,
    win:wins/arr.length*100,
    avg:sum/arr.length,
    best,
    worst
  };
}


/* =========================
   ТАБЛИЦА SCORE
========================= */

function scoreTable(arr,side){

  let groups=
    side==="BUY"
    ?["70–75","75–80","80–85","85–90","90–100"]
    :["25–30","20–25","15–20","10–15","0–10"];

  let html=`
  <table>
  <tr>
    <th>Score</th>
    <th>Сигналов</th>
    <th>Успешных</th>
    <th>Средний</th>
  </tr>`;

  for(let g of groups){

    let items=arr.filter(x=>
      scoreGroup(x.score,side)===g
    );

    let st=calcStats(items);

    let avg=
      (st.avg>=0?"+":"")+
      st.avg.toFixed(2)+"%";

    let cls=
      st.avg>0?"good":
      st.avg<0?"bad":"neutral";

    html+=`
    <tr>
      <td><b>${g}</b></td>
      <td>${st.count}</td>
      <td>${st.win.toFixed(1)}%</td>
      <td class="${cls}">${avg}</td>
    </tr>`;
  }

  html+=`</table>`;

  return html;
}


/* =========================
   ОТРИСОВКА
========================= */

function renderStats(name,stats){

  if(!stats)return "";

  let html=`
  <div class="card">
  <h2>${name}</h2>`;

  for(let side of ["BUY","SELL"]){

    let st=calcStats(stats[side]);

    html+=`
    <div style="margin-top:18px">

    <h3>${side}</h3>

    <div class="metric">
      <span>Сигналов</span>
      <b>${st.count}</b>
    </div>

    <div class="metric">
      <span>Успешных</span>
      <b>${st.win.toFixed(1)}%</b>
    </div>

    <div class="metric">
      <span>Средний результат</span>
      <b class="${st.avg>=0?'good':'bad'}">
        ${st.avg>=0?"+":""}${st.avg.toFixed(2)}%
      </b>
    </div>

    <div class="metric">
      <span>Лучший</span>
      <b class="good">+${st.best.toFixed(2)}%</b>
    </div>

    <div class="metric">
      <span>Худший</span>
      <b class="bad">${st.worst.toFixed(2)}%</b>
    </div>

    <div style="margin-top:15px">
      <b>Разбор по Score</b>
      ${scoreTable(stats[side],side)}
    </div>

    </div>`;
  }

  html+=`</div>`;

  return html;
}


/* =========================
   ВИРТУАЛЬНАЯ СТРАТЕГИЯ
========================= */

function virtualStrategy(candles,signals,tf){

  let h=
    tf==="15m"?96:
    tf==="1h"?24:
    tf==="4h"?6:
    1;

  let trades=[];
  let nextAvailable=0;

  for(let s of signals){

    let entryIndex=s.i+1;

    if(entryIndex<nextAvailable)continue;

    let exitIndex=entryIndex+h-1;

    if(exitIndex>=candles.length)break;

    let entry=candles[entryIndex].open;
    let exit=candles[exitIndex].close;

    let result=
      s.side==="BUY"
      ?(exit-entry)/entry*100
      :(entry-exit)/entry*100;

    trades.push({
      result,
      side:s.side
    });

    nextAvailable=exitIndex+1;
  }

  if(!trades.length)return null;

  let equity=0;
  let peak=0;
  let maxDD=0;

  for(let t of trades){

    equity+=t.result;

    peak=Math.max(peak,equity);

    let dd=equity-peak;

    maxDD=Math.min(maxDD,dd);
  }

  let wins=
    trades.filter(x=>x.result>0).length;

  return{
    count:trades.length,
    win:wins/trades.length*100,
    result:equity,
    maxDD
  };
}


/* =========================
   ЗАПУСК
========================= */

$("backtest").onclick=async()=>{

  let btn=$("backtest");

  btn.disabled=true;

  $("status").textContent=
    "⏳ Загружаем историю...";

  $("results").innerHTML="";

  try{

    let tf=$("tf").value;

    let candles=
      await getHistory(tf);

    $("status").textContent=
      "⏳ Анализируем "+candles.length+" свечей...";

    let bt=
      runBacktest(candles,tf);

    let html=`
      <div class="card">

      <h2>Результат</h2>

      <div class="metric">
        <span>Таймфрейм</span>
        <b>${tf}</b>
      </div>

      <div class="metric">
        <span>Свечей</span>
        <b>${candles.length}</b>
      </div>

      <div class="metric">
        <span>BUY</span>
        <b>${bt.signals.filter(x=>x.side==="BUY").length}</b>
      </div>

      <div class="metric">
        <span>SELL</span>
        <b>${bt.signals.filter(x=>x.side==="SELL").length}</b>
      </div>

      </div>
    `;

    for(let [name,stats] of Object.entries(bt.output)){

      html+=renderStats(name,stats);

    }

    let vs=
      virtualStrategy(candles,bt.signals,tf);

    if(vs){

      html+=`
      <div class="card">

      <h2>💰 Виртуальная стратегия · 24 часа</h2>

      <div class="metric">
        <span>Сделок</span>
        <b>${vs.count}</b>
      </div>

      <div class="metric">
        <span>Успешных</span>
        <b>${vs.win.toFixed(1)}%</b>
      </div>

      <div class="metric">
        <span>Результат</span>
        <b class="${vs.result>=0?'good':'bad'}">
          ${vs.result>=0?"+":""}${vs.result.toFixed(2)}%
        </b>
      </div>

      <div class="metric">
        <span>Max Drawdown</span>
        <b class="bad">
          ${vs.maxDD.toFixed(2)}%
        </b>
      </div>

      <div class="small" style="margin-top:12px">
        Модель без комиссий, проскальзывания и налогов.
        Используется только для сравнения качества сигналов.
      </div>

      </div>`;
    }

    $("results").innerHTML=html;

    $("status").textContent=
      "✅ Тест завершён";

  }catch(e){

    console.error(e);

    $("status").textContent=
      "❌ Ошибка: "+e.message;

  }

  btn.disabled=false;

};

</script>

</body>
</html>
