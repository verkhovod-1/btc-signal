const TF = {

 "1d":[1]

};


let currentCloseForSignal=0;


/* =========================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================================================= */

function sleep(ms){

 return new Promise(
  resolve=>setTimeout(resolve,ms)
 );

}


function pct(x){

 if(
  x===null ||
  x===undefined ||
  !Number.isFinite(Number(x))
 ){
  return "—";
 }

 const n=Number(x);

 return (
  n>=0 ? "+" : ""
 )+
 n.toFixed(2)+
 "%";
}


function pctNumber(x){

 if(
  x===null ||
  x===undefined ||
  !Number.isFinite(Number(x))
 ){
  return null;
 }

 return Number(x);
}


function fmtPrice(x){

 const n=Number(x);

 if(!Number.isFinite(n)){
  return "—";
 }

 return n.toLocaleString(
  "en-US",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 );

}


function formatHorizon(tf,h){

 if(tf==="15m"){

 }

 if(tf==="1h"){

 }

 if(tf==="4h"){

 }

 if(tf==="1d"){

  if(h===1) return "24 часа";

 }

 return h+" свеч.";


}


/* =========================================================
   EMA
========================================================= */

function ema(values,period){

 const result=
  new Array(values.length).fill(null);

 if(values.length<period){
  return result;
 }

 let sum=0;

 for(let i=0;i<period;i++){
  sum+=values[i];
 }

 let prev=sum/period;

 result[period-1]=prev;

 const k=2/(period+1);

 for(
  let i=period;
  i<values.length;
  i++
 ){

  prev=
   values[i]*k+
   prev*(1-k);

  result[i]=prev;

 }

 return result;

}


/* =========================================================
   RSI
========================================================= */

function rsi(values,period=14){

 const result=
  new Array(values.length).fill(null);

 if(values.length<=period){
  return result;
 }

 let gains=0;
 let losses=0;

 for(let i=1;i<=period;i++){

  const diff=
   values[i]-values[i-1];

  if(diff>=0){
   gains+=diff;
  }else{
   losses-=diff;
  }

 }

 let avgGain=gains/period;
 let avgLoss=losses/period;

 if(avgLoss===0){

  result[period]=100;

 }else{

  const rs=
   avgGain/avgLoss;

  result[period]=
   100-(100/(1+rs));

 }


 for(
  let i=period+1;
  i<values.length;
  i++
 ){

  const diff=
   values[i]-values[i-1];

  const gain=
   diff>0 ? diff : 0;

  const loss=
   diff<0 ? -diff : 0;

  avgGain=
   (
    avgGain*(period-1)+gain
   )/period;

  avgLoss=
   (
    avgLoss*(period-1)+loss
   )/period;

  if(avgLoss===0){

   result[i]=100;

  }else{

   const rs=
    avgGain/avgLoss;

   result[i]=
    100-(100/(1+rs));

  }

 }

 return result;

}


/* =========================================================
   MACD
========================================================= */

function macd(values){

 const ema12=ema(values,12);
 const ema26=ema(values,26);

 const line=
  new Array(values.length).fill(null);

 for(let i=0;i<values.length;i++){

  if(
   ema12[i]!==null &&
   ema26[i]!==null
  ){

   line[i]=
    ema12[i]-ema26[i];

  }

 }

 const valid=[];
 const indexes=[];

 for(let i=0;i<line.length;i++){

  if(line[i]!==null){

   valid.push(line[i]);
   indexes.push(i);

  }

 }

 const signalValues=
  ema(valid,9);

 const signal=
  new Array(values.length).fill(null);

 const histogram=
  new Array(values.length).fill(null);

 for(
  let j=0;
  j<indexes.length;
  j++
 ){

  const i=indexes[j];

  if(signalValues[j]!==null){

   signal[i]=signalValues[j];

   histogram[i]=
    line[i]-signal[i];

  }

 }

 return {
  line,
  signal,
  histogram
 };

}


/* =========================================================
   ADX
========================================================= */

function adx(data,period=14){

 const n=data.length;

 const result=
  new Array(n).fill(null);

 const plusDI=
  new Array(n).fill(null);

 const minusDI=
  new Array(n).fill(null);

 if(n<period*2+1){

  return {
   adx:result,
   plusDI,
   minusDI
  };

 }

 const tr=
  new Array(n).fill(0);

 const plusDM=
  new Array(n).fill(0);

 const minusDM=
  new Array(n).fill(0);


 for(let i=1;i<n;i++){

  const high=data[i].high;
  const low=data[i].low;

  const prevHigh=data[i-1].high;
  const prevLow=data[i-1].low;
  const prevClose=data[i-1].close;

  tr[i]=Math.max(
   high-low,
   Math.abs(high-prevClose),
   Math.abs(low-prevClose)
  );

  const upMove=
   high-prevHigh;

  const downMove=
   prevLow-low;

  plusDM[i]=
   upMove>downMove &&
   upMove>0
   ? upMove
   : 0;

  minusDM[i]=
   downMove>upMove &&
   downMove>0
   ? downMove
   : 0;

 }


 let atr=0;
 let pDM=0;
 let mDM=0;


 for(let i=1;i<=period;i++){

  atr+=tr[i];
  pDM+=plusDM[i];
  mDM+=minusDM[i];

 }


 const dx=[];


 for(let i=period;i<n;i++){

  if(i>period){

   atr=
    atr-(atr/period)+tr[i];

   pDM=
    pDM-(pDM/period)+plusDM[i];

   mDM=
    mDM-(mDM/period)+minusDM[i];

  }


  if(atr===0) continue;


  const pdi=
   100*(pDM/atr);

  const mdi=
   100*(mDM/atr);


  plusDI[i]=pdi;
  minusDI[i]=mdi;


  const denominator=
   pdi+mdi;


  const dxValue=
   denominator===0
   ?0
   :100*
    Math.abs(pdi-mdi)/
    denominator;


  dx.push({
   i,
   value:dxValue
  });

 }


 if(dx.length<period){

  return {
   adx:result,
   plusDI,
   minusDI
  };

 }


 let sum=0;

 for(let j=0;j<period;j++){
  sum+=dx[j].value;
 }


 result[
  dx[period-1].i
 ]=
  sum/period;


 for(
  let j=period;
  j<dx.length;
  j++
 ){

  const prevIndex=
   dx[j-1].i;

  const currentIndex=
   dx[j].i;

  const previousADX=
   result[prevIndex];

  if(previousADX!==null){

   result[currentIndex]=
    (
     previousADX*(period-1)+
     dx[j].value
    )/period;

  }

 }


 return {
  adx:result,
  plusDI,
  minusDI
 };

}


/* =========================================================
   BUILD INDICATORS
========================================================= */

function buildIndicators(data){

 const close=
  data.map(x=>x.close);

 const volume=
  data.map(x=>x.volume);


 const ema20=
  ema(close,20);

 const ema50=
  ema(close,50);

 const ema200=
  ema(close,200);

 const rsi14=
  rsi(close,14);

 const m=
  macd(close);

 const a=
  adx(data,14);


 const volumeRatio=
  new Array(data.length).fill(null);


 for(let i=20;i<data.length;i++){

  let sum=0;
  let count=0;

  for(
   let j=Math.max(0,i-20);
   j<i;
   j++
  ){

   if(Number.isFinite(volume[j])){

    sum+=volume[j];
    count++;

   }

  }


  if(count>0){

   const avg=sum/count;

   if(avg>0){

    volumeRatio[i]=
     volume[i]/avg;

   }

  }

 }


 return {

  ema20,
  ema50,
  ema200,

  rsi:rsi14,

  macd:m.line,

  macdSignal:m.signal,

  macdHistogram:m.histogram,

  adx:a.adx,

  plusDI:a.plusDI,

  minusDI:a.minusDI,

  volumeRatio

 };

}


/* =========================================================
   MARKET REGIME
========================================================= */

function getRegime(ind,i){

 const adxValue=ind.adx[i];

 const pdi=ind.plusDI[i];

 const mdi=ind.minusDI[i];


 if(
  adxValue===null ||
  pdi===null ||
  mdi===null
 ){
  return "UNKNOWN";
 }


 if(adxValue<20){
  return "FLAT";
 }


 if(adxValue<=25){
  return "TRANSITION";
 }


 if(pdi>mdi){
  return "BULL";
 }


 return "BEAR";

}


/* =========================================================
   SIGNAL
========================================================= */

function getSignal(ind,i){

 let bull=0;
 let bear=0;


 /* EMA */

 if(
  ind.ema20[i]!==null &&
  ind.ema50[i]!==null
 ){

  if(
   ind.ema20[i]>
   ind.ema50[i]
  ){

   bull+=20;

  }else{

   bear+=20;

  }

 }


 /* EMA200 */

 if(
  ind.ema200[i]!==null
 ){

  if(
   currentCloseForSignal>
   ind.ema200[i]
  ){

   bull+=20;

  }else{

   bear+=20;

  }

 }


 /* RSI */

 const r=ind.rsi[i];

 if(r!==null){

  if(
   r>=52 &&
   r<=68
  ){

   bull+=20;

  }else if(r>75){

   bear+=10;

  }else if(r<30){

   bull+=10;

  }else if(r<45){

   bear+=15;

  }else{

   bull+=10;
   bear+=10;

  }

 }


 /* MACD */

 if(ind.macd[i]!==null){

  if(ind.macd[i]>0){

   bull+=20;

  }else{

   bear+=20;

  }

 }


 /* VOLUME */

 const vr=
  ind.volumeRatio[i];

 if(vr!==null){

  if(vr>=1.25){

   if(
    currentCloseForSignal>
    ind.ema20[i]
   ){

    bull+=20;

   }else{

    bear+=20;

   }

  }else{

   bull+=10;
   bear+=10;

  }

 }


 const score=
  Math.max(
   0,
   Math.min(
    100,
    50+(bull-bear)/2
   )
  );


 let signal="HOLD";

 if(score>=70){
  signal="BUY";
 }else if(score<=30){
  signal="SELL";
 }


 return {
  signal,
  score,
  bull,
  bear
 };

}


/* =========================================================
   RETURN
========================================================= */

function directionalReturn(
 data,
 i,
 horizon,
 direction
){

 const entry=i+1;

 const exit=
  i+1+horizon;


 if(
  entry>=data.length ||
  exit>=data.length
 ){
  return null;
 }


 const p1=
  Number(data[entry].open);

 const p2=
  Number(data[exit].open);


 if(
  !Number.isFinite(p1) ||
  !Number.isFinite(p2) ||
  p1<=0
 ){
  return null;
 }


 const raw=
  (p2-p1)/p1*100;


 if(direction==="BUY"){
  return raw;
 }


 if(direction==="SELL"){
  return -raw;
 }


 return null;

}


/* =========================================================
   SIGNAL STATS
========================================================= */

function signalStats(
 data,
 ind,
 signal,
 horizon
){

 let n=0;
 let wins=0;

 const returns=[];


 const maxI=
  data.length-
  horizon-
  2;


 for(
  let i=200;
  i<=maxI;
  i++
 ){

  currentCloseForSignal=
   Number(data[i].close);


  if(
   !Number.isFinite(
    currentCloseForSignal
   )
  ){
   continue;
  }


  const s=
   getSignal(ind,i);


  if(s.signal!==signal){
   continue;
  }


  const ret=
   directionalReturn(
    data,
    i,
    horizon,
    signal
   );


  if(ret===null){
   continue;
  }


  n++;

  returns.push(ret);


  if(ret>0){
   wins++;
  }

 }


 if(n===0){

  return {
   n:0,
   accuracy:null,
   avg:null,
   best:null,
   worst:null
  };

 }


 return {

  n,

  accuracy:
   wins/n*100,

  avg:
   returns.reduce(
    (a,b)=>a+b,
    0
   )/returns.length,

  best:
   Math.max(...returns),

  worst:
   Math.min(...returns)

 };

}


/* =========================================================
   FACTOR DEFINITIONS
========================================================= */

function getFactors(){

 return [

  {
   name:"EMA20 > EMA50",
   fn:(ind,i)=>
    ind.ema20[i]!==null &&
    ind.ema50[i]!==null &&
    ind.ema20[i]>
    ind.ema50[i]
  },


  {
   name:"Цена > EMA200",
   fn:(ind,i)=>
    ind.ema200[i]!==null &&
    currentCloseForSignal>
    ind.ema200[i]
  },


  {
   name:"MACD > 0",
   fn:(ind,i)=>
    ind.macd[i]!==null &&
    ind.macd[i]>0
  },


  {
   name:"MACD Histogram > 0",
   fn:(ind,i)=>
    ind.macdHistogram[i]!==null &&
    ind.macdHistogram[i]>0
  },


  {
   name:"RSI 52–68",
   fn:(ind,i)=>
    ind.rsi[i]!==null &&
    ind.rsi[i]>=52 &&
    ind.rsi[i]<=68
  },


  {
   name:"Volume >= 1.25",
   fn:(ind,i)=>
    ind.volumeRatio[i]!==null &&
    ind.volumeRatio[i]>=1.25
  }

 ];

}


/* =========================================================
   COMBINATION GENERATOR
========================================================= */

function generateCombinations(factors){

 const result=[];


 /*
  Все комбинации из 2 факторов
 */

 for(
  let a=0;
  a<factors.length;
  a++
 ){

  for(
   let b=a+1;
   b<factors.length;
   b++
  ){

   result.push({

    size:2,

    factors:[
     factors[a],
     factors[b]
    ]

   });

  }

 }


 /*
  Все комбинации из 3 факторов
 */

 for(
  let a=0;
  a<factors.length;
  a++
 ){

  for(
   let b=a+1;
   b<factors.length;
   b++
  ){

   for(
    let c=b+1;
    c<factors.length;
    c++
   ){

    result.push({

     size:3,

     factors:[
      factors[a],
      factors[b],
      factors[c]
     ]

    });

   }

  }

 }


 return result;

}


/* =========================================================
   COMBINATION STATS
========================================================= */

function combinationStats(
 data,
 ind,
 combination,
 horizon
){

 let n=0;
 let wins=0;

 const returns=[];


 const maxI=
  data.length-
  horizon-
  2;


 for(
  let i=200;
  i<=maxI;
  i++
 ){

  currentCloseForSignal=
   Number(data[i].close);


  if(
   !Number.isFinite(
    currentCloseForSignal
   )
  ){
   continue;
  }


  let matches=true;


  for(
   const factor
   of combination.factors
  ){

   let result=false;

   try{

    result=
     Boolean(
      factor.fn(ind,i)
     );

   }catch(e){

    result=false;

   }


   if(!result){

    matches=false;
    break;

   }

  }


  if(!matches){
   continue;
  }


  const ret=
   directionalReturn(
    data,
    i,
    horizon,
    "BUY"
   );


  if(ret===null){
   continue;
  }


  n++;

  returns.push(ret);


  if(ret>0){
   wins++;
  }

 }


 if(n===0){

  return {

   n:0,

   accuracy:null,

   avg:null,

   best:null,

   worst:null

  };

 }


 return {

  n,

  accuracy:
   wins/n*100,

  avg:
   returns.reduce(
    (a,b)=>a+b,
    0
   )/returns.length,

  best:
   Math.max(...returns),

  worst:
   Math.min(...returns)

 };

}


/* =========================================================
   COMBINATION ANALYSIS
========================================================= */

function analyzeCombinations(
 data,
 ind,
 tf
){

 const factors=
  getFactors();


 const combinations=
  generateCombinations(
   factors
  );


 /*
  Для анализа комбинаций используем
  именно 24 часа.
 */

 let horizon;

 if(tf==="15m"){
  horizon=96;
 }else if(tf==="1h"){
  horizon=24;
 }else if(tf==="4h"){
  horizon=6;
 }else{
  horizon=1;
 }


 const results=[];


 for(
  const combination
  of combinations
 ){

  const stats=
   combinationStats(
    data,
    ind,
    combination,
    horizon
   );


  if(stats.n===0){
   continue;
  }


  results.push({

   ...combination,

   ...stats

  });

 }


 /*
  Сначала предпочитаем
  среднюю доходность.

  Но комбинации с N<30
  не должны попадать наверх
  как будто они надёжны.
 */

 results.sort(
  (a,b)=>{

   const scoreA=
    a.n>=30
    ? a.avg
    : a.avg*0.35;

   const scoreB=
    b.n>=30
    ? b.avg
    : b.avg*0.35;

   return scoreB-scoreA;

  }
 );


 return {

/* =========================================================
   REGIME FACTOR STATS
========================================================= */

function regimeFactorStats(
 data,
 ind,
 regime,
 factorFn,
 horizon
){

 let n=0;
 let wins=0;

 const returns=[];


 const maxI=
  data.length-
  horizon-
  2;


 for(
  let i=200;
  i<=maxI;
  i++
 ){

  currentCloseForSignal=
   Number(data[i].close);


  if(
   !Number.isFinite(
    currentCloseForSignal
   )
  ){
   continue;
  }


  if(
   getRegime(ind,i)!==
   regime
  ){
   continue;
  }


  let factor=false;

  try{

   factor=
    Boolean(
     factorFn(ind,i)
    );

  }catch(e){

   factor=false;

  }


  if(!factor){
   continue;
  }


  const ret=
   directionalReturn(
    data,
    i,
    horizon,
    "BUY"
   );


  if(ret===null){
   continue;
  }


  n++;

  returns.push(ret);


  if(ret>0){
   wins++;
  }

 }


 if(n===0){

  return {

   n:0,

   accuracy:null,

   avg:null,

   best:null,

   worst:null

  };

 }


 return {

  n,

  accuracy:
   wins/n*100,

  avg:
   returns.reduce(
    (a,b)=>a+b,
    0
   )/returns.length,

  best:
   Math.max(...returns),

  worst:
   Math.min(...returns)

 };

}
