<script>

const API="https://api.binance.com/api/v3/klines";

const TF={
  "15m":900000,
  "1h":3600000,
  "4h":14400000,
  "1d":86400000
};

const HORIZONS={
  "15m":[4,16,96],
  "1h":[1,4,24],
  "4h":[1,6],
  "1d":[1]
};

let candles=[];


/* =========================
   UTILITY
========================= */

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function pct(x){
  if(!isFinite(x)) return "—";
  return (x>=0?"+":"")+x.toFixed(2)+"%";
}

function num(x){
  return Number(x).toFixed(2);
}

function fmtPrice(x){
  return Number(x).toLocaleString("en-US",{
    maximumFractionDigits:2
  });
}


/* =========================
   EMA
========================= */

function calcEMA(values,period){

  const result=new Array(values.length).fill(null);

  if(values.length<period) return result;

  let sum=0;

  for(let i=0;i<period;i++){
    sum+=values[i];
  }

  let ema=sum/period;
  result[period-1]=ema;

  const k=2/(period+1);

  for(let i=period;i<values.length;i++){
    ema=values[i]*k+ema*(1-k);
    result[i]=ema;
  }

  return result;
}


/* =========================
   RSI
========================= */

function calcRSI(values,period=14){

  const result=new Array(values.length).fill(null);

  if(values.length<=period) return result;

  let gain=0;
  let loss=0;

  for(let i=1;i<=period;i++){
    const d=values[i]-values[i-1];

    if(d>=0) gain+=d;
    else loss-=d;
  }

  let avgGain=gain/period;
  let avgLoss=loss/period;

  result[period]=
    avgLoss===0 ? 100 :
    100-(100/(1+avgGain/avgLoss));

  for(let i=period+1;i<values.length;i++){

    const d=values[i]-values[i-1];

    const g=Math.max(d,0);
    const l=Math.max(-d,0);

    avgGain=(avgGain*(period-1)+g)/period;
    avgLoss=(avgLoss*(period-1)+l)/period;

    result[i]=
      avgLoss===0 ? 100 :
      100-(100/(1+avgGain/avgLoss));
  }

  return result;
}


/* =========================
   CORRECT MACD
   EMA12 / EMA26
   Signal EMA9
   Histogram
========================= */

function calcMACD(values){

  const ema12=calcEMA(values,12);
  const ema26=calcEMA(values,26);

  const macd=new Array(values.length).fill(null);

  for(let i=0;i<values.length;i++){

    if(
      ema12[i]!==null &&
      ema26[i]!==null
    ){
      macd[i]=ema12[i]-ema26[i];
    }
  }

  const macdForSignal=[];
  const macdIndexes=[];

  for(let i=0;i<macd.length;i++){
    if(macd[i]!==null){
      macdForSignal.push(macd[i]);
      macdIndexes.push(i);
    }
  }

  const signalValues=calcEMA(macdForSignal,9);

  const signal=new Array(values.length).fill(null);
  const histogram=new Array(values.length).fill(null);

  for(let j=0;j<signalValues.length;j++){

    const originalIndex=macdIndexes[j];

    if(signalValues[j]!==null){

      signal[originalIndex]=signalValues[j];
      histogram[originalIndex]=
        macd[originalIndex]-signalValues[j];
    }
  }

  return {
    ema12,
    ema26,
    macd,
    signal,
    histogram
  };
}


/* =========================
   INDICATORS
========================= */

function buildIndicators(data){

  const close=data.map(x=>x.close);
  const volume=data.map(x=>x.volume);

  const ema20=calcEMA(close,20);
  const ema50=calcEMA(close,50);
  const ema200=calcEMA(close,200);
  const rsi=calcRSI(close,14);
  const macd=calcMACD(close);

  const volumeRatio=new Array(close.length).fill(null);

  for(let i=20;i<close.length;i++){

    let sum=0;

    for(let j=i-20;j<i;j++){
      sum+=volume[j];
    }

    const avg=sum/20;

    if(avg>0){
      volumeRatio[i]=volume[i]/avg;
    }
  }

  return {
    close,
    volume,
    ema20,
    ema50,
    ema200,
    rsi,
    macd,
    volumeRatio
  };
}


/* =========================
   SCORE
   Сохраняем текущую логику
========================= */

function getSignal(ind,i){

  let bull=0;
  let bear=0;
  const reasons=[];

  const price=ind.close[i];
  const e20=ind.ema20[i];
  const e50=ind.ema50[i];
  const e200=ind.ema200[i];
  const rsi=ind.rsi[i];
  const macd=ind.macd.macd[i];
  const vr=ind.volumeRatio[i];

  if(
    e20!==null &&
    e50!==null
  ){

    if(e20>e50){
      bull+=20;
      reasons.push("EMA20 > EMA50: бычий тренд");
    }else{
      bear+=20;
      reasons.push("EMA20 < EMA50: медвежий тренд");
    }
  }

  if(
    e200!==null
  ){

    if(price>e200){
      bull+=20;
      reasons.push("Цена выше EMA200");
    }else{
      bear+=20;
      reasons.push("Цена ниже EMA200");
    }
  }

  if(rsi!==null){

    if(rsi>=52 && rsi<=68){
      bull+=20;
      reasons.push("RSI 52–68: сильная бычья зона");
    }
    else if(rsi>75){
      bear+=10;
      reasons.push("RSI >75: перекупленность");
    }
    else if(rsi<30){
      bull+=10;
      reasons.push("RSI <30: возможный отскок");
    }
    else if(rsi<45){
      bear+=15;
      reasons.push("RSI <45: слабость");
    }
    else{
      bull+=10;
      bear+=10;
      reasons.push("RSI нейтральный");
    }
  }

  /*
    ВАЖНО:
    Для сохранения сопоставимости с v2.2
    решение использует MACD LINE > 0.
    Но теперь MACD рассчитан корректно.
  */

  if(macd!==null){

    if(macd>0){
      bull+=20;
      reasons.push("MACD > 0");
    }else{
      bear+=20;
      reasons.push("MACD < 0");
    }
  }

  if(vr!==null){

    if(vr>=1.25){

      if(price>e20){
        bull+=20;
        reasons.push("Объём выше среднего + цена выше EMA20");
      }else{
        bear+=20;
        reasons.push("Объём выше среднего + цена ниже EMA20");
      }

    }else{
      bull+=10;
      bear+=10;
      reasons.push("Объём без сильного подтверждения");
    }
  }

  const score=
    Math.max(
      0,
      Math.min(
        100,
        50+(bull-bear)/2
      )
    );

  let signal="HOLD";

  if(score>=70) signal="BUY";
  else if(score<=30) signal="SELL";

  return {
    score,
    signal,
    bull,
    bear,
    reasons
  };
}


/* =========================
   SCORE BAND
========================= */

function scoreBand(score,signal){

  if(signal==="BUY"){

    if(score>=90) return "90–100";
    if(score>=85) return "85–90";
    if(score>=80) return "80–85";
    if(score>=75) return "75–80";
    return "70–75";
  }

  if(signal==="SELL"){

    if(score<=10) return "0–10";
    if(score<=15) return "10–15";
    if(score<=20) return "15–20";
    if(score<=25) return "20–25";
    return "25–30";
  }

  return "HOLD";
}


/* =========================
   BINANCE DATA
========================= */

async function fetchBatch(start,end,interval){

  const url=
    API+
    "?symbol=BTCUSDT"+
    "&interval="+interval+
    "&limit=1000"+
    "&startTime="+start+
    "&endTime="+end;

  const response=await fetch(url);

  if(!response.ok){
    throw new Error(
      "Binance HTTP "+response.status
    );
  }

  return await response.json();
}


async function fetchHistory(interval){

  const now=Date.now();

  const oneYear=365*24*60*60*1000;

  const start=now-oneYear;

  const step=TF[interval];

  let all=[];

  let cursor=start;

  while(cursor<now){

    let data=null;

    for(let attempt=0;attempt<4;attempt++){

      try{

        data=await fetchBatch(
          cursor,
          now,
          interval
        );

        break;

      }catch(e){

        if(attempt===3) throw e;

        await sleep(1000*(attempt+1));
      }
    }

    if(!data || data.length===0) break;

    for(const k of data){

      all.push({
        time:k[0],
        open:Number(k[1]),
        high:Number(k[2]),
        low:Number(k[3]),
        close:Number(k[4]),
        volume:Number(k[5])
      });
    }

    const last=data[data.length-1][0];

    cursor=last+step;

    document.getElementById("status").innerText=
      "Загрузка истории: "+
      all.length+
      " свечей";

    await sleep(120);

    if(data.length<1000) break;
  }

  const map=new Map();

  for(const x of all){
    map.set(x.time,x);
  }

  return [...map.values()]
    .sort((a,b)=>a.time-b.time);
}


/* =========================
   LIVE
========================= */

function renderLive(ind,i){

  const s=getSignal(ind,i);

  const price=ind.close[i];

  const cls=
    s.signal==="BUY" ? "buy" :
    s.signal==="SELL" ? "sell" :

  let html=`

  <div class="card">

    <div class="small center">

    </div>

    <div class="price">

    </div>

    <div class="signal ${cls}">

    </div>

    <div class="score">
      ${s.score.toFixed(0)}
    </div>

    <div class="small center">
      Signal Score — не вероятность
    </div>

    <div class="meter">
      <div
        class="meterFill"
        style="width:${s.score}%"
      ></div>
    </div>

    <hr>

      Разбор сигнала
    </div>
  `;

  for(const r of s.reasons){

    html+=`

    `;
  }

  html+=`
    <hr>

    <div class="small">
      EMA20: ${num(ind.ema20[i])}<br>
      EMA50: ${num(ind.ema50[i])}<br>
      EMA200: ${num(ind.ema200[i])}<br>
      RSI: ${num(ind.rsi[i])}<br>
      MACD: ${num(ind.macd.macd[i])}<br>
      Signal: ${num(ind.macd.signal[i])}<br>
      Histogram: ${num(ind.macd.histogram[i])}<br>

    </div>

  </div>
  `;

  document.getElementById("live").innerHTML=html;
}


/* =========================
   BACKTEST HELPERS
========================= */

function directionalReturn(data,i,horizon,direction){

  const entryIndex=i+1;
  const exitIndex=i+1+horizon;

  if(
    entryIndex>=data.length ||
    exitIndex>=data.length
  ){
    return null;
  }

  const entry=data[entryIndex].open;
  const exit=data[exitIndex].open;

  if(
    !isFinite(entry) ||
    !isFinite(exit) ||
    entry<=0
  ){
    return null;
  }

  const raw=(exit-entry)/entry*100;

  return direction==="BUY" ? raw : -raw;
}


function calcSignalStats(
  data,
  ind,
  signalName,
  horizon
){

  let n=0;
  let wins=0;
  let sum=0;
  let best=-Infinity;
  let worst=Infinity;

  for(
    let i=200;
    i<data.length-horizon-2;
    i++
  ){

    const s=getSignal(ind,i);

    if(s.signal!==signalName) continue;

    const r=
      directionalReturn(
        data,
        i,
        horizon,
        signalName
      );

    if(r===null) continue;

    n++;

    if(r>0) wins++;

    sum+=r;

    best=Math.max(best,r);
    worst=Math.min(worst,r);
  }

  return {
    n,
    accuracy:n ? wins/n*100 : null,
    avg:n ? sum/n : null,
    best:n ? best : null,
    worst:n ? worst : null
  };
}


/* =========================
   SCORE DIAGNOSTICS
========================= */

function scoreDiagnostics(
  data,
  ind,
  signalName,
  horizon
){

  const bands=
    signalName==="BUY"
      ? ["70–75","75–80","80–85","85–90","90–100"]
      : ["25–30","20–25","15–20","10–15","0–10"];

  const stats={};

  for(const b of bands){
    stats[b]={
      n:0,
      wins:0,
      sum:0
    };
  }

  for(
    let i=200;
    i<data.length-horizon-2;
    i++
  ){

    const s=getSignal(ind,i);

    if(s.signal!==signalName) continue;

    const b=scoreBand(
      s.score,
      signalName
    );

    const r=
      directionalReturn(
        data,
        i,
        horizon,
        signalName
      );

    if(r===null) continue;

    stats[b].n++;

    if(r>0) stats[b].wins++;

    stats[b].sum+=r;
  }

  return {
    bands,
    stats
  };
}


/* =========================
   FACTOR DIAGNOSTICS
========================= */

function factorCondition(ind,i){

  const rsi=ind.rsi[i];

  return {

    EMA:
      ind.ema20[i]!==null &&
      ind.ema50[i]!==null &&
      ind.ema20[i]>ind.ema50[i],

    EMA200:
      ind.ema200[i]!==null &&
      ind.close[i]>ind.ema200[i],

    MACD:
      ind.macd.macd[i]!==null &&
      ind.macd.macd[i]>0,

    MACD_HIST:
      ind.macd.histogram[i]!==null &&
      ind.macd.histogram[i]>0,

    RSI:
      rsi!==null &&
      rsi>=52 &&
      rsi<=68,

    VOLUME:
      ind.volumeRatio[i]!==null &&
      ind.volumeRatio[i]>=1.25
  };
}


function factorTest(
  data,
  ind,
  horizon,
  condition,
  direction
){

  let n=0;
  let wins=0;
  let sum=0;

  for(
    let i=200;
    i<data.length-horizon-2;
    i++
  ){

    if(!condition(i)) continue;

    const r=
      directionalReturn(
        data,
        i,
        horizon,
        direction
      );

    if(r===null) continue;

    n++;

    if(r>0) wins++;

    sum+=r;
  }

  return {
    n,
    accuracy:n ? wins/n*100 : null,
    avg:n ? sum/n : null
  };
}


function combinationTest(
  data,
  ind,
  horizon,
  conditions,
  direction
){

  return factorTest(
    data,
    ind,
    horizon,
    i=>{
      const f=factorCondition(ind,i);

      return conditions.every(x=>f[x]);
    },
    direction
  );
}


/* =========================
   DIAGNOSTICS RENDER
========================= */

function renderDiagnostics(
  data,
  ind
){

  const tf=
    document.getElementById("timeframe").value;

  const horizons=HORIZONS[tf];

  let html=`

  <div class="card">

    <div class="sectionTitle">
      🔬 Диагностика факторов
    </div>

    <div class="small">
      Проверяем каждый фактор отдельно.
      Это НЕ меняет текущий сигнал.
      Результат показывает, действительно ли
      фактор помогает прогнозировать направление.
    </div>

  `;

  for(const h of horizons){

    html+=`

    <hr>

    <div class="sectionTitle">
      Горизонт ${formatHorizon(h,tf)}
    </div>

    <table>
      <tr>
        <th>Фактор</th>
        <th>N</th>
        <th>Успех</th>
        <th>Средн.</th>
      </tr>
    `;

    const factors=[
      ["EMA20 > EMA50","EMA","BUY"],
      ["Цена > EMA200","EMA200","BUY"],
      ["MACD > 0","MACD","BUY"],
      ["MACD Histogram > 0","MACD_HIST","BUY"],
      ["RSI 52–68","RSI","BUY"],
      ["Объём ≥1.25","VOLUME","BUY"]
    ];

    for(const [name,key,direction] of factors){

      const r=factorTest(
        data,
        ind,
        h,
        i=>factorCondition(ind,i)[key],
        direction
      );

      html+=`
      <tr>
        <td>${name}</td>
        <td>${r.n}</td>
        <td>${r.accuracy===null?"—":r.accuracy.toFixed(1)+"%"}</td>
        <td>${r.avg===null?"—":pct(r.avg)}</td>
      </tr>
      `;
    }

    html+=`</table>`;

    html+=`

    <div class="small" style="margin-top:10px">
      Комбинации факторов:
    </div>

    <table>

      <tr>
        <th>Комбинация</th>
        <th>N</th>
        <th>Успех</th>
        <th>Средн.</th>
      </tr>
    `;

    const combos=[
      ["EMA + EMA200",["EMA","EMA200"]],
      ["EMA + MACD",["EMA","MACD"]],
      ["EMA200 + MACD",["EMA200","MACD"]],
      ["EMA + EMA200 + MACD",["EMA","EMA200","MACD"]],
      ["EMA + EMA200 + MACD + RSI",
        ["EMA","EMA200","MACD","RSI"]],
      ["Все факторы",
        ["EMA","EMA200","MACD","RSI","VOLUME"]]
    ];

    for(const [name,keys] of combos){

      const r=
        combinationTest(
          data,
          ind,
          h,
          keys,
          "BUY"
        );

      html+=`
      <tr>
        <td>${name}</td>
        <td>${r.n}</td>
        <td>${r.accuracy===null?"—":r.accuracy.toFixed(1)+"%"}</td>
        <td>${r.avg===null?"—":pct(r.avg)}</td>
      </tr>
      `;
    }

    html+=`</table>`;

  }

  html+=`

    <details>
      <summary>Что означают результаты?</summary>

      <div class="small" style="padding:10px">

        <p>
        <b>Успех</b> — процент случаев,
        когда движение цены совпало
        с предполагаемым направлением.
        </p>

        <p>
        <b>Средн.</b> — средняя доходность
        в предполагаемом направлении.
        </p>

        <p>
        Если фактор стабильно показывает
        около 50%, он практически не помогает.
        </p>

        <p>
        Если фактор показывает 53–55%+
        на большом количестве наблюдений,
        его уже стоит изучать подробнее.
        </p>

        <p>
        Особенно важна комбинация:
        рост точности + достаточно большое N.
        Например, 58% на 40 случаях хуже
        для исследования, чем 54% на 3000 случаях.
        </p>

      </div>
    </details>

  </div>
  `;

  document.getElementById("diagnostics").innerHTML=html;
}


/* =========================
   HORIZON TEXT
========================= */

function formatHorizon(h,tf){

  const minutes=
    h*(
      tf==="15m" ? 15 :
      tf==="1h" ? 60 :
      tf==="4h" ? 240 :
      1440
    );

  if(minutes<60){
    return minutes+" мин";
  }

  if(minutes%1440===0){
    return (minutes/1440)+" дн";
  }

  return (minutes/60)+" ч";
}


/* =========================
   BACKTEST RENDER
========================= */

function renderBacktest(
  data,
  ind
){

  const tf=
    document.getElementById("timeframe").value;

  const horizons=HORIZONS[tf];

  let html=`

  <div class="card">

    <div class="sectionTitle">
      📊 Годовой бэктест
    </div>

    <div class="small">
      Свечей: ${data.length.toLocaleString()}
    </div>

  `;

  for(const h of horizons){

    const buy=
      calcSignalStats(
        data,
        ind,
        "BUY",
        h
      );

    const sell=
      calcSignalStats(
        data,
        ind,
        "SELL",
        h
      );

    html+=`

    <hr>

    <div class="sectionTitle">
      ${formatHorizon(h,tf)}

      <tr>

        <th>Средн.</th>
        <th>Лучший</th>
        <th>Худший</th>
      </tr>

      <tr>
        <td class="good">BUY</td>
        <td>${buy.n}</td>
        <td>${buy.accuracy===null?"—":buy.accuracy.toFixed(1)+"%"}</td>
        <td>${buy.avg===null?"—":pct(buy.avg)}</td>
        <td>${buy.best===null?"—":pct(buy.best)}</td>
        <td>${buy.worst===null?"—":pct(buy.worst)}</td>
      </tr>

      <tr>
        <td class="bad">SELL</td>
        <td>${sell.n}</td>
        <td>${sell.accuracy===null?"—":sell.accuracy.toFixed(1)+"%"}</td>
        <td>${sell.avg===null?"—":pct(sell.avg)}</td>
        <td>${sell.best===null?"—":pct(sell.best)}</td>
        <td>${sell.worst===null?"—":pct(sell.worst)}</td>
      </tr>

    </table>
    `;

    const bd=
      scoreDiagnostics(
        data,
        ind,
        "BUY",
        h
      );

    const sd=
      scoreDiagnostics(
        data,
        ind,
        "SELL",
        h
      );

    html+=`

    <details>
      <summary>Разбор BUY по Score</summary>

      <table>
        <tr>
          <th>Score</th>
          <th>N</th>
          <th>Успех</th>
          <th>Средн.</th>
        </tr>
    `;

    for(const b of bd.bands){

      const x=bd.stats[b];

      html+=`
      <tr>
        <td>${b}</td>
        <td>${x.n}</td>
        <td>${x.n ? (x.wins/x.n*100).toFixed(1)+"%" : "—"}</td>
        <td>${x.n ? pct(x.sum/x.n) : "—"}</td>
      </tr>
      `;
    }

    html+=`
      </table>
    </details>

    <details>
      <summary>Разбор SELL по Score</summary>

      <table>
        <tr>
          <th>Score</th>
          <th>N</th>
          <th>Успех</th>
          <th>Средн.</th>
        </tr>
    `;

    for(const b of sd.bands){

      const x=sd.stats[b];

      html+=`
      <tr>
        <td>${b}</td>
        <td>${x.n}</td>
        <td>${x.n ? (x.wins/x.n*100).toFixed(1)+"%" : "—"}</td>
        <td>${x.n ? pct(x.sum/x.n) : "—"}</td>
      </tr>
      `;
    }

    html+=`
      </table>
    </details>
    `;
  }

  html+=`

  <details>
    <summary>⚠️ Важное ограничение теста</summary>

    <div class="small" style="padding:10px">
      Результаты не учитывают комиссии,
      проскальзывание и налоги.
      Прошлая доходность не гарантирует
      будущую.
    </div>

  </details>

  </div>
  `;

  document.getElementById("backtest").innerHTML=html;
}

========================= */

async function runAnalysis(){

  const btn=
    document.getElementById("runBtn");

  const status=
    document.getElementById("status");

  btn.disabled=true;

  document.getElementById("live").innerHTML="";
  document.getElementById("backtest").innerHTML="";
  document.getElementById("diagnostics").innerHTML="";

  try{

    const tf=
      document.getElementById("timeframe").value;

    status.innerText=
      "Загружаем историю Binance...";

    candles=
      await fetchHistory(tf);

    if(candles.length<300){

      throw new Error(
        "Недостаточно исторических данных"
      );
    }

    status.innerText=
      "Рассчитываем индикаторы...";

    const ind=
      buildIndicators(candles);

    const last=
      candles.length-1;

    renderLive(ind,last);

    status.innerText=
      "Выполняем годовой бэктест...";

    await sleep(50);

    renderBacktest(
      candles,
      ind
    );

    status.innerText=
      "Выполняем диагностику факторов...";

    await sleep(50);

    renderDiagnostics(
      candles,
      ind
    );

    status.innerText=
      "Готово • v2.3";

  }catch(e){

    console.error(e);

    status.innerText=
      "Ошибка: "+e.message;

  }finally{

    btn.disabled=false;
  }
}
