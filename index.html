<script>

"use strict";

/* =========================
   НАСТРОЙКИ
========================= */

const BINANCE =
"https://api.binance.com/api/v3/klines";

const TF={
 "15m":900000,
 "1h":3600000,
 "4h":14400000,
 "1d":86400000
};

/*
 Не загружаем лишнее.
 Этого более чем достаточно для анализа.
*/

const HISTORY_DAYS={
 "15m":90,
 "1h":365,
 "4h":730,
 "1d":1825
};

const HORIZONS={
 "15m":[4,16,96],
 "1h":[1,4,24],
 "4h":[1,6],
 "1d":[1]
};

let currentCloseForSignal=0;


/* =========================
   UI
========================= */

const statusEl=document.getElementById("status");
const button=document.getElementById("analyzeBtn");

function status(text,error=false){
 statusEl.className=error?"status error":"status";
 statusEl.textContent=text;
}

function sleep(ms){
 return new Promise(r=>setTimeout(r,ms));
}

function pct(x){
 if(x===null || x===undefined || !Number.isFinite(Number(x)))
  return "—";

 const n=Number(x);
 return (n>=0?"+":"")+n.toFixed(2)+"%";
}

function fmtPrice(x){
 const n=Number(x);
 if(!Number.isFinite(n)) return "—";

 return n.toLocaleString("en-US",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function formatHorizon(tf,h){

 if(tf==="15m"){
  if(h===4)return "1 час";
  if(h===16)return "4 часа";
  if(h===96)return "24 часа";
 }

 if(tf==="1h"){
  if(h===1)return "1 час";
  if(h===4)return "4 часа";
  if(h===24)return "24 часа";
 }

 if(tf==="4h"){
  if(h===1)return "4 часа";
  if(h===6)return "24 часа";
 }

 if(tf==="1d" && h===1)return "24 часа";

 return h+" свеч.";
}


/* =========================
   BINANCE
========================= */

async function fetchJSON(url,timeout=20000){

 const controller=new AbortController();

 const timer=setTimeout(
  ()=>controller.abort(),
  timeout
 );

 try{

  const response=await fetch(url,{
   cache:"no-store",
   signal:controller.signal
  });

  if(!response.ok){
   throw new Error(
    "Binance HTTP "+response.status
   );
  }

  return await response.json();

 }catch(e){

  if(e.name==="AbortError"){
   throw new Error(
    "Превышено время ожидания Binance"
   );
  }

  throw e;

 }finally{

  clearTimeout(timer);

 }
}


async function fetchHistory(tf){

 const days=HISTORY_DAYS[tf];
 const interval=TF[tf];

 const end=Date.now();
 const start=end-days*86400000;

 let cursor=start;
 const all=[];

 const totalRequests=
  Math.ceil(
   (end-start)/
   (interval*1000)
  );

 let requestNo=0;

 while(cursor<end){

  requestNo++;

  status(
   "Загрузка истории: "+
   requestNo+
   " / примерно "+
   totalRequests+
   "..."
  );

  const url=
   BINANCE+
   "?symbol=BTCUSDT"+
   "&interval="+tf+
   "&limit=1000"+
   "&startTime="+cursor+
   "&endTime="+end;

  let data=null;
  let lastError=null;

  for(let attempt=1;attempt<=3;attempt++){

   try{

    data=await fetchJSON(url,20000);
    break;

   }catch(e){

    lastError=e;

    status(
     "Ошибка соединения. Повтор "+
     attempt+
     "/3..."
    );

    await sleep(1000*attempt);

   }

  }

  if(!data){

   throw new Error(
    "Binance не отвечает.\n"+
    (lastError?.message || "Неизвестная ошибка")
   );

  }

  if(!Array.isArray(data)){

   throw new Error(
    "Binance вернул неожиданный ответ."
   );

  }

  if(data.length===0) break;

  for(const k of data){

   all.push({
    openTime:Number(k[0]),
    open:Number(k[1]),
    high:Number(k[2]),
    low:Number(k[3]),
    close:Number(k[4]),
    volume:Number(k[5])
   });

  }

  const lastTime=
   Number(data[data.length-1][0]);

  const next=
   lastTime+interval;

  if(next<=cursor) break;

  cursor=next;

  if(data.length<1000) break;

  await sleep(150);

 }

 /*
  Убираем возможные дубликаты.
 */

 const map=new Map();

 for(const x of all){
  map.set(x.openTime,x);
 }

 const result=
  Array.from(map.values())
  .sort((a,b)=>a.openTime-b.openTime);

 if(result.length<250){

  throw new Error(
   "Получено слишком мало истории: "+
   result.length+
   " свечей."
  );

 }

 return result;
}


/* =========================
   EMA
========================= */

function ema(values,period){

 const result=
  new Array(values.length).fill(null);

 if(values.length<period)return result;

 let sum=0;

 for(let i=0;i<period;i++)
  sum+=values[i];

 let prev=sum/period;

 result[period-1]=prev;

 const k=2/(period+1);

 for(let i=period;i<values.length;i++){

  prev=
   values[i]*k+
   prev*(1-k);

  result[i]=prev;
 }

 return result;
}


/* =========================
   RSI
========================= */

function rsi(values,period=14){

 const result=
  new Array(values.length).fill(null);

 if(values.length<=period)return result;

 let gains=0;
 let losses=0;

 for(let i=1;i<=period;i++){

  const d=values[i]-values[i-1];

  if(d>=0) gains+=d;
  else losses-=d;

 }

 let avgGain=gains/period;
 let avgLoss=losses/period;

 result[period]=
  avgLoss===0
  ?100
  :100-(100/(1+avgGain/avgLoss));

 for(let i=period+1;i<values.length;i++){

  const d=values[i]-values[i-1];

  const gain=d>0?d:0;
  const loss=d<0?-d:0;

  avgGain=
   (avgGain*(period-1)+gain)/period;

  avgLoss=
   (avgLoss*(period-1)+loss)/period;

  result[i]=
   avgLoss===0
   ?100
   :100-(100/(1+avgGain/avgLoss));
 }

 return result;
}


/* =========================
   MACD
========================= */

function macd(values){

 const e12=ema(values,12);
 const e26=ema(values,26);

 const line=
  new Array(values.length).fill(null);

 for(let i=0;i<values.length;i++){

  if(e12[i]!==null && e26[i]!==null)
   line[i]=e12[i]-e26[i];

 }

 const valid=[];
 const indexes=[];

 for(let i=0;i<line.length;i++){

  if(line[i]!==null){
   valid.push(line[i]);
   indexes.push(i);
  }

 }

 const sigValid=ema(valid,9);

 const signal=
  new Array(values.length).fill(null);

 const histogram=
  new Array(values.length).fill(null);

 for(let j=0;j<indexes.length;j++){

  const i=indexes[j];

  if(sigValid[j]!==null){

   signal[i]=sigValid[j];
   histogram[i]=line[i]-signal[i];

  }

 }

 return {line,signal,histogram};
}


/* =========================
   ADX
========================= */

function adx(data,period=14){

 const n=data.length;

 const result=
  new Array(n).fill(null);

 const plusDI=
  new Array(n).fill(null);

 const minusDI=
  new Array(n).fill(null);

 if(n<period*2+1)
  return {adx:result,plusDI,minusDI};

 const tr=new Array(n).fill(0);
 const plusDM=new Array(n).fill(0);
 const minusDM=new Array(n).fill(0);

 for(let i=1;i<n;i++){

  const h=data[i].high;
  const l=data[i].low;

  const ph=data[i-1].high;
  const pl=data[i-1].low;
  const pc=data[i-1].close;

  tr[i]=Math.max(
   h-l,
   Math.abs(h-pc),
   Math.abs(l-pc)
  );

  const up=h-ph;
  const down=pl-l;

  plusDM[i]=
   up>down && up>0 ? up : 0;

  minusDM[i]=
   down>up && down>0 ? down : 0;
 }

 let atr=0;
 let pDM=0;
 let mDM=0;

 for(let i=1;i<=period;i++){
  atr+=tr[i];
  pDM+=plusDM[i];
  mDM+=minusDM[i];
 }

 const dx=[];

 for(let i=period;i<n;i++){

  if(i>period){

   atr=atr-atr/period+tr[i];
   pDM=pDM-pDM/period+plusDM[i];
   mDM=mDM-mDM/period+minusDM[i];

  }

  if(atr===0)continue;

  const pdi=100*pDM/atr;
  const mdi=100*mDM/atr;

  plusDI[i]=pdi;
  minusDI[i]=mdi;

  const sum=pdi+mdi;

  const dxValue=
   sum===0
   ?0
   :100*Math.abs(pdi-mdi)/sum;

  dx.push({i,value:dxValue});
 }

 if(dx.length<period)
  return {adx:result,plusDI,minusDI};

 let sum=0;

 for(let j=0;j<period;j++)
  sum+=dx[j].value;

 result[dx[period-1].i]=sum/period;

 for(let j=period;j<dx.length;j++){

  const prev=result[dx[j-1].i];

  if(prev!==null){

   result[dx[j].i]=
    (prev*(period-1)+dx[j].value)/period;

  }

 }

 return {adx:result,plusDI,minusDI};
}


/* =========================
   INDICATORS
========================= */

function buildIndicators(data){

 const close=data.map(x=>x.close);
 const volume=data.map(x=>x.volume);

 const e20=ema(close,20);
 const e50=ema(close,50);
 const e200=ema(close,200);

 const r=rsi(close,14);
 const m=macd(close);
 const a=adx(data,14);

 const volumeRatio=
  new Array(data.length).fill(null);

 for(let i=20;i<data.length;i++){

  let sum=0;

  for(let j=i-20;j<i;j++)
   sum+=volume[j];

  const avg=sum/20;

  if(avg>0)
   volumeRatio[i]=volume[i]/avg;
 }

 return {
  ema20:e20,
  ema50:e50,
  ema200:e200,
  rsi:r,
  macd:m.line,
  macdSignal:m.signal,
  macdHistogram:m.histogram,
  adx:a.adx,
  plusDI:a.plusDI,
  minusDI:a.minusDI,
  volumeRatio
 };
}


/* =========================
   REGIME
========================= */

function getRegime(ind,i){

 const a=ind.adx[i];
 const p=ind.plusDI[i];
 const m=ind.minusDI[i];

 if(a===null || p===null || m===null)
  return "UNKNOWN";

 if(a<20)return "FLAT";
 if(a<=25)return "TRANSITION";

 return p>m?"BULL":"BEAR";
}


/* =========================
   SIGNAL
========================= */

function getSignal(ind,i){

 let bull=0;
 let bear=0;

 if(
  ind.ema20[i]!==null &&
  ind.ema50[i]!==null
 ){

  if(ind.ema20[i]>ind.ema50[i])
   bull+=20;
  else
   bear+=20;
 }

 if(ind.ema200[i]!==null){

  if(currentCloseForSignal>ind.ema200[i])
   bull+=20;
  else
   bear+=20;
 }

 const r=ind.rsi[i];

 if(r!==null){

  if(r>=52 && r<=68)
   bull+=20;
  else if(r>75)
   bear+=10;
  else if(r<30)
   bull+=10;
  else if(r<45)
   bear+=15;
  else{
   bull+=10;
   bear+=10;
  }
 }

 if(ind.macd[i]!==null){

  if(ind.macd[i]>0)
   bull+=20;
  else
   bear+=20;
 }

 const vr=ind.volumeRatio[i];

 if(vr!==null){

  if(vr>=1.25){

   if(currentCloseForSignal>ind.ema20[i])
    bull+=20;
   else
    bear+=20;

  }else{

   bull+=10;
   bear+=10;

  }
 }

 const score=Math.max(
  0,
  Math.min(100,50+(bull-bear)/2)
 );

 let signal="HOLD";

 if(score>=70)signal="BUY";
 else if(score<=30)signal="SELL";

 return {signal,score,bull,bear};
}


/* =========================
   RETURN
========================= */

function directionalReturn(data,i,h,direction){

 const entry=i+1;
 const exit=i+1+h;

 if(entry>=data.length || exit>=data.length)
  return null;

 const p1=data[entry].open;
 const p2=data[exit].open;

 if(!Number.isFinite(p1) ||
    !Number.isFinite(p2) ||
    p1<=0)
  return null;

 const raw=(p2-p1)/p1*100;

 return direction==="SELL" ? -raw : raw;
}


/* =========================
   STATS
========================= */

function stats(data,ind,signal,h){

 let n=0;
 let wins=0;
 let total=0;
 let best=-Infinity;
 let worst=Infinity;

 const maxI=data.length-h-2;

 for(let i=200;i<=maxI;i++){

  currentCloseForSignal=data[i].close;

  const s=getSignal(ind,i);

  if(s.signal!==signal)continue;

  const ret=
   directionalReturn(data,i,h,signal);

  if(ret===null)continue;

  n++;
  total+=ret;

  if(ret>0)wins++;

  best=Math.max(best,ret);
  worst=Math.min(worst,ret);
 }

 if(n===0)
  return {n:0,accuracy:null,avg:null,best:null,worst:null};

 return {
  n,
  accuracy:wins/n*100,
  avg:total/n,
  best,
  worst
 };
}


/* =========================
   FACTORS
========================= */

function getFactors(){

 return [

  {
   name:"EMA20 > EMA50",
   fn:(ind,i)=>
    ind.ema20[i]!==null &&
    ind.ema50[i]!==null &&
    ind.ema20[i]>ind.ema50[i]
  },

  {
   name:"Цена > EMA200",
   fn:(ind,i)=>
    ind.ema200[i]!==null &&
    currentCloseForSignal>ind.ema200[i]
  },

  {
   name:"MACD > 0",
   fn:(ind,i)=>
    ind.macd[i]!==null &&
    ind.macd[i]>0
  },

  {
   name:"MACD Histogram > 0",
   fn:(ind,i)=>
    ind.macdHistogram[i]!==null &&
    ind.macdHistogram[i]>0
  },

  {
   name:"RSI 52–68",
   fn:(ind,i)=>
    ind.rsi[i]!==null &&
    ind.rsi[i]>=52 &&
    ind.rsi[i]<=68
  },

  {
   name:"Volume >= 1.25",
   fn:(ind,i)=>
    ind.volumeRatio[i]!==null &&
    ind.volumeRatio[i]>=1.25
  }

 ];
}


/* =========================
   COMBINATIONS
========================= */

function generateCombinations(factors){

 const result=[];

 for(let a=0;a<factors.length;a++){

  for(let b=a+1;b<factors.length;b++){

   result.push({
    factors:[factors[a],factors[b]]
   });

   for(let c=b+1;c<factors.length;c++){

    result.push({
     factors:[
      factors[a],
      factors[b],
      factors[c]
     ]
    });

   }
  }
 }

 return result;
}


function combinationStats(data,ind,combo,h){

 let n=0;
 let wins=0;
 let total=0;
 let best=-Infinity;
 let worst=Infinity;

 const maxI=data.length-h-2;

 for(let i=200;i<=maxI;i++){

  currentCloseForSignal=data[i].close;

  let match=true;

  for(const f of combo.factors){

   if(!f.fn(ind,i)){
    match=false;
    break;
   }

  }

  if(!match)continue;

  const ret=
   directionalReturn(data,i,h,"BUY");

  if(ret===null)continue;

  n++;
  total+=ret;

  if(ret>0)wins++;

  best=Math.max(best,ret);
  worst=Math.min(worst,ret);
 }

 if(n===0)
  return {n:0,accuracy:null,avg:null,best:null,worst:null};

 return {
  n,
  accuracy:wins/n*100,
  avg:total/n,
  best,
  worst
 };
}


/* =========================
   RENDER LIVE
========================= */

function renderLive(data,ind,tf){

 const i=data.length-1;

 currentCloseForSignal=data[i].close;

 const s=getSignal(ind,i);
 const regime=getRegime(ind,i);

 const signalClass=
  s.signal==="BUY"
  ?"buy"
  :s.signal==="SELL"
  ?"sell"
  :"hold";

 document.getElementById("live").innerHTML=`

 <div class="panel">

  <div class="section-title">
   Текущий рынок
  </div>

  <div class="price">
   $${fmtPrice(data[i].close)}
  </div>

  <div class="grid">

   <div class="card">
    <div class="card-title">Сигнал</div>
    <div class="card-value ${signalClass}">
     ${s.signal}
    </div>
   </div>

   <div class="card">
    <div class="card-title">Score</div>
    <div class="card-value">
     ${s.score.toFixed(0)}/100
    </div>
   </div>

   <div class="card">
    <div class="card-title">Режим</div>
    <div class="card-value">
     ${regime}
    </div>
   </div>

   <div class="card">
    <div class="card-title">RSI</div>
    <div class="card-value">
     ${ind.rsi[i]===null?"—":ind.rsi[i].toFixed(1)}
    </div>
   </div>

   <div class="card">
    <div class="card-title">ADX</div>
    <div class="card-value">
     ${ind.adx[i]===null?"—":ind.adx[i].toFixed(1)}
    </div>
   </div>

   <div class="card">
    <div class="card-title">MACD</div>
    <div class="card-value">
     ${ind.macd[i]===null?"—":ind.macd[i].toFixed(2)}
    </div>
   </div>

  </div>

 </div>
 `;
}


/* =========================
   BACKTEST
========================= */

function renderBacktest(data,ind,tf){

 let html=`

 <div class="panel">

 <div class="section-title">
  📊 Историческая эффективность
 </div>

 <table>
 <thead>
 <tr>
 <th>Горизонт</th>
 <th>BUY N</th>
 <th>Успех</th>
 <th>Средн.</th>
 <th>SELL N</th>
 <th>Успех</th>
 <th>Средн.</th>
 </tr>
 </thead>
 <tbody>
 `;

 for(const h of HORIZONS[tf]){

  const buy=stats(data,ind,"BUY",h);
  const sell=stats(data,ind,"SELL",h);

  html+=`

  <tr>
   <td>${formatHorizon(tf,h)}</td>

   <td>${buy.n}</td>

   <td>
    ${buy.accuracy===null?"—":buy.accuracy.toFixed(1)+"%"}
   </td>

   <td class="${buy.avg>0?"positive":"negative"}">
    ${pct(buy.avg)}
   </td>

   <td>${sell.n}</td>

   <td>
    ${sell.accuracy===null?"—":sell.accuracy.toFixed(1)+"%"}
   </td>

   <td class="${sell.avg>0?"positive":"negative"}">
    ${pct(sell.avg)}
   </td>
  </tr>
  `;
 }

 html+=`
 </tbody>
 </table>

 </div>
 `;

 document.getElementById("backtest").innerHTML=html;
}


/* =========================
   DIAGNOSTICS
========================= */

function renderDiagnostics(data,ind,tf){

 const h=
  tf==="15m"?96:
  tf==="1h"?24:
  tf==="4h"?6:1;

 const regimes=[
  "BULL",
  "BEAR",
  "FLAT",
  "TRANSITION"
 ];

 const factors=getFactors();

 let html=`

 <div class="panel">

 <div class="section-title">
  Market Regime Diagnostics
 </div>

 <div class="small">
  Отдельная проверка факторов на горизонте
  ${formatHorizon(tf,h)}.
 </div>

 <table>

 <thead>
 <tr>
 <th>Фактор</th>
 `;

 for(const r of regimes)
  html+=`<th>${r}</th>`;

 html+=`
 </tr>
 </thead>
 <tbody>
 `;

 for(const factor of factors){

  html+=`<tr><td>${factor.name}</td>`;

  for(const regime of regimes){

   let n=0;
   let wins=0;
   let total=0;

   const maxI=data.length-h-2;

   for(let i=200;i<=maxI;i++){

    currentCloseForSignal=data[i].close;

    if(getRegime(ind,i)!==regime)
     continue;

    if(!factor.fn(ind,i))
     continue;

    const ret=
     directionalReturn(data,i,h,"BUY");

    if(ret===null)continue;

    n++;
    total+=ret;

    if(ret>0)wins++;
   }

   if(n===0){

    html+=`<td>—</td>`;

   }else{

    const acc=wins/n*100;
    const avg=total/n;

    html+=`
     <td>
      ${acc.toFixed(0)}%
      <br>
      <span class="${avg>=0?"positive":"negative"}">
       ${pct(avg)}
      </span>
      <br>
      <span class="small">N=${n}</span>
     </td>
    `;
   }
  }

  html+=`</tr>`;
 }

 html+=`
 </tbody>
 </table>
 </div>
 `;

 document.getElementById("diagnostics").innerHTML=html;
}


/* =========================
   COMBINATIONS RENDER
========================= */

function renderCombinations(data,ind,tf){

 const h=
  tf==="15m"?96:
  tf==="1h"?24:
  tf==="4h"?6:1;

 const factors=getFactors();
 const combinations=generateCombinations(factors);

 const results=[];

 for(const combo of combinations){

  const s=
   combinationStats(data,ind,combo,h);

  if(s.n>0)
   results.push({...combo,...s});
 }

 results.sort((a,b)=>{

  const sa=
   a.n>=30?a.avg:a.avg*.35;

  const sb=
   b.n>=30?b.avg:b.avg*.35;

  return sb-sa;
 });

 let html=`

 <div class="panel">

 <div class="section-title">
  🔎 Лучшие комбинации 2–3 факторов
 </div>

 <div class="small">
  Горизонт: <b>${formatHorizon(tf,h)}</b>.
  Направление: <b>BUY</b>.
 </div>

 <hr>

 <table>
 <thead>
 <tr>
 <th>Комбинация</th>
 <th>N</th>
 <th>Успех</th>
 <th>Средн.</th>
 <th>Лучший</th>
 <th>Худший</th>
 </tr>
 </thead>
 <tbody>
 `;

 for(const item of results.slice(0,20)){

  let cls="combo-bad";
  let badge="";

  if(
   item.n>=100 &&
   item.avg>0 &&
   item.accuracy>=53
  ){

   cls="combo-good";
   badge=
    '<span class="badge badge-good">ИНТЕРЕСНО</span>';

  }else if(
   item.n>=30 &&
   item.avg>0
  ){

   cls="combo-medium";
   badge=
    '<span class="badge badge-warning">КАНДИДАТ</span>';

  }else{

   badge=
    '<span class="badge badge-danger">МАЛО N</span>';
  }

  const name=
   item.factors.map(x=>x.name).join(" + ");

  html+=`

  <tr class="${cls}">

   <td class="combo-name">
    ${name}${badge}
   </td>

   <td>${item.n}</td>

   <td>
    ${item.accuracy.toFixed(1)}%
   </td>

   <td class="${item.avg>=0?"positive":"negative"}">
    ${pct(item.avg)}
   </td>

   <td>${pct(item.best)}</td>
   <td>${pct(item.worst)}</td>

  </tr>
  `;
 }

 html+=`
 </tbody>
 </table>

 <div class="small" style="margin-top:14px">

 🟢 <b>ИНТЕРЕСНО</b> —
 минимум 100 наблюдений,
 успех ≥53% и положительная
 средняя доходность.<br><br>

 🟡 <b>КАНДИДАТ</b> —
 минимум 30 наблюдений
 и положительная доходность.<br><br>

 🔴 <b>МАЛО N</b> —
 наблюдений недостаточно.

 </div>

 </div>
 `;

 document.getElementById("combinations").innerHTML=html;
}


/* =========================
   ОСНОВНОЙ ЗАПУСК
========================= */

async function runAnalysis(){

 if(button.disabled)return;

 const tf=
  document.getElementById("timeframe").value;

 button.disabled=true;

 document.getElementById("live").innerHTML="";
 document.getElementById("backtest").innerHTML="";
 document.getElementById("diagnostics").innerHTML="";
 document.getElementById("combinations").innerHTML="";

 try{

  status("Начинаю анализ BTC...");

  const data=
   await fetchHistory(tf);

  status(
   "История загружена: "+
   data.length+
   " свечей. Расчёт индикаторов..."
  );

  /*
   Даём браузеру немного времени
   обновить экран.
  */

  await sleep(100);

  const ind=
   buildIndicators(data);

  status(
   "Индикаторы рассчитаны. Анализ..."
  );

  await sleep(100);

  renderLive(data,ind,tf);
  renderBacktest(data,ind,tf);
  renderDiagnostics(data,ind,tf);
  renderCombinations(data,ind,tf);

  status(
   "Готово. Проанализировано "+
   data.length+
   " свечей."
  );

 }catch(e){

  console.error(e);

  status(
   "ОШИБКА:\n"+
   (e.message||String(e)),
   true
  );

 }finally{

  button.disabled=false;

 }
}


/* =========================
   КНОПКА
========================= */

button.addEventListener(
 "click",
 runAnalysis
);
