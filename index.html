<script>

const VERSION="2.8.1";
const SYMBOL="BTCUSDT";
const API="https://api.binance.com/api/v3/klines";

const FACTORS={
  emaTrend:{
    name:"EMA20 > EMA50",
    short:"EMA20>EMA50"
  },
  price200:{
    name:"Цена > EMA200",
    short:"Цена>EMA200"
  },
  macd:{
    name:"MACD > 0",
    short:"MACD>0"
  },
  macdHist:{
    name:"MACD Histogram > 0",
    short:"MACD-Hist>0"
  },
  rsi52:{
    name:"RSI > 52",
    short:"RSI>52"
  },
  rsiRange:{
    name:"RSI 52–65",
    short:"RSI 52–65"
  },
  adx:{
    name:"ADX > 25",
    short:"ADX>25"
  },
  volume:{
    name:"Volume > average",
    short:"Volume>Avg"
  }
};

const FACTOR_KEYS=Object.keys(FACTORS);


/* =========================================================
   BINANCE
========================================================= */

async function fetchKlines(){

  const url=
    API+
    "?symbol="+SYMBOL+
    "&interval=1d"+
    "&limit=1500";

  const r=await fetch(url);

  if(!r.ok)
    throw new Error("Binance HTTP "+r.status);

  const raw=await r.json();

  return raw.map(x=>({
    time:x[0],
    open:+x[1],
    high:+x[2],
    low:+x[3],
    close:+x[4],
    volume:+x[5]
  }));
}


/* =========================================================
   EMA
========================================================= */

function ema(values,p){

  const out=new Array(values.length).fill(null);

  if(values.length<p)return out;

  let sum=0;

  for(let i=0;i<p;i++)
    sum+=values[i];

  let prev=sum/p;

  out[p-1]=prev;

  const k=2/(p+1);

  for(let i=p;i<values.length;i++){

    prev=
      values[i]*k+
      prev*(1-k);

    out[i]=prev;
  }

  return out;
}


/* =========================================================
   RSI
========================================================= */

function rsi(values,p=14){

  const out=new Array(values.length).fill(null);

  if(values.length<=p)return out;

  let gain=0;
  let loss=0;

  for(let i=1;i<=p;i++){

    const d=
      values[i]-
      values[i-1];

    if(d>=0)
      gain+=d;
    else
      loss-=d;
  }

  let avgGain=gain/p;
  let avgLoss=loss/p;

  out[p]=
    avgLoss===0
      ?100
      :100-100/(1+avgGain/avgLoss);

  for(let i=p+1;i<values.length;i++){

    const d=
      values[i]-
      values[i-1];

    const g=d>0?d:0;
    const l=d<0?-d:0;

    avgGain=
      (avgGain*(p-1)+g)/p;

    avgLoss=
      (avgLoss*(p-1)+l)/p;

    out[i]=
      avgLoss===0
        ?100
        :100-100/(1+avgGain/avgLoss);
  }

  return out;
}


/* =========================================================
   MACD
========================================================= */

function macd(values){

  const e12=ema(values,12);
  const e26=ema(values,26);

  const line=
    new Array(values.length).fill(null);

  for(let i=0;i<values.length;i++){

    if(
      e12[i]!=null &&
      e26[i]!=null
    ){
      line[i]=e12[i]-e26[i];
    }
  }

  const valid=[];
  const indexes=[];

  for(let i=0;i<line.length;i++){

    if(line[i]!=null){

      valid.push(line[i]);
      indexes.push(i);
    }
  }

  const sigValid=ema(valid,9);

  const signal=
    new Array(values.length).fill(null);

  const hist=
    new Array(values.length).fill(null);

  for(let j=0;j<indexes.length;j++){

    const i=indexes[j];

    if(sigValid[j]!=null){

      signal[i]=sigValid[j];

      hist[i]=
        line[i]-
        signal[i];
    }
  }

  return{
    line,
    signal,
    hist
  };
}


/* =========================================================
   ADX
========================================================= */

function adx(high,low,close,p=14){

  const n=close.length;

  const out=
    new Array(n).fill(null);

  if(n<p*2+2)return out;

  const tr=
    new Array(n).fill(0);

  const plusDM=
    new Array(n).fill(0);

  const minusDM=
    new Array(n).fill(0);

  for(let i=1;i<n;i++){

    const up=
      high[i]-high[i-1];

    const down=
      low[i-1]-low[i];

    plusDM[i]=
      up>down && up>0
        ?up
        :0;

    minusDM[i]=
      down>up && down>0
        ?down
        :0;

    tr[i]=Math.max(
      high[i]-low[i],
      Math.abs(
        high[i]-close[i-1]
      ),
      Math.abs(
        low[i]-close[i-1]
      )
    );
  }

  let atr=0;
  let pdm=0;
  let mdm=0;

  for(let i=1;i<=p;i++){

    atr+=tr[i];
    pdm+=plusDM[i];
    mdm+=minusDM[i];
  }

  atr/=p;
  pdm/=p;
  mdm/=p;

  const dx=[];

  for(let i=p;i<n;i++){

    if(i>p){

      atr=
        (atr*(p-1)+tr[i])/p;

      pdm=
        (pdm*(p-1)+plusDM[i])/p;

      mdm=
        (mdm*(p-1)+minusDM[i])/p;
    }

    const plusDI=
      atr
        ?100*pdm/atr
        :0;

    const minusDI=
      atr
        ?100*mdm/atr
        :0;

    const sum=
      plusDI+
      minusDI;

    const dxi=
      sum
        ?100*
         Math.abs(
           plusDI-minusDI
         )/sum
        :0;

    dx.push({
      i,
      dx:dxi
    });
  }

  if(dx.length<p)return out;

  let adxVal=0;

  for(let j=0;j<p;j++)
    adxVal+=dx[j].dx;

  adxVal/=p;

  out[
    dx[p-1].i
  ]=adxVal;

  for(
    let j=p;
    j<dx.length;
    j++
  ){

    adxVal=
      (adxVal*(p-1)+
       dx[j].dx)/p;

    out[
      dx[j].i
    ]=adxVal;
  }

  return out;
}


/* =========================================================
   PREPARE
========================================================= */

function prepare(raw){

  const close=
    raw.map(x=>x.close);

  const high=
    raw.map(x=>x.high);

  const low=
    raw.map(x=>x.low);

  const volume=
    raw.map(x=>x.volume);

  const e20=ema(close,20);
  const e50=ema(close,50);
  const e200=ema(close,200);

  const rr=rsi(close,14);
  const mm=macd(close);
  const aa=adx(
    high,
    low,
    close,
    14
  );

  const volAvg=
    new Array(raw.length)
    .fill(null);

  for(let i=19;i<raw.length;i++){

    let s=0;

    for(
      let j=i-19;
      j<=i;
      j++
    ){
      s+=volume[j];
    }

    volAvg[i]=s/20;
  }

  return raw.map((x,i)=>({

    ...x,

    ema20:e20[i],
    ema50:e50[i],
    ema200:e200[i],

    rsi:rr[i],

    macd:mm.line[i],
    macdSignal:mm.signal[i],
    macdHist:mm.hist[i],

    adx:aa[i],

    volAvg:volAvg[i]
  }));
}


/* =========================================================
   FACTORS
========================================================= */

function factorValue(d,key){

  if(!d)return false;

  switch(key){

    case"emaTrend":
      return(
        d.ema20!=null &&
        d.ema50!=null &&
        d.ema20>d.ema50
      );

    case"price200":
      return(
        d.ema200!=null &&
        d.close>d.ema200
      );

    case"macd":
      return(
        d.macd!=null &&
        d.macd>0
      );

    case"macdHist":
      return(
        d.macdHist!=null &&
        d.macdHist>0
      );

    case"rsi52":
      return(
        d.rsi!=null &&
        d.rsi>52
      );

    case"rsiRange":
      return(
        d.rsi!=null &&
        d.rsi>=52 &&
        d.rsi<=65
      );

    case"adx":
      return(
        d.adx!=null &&
        d.adx>25
      );

    case"volume":
      return(
        d.volAvg!=null &&
        d.volume>d.volAvg
      );

    default:
      return false;
  }
}


function activeFactors(d){

  return FACTOR_KEYS.filter(
    k=>factorValue(d,k)
  );
}


/* =========================================================
   24H RETURN
========================================================= */

function futureReturn(data,i){

  if(i+1>=data.length)
    return null;

  const entry=
    data[i+1].open;

  const exit=
    data[i+1].close;

  if(!entry || !exit)
    return null;

  return exit/entry-1;
}


/* =========================================================
   PRECALCULATE RETURNS
========================================================= */

function buildReturns(data){

  const r=
    new Array(data.length)
    .fill(null);

  for(let i=0;i<data.length;i++)
    r[i]=futureReturn(data,i);

  return r;
}


/* =========================================================
   BASIC STATS
========================================================= */

function stats(values){

  const a=
    values.filter(
      x=>Number.isFinite(x)
    );

  if(!a.length){

    return{
      n:0,
      avg:0,
      median:0,
      win:0,
      plus1:0,
      minus1:0
    };
  }

  const sorted=
    [...a].sort(
      (x,y)=>x-y
    );

  const avg=
    a.reduce(
      (s,x)=>s+x,
      0
    )/a.length;

  const mid=
    Math.floor(
      sorted.length/2
    );

  const median=
    sorted.length%2
      ?sorted[mid]
      :(sorted[mid-1]+
        sorted[mid])/2;

  return{

    n:a.length,

    avg,

    median,

    win:
      a.filter(
        x=>x>0
      ).length/a.length,

    plus1:
      a.filter(
        x=>x>=0.01
      ).length/a.length,

    minus1:
      a.filter(
        x=>x<=-0.01
      ).length/a.length
  };
}


/* =========================================================
   COMBO MATCH
========================================================= */

function comboMatches(
  data,
  i,
  keys
){

  for(const k of keys){

    if(
      !factorValue(
        data[i],
        k
      )
    ){
      return false;
    }
  }

  return true;
}


/* =========================================================
   COMBINATION STATS
========================================================= */

function comboStats(
  data,
  returns,
  keys,
  start=0,
  end=data.length
){

  const values=[];
  const indexes=[];

  for(
    let i=Math.max(200,start);
    i<Math.min(
      end,
      data.length-1
    );
    i++
  ){

    if(
      returns[i]==null
    )continue;

    if(
      comboMatches(
        data,
        i,
        keys
      )
    ){

      values.push(
        returns[i]
      );

      indexes.push(i);
    }
  }

  const s=stats(values);

  /*
    ВАЖНО:

    Здесь baseline больше НЕ считается
    только на selected-свечах.

    Это просто статистика комбинации.
    Настоящий baseline для edge будет
    рассчитан отдельно по ВСЕМУ
    соответствующему периоду.
  */

  return{
    ...s,
    indexes
  };
}


/* =========================================================
   BASELINE ПЕРИОДА
========================================================= */

function periodBaseline(
  returns,
  start,
  end
){

  const values=[];

  for(
    let i=start;
    i<end;
    i++
  ){

    if(
      returns[i]!=null
    ){
      values.push(
        returns[i]
      );
    }
  }

  return stats(values);
}


/* =========================================================
   FOLD CREATION
========================================================= */

function makeFolds(n){

  const folds=[];

  const firstTrain=
    Math.max(
      350,
      Math.floor(n*0.35)
    );

  const remaining=
    n-firstTrain;

  if(remaining<200)
    return folds;

  const testSize=
    Math.max(
      30,
      Math.floor(
        remaining/5
      )
    );

  for(
    let f=0;
    f<5;
    f++
  ){

    const trainEnd=
      firstTrain+
      f*testSize;

    const testStart=
      trainEnd;

    const testEnd=
      f===4
        ?n
        :Math.min(
          n,
          testStart+
          testSize
        );

    if(
      testEnd-
      testStart<20
    )continue;

    folds.push({
      trainStart:0,
      trainEnd,
      testStart,
      testEnd
    });
  }

  return folds;
}


/* =========================================================
   WALK FORWARD — ИСПРАВЛЕННЫЙ
========================================================= */

function walkForward(
  data,
  returns,
  keys
){

  /*
    Индексы всех валидных наблюдений.
  */

  const indexes=[];

  for(
    let i=200;
    i<data.length-1;
    i++
  ){

    if(
      returns[i]!=null
    ){
      indexes.push(i);
    }
  }

  if(indexes.length<250)
    return null;

  const folds=
    makeFolds(
      indexes.length
    );

  const tests=[];

  for(const f of folds){

    const trainIndexes=
      indexes.slice(
        f.trainStart,
        f.trainEnd
      );

    const testIndexes=
      indexes.slice(
        f.testStart,
        f.testEnd
      );

    /*
      TRAIN
    */

    const trainValues=[];

    for(
      const i of trainIndexes
    ){

      if(
        comboMatches(
          data,
          i,
          keys
        )
      ){

        trainValues.push(
          returns[i]
        );
      }
    }

    /*
      Редкие комбинации
      не анализируем.
    */

    if(
      trainValues.length<20
    ){
      continue;
    }

    const trainStats=
      stats(trainValues);


    /*
      TEST:

      selected returns
      против ВСЕГО BTC
      на этом же test window.
    */

    const testValues=[];

    for(
      const i of testIndexes
    ){

      if(
        comboMatches(
          data,
          i,
          keys
        )
      ){

        testValues.push(
          returns[i]
        );
      }
    }

    if(
      testValues.length<10
    ){
      continue;
    }

    const ts=
      stats(testValues);

    /*
      КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ.

      baseline = ВСЕ наблюдения
      внутри test периода.
    */

    const firstIndex=
      testIndexes[0];

    const lastIndex=
      testIndexes[
        testIndexes.length-1
      ];

    const bs=
      periodBaseline(
        returns,
        firstIndex,
        lastIndex+1
      );

    const edge=
      ts.avg-
      bs.avg;

    const medianEdge=
      ts.median-
      bs.median;

    tests.push({

      trainN:
        trainValues.length,

      trainAvg:
        trainStats.avg,

      testN:
        testValues.length,

      testAvg:
        ts.avg,

      testMedian:
        ts.median,

      baseN:
        bs.n,

      baseAvg:
        bs.avg,

      baseMedian:
        bs.median,

      edge,

      medianEdge
    });
  }

  if(!tests.length)
    return null;


  /*
    Взвешенное среднее
    по количеству сигналов.
  */

  const totalN=
    tests.reduce(
      (s,x)=>s+x.testN,
      0
    );

  const meanEdge=
    tests.reduce(
      (s,x)=>
        s+
        x.edge*
        x.testN,
      0
    )/
    Math.max(
      1,
      totalN
    );

  const meanReturn=
    tests.reduce(
      (s,x)=>
        s+
        x.testAvg*
        x.testN,
      0
    )/
    Math.max(
      1,
      totalN
    );


  /*
    Медиана fold-edge.
  */

  const edgeValues=
    tests
      .map(
        x=>x.medianEdge
      )
      .sort(
        (a,b)=>a-b
      );

  const mid=
    Math.floor(
      edgeValues.length/2
    );

  const medianEdge=
    edgeValues.length%2
      ?edgeValues[mid]
      :(edgeValues[mid-1]+
        edgeValues[mid])/2;


  const positivePeriods=
    tests.filter(
      x=>x.edge>0
    ).length;

  const positiveRatio=
    positivePeriods/
    tests.length;

  const worstEdge=
    Math.min(
      ...tests.map(
        x=>x.edge
      )
    );


  /*
    STRICT SCORE
  */

  let score=0;

  if(tests.length>=4)
    score+=20;
  else if(tests.length>=3)
    score+=10;

  if(totalN>=150)
    score+=20;
  else if(totalN>=100)
    score+=10;

  if(meanEdge>0.001)
    score+=20;

  if(meanEdge>0.0025)
    score+=10;

  if(medianEdge>0)
    score+=10;

  if(positiveRatio>=0.75)
    score+=15;
  else if(positiveRatio>=0.60)
    score+=7;

  if(worstEdge>-0.005)
    score+=5;


  let status=
    "НЕ ПОДТВЕРЖДАЕТСЯ";

  if(

    tests.length>=4 &&

    totalN>=150 &&

    meanEdge>0.001 &&

    medianEdge>0 &&

    positiveRatio>=0.75 &&

    worstEdge>-0.005

  ){

    status=
      "ПОДТВЕРЖДАЕТСЯ";

  }
  else if(

    tests.length>=3 &&

    totalN>=80 &&

    meanEdge>0 &&

    positiveRatio>=0.60

  ){

    status=
      "ЧАСТИЧНО ПОДТВЕРЖДАЕТСЯ";
  }


  return{

    keys,

    tests,

    totalN,

    meanEdge,

    meanReturn,

    medianEdge,

    positivePeriods,

    positiveRatio,

    worstEdge,

    score,

    status
  };
}


/* =========================================================
   SINGLE FACTORS
========================================================= */

function singleFactorStats(
  data,
  returns,
  key
){

  const s=
    comboStats(
      data,
      returns,
      [key]
    );

  /*
    Полный baseline:
    все валидные дни.
  */

  const all=[];

  for(
    let i=200;
    i<data.length-1;
    i++
  ){

    if(
      returns[i]!=null
    ){
      all.push(
        returns[i]
      );
    }
  }

  const b=
    stats(all);

  return{

    key,

    ...s,

    baseline:b.avg,

    edge:
      s.avg-b.avg,

    medianEdge:
      s.median-b.median
  };
}


/* =========================================================
   INCREMENTAL
========================================================= */

function incrementalStats(
  data,
  returns,
  baseKeys,
  addKey
){

  /*
    До
  */

  const before=
    comboStats(
      data,
      returns,
      baseKeys
    );

  /*
    После
  */

  const afterKeys=[
    ...baseKeys,
    addKey
  ];

  const after=
    comboStats(
      data,
      returns,
      afterKeys
    );


  /*
    Один и тот же полный baseline.

    Поэтому:

    edgeBefore =
      before.avg - baseline

    edgeAfter =
      after.avg - baseline

    incrementalEdge =
      edgeAfter - edgeBefore

    Что эквивалентно:

      after.avg - before.avg

    Но мы показываем оба значения
    для прозрачности.
  */

  const all=[];

  for(
    let i=200;
    i<data.length-1;
    i++
  ){

    if(
      returns[i]!=null
    ){
      all.push(
        returns[i]
      );
    }
  }

  const b=
    stats(all);

  const beforeEdge=
    before.avg-
    b.avg;

  const afterEdge=
    after.avg-
    b.avg;

  const beforeMedianEdge=
    before.median-
    b.median;

  const afterMedianEdge=
    after.median-
    b.median;

  return{

    baseKeys,

    addKey,

    before,

    after,

    baseline:b.avg,

    beforeEdge,

    afterEdge,

    beforeMedianEdge,

    afterMedianEdge,

    incrementalAvg:
      after.avg-
      before.avg,

    incrementalMedian:
      after.median-
      before.median,

    incrementalEdge:
      afterEdge-
      beforeEdge,

    nBefore:
      before.n,

    nAfter:
      after.n
  };
}


/* =========================================================
   INCREMENTAL ANALYSIS
========================================================= */

function buildIncremental(
  data,
  returns
){

  const base=[
    "rsiRange"
  ];

  const candidates=[
    "macd",
    "price200",
    "volume",
    "emaTrend",
    "macdHist",
    "rsi52",
    "adx"
  ];

  const first=[];

  for(
    const key of candidates
  ){

    const x=
      incrementalStats(
        data,
        returns,
        base,
        key
      );

    first.push(x);
  }

  first.sort(
    (a,b)=>
      b.incrementalEdge-
      a.incrementalEdge
  );


  /*
    Последовательная цепочка.
  */

  const chain=[];

  let current=[
    ...base
  ];

  const remaining=
    new Set(
      candidates
    );

  while(
    remaining.size
  ){

    let best=null;

    for(
      const key of remaining
    ){

      const x=
        incrementalStats(
          data,
          returns,
          current,
          key
        );

      if(
        x.nAfter>=20 &&
        (
          !best ||
          x.incrementalEdge>
          best.incrementalEdge
        )
      ){

        best=x;
      }
    }

    if(!best)
      break;

    chain.push(best);

    current.push(
      best.addKey
    );

    remaining.delete(
      best.addKey
    );
  }

  return{
    first,
    chain
  };
}


/* =========================================================
   CANDIDATE COMBINATIONS
========================================================= */

function candidateCombinations(){

  return[

    ["rsiRange"],

    ["rsiRange","macd"],
    ["rsiRange","price200"],
    ["rsiRange","volume"],
    ["rsiRange","emaTrend"],
    ["rsiRange","macdHist"],
    ["rsiRange","adx"],

    ["rsiRange","macd","price200"],
    ["rsiRange","macd","volume"],
    ["rsiRange","price200","volume"],
    ["rsiRange","emaTrend","volume"],
    ["rsiRange","macd","emaTrend"],
    ["rsiRange","macdHist","volume"],
    ["rsiRange","price200","emaTrend"],

    ["rsi52","rsiRange"],
    ["rsi52","rsiRange","macd"],
    ["rsi52","rsiRange","price200"],

    ["rsiRange","macd","price200","volume"],
    ["rsiRange","macd","emaTrend","volume"],
    ["rsiRange","price200","emaTrend","volume"],
    ["rsiRange","macd","price200","adx"],
    ["rsiRange","macd","volume","adx"]
  ];
}


/* =========================================================
   EVALUATE
========================================================= */

function evaluateCombinations(
  data,
  returns
){

  const results=[];

  for(
    const keys of
    candidateCombinations()
  ){

    const wf=
      walkForward(
        data,
        returns,
        keys
      );

    if(!wf)
      continue;

    results.push(wf);
  }

  results.sort(
    (a,b)=>{

      if(
        b.score!==a.score
      ){
        return b.score-
               a.score;
      }

      return b.meanEdge-
             a.meanEdge;
    }
  );

  return results;
}


/* =========================================================
   REGIME
========================================================= */

function regime(d){

  if(
    d.close>d.ema200 &&
    d.ema20>d.ema50 &&
    d.macd>0 &&
    d.adx>=30
  ){
    return"Strong Bullish";
  }

  if(
    d.close>d.ema200 &&
    d.ema20>d.ema50 &&
    d.macd>0
  ){
    return"Bullish";
  }

  if(
    d.close<d.ema200 &&
    d.ema20<d.ema50 &&
    d.macd<0 &&
    d.adx>=30
  ){
    return"Strong Bearish";
  }

  if(
    d.close<d.ema200 &&
    d.ema20<d.ema50 &&
    d.macd<0
  ){
    return"Bearish";
  }

  return"Flat";
}


function regimeStats(
  data,
  returns
){

  const map={};

  for(
    let i=200;
    i<data.length-1;
    i++
  ){

    if(
      returns[i]==null
    )continue;

    const rg=
      regime(data[i]);

    if(!map[rg])
      map[rg]=[];

    map[rg].push(
      returns[i]
    );
  }

  return Object.entries(
    map
  ).map(
    ([name,values])=>({

      name,

      ...stats(values)
    })
  );
}


/* =========================================================
   CURRENT SIGNAL
========================================================= */

function currentSignal(
  data,
  returns
){

  const d=
    data[data.length-1];

  const active=
    activeFactors(d);

  const current=[];

  for(
    let i=200;
    i<data.length-1;
    i++
  ){

    if(
      comboMatches(
        data,
        i,
        active
      )
    ){

      current.push(
        returns[i]
      );
    }
  }

  const s=
    stats(current);

  const all=[];

  for(
    let i=200;
    i<data.length-1;
    i++
  ){

    if(
      returns[i]!=null
    ){

      all.push(
        returns[i]
      );
    }
  }

  const b=
    stats(all);

  const edge=
    s.avg-
    b.avg;

  let score=50;

  if(s.n>=50)
    score+=5;

  if(s.n>=100)
    score+=5;

  if(edge>0.001)
    score+=8;

  if(edge>0.003)
    score+=8;

  if(edge<0)
    score-=8;

  if(edge<-0.003)
    score-=8;

  const rg=
    regime(d);

  if(rg==="Strong Bullish")
    score+=8;

  if(rg==="Bullish")
    score+=4;

  if(rg==="Bearish")
    score-=4;

  if(rg==="Strong Bearish")
    score-=8;

  score=
    Math.max(
      0,
      Math.min(
        100,
        Math.round(score)
      )
    );

  let signal="NEUTRAL";

  if(score>=60)
    signal="BUY";
  else if(score<=40)
    signal="SELL";

  return{

    d,

    active,

    n:s.n,

    avg:s.avg,

    median:s.median,

    win:s.win,

    plus1:s.plus1,

    minus1:s.minus1,

    baseline:b.avg,

    edge,

    score,

    signal,

    regime:rg
  };
}

  if(
    status===

  if(
    status===
    "ЧАСТИЧНО ПОДТВЕРЖДАЕТСЯ"

  return"bad";
}
