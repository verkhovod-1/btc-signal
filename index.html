<h1>₿ BTC Signal</h1>
<div class="small">v2.8 · статистический анализ 24h</div>

<div id="app" class="loading">Загрузка BTC...</div>

<script>
const VERSION="2.8";
const SYMBOL="BTCUSDT";
const API="https://api.binance.com/api/v3/klines";

const FACTORS={
  emaTrend:{
    name:"EMA20 > EMA50",
    short:"EMA20>EMA50"
  },
  price200:{
    name:"Цена > EMA200",
    short:"Цена>EMA200"
  },
  macd:{
    name:"MACD > 0",
    short:"MACD>0"
  },
  macdHist:{
    name:"MACD Histogram > 0",
    short:"MACD-Hist>0"
  },
  rsi52:{
    name:"RSI > 52",
    short:"RSI>52"
  },
  rsiRange:{
    name:"RSI 52–65",
    short:"RSI 52–65"
  },
  adx:{
    name:"ADX > 25",
    short:"ADX>25"
  },
  volume:{
    name:"Volume > average",
    short:"Volume>Avg"
  }
};

const FACTOR_KEYS=Object.keys(FACTORS);

/* ---------------------------------------------------------
   ЗАГРУЗКА ДАННЫХ
--------------------------------------------------------- */

async function fetchKlines(){
  const url=API+
    "?symbol="+SYMBOL+
    "&interval=1d"+
    "&limit=1500";

  const r=await fetch(url);
  if(!r.ok) throw new Error("Binance HTTP "+r.status);

  const raw=await r.json();

  return raw.map(x=>({
    time:x[0],
    open:+x[1],
    high:+x[2],
    low:+x[3],
    close:+x[4],
    volume:+x[5]
  }));
}

/* ---------------------------------------------------------
   ИНДИКАТОРЫ
--------------------------------------------------------- */

function ema(values,p){
  const out=new Array(values.length).fill(null);
  if(values.length<p)return out;

  let sum=0;
  for(let i=0;i<p;i++)sum+=values[i];

  let prev=sum/p;
  out[p-1]=prev;

  const k=2/(p+1);

  for(let i=p;i<values.length;i++){
    prev=values[i]*k+prev*(1-k);
    out[i]=prev;
  }
  return out;
}

function rsi(values,p=14){
  const out=new Array(values.length).fill(null);
  if(values.length<=p)return out;

  let gain=0,loss=0;

  for(let i=1;i<=p;i++){
    const d=values[i]-values[i-1];
    if(d>=0)gain+=d;
    else loss-=d;
  }

  let avgGain=gain/p;
  let avgLoss=loss/p;

  out[p]=avgLoss===0?100:100-100/(1+avgGain/avgLoss);

  for(let i=p+1;i<values.length;i++){
    const d=values[i]-values[i-1];
    const g=d>0?d:0;
    const l=d<0?-d:0;

    avgGain=(avgGain*(p-1)+g)/p;
    avgLoss=(avgLoss*(p-1)+l)/p;

    out[i]=avgLoss===0
      ?100
      :100-100/(1+avgGain/avgLoss);
  }

  return out;
}

function macd(values){
  const e12=ema(values,12);
  const e26=ema(values,26);

  const line=new Array(values.length).fill(null);

  for(let i=0;i<values.length;i++){
    if(e12[i]!=null && e26[i]!=null)
      line[i]=e12[i]-e26[i];
  }

  const valid=[];
  const indexes=[];

  for(let i=0;i<line.length;i++){
    if(line[i]!=null){
      valid.push(line[i]);
      indexes.push(i);
    }
  }

  const sigValid=ema(valid,9);
  const signal=new Array(values.length).fill(null);
  const hist=new Array(values.length).fill(null);

  for(let j=0;j<indexes.length;j++){
    const i=indexes[j];
    if(sigValid[j]!=null){
      signal[i]=sigValid[j];
      hist[i]=line[i]-signal[i];
    }
  }

  return {line,signal,hist};
}

/* ADX */
function adx(high,low,close,p=14){
  const n=close.length;
  const out=new Array(n).fill(null);

  if(n<p*2+2)return out;

  const tr=new Array(n).fill(0);
  const plusDM=new Array(n).fill(0);
  const minusDM=new Array(n).fill(0);

  for(let i=1;i<n;i++){
    const up=high[i]-high[i-1];
    const down=low[i-1]-low[i];

    plusDM[i]=(up>down && up>0)?up:0;
    minusDM[i]=(down>up && down>0)?down:0;

    tr[i]=Math.max(
      high[i]-low[i],
      Math.abs(high[i]-close[i-1]),
      Math.abs(low[i]-close[i-1])
    );
  }

  let atr=0,pdm=0,mdm=0;

  for(let i=1;i<=p;i++){
    atr+=tr[i];
    pdm+=plusDM[i];
    mdm+=minusDM[i];
  }

  atr/=p;
  pdm/=p;
  mdm/=p;

  const dx=[];

  for(let i=p;i<n;i++){

    if(i>p){
      atr=(atr*(p-1)+tr[i])/p;
      pdm=(pdm*(p-1)+plusDM[i])/p;
      mdm=(mdm*(p-1)+minusDM[i])/p;
    }

    const plusDI=atr?100*pdm/atr:0;
    const minusDI=atr?100*mdm/atr:0;

    const sum=plusDI+minusDI;
    const dxi=sum
      ?100*Math.abs(plusDI-minusDI)/sum
      :0;

    dx.push({i,dx:dxi});
  }

  if(dx.length<p)return out;

  let adxVal=0;

  for(let j=0;j<p;j++)adxVal+=dx[j].dx;
  adxVal/=p;

  out[dx[p-1].i]=adxVal;

  for(let j=p;j<dx.length;j++){
    adxVal=(adxVal*(p-1)+dx[j].dx)/p;
    out[dx[j].i]=adxVal;
  }

  return out;
}

/* ---------------------------------------------------------
   ПОДГОТОВКА DATA
--------------------------------------------------------- */

function prepare(raw){

  const close=raw.map(x=>x.close);
  const high=raw.map(x=>x.high);
  const low=raw.map(x=>x.low);
  const volume=raw.map(x=>x.volume);

  const e20=ema(close,20);
  const e50=ema(close,50);
  const e200=ema(close,200);
  const rr=rsi(close,14);
  const mm=macd(close);
  const aa=adx(high,low,close,14);

  const volAvg=new Array(raw.length).fill(null);

  for(let i=19;i<raw.length;i++){
    let s=0;
    for(let j=i-19;j<=i;j++)s+=volume[j];
    volAvg[i]=s/20;
  }

  return raw.map((x,i)=>({
    ...x,
    ema20:e20[i],
    ema50:e50[i],
    ema200:e200[i],
    rsi:rr[i],
    macd:mm.line[i],
    macdSignal:mm.signal[i],
    macdHist:mm.hist[i],
    adx:aa[i],
    volAvg:volAvg[i]
  }));
}

/* ---------------------------------------------------------
   ФАКТОРЫ
--------------------------------------------------------- */

function factorValue(d,key){

  if(!d)return false;

  switch(key){

    case "emaTrend":
      return d.ema20!=null &&
             d.ema50!=null &&
             d.ema20>d.ema50;

    case "price200":
      return d.ema200!=null &&
             d.close>d.ema200;

    case "macd":
      return d.macd!=null &&
             d.macd>0;

    case "macdHist":
      return d.macdHist!=null &&
             d.macdHist>0;

    case "rsi52":
      return d.rsi!=null &&
             d.rsi>52;

    case "rsiRange":
      return d.rsi!=null &&
             d.rsi>=52 &&
             d.rsi<=65;

    case "adx":
      return d.adx!=null &&
             d.adx>25;

    case "volume":
      return d.volAvg!=null &&
             d.volume>d.volAvg;

    default:
      return false;
  }
}

function activeFactors(d){
  return FACTOR_KEYS.filter(k=>factorValue(d,k));
}

/* ---------------------------------------------------------
   ДОХОДНОСТЬ 24 ЧАСА
--------------------------------------------------------- */

function futureReturn(data,i){

  /*
    Сигнал формируется на закрытии текущей
    дневной свечи.

    Вход:
    open следующей дневной свечи.

    Выход:
    close следующей дневной свечи.
  */

  if(i+1>=data.length)return null;

  const entry=data[i+1].open;
  const exit=data[i+1].close;

  if(!entry || !exit)return null;

  return exit/entry-1;
}

function baselineReturn(data,i){
  return futureReturn(data,i);
}

/* ---------------------------------------------------------
   СТАТИСТИКА
--------------------------------------------------------- */

function stats(values){

  const a=values.filter(x=>Number.isFinite(x));

  if(!a.length){
    return {
      n:0,
      avg:0,
      median:0,
      win:0,
      plus1:0,
      minus1:0
    };
  }

  const sorted=[...a].sort((x,y)=>x-y);

  const avg=a.reduce((s,x)=>s+x,0)/a.length;

  const mid=Math.floor(sorted.length/2);

  const median=
    sorted.length%2
      ?sorted[mid]
      :(sorted[mid-1]+sorted[mid])/2;

  return {
    n:a.length,
    avg,
    median,
    win:a.filter(x=>x>0).length/a.length,
    plus1:a.filter(x=>x>=0.01).length/a.length,
    minus1:a.filter(x=>x<=-0.01).length/a.length
  };
}

function pct(x){
  return (x*100).toFixed(2)+"%";
}

function pct1(x){
  return (x*100).toFixed(1)+"%";
}

/* ---------------------------------------------------------
   ПРЕДВЫЧИСЛЕНИЕ
--------------------------------------------------------- */

function buildReturns(data){

  const r=new Array(data.length).fill(null);

  for(let i=0;i<data.length;i++)
    r[i]=futureReturn(data,i);

  return r;
}

function usableIndexes(data,returns){

  const out=[];

  for(let i=200;i<data.length-1;i++){
    if(returns[i]!=null)out.push(i);
  }

  return out;
}

/* ---------------------------------------------------------
   УСЛОВИЕ КОМБИНАЦИИ
--------------------------------------------------------- */

function comboMatches(data,i,keys){
  for(const k of keys){
    if(!factorValue(data[i],k))return false;
  }
  return true;
}

function comboStats(data,returns,keys,start=0,end=data.length){

  const values=[];
  const base=[];

  for(let i=Math.max(200,start);i<Math.min(end,data.length-1);i++){

    const r=returns[i];

    if(r==null)continue;

    if(comboMatches(data,i,keys)){
      values.push(r);
      base.push(baselineReturn(data,i));
    }
  }

  const s=stats(values);
  const b=stats(base);

  return {
    ...s,
    baseline:b.avg,
    edge:s.avg-b.avg,
    medianEdge:s.median-b.median
  };
}

/* ---------------------------------------------------------
   WALK FORWARD
--------------------------------------------------------- */

function makeFolds(n){

  /*
    5 expanding folds.

    Тестовые окна идут строго после train.
  */

  const folds=[];

  const firstTrain=Math.max(350,Math.floor(n*0.35));
  const remaining=n-firstTrain;

  if(remaining<200)return folds;

  const testSize=Math.max(30,Math.floor(remaining/5));

  for(let f=0;f<5;f++){

    const trainEnd=firstTrain+f*testSize;
    const testStart=trainEnd;
    const testEnd=
      f===4
        ?n
        :Math.min(n,testStart+testSize);

    if(testEnd-testStart<20)continue;

    folds.push({
      trainStart:0,
      trainEnd,
      testStart,
      testEnd
    });
  }

  return folds;
}

/*
  ВАЖНО:
  комбинация не выбирается отдельно на каждом тесте.

  Сначала оцениваем комбинацию на train,
  затем только проверяем её на test.
*/

function walkForward(data,returns,keys){

  const indexes=usableIndexes(data,returns);

  if(indexes.length<250)return null;

  const folds=makeFolds(indexes.length);

  const tests=[];

  for(const f of folds){

    const trainIndexes=indexes.slice(
      f.trainStart,
      f.trainEnd
    );

    const testIndexes=indexes.slice(
      f.testStart,
      f.testEnd
    );

    /*
      Условия достаточности train.
    */
    let trainValues=[];

    for(const pos of trainIndexes){

      const i=pos;

      if(comboMatches(data,i,keys))
        trainValues.push(returns[i]);
    }

    /*
      Редкие комбинации исключаем.
    */
    if(trainValues.length<20)continue;

    const trainStats=stats(trainValues);

    /*
      Если комбинация на train уже отрицательная,
      её не считаем хорошим кандидатом.
      Но оставляем для диагностики.
    */

    const testValues=[];
    const baseValues=[];

    for(const pos of testIndexes){

      const i=pos;

      if(comboMatches(data,i,keys)){
        testValues.push(returns[i]);
        baseValues.push(baselineReturn(data,i));
      }
    }

    if(testValues.length<10)continue;

    const ts=stats(testValues);
    const bs=stats(baseValues);

    tests.push({
      trainN:trainValues.length,
      trainAvg:trainStats.avg,
      testN:testValues.length,
      testAvg:ts.avg,
      testMedian:ts.median,
      baseAvg:bs.avg,
      edge:ts.avg-bs.avg,
      medianEdge:ts.median-bs.median
    });
  }

  if(!tests.length)return null;

  const totalN=tests.reduce((s,x)=>s+x.testN,0);

  const meanEdge=
    tests.reduce((s,x)=>s+x.edge*x.testN,0)/
    Math.max(1,totalN);

  const meanReturn=
    tests.reduce((s,x)=>s+x.testAvg*x.testN,0)/
    Math.max(1,totalN);

  const allReturns=[];
  const allBase=[];

  /*
    Для общей медианы собираем тестовые результаты.
  */
  for(const t of tests){

    /*
      повторный проход не нужен для средних,
      но медиану удобнее посчитать через fold-медианы
      только как диагностическую оценку.
    */

    allReturns.push(t.testMedian);
    allBase.push(t.baseAvg);
  }

  const positivePeriods=
    tests.filter(x=>x.edge>0).length;

  const positiveRatio=
    positivePeriods/tests.length;

  const worstEdge=
    Math.min(...tests.map(x=>x.edge));

  const medianEdge=
    tests
      .map(x=>x.medianEdge)
      .sort((a,b)=>a-b);

  const med=
    medianEdge.length%2
      ?medianEdge[Math.floor(medianEdge.length/2)]
      :(medianEdge[medianEdge.length/2-1]+
        medianEdge[medianEdge.length/2])/2;

  /*
    Строгая оценка.

    100 = очень хороший кандидат,
    но "confirmed" будет только при
    выполнении жёстких условий.
  */

  let score=0;

  if(tests.length>=4)score+=20;
  else if(tests.length>=3)score+=10;

  if(totalN>=150)score+=20;
  else if(totalN>=100)score+=10;

  if(meanEdge>0.001)score+=20;
  if(meanEdge>0.0025)score+=10;

  if(med>0)score+=10;

  if(positiveRatio>=0.75)score+=15;
  else if(positiveRatio>=0.60)score+=7;

  if(worstEdge>-0.005)score+=5;

  let status="НЕ ПОДТВЕРЖДАЕТСЯ";

  if(
    tests.length>=4 &&
    totalN>=150 &&
    meanEdge>0.001 &&
    med>0 &&
    positiveRatio>=0.75 &&
    worstEdge>-0.005
  ){
    status="ПОДТВЕРЖДАЕТСЯ";
  }
  else if(
    tests.length>=3 &&
    totalN>=80 &&
    meanEdge>0 &&
    positiveRatio>=0.60
  ){
    status="ЧАСТИЧНО ПОДТВЕРЖДАЕТСЯ";
  }

  return {
    keys,
    tests,
    totalN,
    meanEdge,
    meanReturn,
    medianEdge:med,
    positivePeriods,
    positiveRatio,
    worstEdge,
    score,
    status
  };
}

/* ---------------------------------------------------------
   ИНДИВИДУАЛЬНЫЕ ФАКТОРЫ
--------------------------------------------------------- */

function singleFactorStats(data,returns,key){

  const s=comboStats(data,returns,[key]);

  return {
    key,
    ...s
  };
}

/* ---------------------------------------------------------
   ИНКРЕМЕНТАЛЬНЫЙ АНАЛИЗ
--------------------------------------------------------- */

function incrementalStats(data,returns,baseKeys,addKey){

  const before=comboStats(
    data,
    returns,
    baseKeys
  );

  const afterKeys=[...baseKeys,addKey];

  const after=comboStats(
    data,
    returns,
    afterKeys
  );

  return {
    baseKeys,
    addKey,
    before,
    after,
    incrementalAvg:after.avg-before.avg,
    incrementalMedian:after.median-before.median,
    incrementalEdge:after.edge-before.edge,
    nBefore:before.n,
    nAfter:after.n
  };
}

/*
  Для анализа последовательности факторов
  начинаем с RSI 52–65 — наиболее интересного
  фактора v2.7.
*/

function buildIncremental(data,returns){

  const base=["rsiRange"];

  const candidates=[
    "macd",
    "price200",
    "volume",
    "emaTrend",
    "macdHist",
    "rsi52",
    "adx"
  ];

  const first=[];

  for(const key of candidates){

    const x=incrementalStats(
      data,
      returns,
      base,
      key
    );

    first.push(x);
  }

  first.sort(
    (a,b)=>b.incrementalEdge-a.incrementalEdge
  );

  /*
    Затем строим последовательность:
    RSI -> лучший добавочный фактор ->
    следующий лучший и т.д.
  */

  const chain=[];
  let current=[...base];

  const remaining=new Set(candidates);

  while(remaining.size){

    let best=null;

    for(const key of remaining){

      const x=incrementalStats(
        data,
        returns,
        current,
        key
      );

      if(
        x.nAfter>=20 &&
        (!best ||
         x.incrementalEdge>best.incrementalEdge)
      ){
        best=x;
      }
    }

    if(!best)break;

    chain.push(best);
    current.push(best.addKey);
    remaining.delete(best.addKey);
  }

  return {
    first,
    chain
  };
}

/* ---------------------------------------------------------
   КОМБИНАЦИИ
--------------------------------------------------------- */

function candidateCombinations(){

  /*
    Не перебираем бессмысленно все 255 комбинаций.

    Фокус:
    RSI 52–65,
    плюс потенциально полезные факторы.
  */

  const candidates=[
    ["rsiRange"],
    ["rsiRange","macd"],
    ["rsiRange","price200"],
    ["rsiRange","volume"],
    ["rsiRange","emaTrend"],
    ["rsiRange","macdHist"],
    ["rsiRange","adx"],

    ["rsiRange","macd","price200"],
    ["rsiRange","macd","volume"],
    ["rsiRange","price200","volume"],
    ["rsiRange","emaTrend","volume"],
    ["rsiRange","macd","emaTrend"],
    ["rsiRange","macdHist","volume"],
    ["rsiRange","price200","emaTrend"],

    ["macd","rsiRange"],
    ["macd","rsiRange","price200"],
    ["macd","rsiRange","volume"],
    ["price200","rsiRange","volume"],

    ["rsi52","rsiRange"],
    ["rsi52","rsiRange","macd"],
    ["rsi52","rsiRange","price200"],

    ["rsiRange","macd","price200","volume"],
    ["rsiRange","macd","emaTrend","volume"],
    ["rsiRange","price200","emaTrend","volume"],
    ["rsiRange","macd","price200","adx"],
    ["rsiRange","macd","volume","adx"]
  ];

  return candidates;
}

function evaluateCombinations(data,returns){

  const results=[];

  for(const keys of candidateCombinations()){

    const wf=walkForward(
      data,
      returns,
      keys
    );

    if(!wf)continue;

    results.push(wf);
  }

  results.sort((a,b)=>{

    if(b.score!==a.score)
      return b.score-a.score;

    return b.meanEdge-a.meanEdge;
  });

  return results;
}

/* ---------------------------------------------------------
   РЕЖИМ
--------------------------------------------------------- */

function regime(d){

  if(
    d.close>d.ema200 &&
    d.ema20>d.ema50 &&
    d.macd>0 &&
    d.adx>=30
  )return "Strong Bullish";

  if(
    d.close>d.ema200 &&
    d.ema20>d.ema50 &&
    d.macd>0
  )return "Bullish";

  if(
    d.close<d.ema200 &&
    d.ema20<d.ema50 &&
    d.macd<0 &&
    d.adx>=30
  )return "Strong Bearish";

  if(
    d.close<d.ema200 &&
    d.ema20<d.ema50 &&
    d.macd<0
  )return "Bearish";

  return "Flat";
}

function regimeStats(data,returns){

  const map={};

  for(let i=200;i<data.length-1;i++){

    const r=returns[i];

    if(r==null)continue;

    const rg=regime(data[i]);

    if(!map[rg])map[rg]=[];

    map[rg].push(r);
  }

  return Object.entries(map).map(([name,values])=>({
    name,
    ...stats(values)
  }));
}

/* ---------------------------------------------------------
   ТЕКУЩИЙ СИГНАЛ
--------------------------------------------------------- */

function currentSignal(data,returns,top){

  const d=data[data.length-1];

  const active=activeFactors(d);

  const currentValues=[];

  for(let i=200;i<data.length-1;i++){

    if(comboMatches(data,i,active))
      currentValues.push(returns[i]);
  }

  const s=stats(currentValues);

  /*
    Сравниваем с базой.
  */

  const allValues=[];

  for(let i=200;i<data.length-1;i++)
    if(returns[i]!=null)
      allValues.push(returns[i]);

  const base=stats(allValues);

  const edge=s.avg-base.avg;

  /*
    Не превращаем score в вероятность.

    Это просто индикатор силы совокупности:
    режим + историческое преимущество.
  */

  let score=50;

  if(s.n>=50)score+=5;
  if(s.n>=100)score+=5;

  if(edge>0.001)score+=8;
  if(edge>0.003)score+=8;
  if(edge<0)score-=8;
  if(edge<-0.003)score-=8;

  if(regime(d)==="Strong Bullish")score+=8;
  if(regime(d)==="Bullish")score+=4;
  if(regime(d)==="Bearish")score-=4;
  if(regime(d)==="Strong Bearish")score-=8;

  score=Math.max(0,Math.min(100,Math.round(score)));

  let signal="NEUTRAL";

  if(score>=60)signal="BUY";
  else if(score<=40)signal="SELL";

  return {
    d,
    active,
    n:s.n,
    avg:s.avg,
    median:s.median,
    win:s.win,
    plus1:s.plus1,
    minus1:s.minus1,
    baseline:base.avg,
    edge,
    score,
    signal,
    regime:regime(d)
  };
}
