<body>

<h1>₿ BTC Signal v3.5</h1>

<div class="card">
  <div id="status" class="loading">Загрузка данных Binance...</div>
</div>

<div id="app"></div>

<script>

const API="https://api.binance.com/api/v3/klines";
const SYMBOL="BTCUSDT";
const INTERVAL="1h";

const LIMIT=1000;
const BATCHES=10;

const HORIZONS=[6,12,24,48,72];

let candles=[];
let rows=[];
let signalRows=[];

/* =========================
   ОБЩИЕ ФУНКЦИИ
========================= */

function avg(a){
  if(!a.length) return 0;
  return a.reduce((x,y)=>x+y,0)/a.length;
}

function median(a){
  if(!a.length) return 0;
  let b=[...a].sort((x,y)=>x-y);
  let m=Math.floor(b.length/2);
  return b.length%2 ? b[m] : (b[m-1]+b[m])/2;
}

function pct(a){
  return (a*100).toFixed(2)+"%";
}

function num(a){
  return Number(a).toFixed(2);
}

function cellPct(v){
  let c=v>=0 ? "pos":"neg";
  return `<span class="${c}">${pct(v)}</span>`;
}

function winRate(arr){
  if(!arr.length) return 0;
  return arr.filter(x=>x>0).length/arr.length;
}

function maxLossStreak(arr){
  let cur=0,max=0;
  for(const x of arr){
    if(x<=0){
      cur++;
      if(cur>max)max=cur;
    }else{
      cur=0;
    }
  }
  return max;
}

/* =========================
   EMA
========================= */

function EMA(values,period){
  let out=new Array(values.length).fill(null);
  if(values.length<period)return out;

  let sum=0;

  for(let i=0;i<period;i++){
    sum+=values[i];
  }

  out[period-1]=sum/period;

  let k=2/(period+1);

  for(let i=period;i<values.length;i++){
    out[i]=values[i]*k+out[i-1]*(1-k);
  }

  return out;
}

/* =========================
   ADX
========================= */

function calculateADX(data,period=14){

  const n=data.length;

  let tr=new Array(n).fill(0);
  let plusDM=new Array(n).fill(0);
  let minusDM=new Array(n).fill(0);

  for(let i=1;i<n;i++){

    const high=data[i].high;
    const low=data[i].low;

    const prevHigh=data[i-1].high;
    const prevLow=data[i-1].low;
    const prevClose=data[i-1].close;

    tr[i]=Math.max(
      high-low,
      Math.abs(high-prevClose),
      Math.abs(low-prevClose)
    );

    const up=high-prevHigh;
    const down=prevLow-low;

    plusDM[i]=(up>down && up>0)?up:0;
    minusDM[i]=(down>up && down>0)?down:0;
  }

  let atr=new Array(n).fill(null);
  let pdi=new Array(n).fill(null);
  let mdi=new Array(n).fill(null);
  let dx=new Array(n).fill(null);
  let adx=new Array(n).fill(null);

  let trSum=0;
  let plusSum=0;
  let minusSum=0;

  for(let i=1;i<=period;i++){
    trSum+=tr[i];
    plusSum+=plusDM[i];
    minusSum+=minusDM[i];
  }

  atr[period]=trSum/period;

  let plusDI=100*(plusSum/period)/atr[period];
  let minusDI=100*(minusSum/period)/atr[period];

  pdi[period]=plusDI;
  mdi[period]=minusDI;

  dx[period]=
    100*Math.abs(plusDI-minusDI)/
    Math.max(plusDI+minusDI,1e-10);

  for(let i=period+1;i<n;i++){

    atr[i]=((atr[i-1]*(period-1))+tr[i])/period;

    plusSum=((plusSum*(period-1))+plusDM[i])/period;
    minusSum=((minusSum*(period-1))+minusDM[i])/period;

    plusDI=100*plusSum/atr[i];
    minusDI=100*minusSum/atr[i];

    pdi[i]=plusDI;
    mdi[i]=minusDI;

    dx[i]=
      100*Math.abs(plusDI-minusDI)/
      Math.max(plusDI+minusDI,1e-10);
  }

  let firstADXStart=period*2;

  if(firstADXStart<n){

    let s=0;
    let count=0;

    for(let i=period;i<firstADXStart;i++){
      if(dx[i]!=null){
        s+=dx[i];
        count++;
      }
    }

    if(count){
      adx[firstADXStart-1]=s/count;
    }

    for(let i=firstADXStart;i<n;i++){
      adx[i]=
        ((adx[i-1]*(period-1))+dx[i])/period;
    }
  }

  return adx;
}

/* =========================
   ЗАГРУЗКА BINANCE
========================= */

async function loadData(){

  document.getElementById("status").innerHTML=
    "Загружаем 10 000 часовых свечей...";

  let all=[];
  let endTime=null;

  for(let b=0;b<BATCHES;b++){

    let url=
      `${API}?symbol=${SYMBOL}&interval=${INTERVAL}&limit=${LIMIT}`;

    if(endTime!==null){
      url+=`&endTime=${endTime}`;
    }

    const r=await fetch(url);

    if(!r.ok){
      throw new Error("Ошибка Binance: "+r.status);
    }

    const batch=await r.json();

    if(!batch.length)break;

    all.push(...batch);

    endTime=batch[0][0]-1;

    document.getElementById("status").innerHTML=
      `Загрузка: ${all.length.toLocaleString()} свечей...`;

    await new Promise(r=>setTimeout(r,100));
  }

  const map=new Map();

  for(const x of all){
    map.set(x[0],x);
  }

  candles=[...map.values()]
    .sort((a,b)=>a[0]-b[0])
    .map(x=>({
      time:x[0],
      open:+x[1],
      high:+x[2],
      low:+x[3],
      close:+x[4],
      volume:+x[5]
    }));

  return candles;
}

/* =========================
   ПОСТРОЕНИЕ ИНДИКАТОРОВ
========================= */

function buildRows(){

  const closes=candles.map(x=>x.close);

  const ema20=EMA(closes,20);
  const ema50=EMA(closes,50);
  const ema200=EMA(closes,200);
  const adx=calculateADX(candles,14);

  let volAvg=new Array(candles.length).fill(null);

  let sum=0;

  for(let i=0;i<candles.length;i++){

    sum+=candles[i].volume;

    if(i>=20){
      sum-=candles[i-20].volume;
      volAvg[i]=sum/20;
    }
  }

  rows=[];

  /*
     Начинаем с 200-й свечи,
     потому что нам нужна EMA200.
  */

  for(let i=200;i<candles.length;i++){

    if(
      ema20[i]==null ||
      ema50[i]==null ||
      ema200[i]==null ||
      adx[i]==null ||
      volAvg[i]==null
    )continue;

    /*
       ФИКСИРОВАННЫЙ СИГНАЛ.

       Он НЕ меняется в зависимости
       от результатов теста.
    */

    const signal=
      ema20[i]>ema50[i] &&
      adx[i]>25 &&
      candles[i].volume>volAvg[i];

    rows.push({
      i,
      time:candles[i].time,
      open:candles[i].open,
      close:candles[i].close,

      ema20:ema20[i],
      ema50:ema50[i],
      ema200:ema200[i],
      adx:adx[i],

      volume:candles[i].volume,
      volAvg:volAvg[i],

      volRatio:candles[i].volume/volAvg[i],

      priceEma200:
        (candles[i].close/ema200[i])-1,

      emaSpread:
        (ema20[i]/ema50[i])-1,

      signal
    });
  }

  signalRows=rows.filter(x=>x.signal);
}

/* =========================
   ВОЗВРАТЫ
========================= */

function getReturn(row,h){

  const entryIndex=row.i+1;
  const exitIndex=entryIndex+h-1;

  if(
    entryIndex>=candles.length ||
    exitIndex>=candles.length
  ){
    return null;
  }

  const entry=candles[entryIndex].open;
  const exit=candles[exitIndex].close;

  return exit/entry-1;
}

/*
   BTC baseline:
   доходность любого часа,
   независимо от наличия сигнала.
*/

function getBaseline(i,h){

  const entryIndex=i+1;
  const exitIndex=entryIndex+h-1;

  if(
    entryIndex>=candles.length ||
    exitIndex>=candles.length
  ){
    return null;
  }

  const entry=candles[entryIndex].open;
  const exit=candles[exitIndex].close;

  return exit/entry-1;
}

/* =========================
   СТАТИСТИКА
========================= */

function stats(signalList,h,baselineRows){

  let sig=[];
  let base=[];

  for(const r of signalList){

    const s=getReturn(r,h);

    if(s!=null){
      sig.push(s);
    }
  }

  for(const r of baselineRows){

    const b=getBaseline(r.i,h);

    if(b!=null){
      base.push(b);
    }
  }

  if(!sig.length || !base.length){
    return null;
  }

  const signalAvg=avg(sig);
  const baseAvg=avg(base);

  return {
    n:sig.length,
    signal:signalAvg,
    btc:baseAvg,
    edge:signalAvg-baseAvg,
    median:median(sig),
    win:winRate(sig),
    lossStreak:maxLossStreak(sig)
  };
}

/* =========================
   РЕЖИМ РЫНКА
========================= */

/*
   ВАЖНО:

   Мы НЕ используем EMA20>EMA50
   как отдельный режим, потому что
   это уже часть самого сигнала.

   То же самое касается ADX>25
   и Volume>average.

   Поэтому смотрим на более тонкие
   характеристики внутри сигнала.
*/

function regimeName(r){

  /*
     1. Цена относительно EMA200
  */

  const trend=
    r.priceEma200>0
      ?"Цена выше EMA200"
      :"Цена ниже EMA200";

  /*
     2. Сила ADX
  */

  let adxReg;

  if(r.adx<30){
    adxReg="ADX 25–30";
  }else{
    adxReg="ADX >30";
  }

  /*
     3. Объём
  */

  let volReg;

  if(r.volRatio<1.2){
    volReg="Объём 1.0–1.2x";
  }else{
    volReg="Объём >1.2x";
  }

  return {
    trend,
    adx:adxReg,
    volume:volReg
  };
}

/* =========================
   РАСШИРЕННЫЕ РЕЖИМЫ
========================= */

function spreadRegime(r){

  const x=r.emaSpread*100;

  if(x<0.5){
    return "EMA-spread 0–0.5%";
  }

  if(x<1.5){
    return "EMA-spread 0.5–1.5%";
  }

  return "EMA-spread >1.5%";
}

function distanceRegime(r){

  const x=r.priceEma200*100;

  if(x<0){
    return "Ниже EMA200";
  }

  if(x<3){
    return "0–3% выше EMA200";
  }

  if(x<7){
    return "3–7% выше EMA200";
  }

  return ">7% выше EMA200";
}

/* =========================
   ТАБЛИЦА СТАТИСТИКИ
========================= */

function renderStats(title,list,baselineRows,horizons=[24,72]){

  let html=`
    <h3>${title}</h3>
    <table>
      <tr>
        <th>Период</th>
        <th>N</th>
        <th>Сигнал</th>
        <th>BTC</th>
        <th>Edge</th>
        <th>Медиана</th>
        <th>Win</th>
        <th>LS</th>
      </tr>
  `;

  for(const h of horizons){

    const s=stats(list,h,baselineRows);

    if(!s)continue;

    html+=`
      <tr>
        <td>${h}ч</td>
        <td>${s.n}</td>
        <td>${cellPct(s.signal)}</td>
        <td>${cellPct(s.btc)}</td>
        <td>${cellPct(s.edge)}</td>
        <td>${cellPct(s.median)}</td>
        <td>${(s.win*100).toFixed(1)}%</td>
        <td>${s.lossStreak}</td>
      </tr>
    `;
  }

  html+=`</table>`;

  return html;
}

/* =========================
   ГРУППИРОВКА
========================= */

function renderGroupTable(title,groups,baselineRows){

  let html=`
    <h3>${title}</h3>
    <table>
      <tr>
        <th>Режим</th>
        <th>N</th>
        <th>24h Edge</th>
        <th>24h Win</th>
        <th>72h Edge</th>
        <th>72h Win</th>
      </tr>
  `;

  for(const g of groups){

    const s24=stats(g.list,24,baselineRows);
    const s72=stats(g.list,72,baselineRows);

    if(!s24 || !s72)continue;

    html+=`
      <tr>
        <td>${g.name}</td>
        <td>${s24.n}</td>
        <td>${cellPct(s24.edge)}</td>
        <td>${(s24.win*100).toFixed(1)}%</td>
        <td>${cellPct(s72.edge)}</td>
        <td>${(s72.win*100).toFixed(1)}%</td>
      </tr>
    `;
  }

  html+=`</table>`;

  return html;
}

/* =========================
   FINAL HOLDOUT
========================= */

function renderFinalHoldout(){

  const split=Math.floor(rows.length*0.90);

  const finalRows=rows.slice(split);
  const finalSignals=finalRows.filter(x=>x.signal);

  let html=`
    <div class="card">
      <h2>🔒 Независимый Final Holdout 10%</h2>

      <div class="small">
        Последние 10% данных не используются для выбора режима.
      </div>

      <p>
        Всего наблюдений: <b>${finalRows.length}</b><br>
        Сигналов: <b>${finalSignals.length}</b>
      </p>
  `;

  html+=renderStats(
    "Результат финального теста",
    finalSignals,
    finalRows,
    [6,12,24,48,72]
  );

  html+=`</div>`;

  return html;
}

/* =========================
   РЕЖИМЫ НА ВСЁМ И DEVELOPMENT
========================= */

function renderRegimes(){

  /*
     Для анализа режимов используем
     первые 90% данных.

     Последние 10% оставляем полностью
     нетронутыми.
  */

  const split=Math.floor(rows.length*0.90);

  const devRows=rows.slice(0,split);
  const devSignals=devRows.filter(x=>x.signal);

  let html=`
    <div class="card">
      <h2>🔬 Анализ рыночных режимов</h2>

      <div class="small">
        Режимы исследуются только на первых 90%.
        Последние 10% используются отдельно для проверки.
      </div>
  `;

  /* -------------------------
     Цена относительно EMA200
  ------------------------- */

  let groups=[
    {
      name:"Цена ниже EMA200",
      list:devSignals.filter(x=>x.priceEma200<=0)
    },
    {
      name:"0–3% выше EMA200",
      list:devSignals.filter(x=>x.priceEma200>0 && x.priceEma200<0.03)
    },
    {
      name:"3–7% выше EMA200",
      list:devSignals.filter(x=>x.priceEma200>=0.03 && x.priceEma200<0.07)
    },
    {
      name:">7% выше EMA200",
      list:devSignals.filter(x=>x.priceEma200>=0.07)
    }
  ];

  html+=renderGroupTable(
    "1. Положение цены относительно EMA200",
    groups,
    devRows
  );

  /* -------------------------
     ADX
  ------------------------- */

  groups=[
    {
      name:"ADX 25–30",
      list:devSignals.filter(x=>x.adx>=25 && x.adx<30)
    },
    {
      name:"ADX >30",
      list:devSignals.filter(x=>x.adx>=30)
    }
  ];

  html+=renderGroupTable(
    "2. Сила тренда",
    groups,
    devRows
  );

  /* -------------------------
     Volume
  ------------------------- */

  groups=[
    {
      name:"Volume 1.0–1.2x",
      list:devSignals.filter(x=>x.volRatio>=1 && x.volRatio<1.2)
    },
    {
      name:"Volume >1.2x",
      list:devSignals.filter(x=>x.volRatio>=1.2)
    }
  ];

  html+=renderGroupTable(
    "3. Сила объёма",
    groups,
    devRows
  );

  /* -------------------------
     EMA spread
  ------------------------- */

  groups=[
    {
      name:"EMA-spread 0–0.5%",
      list:devSignals.filter(x=>x.emaSpread>=0 && x.emaSpread<0.005)
    },
    {
      name:"EMA-spread 0.5–1.5%",
      list:devSignals.filter(x=>x.emaSpread>=0.005 && x.emaSpread<0.015)
    },
    {
      name:"EMA-spread >1.5%",
      list:devSignals.filter(x=>x.emaSpread>=0.015)
    }
  ];

  html+=renderGroupTable(
    "4. Расхождение EMA20 и EMA50",
    groups,
    devRows
  );

  html+=`
    <div class="small" style="margin-top:12px">
      Edge = средняя доходность после сигнала минус средняя
      доходность BTC за тот же период.
      LS = максимальная серия отрицательных результатов.
    </div>
  `;

  html+=`</div>`;

  return html;
}

/* =========================
   КОМБИНИРОВАННЫЕ РЕЖИМЫ
========================= */

function renderCombined(){

  const split=Math.floor(rows.length*0.90);

  const devRows=rows.slice(0,split);
  const sig=devRows.filter(x=>x.signal);

  /*
     Здесь НЕ ищем десятки комбинаций.

     Проверяем только логически понятные
     состояния рынка.
  */

  const groups=[

    {
      name:"Цена > EMA200 + ADX >30",
      list:sig.filter(x=>
        x.priceEma200>0 &&
        x.adx>30
      )
    },

    {
      name:"Цена > EMA200 + Volume >1.2x",
      list:sig.filter(x=>
        x.priceEma200>0 &&
        x.volRatio>1.2
      )
    },

    {
      name:"Цена > EMA200 + ADX >30 + Volume >1.2x",
      list:sig.filter(x=>
        x.priceEma200>0 &&
        x.adx>30 &&
        x.volRatio>1.2
      )
    },

    {
      name:"0–3% выше EMA200 + ADX >30",
      list:sig.filter(x=>
        x.priceEma200>=0 &&
        x.priceEma200<0.03 &&
        x.adx>30
      )
    },

    {
      name:"3–7% выше EMA200 + ADX >30",
      list:sig.filter(x=>
        x.priceEma200>=0.03 &&
        x.priceEma200<0.07 &&
        x.adx>30
      )
    },

    {
      name:">7% выше EMA200 + ADX >30",
      list:sig.filter(x=>
        x.priceEma200>=0.07 &&
        x.adx>30
      )
    }

  ];

  let html=`
    <div class="card">
      <h2>🧩 Комбинированные режимы</h2>

      <div class="small">
        Это НЕ новые сигналы. Это проверка того,
        как уже существующий сигнал ведёт себя
        в разных состояниях рынка.
      </div>
  `;

  html+=renderGroupTable(
    "Разбор режимов",
    groups,
    devRows
  );

  html+=`</div>`;

  return html;
}

/* =========================
   ОСНОВНАЯ СТАТИСТИКА
========================= */

function renderOverall(){

  const split=Math.floor(rows.length*0.90);

  const devRows=rows.slice(0,split);
  const devSignals=devRows.filter(x=>x.signal);

  let html=`
    <div class="card">
      <h2>📊 Основная статистика</h2>

      <div class="small">
        Фиксированный сигнал:
        EMA20 &gt; EMA50 + ADX &gt;25 + Volume &gt; среднего
      </div>
  `;

  html+=renderStats(
    "Первые 90% данных",
    devSignals,
    devRows,
    [6,12,24,48,72]
  );

  html+=`
    <hr>
    <div class="small">
      N — количество сигналов.
      BTC — средний результат обычного BTC за тот же период.
      Edge — преимущество сигнала над BTC.
    </div>
  `;

  html+=`</div>`;

  return html;
}

/* =========================
   ТЕКУЩЕЕ СОСТОЯНИЕ
========================= */

function renderCurrent(){

  const r=rows[rows.length-1];

  const signal=r.signal;

  let signalText=signal
    ?"🟢 SIGNAL"
    :"⚪ NO SIGNAL";

  let signalClass=signal
    ?"good"
    :"neutral";

  const priceVs200=r.priceEma200*100;
  const spread=r.emaSpread*100;

  return `
    <div class="card">

      <div class="big ${signalClass}">
        ${signalText}
      </div>

      <p>
        BTC: <b>$${r.close.toLocaleString(
          "en-US",
          {maximumFractionDigits:0}
        )}</b>
      </p>

      <hr>

      <p>
        EMA20 &gt; EMA50:
        <b class="${r.ema20>r.ema50?'good':'bad'}">
          ${r.ema20>r.ema50?'✓':'✗'}
        </b>
      </p>

      <p>
        ADX:
        <b class="${r.adx>25?'good':'bad'}">
          ${r.adx.toFixed(1)}
        </b>
      </p>

      <p>
        Volume:
        <b class="${r.volRatio>1?'good':'bad'}">
          ${r.volRatio.toFixed(2)}x
        </b>
      </p>

      <p>
        Цена / EMA200:
        <b class="${priceVs200>0?'good':'bad'}">
          ${priceVs200>=0?'+':''}${priceVs200.toFixed(2)}%
        </b>
      </p>

      <p>
        EMA20–EMA50:
        <b>${spread.toFixed(2)}%</b>
      </p>

    </div>
  `;
}

/* =========================
   КЛАСТЕРЫ СИГНАЛОВ
========================= */

function renderClusters(){

  const split=Math.floor(rows.length*0.90);
  const sig=rows.slice(0,split).filter(x=>x.signal);

  if(!sig.length)return "";

  let clusters=[];
  let current=[];

  for(let i=0;i<sig.length;i++){

    if(!current.length){
      current=[sig[i]];
      continue;
    }

    const diff=
      (sig[i].i-current[current.length-1].i);

    if(diff<=24){
      current.push(sig[i]);
    }else{
      clusters.push(current);
      current=[sig[i]];
    }
  }

  if(current.length)clusters.push(current);

  const lengths=clusters.map(x=>x.length);

  return `
    <div class="card">
      <h2>🔗 Кластеры сигналов</h2>

      <p>
        Сигналов: <b>${sig.length}</b><br>
        Кластеров: <b>${clusters.length}</b><br>
        Средний размер кластера:
        <b>${avg(lengths).toFixed(1)}</b><br>
        Максимальный кластер:
        <b>${Math.max(...lengths)}</b>
      </p>

      <div class="small">
        Сигналы могут возникать несколько часов подряд.
        Поэтому их нельзя автоматически считать
        независимыми сделками.
      </div>
    </div>
  `;
}

/* =========================
   ЗАПУСК
========================= */

async function main(){

  try{

    await loadData();

    document.getElementById("status").innerHTML=
      `Загружено ${candles.length.toLocaleString()} часовых свечей.`;

    buildRows();

    const app=document.getElementById("app");

    app.innerHTML=
      renderCurrent()+
      renderOverall()+
      renderRegimes()+
      renderCombined()+
      renderClusters()+
      renderFinalHoldout();

  }catch(e){

    console.error(e);

    document.getElementById("status").innerHTML=
      `<span class="bad">
        Ошибка загрузки: ${e.message}
      </span>`;
  }
}

main();

</script>
