<script>

const API="https://api.binance.com/api/v3/klines";

const TF={
 "15m":900000,
 "1h":3600000,
 "4h":14400000,
 "1d":86400000
};

const HORIZONS={
 "15m":[4,16,96],
 "1h":[1,4,24],
 "4h":[1,6],
 "1d":[1]
};


/* =========================
   HELPERS
========================= */

function sleep(ms){
 return new Promise(r=>setTimeout(r,ms));
}

function pct(x){
 if(!isFinite(x))return "—";
 return (x>=0?"+":"")+x.toFixed(2)+"%";
}

function num(x){
 return x==null||!isFinite(x)?"—":Number(x).toFixed(2);
}

function fmtPrice(x){
 return Number(x).toLocaleString("en-US",{
  maximumFractionDigits:2
 });
}

function formatHorizon(h,tf){

 const minutes=h*(
  tf==="15m"?15:
  tf==="1h"?60:
  tf==="4h"?240:1440
 );

 if(minutes<60)return minutes+" мин";
 if(minutes%1440===0)return minutes/1440+" дн";

 return minutes/60+" ч";
}


/* =========================
   EMA
========================= */

function calcEMA(values,period){

 const out=new Array(values.length).fill(null);

 if(values.length<period)return out;

 let sum=0;

 for(let i=0;i<period;i++)sum+=values[i];

 let ema=sum/period;

 out[period-1]=ema;

 const k=2/(period+1);

 for(let i=period;i<values.length;i++){
  ema=values[i]*k+ema*(1-k);
  out[i]=ema;
 }

 return out;
}


/* =========================
   RSI
========================= */

function calcRSI(values,period=14){

 const out=new Array(values.length).fill(null);

 if(values.length<=period)return out;

 let gain=0,loss=0;

 for(let i=1;i<=period;i++){

  const d=values[i]-values[i-1];

  if(d>=0)gain+=d;
  else loss-=d;
 }

 let avgGain=gain/period;
 let avgLoss=loss/period;

 out[period]=
  avgLoss===0?100:
  100-(100/(1+avgGain/avgLoss));

 for(let i=period+1;i<values.length;i++){

  const d=values[i]-values[i-1];

  const g=Math.max(d,0);
  const l=Math.max(-d,0);

  avgGain=(avgGain*(period-1)+g)/period;
  avgLoss=(avgLoss*(period-1)+l)/period;

  out[i]=
   avgLoss===0?100:
   100-(100/(1+avgGain/avgLoss));
 }

 return out;
}


/* =========================
   MACD
========================= */

function calcMACD(values){

 const ema12=calcEMA(values,12);
 const ema26=calcEMA(values,26);

 const macd=new Array(values.length).fill(null);

 for(let i=0;i<values.length;i++){

  if(ema12[i]!=null&&ema26[i]!=null){
   macd[i]=ema12[i]-ema26[i];
  }
 }

 const temp=[];
 const indexes=[];

 for(let i=0;i<macd.length;i++){

  if(macd[i]!=null){
   temp.push(macd[i]);
   indexes.push(i);
  }
 }

 const sigTemp=calcEMA(temp,9);

 const signal=new Array(values.length).fill(null);
 const histogram=new Array(values.length).fill(null);

 for(let j=0;j<sigTemp.length;j++){

  if(sigTemp[j]!=null){

   const i=indexes[j];

   signal[i]=sigTemp[j];
   histogram[i]=macd[i]-signal[i];
  }
 }

 return{
  macd,
  signal,
  histogram
 };
}


/* =========================
   ADX
========================= */

function calcADX(data,period=14){

 const n=data.length;

 const tr=new Array(n).fill(null);
 const plusDM=new Array(n).fill(null);
 const minusDM=new Array(n).fill(null);

 for(let i=1;i<n;i++){

  const high=data[i].high;
  const low=data[i].low;

  const prevHigh=data[i-1].high;
  const prevLow=data[i-1].low;
  const prevClose=data[i-1].close;

  tr[i]=Math.max(
   high-low,
   Math.abs(high-prevClose),
   Math.abs(low-prevClose)
  );

  const up=high-prevHigh;
  const down=prevLow-low;

  plusDM[i]=(up>down&&up>0)?up:0;
  minusDM[i]=(down>up&&down>0)?down:0;
 }

 const adx=new Array(n).fill(null);
 const plusDI=new Array(n).fill(null);
 const minusDI=new Array(n).fill(null);
 const dx=new Array(n).fill(null);

 let atr=0;
 let pDM=0;
 let mDM=0;

 for(let i=1;i<=period;i++){

  atr+=tr[i];
  pDM+=plusDM[i];
  mDM+=minusDM[i];
 }

 atr/=period;
 pDM/=period;
 mDM/=period;

 let firstDX=null;

 for(let i=period;i<n;i++){

  if(i>period){

   atr=((atr*(period-1))+tr[i])/period;
   pDM=((pDM*(period-1))+plusDM[i])/period;
   mDM=((mDM*(period-1))+minusDM[i])/period;
  }

  if(atr===0)continue;

  plusDI[i]=100*(pDM/atr);
  minusDI[i]=100*(mDM/atr);

  const sum=plusDI[i]+minusDI[i];

  if(sum>0){

   dx[i]=100*
    Math.abs(plusDI[i]-minusDI[i])/sum;

   if(firstDX===null){

    firstDX=i;
    adx[i]=dx[i];

   }else{

    adx[i]=
     ((adx[i-1]??dx[i])* (period-1)+dx[i])/period;
   }
  }
 }

 /*
  Более стабильная и простая повторная
  инициализация ADX через DX.
 */

 const cleanDX=[];

 for(let i=period;i<n;i++){

  if(dx[i]!=null)cleanDX.push({
   i,
   v:dx[i]
  });
 }

 for(let j=period-1;j<cleanDX.length;j++){

  const idx=cleanDX[j].i;

  if(j===period-1){

   let sum=0;

   for(let k=0;k<period;k++){
    sum+=cleanDX[k].v;
   }

   adx[idx]=sum/period;

  }else{

   adx[idx]=
    ((adx[cleanDX[j-1].i]??cleanDX[j].v)*
     (period-1)+cleanDX[j].v)/period;
  }
 }

 return{
  adx,
  plusDI,
  minusDI
 };
}


/* =========================
   INDICATORS
========================= */

function buildIndicators(data){

 const close=data.map(x=>x.close);
 const volume=data.map(x=>x.volume);

 const ema20=calcEMA(close,20);
 const ema50=calcEMA(close,50);
 const ema200=calcEMA(close,200);
 const rsi=calcRSI(close,14);
 const macd=calcMACD(close);
 const adx=calcADX(data,14);

 const volumeRatio=
  new Array(close.length).fill(null);

 for(let i=20;i<close.length;i++){

  let sum=0;

  for(let j=i-20;j<i;j++){
   sum+=volume[j];
  }

  const avg=sum/20;

  if(avg>0)
   volumeRatio[i]=volume[i]/avg;
 }

 return{
  close,
  volume,
  ema20,
  ema50,
  ema200,
  rsi,
  macd,
  adx,
  volumeRatio
 };
}


/* =========================
   MARKET REGIME
========================= */

function getRegime(ind,i){

 const adx=ind.adx.adx[i];
 const plus=ind.adx.plusDI[i];
 const minus=ind.adx.minusDI[i];

 if(adx==null||plus==null||minus==null)
  return "UNKNOWN";

 /*
  ADX:
  <20 = слабый тренд / флэт
  20–25 = переход
  >=25 = выраженный тренд
 */

 if(adx<20)
  return "FLAT";

 if(adx<25)
  return "TRANSITION";

 if(plus>minus)
  return "BULL";

 return "BEAR";
}


function regimeName(r){

 if(r==="BULL")return "🟢 Сильный бычий тренд";
 if(r==="BEAR")return "🔴 Сильный медвежий тренд";
 if(r==="FLAT")return "🟡 Флэт / слабый тренд";
 if(r==="TRANSITION")return "⚪ Переходный рынок";

 return "—";
}


/* =========================
   SIGNAL
========================= */

function getSignal(ind,i){

 let bull=0;
 let bear=0;
 const reasons=[];

 const price=ind.close[i];
 const e20=ind.ema20[i];
 const e50=ind.ema50[i];
 const e200=ind.ema200[i];
 const rsi=ind.rsi[i];
 const macd=ind.macd.macd[i];
 const vr=ind.volumeRatio[i];

 if(e20!=null&&e50!=null){

  if(e20>e50){
   bull+=20;
   reasons.push("EMA20 > EMA50");
  }else{
   bear+=20;
   reasons.push("EMA20 < EMA50");
  }
 }

 if(e200!=null){

  if(price>e200){
   bull+=20;
   reasons.push("Цена выше EMA200");
  }else{
   bear+=20;
   reasons.push("Цена ниже EMA200");
  }
 }

 if(rsi!=null){

  if(rsi>=52&&rsi<=68){
   bull+=20;
   reasons.push("RSI 52–68");
  }
  else if(rsi>75){
   bear+=10;
   reasons.push("RSI >75");
  }
  else if(rsi<30){
   bull+=10;
   reasons.push("RSI <30");
  }
  else if(rsi<45){
   bear+=15;
   reasons.push("RSI <45");
  }
  else{
   bull+=10;
   bear+=10;
  }
 }

 if(macd!=null){

  if(macd>0){
   bull+=20;
   reasons.push("MACD >0");
  }else{
   bear+=20;
   reasons.push("MACD <0");
  }
 }

 if(vr!=null){

  if(vr>=1.25){

   if(price>e20){
    bull+=20;
    reasons.push("Высокий объём + цена выше EMA20");
   }else{
    bear+=20;
    reasons.push("Высокий объём + цена ниже EMA20");
   }

  }else{

   bull+=10;
   bear+=10;
  }
 }

 const score=Math.max(
  0,
  Math.min(
   100,
   50+(bull-bear)/2
  )
 );

 let signal="HOLD";

 if(score>=70)signal="BUY";
 else if(score<=30)signal="SELL";

 return{
  score,
  signal,
  bull,
  bear,
  reasons
 };
}

 `;

/* =========================
   RETURN
========================= */

function directionalReturn(
 data,i,horizon,direction
){

 const entry=i+1;
 const exit=i+1+horizon;

 if(
  entry>=data.length||
  exit>=data.length
 )return null;

 const p1=data[entry].open;
 const p2=data[exit].open;

 if(!p1||!p2)return null;

 const raw=(p2-p1)/p1*100;

 return direction==="BUY"?raw:-raw;
}


/* =========================
   SIGNAL STATS
========================= */

function signalStats(
 data,
 ind,
 signal,
 horizon
){

 let n=0;
 let wins=0;
 let sum=0;
 let best=-Infinity;
 let worst=Infinity;

 for(
  let i=200;
  i<data.length-horizon-2;
  i++
 ){

  const s=getSignal(ind,i);

  if(s.signal!==signal)continue;

  const r=
   directionalReturn(
    data,i,horizon,signal
   );

  if(r==null)continue;

  n++;

  if(r>0)wins++;

  sum+=r;
  best=Math.max(best,r);
  worst=Math.min(worst,r);
 }

 return{
  n,
  accuracy:n?wins/n*100:null,
  avg:n?sum/n:null,
  best:n?best:null,
  worst:n?worst:null
 };
}


/* =========================
   BACKTEST
========================= */

function renderBacktest(data,ind){

 let html=`

 <div class="card">

  📊 Годовой бэктест
 </div>

 <div class="small">
  Свечей: ${data.length.toLocaleString()}
 </div>
 `;

 for(const h of HORIZONS[tf]){

  const buy=signalStats(
   data,ind,"BUY",h
  );

  const sell=signalStats(
   data,ind,"SELL",h
  );

  html+=`

  <hr>

  <div class="sectionTitle">
   ${formatHorizon(h,tf)}
  </div>

  <table>

  <tr>
   <th></th>
   <th>N</th>
   <th>Успех</th>
   <th>Средн.</th>
   <th>Лучший</th>
   <th>Худший</th>
  </tr>

  <tr>
   <td>BUY</td>
   <td>${buy.n}</td>
   <td>${buy.accuracy?.toFixed(1)??"—"}%</td>
   <td>${pct(buy.avg)}</td>
   <td>${pct(buy.best)}</td>
   <td>${pct(buy.worst)}</td>
  </tr>

  <tr>
   <td>SELL</td>
   <td>${sell.n}</td>
   <td>${sell.accuracy?.toFixed(1)??"—"}%</td>
   <td>${pct(sell.avg)}</td>
   <td>${pct(sell.best)}</td>
   <td>${pct(sell.worst)}</td>
  </tr>

  </table>
  `;
 }

 html+=`

 <details>
 <summary>О методике</summary>

 <div class="small" style="padding:10px">
 Сигнал формируется на закрытии свечи.
 Вход происходит на открытии следующей свечи.
 Будущие данные при формировании сигнала
 не используются.
 </div>

 </details>

 </div>
 `;

 document.getElementById("backtest").innerHTML=html;
}


/* =========================
   REGIME TEST
========================= */

function regimeFactorStats(
 data,
 ind,
 regime,
 factor,
 direction,
 horizon
){

 let n=0;
 let wins=0;
 let sum=0;

 for(
  let i=200;
  i<data.length-horizon-2;
  i++
 ){

  if(getRegime(ind,i)!==regime)
   continue;

  const f=factor(i);

  if(!f)continue;

  const r=
   directionalReturn(
    data,i,horizon,direction
   );

  if(r==null)continue;

  n++;

  if(r>0)wins++;

  sum+=r;
 }

 return{
  n,
  accuracy:n?wins/n*100:null,
  avg:n?sum/n:null
 };
}


/* =========================
   REGIME COMBINATIONS
========================= */

  "FLAT",
  "TRANSITION"

  },
  {

   fn:i=>
    ind.macd.macd[i]!=null&&
    ind.macd.macd[i]>0
  },
  {
   name:"MACD Histogram > 0",
   direction:"BUY",
   fn:i=>
    ind.macd.histogram[i]!=null&&
    ind.macd.histogram[i]>0
  },
  {
   name:"RSI 52–68",
   direction:"BUY",
   fn:i=>
    ind.rsi[i]!=null&&
    ind.rsi[i]>=52&&
    ind.rsi[i]<=68
  },

   direction:"BUY",
   fn:i=>
    ind.volumeRatio[i]!=null&&
    ind.volumeRatio[i]>=1.25
  }
 ];

 <div class="card">

 </div>
 `;

 for(const h of HORIZONS[tf]){

  </div>

   `;

   for(const factor of factors){

    const r=
     regimeFactorStats(
      data,
      ind,

      factor.name,
      factor.direction,
      h
     );

    html+=`

    <tr>
     <td>${factor.name}</td>
     <td>${r.n}</td>
     <td>
      ${r.accuracy==null?
       "—":
       r.accuracy.toFixed(1)+"%"}
     </td>
     <td>${pct(r.avg)}</td>
    </tr>
    `;
   }

   html+=`

   </table>

   </details>
   `;
  }
 }

 html+=`

 <hr>

 <div class="sectionTitle">
  🧪 Специальный тест силы тренда
 </div>

 <table>

 <tr>
  <th>ADX</th>
  <th>Описание</th>
 </tr>

 <tr>
  <td>&lt;20</td>
  <td>Флэт</td>
 </tr>

 <tr>
  <td>20–25</td>
  <td>Переход</td>
 </tr>

 <tr>
  <td>&gt;25 + DI+</td>
  <td>Бычий тренд</td>
 </tr>

 <tr>
  <td>&gt;25 + DI-</td>
  <td>Медвежий тренд</td>
 </tr>

 </table>

 <details>

/* =========================
   DOWNLOAD HISTORY
========================= */

async function fetchBatch(
 start,
 end,
 interval
){

 const url=
  API+
  "?symbol=BTCUSDT"+
  "&interval="+interval+
  "&limit=1000"+
  "&startTime="+start+
  "&endTime="+end;

 const response=await fetch(url);

 if(!response.ok)
  throw new Error(
   "Binance HTTP "+response.status
  );

 return await response.json();
}


async function fetchHistory(interval){

 const now=Date.now();
 const start=
  now-365*24*60*60*1000;

 const step=TF[interval];

 let cursor=start;
 let all=[];

 while(cursor<now){

  let data=null;

  for(let attempt=0;attempt<4;attempt++){

   try{

    data=await fetchBatch(
     cursor,
     now,
     interval
    );

    break;

   }catch(e){

    if(attempt===3)throw e;

    await sleep(
     1000*(attempt+1)
    );
   }
  }

  if(!data||!data.length)break;

  for(const k of data){

   all.push({
    time:k[0],
    open:Number(k[1]),
    high:Number(k[2]),
    low:Number(k[3]),
    close:Number(k[4]),
    volume:Number(k[5])
   });
  }

  const last=
   data[data.length-1][0];

  cursor=last+step;

  document.getElementById(
   "status"
  ).innerText=
   "Загрузка: "+
   all.length+
   " свечей";

  await sleep(120);

  if(data.length<1000)break;
 }

 const unique=new Map();

 for(const c of all)
  unique.set(c.time,c);

 return [...unique.values()]
  .sort((a,b)=>a.time-b.time);
}

async function runAnalysis(){

 const btn=
  document.getElementById("runBtn");

 const status=
  document.getElementById("status");

 btn.disabled=true;

 document.getElementById("live").innerHTML="";
 document.getElementById("backtest").innerHTML="";
 document.getElementById(
  "regimeDiagnostics"
 ).innerHTML="";

 try{

  const tf=
   document.getElementById(
    "timeframe"
   ).value;

  status.innerText=
   "Загружаем историю Binance...";

  const data=
   await fetchHistory(tf);

  if(data.length<300)
   throw new Error(
    "Недостаточно данных"
   );

  status.innerText=
   "Рассчитываем индикаторы...";

  const ind=
   buildIndicators(data);

  const last=data.length-1;

  renderLive(ind,last);

  status.innerText=
   "Бэктест...";

  await sleep(50);

  renderBacktest(
   data,
   ind
  );

  status.innerText=
   "Анализ режимов рынка...";

  await sleep(50);

  renderRegimeDiagnostics(
   data,
   ind
  );

  status.innerText=
   "Готово • BTC Signal v2.4";

 }catch(e){

  console.error(e);

  status.innerText=
   "Ошибка: "+e.message;

 }finally{

  btn.disabled=false;
 }
}
