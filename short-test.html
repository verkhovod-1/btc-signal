
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>BTC — тест рыночных режимов v2</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#10131b;color:#e8eaf0;font:15px/1.45 system-ui,-apple-system,sans-serif}
h1{font-size:23px;line-height:1.2;margin:4px 0 8px}
h2{font-size:18px;margin:22px 0 8px}
p{color:#b7bfce}
.card{background:#191f2b;border:1px solid #30394a;border-radius:14px;padding:14px;margin:12px 0}
label{display:block;font-size:13px;color:#bdc7d7;margin:12px 0 5px}
input,select,button{width:100%;border-radius:9px;padding:11px;font:inherit}
input,select{color:#fff;background:#101722;border:1px solid #3b465a}
button{border:0;background:#6d8dff;color:#071021;font-weight:700;margin-top:10px;cursor:pointer}
button.secondary{background:#303b50;color:#f3f5fb}
button:disabled{opacity:.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:#9ca8bb}
#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#c9d5e8}
#report{width:100%;min-height:300px;background:#0b1018;color:#e8eaf0;border:1px solid #38445a;border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,SFMono-Regular,monospace}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th,td{padding:8px 7px;border-bottom:1px solid #30394a;text-align:right}
th{color:#b8c8e4;background:#202838}
th:first-child,td:first-child{text-align:left}
.good{color:#70e0a0}
.bad{color:#ff9292}
</style>
</head>
<body>
<h1>BTC LONG / SHORT — тест режимов v2</h1>
<p>Binance BTCUSDT · часовые свечи · исправленная формула SHORT</p>

<div class="card">
<h2>1. Настройки</h2>
<label for="years">История</label>
<select id="years">
<option value="4">4 года</option>
<option value="6" selected>6 лет</option>
<option value="8">8 лет</option>
</select>

<div class="row">
<div>
<label for="fee">Комиссия туда-обратно, %</label>
<input id="fee" type="number" value="0.20" min="0" max="5" step="0.01">
</div>
<div>
<label for="slippage">Проскальзывание туда-обратно, %</label>
<input id="slippage" type="number" value="0.05" min="0" max="5" step="0.01">
</div>
</div>

<label for="funding">Условное финансирование за 8 часов, %</label>
<input id="funding" type="number" value="0.01" min="0" max="5" step="0.001">

<button id="run">Загрузить историю и запустить тест</button>
<button id="stop" class="secondary" disabled>Остановить</button>
<p id="status">Готов к запуску.</p>
<div class="small">Для загрузки истории требуется интернет. Не закрывайте страницу во время теста.</div>
</div>

<div class="card">
<h2>2. Результаты</h2>
<div class="table-wrap" id="tableArea">Результатов пока нет.</div>
</div>

<div class="card">
<h2>3. Текстовый отчёт</h2>
<button id="copy" class="secondary">Скопировать текстовый отчёт</button>
<textarea id="report" readonly placeholder="Здесь появится отчёт."></textarea>
</div>

<script>
"use strict";

const HOUR = 3600000;
const $ = id => document.getElementById(id);
let stopRequested = false;
let busy = false;
let reportText = "";

const HOSTS = [
  "https://api.binance.com",
  "https://api-gcp.binance.com",
  "https://api1.binance.com",
  "https://api2.binance.com",
  "https://api3.binance.com",
  "https://api4.binance.com"
];

const REGIMES = [
  "Сильный медвежий",
  "Слабый медвежий",
  "Бычий",
  "Переходный"
];

const DIRECTIONS = ["LONG","SHORT"];
const HORIZONS = [48,72];

function status(s) {
  $("status").textContent = s;
}

function num(id) {
  const v = Number($(id).value);
  if (!Number.isFinite(v) || v < 0) {
    throw new Error("Проверьте числовое поле: " + id);
  }
  return v;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve,ms));
}

async function fetchPage(start,end) {
  let lastError = null;

  for (const host of HOSTS) {
    if (stopRequested) throw new Error("Остановлено пользователем.");

    try {
      const url = host + "/api/v3/klines?symbol=BTCUSDT&interval=1h"
        + "&startTime=" + start
        + "&endTime=" + end
        + "&limit=1000";

      const response = await fetch(url,{cache:"no-store"});
      if (!response.ok) throw new Error("HTTP " + response.status);

      const data = await response.json();
      if (!Array.isArray(data)) throw new Error("Неожиданный ответ Binance");
      return data;
    } catch(e) {
      lastError = e;
    }
  }

  throw lastError || new Error("Не удалось загрузить данные Binance.");
}

async function loadCandles(years) {
  const end = Math.floor(Date.now()/HOUR)*HOUR-HOUR;
  const start = end-years*365*24*HOUR;
  let cursor = start;
  const all = [];
  let pages = 0;

  while (cursor <= end) {
    if (stopRequested) throw new Error("Остановлено пользователем.");

    const page = await fetchPage(cursor,end);
    pages++;
    if (!page.length) break;

    for (const k of page) {
      const t = Number(k[0]);
      if (t >= start && t <= end) {
        all.push({
          t,
          open:Number(k[1]),
          high:Number(k[2]),
          low:Number(k[3]),
          close:Number(k[4]),
          volume:Number(k[5])
        });
      }
    }

    const lastTime = Number(page[page.length-1][0]);
    if (!Number.isFinite(lastTime) || lastTime < cursor) {
      throw new Error("Ошибка загрузки: время свечей не продвигается.");
    }

    cursor = lastTime+HOUR;
    const pct = Math.min(100,(cursor-start)/(end-start)*100);

    status("Загрузка истории: " + pct.toFixed(1) + "%\n"
      + "Свечей: " + all.length.toLocaleString("ru-RU")
      + "\nЗапросов: " + pages);

    if (page.length < 1000) break;
    await sleep(100);
  }

  const map = new Map();
  for (const c of all) map.set(c.t,c);
  const candles = [...map.values()].sort((a,b)=>a.t-b.t);

  if (candles.length < 5000) {
    throw new Error("Получено слишком мало свечей: " + candles.length);
  }

  return candles;
}

function calcEMA(values,period) {
  const out = new Array(values.length).fill(null);
  const alpha = 2/(period+1);
  let ema = values[0];

  for (let i=0;i<values.length;i++) {
    ema = i===0 ? values[i] : values[i]*alpha+ema*(1-alpha);
    out[i] = ema;
  }
  return out;
}

function calcADX(candles,period=14) {
  const n = candles.length;
  const tr = new Array(n).fill(0);
  const plusDM = new Array(n).fill(0);
  const minusDM = new Array(n).fill(0);
  const dx = new Array(n).fill(null);
  const adx = new Array(n).fill(null);

  for (let i=1;i<n;i++) {
    const c = candles[i], p = candles[i-1];

    tr[i] = Math.max(
      c.high-c.low,
      Math.abs(c.high-p.close),
      Math.abs(c.low-p.close)
    );

    const up = c.high-p.high;
    const down = p.low-c.low;

    plusDM[i] = up>down && up>0 ? up : 0;
    minusDM[i] = down>up && down>0 ? down : 0;
  }

  if (n <= period*2) return adx;

  let smTR=0, smPlus=0, smMinus=0;
  for (let i=1;i<=period;i++) {
    smTR+=tr[i];
    smPlus+=plusDM[i];
    smMinus+=minusDM[i];
  }

  function makeDX(i) {
    if (smTR<=0) {
      dx[i]=0;
      return;
    }
    const pdi=100*smPlus/smTR;
    const mdi=100*smMinus/smTR;
    const denom=pdi+mdi;
    dx[i]=denom===0 ? 0 : 100*Math.abs(pdi-mdi)/denom;
  }

  makeDX(period);

  for (let i=period+1;i<n;i++) {
    smTR=smTR-smTR/period+tr[i];
    smPlus=smPlus-smPlus/period+plusDM[i];
    smMinus=smMinus-smMinus/period+minusDM[i];
    makeDX(i);
  }

  let sum=0;
  for (let i=period;i<period*2;i++) {
    if (dx[i]!==null) sum+=dx[i];
  }
  adx[period*2-1]=sum/period;

  for (let i=period*2;i<n;i++) {
    if (i===period*2-1 || dx[i]===null) continue;
    adx[i]=(adx[i-1]*(period-1)+dx[i])/period;
  }

  return adx;
}

function buildIndicators(candles) {
  const closes=candles.map(c=>c.close);
  const ema50=calcEMA(closes,50);
  const ema200=calcEMA(closes,200);
  const adx=calcADX(candles,14);
  const regimes=new Array(candles.length).fill(null);

  for (let i=0;i<candles.length;i++) {
    if (i<200 || adx[i]===null || !Number.isFinite(adx[i])) continue;

    const c=candles[i].close;
    const strongBear=c<ema200[i] && ema50[i]<ema200[i] && adx[i]>25;
    const weakBear=c<ema200[i] && ema50[i]<ema200[i] && adx[i]<=25;
    const bull=c>ema200[i] && ema50[i]>ema200[i];

    if (strongBear) regimes[i]="Сильный медвежий";
    else if (weakBear) regimes[i]="Слабый медвежий";
    else if (bull) regimes[i]="Бычий";
    else regimes[i]="Переходный";
  }

  return {ema50,ema200,adx,regimes};
}

function median(values) {
  if (!values.length) return 0;
  const a=[...values].sort((x,y)=>x-y);
  const m=Math.floor(a.length/2);
  return a.length%2 ? a[m] : (a[m-1]+a[m])/2;
}

function stats(trades) {
  if (!trades.length) {
    return {n:0,mean:0,med:0,win:0,streak:0,dd:0};
  }

  const vals=trades.map(t=>t.net);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const win=100*vals.filter(x=>x>0).length/vals.length;

  let current=0,streak=0;
  for (const x of vals) {
    if (x<0) {
      current++;
      streak=Math.max(streak,current);
    } else current=0;
  }

  let equity=1,peak=1,maxDD=0;
  for (const x of vals) {
    equity*=Math.max(0.000001,1+x/100);
    peak=Math.max(peak,equity);
    maxDD=Math.max(maxDD,(peak-equity)/peak*100);
  }

  return {
    n:trades.length,
    mean,
    med:median(vals),
    win,
    streak,
    dd:maxDD
  };
}

function runSegment(candles,regimes,start,end,regime,direction,hours,cost) {
  const trades=[];
  let lastExit=-1;

  for (let i=start;i<end;i++) {
    if (i<=lastExit) continue;
    if (regimes[i]!==regime) continue;

    const entryIndex=i+1;
    const exitIndex=i+hours;

    if (entryIndex>=end || exitIndex>=end) continue;

    const entry=candles[entryIndex].open;
    const exit=candles[exitIndex].close;
    if (!(entry>0) || !(exit>0)) continue;

    let gross;

    if (direction==="LONG") {
      gross=(exit-entry)/entry*100;
    } else {
      // ИСПРАВЛЕНО:
      // SHORT: прибыль при падении цены, убыток при росте.
      // Знаменатель — цена входа, а не цена выхода.
      gross=(entry-exit)/entry*100;
    }

    const net=gross-cost(hours);
    trades.push({gross,net});
    lastExit=exitIndex;
  }

  return stats(trades);
}

function fmt(x,d=3) {
  return Number(x).toFixed(d)+"%";
}

function renderTable(results) {
  let html="<table><thead><tr>"
    +"<th>Режим</th><th>Часть</th><th>Срок</th><th>Направление</th>"
    +"<th>N</th><th>Средняя чистая</th><th>Медиана</th><th>Успех</th>"
    +"<th>Серия убытков</th><th>Просадка*</th>"
    +"</tr></thead><tbody>";

  for (const r of results) {
    const cls=r.mean>0?"good":r.mean<0?"bad":"";
    html+="<tr>"
      +"<td>"+r.regime+"</td>"
      +"<td>"+r.segment+"</td>"
      +"<td>"+r.hours+"ч</td>"
      +"<td>"+r.direction+"</td>"
      +"<td>"+r.n+"</td>"
      +"<td class='"+cls+"'>"+fmt(r.mean,4)+"</td>"
      +"<td>"+fmt(r.med,4)+"</td>"
      +"<td>"+fmt(r.win,2)+"</td>"
      +"<td>"+r.streak+"</td>"
      +"<td>"+fmt(r.dd,2)+"</td>"
      +"</tr>";
  }

  html+="</tbody></table><p class='small'>* Упрощённая последовательная просадка, не реальная биржевая кривая капитала.</p>";
  $("tableArea").innerHTML=html;
}

function buildReport(candles,ind,results,fee,slippage,funding,years) {
  const n=candles.length;
  const first=new Date(candles[0].t).toISOString().replace("T"," ").slice(0,16);
  const last=new Date(candles[n-1].t).toISOString().replace("T"," ").slice(0,16);
  const trainEnd=Math.floor(n*0.70);
  const valEnd=Math.floor(n*0.85);

  const segments=[
    {name:"Обучение 70%",start:0,end:trainEnd},
    {name:"Проверка 15%",start:trainEnd,end:valEnd},
    {name:"Итоговый тест 15%",start:valEnd,end:n}
  ];

  const lines=[];
  lines.push("BTCUSDT — тест рыночных режимов v2");
  lines.push("Формула SHORT исправлена.");
  lines.push("Период: "+first+" — "+last+" UTC");
  lines.push("История: "+years+" лет; свечей: "+n);
  lines.push("Последняя цена закрытия: "+candles[n-1].close);
  lines.push("");
  lines.push("ПРАВИЛА");
  lines.push("Режим определяется по закрытию сигнальной свечи.");
  lines.push("Вход: открытие следующей часовой свечи.");
  lines.push("Выход: закрытие свечи через 48 или 72 часа от сигнальной свечи.");
  lines.push("Сделки не перекрываются внутри каждой отдельной комбинации.");
  lines.push("LONG gross = (цена выхода - цена входа) / цена входа * 100.");
  lines.push("SHORT gross = (цена входа - цена выхода) / цена входа * 100.");
  lines.push("Чистая доходность = валовая доходность минус расходы.");
  lines.push("");
  lines.push("РАСХОДЫ");
  lines.push("Комиссия туда-обратно: "+fee+"%");
  lines.push("Проскальзывание туда-обратно: "+slippage+"%");
  lines.push("Условное финансирование за 8 часов: "+funding+"%");
  lines.push("Финансирование 48ч: "+(funding*6).toFixed(4)+"%");
  lines.push("Финансирование 72ч: "+(funding*9).toFixed(4)+"%");
  lines.push("");
  lines.push("РЕЖИМЫ");
  lines.push("Сильный медвежий: close < EMA200, EMA50 < EMA200, ADX14 > 25.");
  lines.push("Слабый медвежий: close < EMA200, EMA50 < EMA200, ADX14 <= 25.");
  lines.push("Бычий: close > EMA200 и EMA50 > EMA200.");
  lines.push("Переходный: все остальные валидные свечи.");
  lines.push("");

  for (const seg of segments) {
    lines.push("=== "+seg.name+" ===");
    for (const reg of REGIMES) {
      lines.push("-- "+reg+" --");
      for (const hours of HORIZONS) {
        for (const dir of DIRECTIONS) {
          const r=results.find(x=>x.regime===reg && x.segment===seg.name && x.hours===hours && x.direction===dir);
          if (!r) continue;
          lines.push(
            dir+" "+hours+"ч"
            +" | N="+r.n
            +" | средняя чистая="+fmt(r.mean,4)
            +" | медиана="+fmt(r.med,4)
            +" | успех="+fmt(r.win,2)
            +" | серия убытков="+r.streak
            +" | просадка="+fmt(r.dd,2)
          );
        }
      }
    }
    lines.push("");
  }

  lines.push("ОГРАНИЧЕНИЯ");
  lines.push("1. Используются спотовые свечи BTCUSDT, а не исторические данные фьючерсов.");
  lines.push("2. SHORT — математическая симуляция без реального исполнения.");
  lines.push("3. Финансирование — постоянная оценка, не реальные исторические ставки.");
  lines.push("4. Не моделируются ликвидации, маржа и рыночное влияние ордеров.");
  lines.push("5. Режим может измениться во время сделки.");
  lines.push("6. Каждая комбинация тестируется независимо.");
  lines.push("7. Малое число сделок и единичные крупные движения могут исказить среднюю.");
  lines.push("8. Результаты не являются финансовой рекомендацией.");

  return lines.join("\n");
}

async function runTest() {
  if (busy) return;
  busy=true;
  stopRequested=false;
  $("run").disabled=true;
  $("stop").disabled=false;
  $("tableArea").textContent="Тест выполняется…";
  $("report").value="";

  try {
    const years=Number($("years").value);
    const fee=num("fee");
    const slippage=num("slippage");
    const funding=num("funding");

    status("Загружаю исторические свечи…");
    const candles=await loadCandles(years);
    if (stopRequested) throw new Error("Остановлено пользователем.");

    status("Рассчитываю индикаторы…");
    const ind=buildIndicators(candles);
    const n=candles.length;
    const trainEnd=Math.floor(n*0.70);
    const valEnd=Math.floor(n*0.85);

    const segments=[
      {name:"Обучение 70%",start:0,end:trainEnd},
      {name:"Проверка 15%",start:trainEnd,end:valEnd},
      {name:"Итоговый тест 15%",start:valEnd,end:n}
    ];

    function cost(hours) {
      return fee+slippage+funding*(hours/8);
    }

    const results=[];
    let done=0;
    const total=REGIMES.length*segments.length*HORIZONS.length*DIRECTIONS.length;

    for (const seg of segments) {
      for (const regime of REGIMES) {
        for (const hours of HORIZONS) {
          for (const direction of DIRECTIONS) {
            if (stopRequested) throw new Error("Остановлено пользователем.");

            const s=runSegment(
              candles,ind.regimes,seg.start,seg.end,
              regime,direction,hours,cost
            );

            results.push({
              regime,segment:seg.name,hours,direction,...s
            });

            done++;
            status("История загружена: "+n.toLocaleString("ru-RU")
              +" свечей\nРасчёт: "+Math.round(done/total*100)
              +"% ("+done+"/"+total+")");
          }
        }
      }
    }

    renderTable(results);
    reportText=buildReport(candles,ind,results,fee,slippage,funding,years);
    $("report").value=reportText;

    status("Готово.\nСвечей: "+n.toLocaleString("ru-RU")
      +"\nПоследняя цена: "+candles[n-1].close
      +"\nФормула SHORT: исправлена.\nИзучите строки «Итоговый тест 15%».");
  } catch(e) {
    status("Ошибка: "+(e && e.message ? e.message : String(e)));
  } finally {
    busy=false;
    $("run").disabled=false;
    $("stop").disabled=true;
  }
}

$("run").addEventListener("click",runTest);
$("stop").addEventListener("click",()=>{
  stopRequested=true;
  status("Останавливаю после текущего запроса…");
});

$("copy").addEventListener("click",async()=>{
  const text=$("report").value;
  if (!text) {
    status("Сначала запустите тест.");
    return;
  }

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      $("report").focus();
      $("report").select();
      if (!document.execCommand("copy")) throw new Error("Копирование не поддерживается.");
    }
    status("Текстовый отчёт скопирован.");
  } catch(e) {
    $("report").focus();
    $("report").select();
    status("Текст выделен. Выберите «Копировать» в меню телефона.");
  }
});
</script>
</body>
</html>
